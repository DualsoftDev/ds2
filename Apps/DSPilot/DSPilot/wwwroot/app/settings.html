                        '모든 디바이스의 이상감지 Min/Max(최소/최대 소요시간)를 project.aasx 에서 전부 비웁니다.\n\n' +
                        '• Duration은 그대로 보존됩니다\n' +
                        '• 잘못 보정된 임계값을 한 번에 초기화할 때 사용합니다\n' +
                        '• 다시 "지금 실측값 채우기" 로 재보정할 수 있습니다',
                        '전부 초기화', '취소');
                    if (!ok) return;
                    this.autoCal.running = true;
                    try {
                        const r = await this.apiPost('/api/settings/auto-calibrate/clear-ranges');
                        this.showToast(r.message, r.success ? 'success' : 'error');
                        if (r.success) await this.load();
                    } catch (e) {
                        this.showToast('초기화 실패: ' + e.message, 'error');
                    } finally { this.autoCal.running = false; }
                },

                // ── 서비스 재시작 (target = agent | mtx | dspilot | all) — 접힘 카드 + 확인 팝업 가드 ──
                // agent/mtx: 백엔드 인라인 동기 실행 → 실제 결과 토스트, 화면 유지.
                // dspilot/all: DSPilot 이 자신을 재시작 → detached 배치. 화면 연결이 잠시 끊겼다가 SignalR 자동 재연결.
                async restartService(target) {
                    if (this.busy) return;
                    const meta = {
                        agent: { name: 'Promaker.Agent', self: false },
                        mtx: { name: 'DSPilot MediaMTX', self: false },
                        dspilot: { name: 'DSPilot', self: true },
                        all: { name: '세 서비스 전체 (MediaMTX · Promaker.Agent · DSPilot)', self: true },
                    }[target];
                    if (!meta) return;
                    const selfNote = meta.self
                        ? '\n• 이 화면의 실시간 연결이 잠시 끊겼다가 자동으로 다시 연결됩니다\n• DSPilot 서비스는 응답 후 약 2초 뒤 재시작됩니다'
                        : '';
                    const ok = await this.askConfirm('⚠️ 서비스 재시작',
                        `${meta.name} 를 재시작합니다.\n\n` +
                        '• 해당 서비스의 모니터링·데이터 수집이 수 초간 중단됩니다' + selfNote +
                        '\n\n정말 재시작할까요?',
                        '재시작', '취소');
                    if (!ok) return;
                    this.busy = true;
                    try {
                        const r = await this.apiPost('/api/settings/restart-services', { target });
                        this.showToast(r.message, r.success ? 'success' : 'error');
                    } catch (e) {
                        this.showToast('서비스 재시작 요청 실패: ' + e.message, 'error');
                    } finally { this.busy = false; }
                },

                // ── AASX 갱신일 기준 선택 삭제 ──
                async openSelectiveDel() {
                    this.selectiveDel.show = true;
                    this.selectiveDel.loading = true;
                    this.selectiveDel.entries = [];
                    this.loadStaleFlows();   // 연표와 독립 — 이력이 없어도 정리 섹션은 떠야 한다
                    try {
                        const data = await this.apiGet('/api/settings/aasx-changelog');
                        this.selectiveDel.entries = data;
                    } catch (e) {
                        this.showToast('이력을 불러오지 못했습니다: ' + e.message, 'error');
                        this.selectiveDel.show = false;
                    } finally {
                        this.selectiveDel.loading = false;
                    }
                },
                async loadStaleFlows() {
                    try { this.stale = await this.apiGet('/api/settings/stale-flows'); }
                    catch (e) { /* 미리보기 실패는 삭제 연표 사용을 막지 않는다 */ }
                },
                async pruneStaleFlows() {
                    const s = this.stale;
                    const ok = await this.askConfirm(
                        '⚠️ 모델에 없는 설비 데이터 정리',
                        `대상 설비: ${s.flowNames.join(', ')}\n\n` +
                        '다음 데이터를 삭제합니다:\n' +
                        `• dspFlow / dspCall (설비·동작 정의) ${s.dspFlowRows + s.dspCallRows}건\n` +
                        `• dspFlowHistory (가동 이력) ${s.historyRows}건\n` +
                        `• oeeDowntimeEvent (정지 이벤트) ${s.downtimeEvents}건\n` +
                        `• FlowCycle 표준CT 설정 ${s.cycleOverrides}건\n\n` +
                        '현재 AASX 에 있는 설비의 데이터는 보존됩니다.\n' +
                        '계속하시겠습니까?',
                        '정리', '취소');
                    if (!ok || this.busy) return;
                    this.busy = true;
                    try {
                        const r = await this.apiPost('/api/settings/prune-stale-flows', {});
                        this.showToast(r.message, r.success ? 'success' : 'error');
                        if (r.success) { this.selectiveDel.show = false; await this.loadStaleFlows(); }
                    } catch (e) {
                        this.showToast('정리 실패: ' + e.message, 'error');
                    } finally {
                        this.busy = false;
                    }
                },
                async selectiveDelChoose(entry) {
                    this.selectiveDel.show = false;
                    const ok = await this.askConfirm(
                        '⚠️ 데이터 선택 삭제',
                        `선택 시각: ${entry.changedAtLocal}\n\n` +
                        '해당 시각 이전의 다음 데이터를 삭제합니다:\n' +
                        '• plcTagLog (PLC 신호 시계열)\n' +
                        '• userTagAlertLog / userTagAlertDaily (알림 이력)\n' +
                        '• dspFlowHistory (Flow 가동 이력)\n' +
                        '• oeeDowntimeEvent (OEE 정지 이벤트)\n\n' +
                        '선택 시각 이후 데이터는 보존됩니다.\n' +
                        '현재 AASX 에 없는 설비의 잔존 데이터도 함께 정리됩니다.\n' +
                        '계속하시겠습니까?',
                        '삭제', '취소');
                    if (!ok) return;
                    if (this.busy) return;
                    this.busy = true;
                    try {
                        const r = await this.apiPost('/api/settings/delete-data-before', { cutoffIso: entry.cutoffIso });
                        this.showToast(r.message, r.success ? 'success' : 'error');
                    } catch (e) {
                        this.showToast('삭제 실패: ' + e.message, 'error');
                    } finally {
                        this.busy = false;
                    }
                },

                // ── 확인 모달 (Promise 기반 — Blazor showConfirm 대체) ──
                askConfirm(title, message, okText, cancelText) {
                    return new Promise((resolve) => {
                        this.confirm = { show: true, title, message, okText: okText || '확인', cancelText: cancelText || '취소', _resolve: resolve };
                    });
                },
                confirmOk() { const r = this.confirm._resolve; this.confirm.show = false; this.confirm._resolve = null; if (r) r(true); },
                confirmCancel() { const r = this.confirm._resolve; this.confirm.show = false; this.confirm._resolve = null; if (r) r(false); },

                // ── SignalR — 외부에서 AASX 가 바뀌면 (Promaker agent 등) 상태 배지 자동 갱신 ──
                connectSignalR() {
                    if (!window.signalR) return;
                    const conn = new signalR.HubConnectionBuilder().withUrl('/hubs/monitoring').withAutomaticReconnect([0, 0, 1000, 3000, 5000, 10000]).build();
                    conn.on('DatabaseRebuilt', () => this.refreshAasxStatus());
                    // PLC 스캔 주기 동기화 — Promaker/다른 클라이언트가 바꾸면 슬라이더 실시간 갱신.
                    conn.on('ScanIntervalChanged', (ms) => { this.scanMs = ms; this.scanConnected = true; });
                    conn.on('AutoCalibrateChanged', (on) => { this.autoCalibrate = !!on; this.scanConnected = true; });
                    conn.onreconnected(() => { this.rt.connected = true; this.refreshAasxStatus(); });
                    conn.onreconnecting(() => { this.rt.connected = false; });
                    conn.onclose(() => { this.rt.connected = false; });
                    conn.start().then(() => { this.rt.connected = true; }).catch(() => { this.rt.connected = false; });
                    this._conn = conn;
                },

                showToast(msg, type) {
                    this.toast = { show: true, msg, type: type || 'success' };
                    clearTimeout(this._toastTimer);
                    this._toastTimer = setTimeout(() => { this.toast.show = false; }, 4000);
                },

                // ── 계정 · 로그인 (관리자 게이트, /api/account) ──
                // 접근 규칙은 서버(AccountController.CanManage): 세션 있음 또는 계정 비활성. 401 이면 로그인 링크 안내.
                acctGateDirty() {
                    const f = this.acct.form, s = this.acct.saved;
                    return f.loginEnabled !== s.loginEnabled || (f.loginEnabled && f.loginScope !== s.loginScope);
                },
                _applyAccount(a, keepForm) {
                    this.acct.authenticated = !!a.authenticated;
                    this.acct.adminId = a.adminId || '';
                    this.acct.passwordIsDefault = !!a.passwordIsDefault;
                    this.acct.saved = { loginEnabled: !!a.loginEnabled, loginScope: a.loginScope === 'app' ? 'app' : 'settings' };
                    if (!keepForm) this.acct.form = { ...this.acct.saved };
                    this.acct.loaded = true;
                    this.acct.error = ''; this.acct.needLogin = false;
                },
                _acctNeedLogin() {
                    this.acct.error = '계정 설정을 변경하려면 로그인이 필요합니다.';
                    this.acct.needLogin = true;
                },
                async _acctPost(url, body) {
                    const res = await fetch(url, {
                        method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    let data = null;
                    try { data = await res.json(); } catch (_) { /* 비 JSON 무시 */ }
                    return { ok: res.ok, status: res.status, data };
                },
                async loadAccount() {
                    try {
                        const res = await fetch('/api/account', { headers: { 'Accept': 'application/json' } });
                        if (res.status === 401) { this.acct.loaded = false; this._acctNeedLogin(); return; }
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        this._applyAccount(await res.json());
                    } catch (e) {
                        this.acct.error = '계정 정보를 불러오지 못했습니다: ' + e.message;
                    }
                },
                async saveLoginGate() {
                    if (this.acct.busy || !this.acct.loaded || !this.acctGateDirty()) return;
                    const enabling = this.acct.form.loginEnabled && !this.acct.saved.loginEnabled;
                    if (enabling && !this.acct.authenticated && !this.acct.gatePassword) {
                        this.showToast('활성화 확인을 위해 현재 비밀번호를 입력하세요.', 'error');
                        return;
                    }
                    if (!this.acct.form.loginEnabled && this.acct.saved.loginEnabled) {
                        const ok = await this.askConfirm('계정 비활성화',
                            '로그인 요구를 끄면 설정 페이지에 누구나 진입할 수 있습니다. 계속하시겠습니까?', '비활성화', '취소');
                        if (!ok) return;
                    }
                    this.acct.busy = true;
                    try {
                        const r = await this._acctPost('/api/account/login-gate', {
                            enabled: this.acct.form.loginEnabled,
                            loginScope: this.acct.form.loginScope,
                            currentPassword: this.acct.gatePassword || null,
                        });
                        if (r.ok && r.data && r.data.account) {
                            this._applyAccount(r.data.account);
                            this.acct.gatePassword = '';
                            this.showToast(this.acct.saved.loginEnabled
                                ? '계정이 활성화되었습니다 — ' + (this.acct.saved.loginScope === 'app' ? '첫 화면부터' : '설정 페이지에서') + ' 로그인을 요구합니다.'
                                : '계정이 비활성화되었습니다 — 로그인 없이 진입합니다.');
                        } else if (r.status === 401) {
                            this._acctNeedLogin();
                        } else {
                            this.showToast((r.data && r.data.message) || '적용에 실패했습니다.', 'error');
                        }
                    } catch (e) {
                        this.showToast('서버에 연결할 수 없습니다.', 'error');
                    } finally { this.acct.busy = false; }
                },
                async changeCredentials() {
                    const c = this.acct.cred;
                    c.error = '';
                    if (this.acct.busy || !this.acct.loaded) return;
                    if (!c.newId && !c.newPw) { c.error = '변경할 아이디 또는 비밀번호를 입력하세요.'; return; }
                    if (c.newPw && c.newPw !== c.newPw2) { c.error = '새 비밀번호가 일치하지 않습니다.'; return; }
                    this.acct.busy = true;
                    try {
                        const r = await this._acctPost('/api/account/credentials', {
                            currentPassword: c.current, newId: c.newId, newPassword: c.newPw,
                        });
                        if (r.ok) {
                            if (r.data && r.data.account) this._applyAccount(r.data.account, true);
                            this.acct.cred = { current: '', newId: '', newPw: '', newPw2: '', error: '' };
                            this.showToast('아이디·비밀번호가 변경되었습니다.');
                        } else if (r.status === 401) {
                            this._acctNeedLogin();
                        } else {
                            c.error = (r.data && r.data.message) || '변경에 실패했습니다.';
                        }
                    } catch (e) {
                        c.error = '서버에 연결할 수 없습니다.';
                    } finally { this.acct.busy = false; }
                }
            };
        }
    </script>
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
</body>

</html>
