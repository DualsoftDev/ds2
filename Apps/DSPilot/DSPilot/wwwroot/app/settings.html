<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>설정 — DSPilot</title>

    <!--
      DSPilot 정적 호스팅 — Swiss Technical 리디자인 (Settings).
      서버/모델 = C#(/api/settings/*), 뷰 = Alpine + fetch.
      GET /api/settings (전체) + /aasx-status. POST /save·/reload·/rebuild-aasx·/invalidate-caches·
      /clear-flow-history·/rebuild-database — 모두 antiforgery 미적용 평범한 JSON fetch.
      (Flow CT 기준 AASX 복원은 사이클 분석 페이지의 'AASX 기본값 복원'(Flow별)으로 이관됨.)
      파괴적 POST(rebuild-database / clear-flow-history)는 askConfirm 모달 가드 필수.
      디자인 시스템: /css/swiss.css (토큰/컴포넌트/다크). 페이지 고유 클래스(settings-*/hms-*/cam-*)만 인라인.
      ConnectionString↔DB폴더 분리 / H·M·S↔ms 변환은 서버(SettingsController)에서 처리.
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/ds.css" rel="stylesheet" />

    <style>
        [x-cloak] { display: none !important; }

        /* ── 독립 셸 (shell.js 미동작 시 fallback) ── */
        .dsp-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); color: var(--color-text-primary); font-family: var(--font-family); }
        .dsp-appbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; background: var(--color-appbar-bg); color: var(--color-appbar-text); border-bottom: 1px solid var(--color-lines-strong); position: sticky; top: 0; z-index: 50; flex-shrink: 0; }
        .dark-theme .dsp-appbar { border-bottom-color: var(--color-lines); }
        .dsp-appbar .dsp-title { font-size: 18px; font-weight: 700; }
        .dsp-appbar .spacer { flex: 1; }
        .dsp-main { flex: 1; min-height: 0; padding: 16px 20px 20px; max-width: 1280px; margin: 0 auto; width: 100%; }

        /* ── 유형별 탭 ── */
        .set-tabs { margin-bottom: 18px; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        /* .set-tabs/.set-tab 룩은 swiss.css 공용 세그먼트/탭 표준(inset+애저)으로 이관 */
        @media (max-width: 480px) {
            .set-tabs { gap: 0; }
            .set-tab { padding: 9px 12px; font-size: 0.76rem; gap: 5px; }
            .set-tab .material-icons { font-size: 16px; }
        }

        /* 모달 (확인) — swiss .modal-overlay / .modal-content 와 결 맞춤 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(10, 15, 22, 0.42); display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(2px); }
        .dark-theme .modal-overlay { background: rgba(4, 8, 14, 0.68); }
        .modal-content { background: var(--color-surface); border: 1px solid var(--color-lines-strong); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-modal); }
        @keyframes heatmap-indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

        /* 간이 토스트 — 잉크 스낵바(평면, 헤어라인, 좌측 시맨틱 룰) */
        .dsp-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2500; padding: 11px 18px; border: 1px solid var(--color-lines-strong); border-left: 3px solid var(--color-text-secondary); border-radius: var(--radius-sm); background: var(--color-text-primary); color: var(--color-surface); font-size: 0.82rem; font-weight: 600; box-shadow: var(--shadow-4); max-width: 90vw; }
        .dsp-toast.success { border-left-color: var(--color-success); }
        .dsp-toast.error { border-left-color: var(--color-error); }
        .dsp-toast.info { border-left-color: var(--color-info); }

        /* ── Settings 레이아웃 ── */
        /* minmax(0,1fr): 트랙 최소를 0 으로 고정 → 내부 nowrap 콘텐츠(.fa-demo-msg 등)가
           1fr(=minmax(auto,1fr)) 트랙을 부풀려 우측 열이 폭주(가로 스크롤)하던 문제 방지. min-width:0 은 보강. */
        /* 탭 본문: 보이는 카드만 자동 균형 배치(멀티컬럼). x-show 로 숨긴(display:none) 카드는 흐름에서 빠진다.
           → 카드를 두 열(settings-col)로 고정 분배하지 않아도 탭별로 자동 2열 균형이 맞는다. */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
        @media (max-width: 900px) { .settings-grid { grid-template-columns: 1fr; } }
        .settings-grid > .card { width: 100%; margin: 0; display: flex; flex-direction: column; }
        .settings-grid > .card > .card-content { flex: 1; }
        .settings-actions { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 16px; }
        .settings-note { padding: 10px 12px; margin-bottom: 12px; background: var(--color-surface-variant); border: 1px solid var(--color-lines); border-left: 3px solid var(--color-primary); border-radius: var(--radius-sm); }
        .settings-note small { color: var(--color-text-secondary); line-height: 1.55; }
        .settings-hint { color: var(--color-text-secondary); margin-top: 6px; display: block; font-size: 0.72rem; line-height: 1.5; }
        .settings-status-grid { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 0.8rem; margin: 10px 0 14px; align-items: baseline; }
        .settings-status-grid .lbl { font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-secondary); }
        .settings-status-grid .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-text-primary); }
        .hms-row { display: flex; gap: 8px; align-items: center; }
        .hms-cell { display: flex; align-items: center; gap: 4px; }
        .hms-cell input { width: 72px; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
        .hms-cell span { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-secondary); }
        .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.78rem; }
        .divider { border: none; border-top: 1px solid var(--color-lines); }
        /* 테마 선택 — 스위치 대신 직관적 2택 카드 */
        .theme-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
        .theme-opt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 10px; background: var(--color-surface); border: 2px solid var(--color-lines); border-radius: var(--radius-md, 10px); cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s; color: var(--color-text-primary); }
        .theme-opt:hover { border-color: color-mix(in srgb, var(--color-primary) 45%, var(--color-lines)); }
        .theme-opt.is-active { border-color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 8%, var(--color-surface)); box-shadow: 0 0 0 1px var(--color-primary) inset; }
        .theme-opt-label { font-size: 0.82rem; font-weight: 600; }
        .theme-swatch { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--color-lines); }
        .theme-swatch .material-icons { font-size: 24px; }
        .theme-swatch-light { background: #f4f6fb; color: #f2a72e; }
        .theme-swatch-dark { background: #1c2333; color: #9fb4ff; border-color: #2c3550; }
        .theme-check { position: absolute; top: 8px; right: 8px; font-size: 18px; color: var(--color-primary); opacity: 0; transition: opacity .15s; }
        .theme-opt.is-active .theme-check { opacity: 1; }
        .settings-page code { background: color-mix(in srgb, var(--color-text-primary) 7%, transparent); padding: 1px 6px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 0.8rem; }
        .set-subhead { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--color-text-secondary); }
        .set-subhead .material-icons { font-size: 16px; color: var(--color-primary); }
        .set-subnote { color: var(--color-text-secondary); display: block; margin-bottom: 10px; font-size: 0.72rem; line-height: 1.5; }

        /* ── 사용자 정의 에러 테이블: 검색/필터/정렬/페이징 ── */
        .ude-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
        .ude-search { position: relative; display: flex; align-items: center; flex: 1 1 220px; min-width: 180px; }
        .ude-search > .material-icons { position: absolute; left: 8px; font-size: 18px; color: var(--color-text-secondary); pointer-events: none; }
        .ude-search .form-field { width: 100%; padding-left: 30px; padding-right: 30px; }
        .ude-search .btn-icon { position: absolute; right: 4px; width: 24px; height: 24px; min-width: 0; padding: 0; }
        .ude-search .btn-icon .material-icons { font-size: 16px; }
        .ude-sel { flex: 0 0 auto; width: auto; min-width: 110px; }
        /* 결과가 줄어도 문서 높이가 급변하지 않도록 고정 높이 스크롤 영역(필터 변경 시 스크롤 튐 방지) */
        .ude-scroll { overflow: auto; min-height: 320px; max-height: 60vh; }
        .ude-table thead th { cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; z-index: 1; background: var(--color-surface-variant, var(--color-surface)); }
        .ude-table thead th:hover { color: var(--color-primary); }
        .ude-sort { font-size: 14px; vertical-align: middle; opacity: 0.6; }
        .ude-pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
        .ude-pager-info { font-size: 0.75rem; color: var(--color-text-secondary); }
        .ude-pager-nav { display: flex; align-items: center; gap: 4px; }
        .ude-pager-nav .btn-sm .material-icons { font-size: 16px; }
        .ude-pager-page { font-size: 0.75rem; padding: 0 6px; white-space: nowrap; }
        .modal-confirm { max-width: 520px; }
        .modal-confirm h3 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; color: var(--color-text-primary); }
        .modal-confirm .msg { white-space: pre-line; color: var(--color-text-secondary); line-height: 1.6; font-size: 0.85rem; max-height: 50vh; overflow-y: auto; }
        .modal-confirm .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* ── 이상 알람 배너 데모 미리보기 — 실제 .flow-alarm 룩 축소판, 설정 px/s 로 실시간 흐름 ── */
        .fa-demo-cap { display: block; margin-bottom: 8px; font-size: 0.72rem; color: var(--color-text-secondary); }
        .fa-demo { display: flex; align-items: center; padding: 10px 14px; margin-bottom: 12px; overflow: hidden; border-radius: var(--radius-sm); background: #facc15; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.08); }
        .fa-demo-icon { display: flex; align-items: center; flex-shrink: 0; margin-right: 10px; padding-right: 8px; z-index: 2; background: #facc15; }
        .fa-demo-icon svg { width: 22px; height: 22px; color: #000; }
        .fa-demo-track { flex: 1; min-width: 0; overflow: hidden; height: 28px; display: flex; align-items: center; }
        .fa-demo-msg { display: block; width: 100%; font-size: 1.15rem; font-weight: 700; color: #dc2626; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; will-change: transform; }
        .fa-demo-msg-anim { animation: fa-demo-flip 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fa-demo-flip { 0% { transform: translateY(108%); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .fa-demo-msg-anim { animation: none; } }
        .fa-demo-idx { flex-shrink: 0; margin-left: 10px; font-size: 0.78rem; font-weight: 800; color: #000; background: rgba(0,0,0,0.14); border: 1px solid rgba(0,0,0,0.1); border-radius: 9999px; padding: 2px 9px; font-variant-numeric: tabular-nums; white-space: nowrap; }

        /* ── 모바일(≤480px) ──
           이 페이지는 .modal-content / .modal-confirm 를 자체 인라인 정의하므로(ds.css 오버라이드)
           폰 화면용 폭/높이 규칙을 여기서 재현한다. 데스크톱 레이아웃은 그대로 둔다. */
        @media (max-width: 480px) {
            /* 메인 패딩 축소 → 360px 에서 카드가 가장자리에 붙지 않게 좌우 여백만 유지 */
            .dsp-main { padding: 12px 12px 16px; }

            /* 상단 저장/되돌리기 액션 — 좁은 폭에서 줄바꿈 허용 */
            .settings-actions { flex-wrap: wrap; gap: 8px; }

            /* H/M/S 시간 입력 — 고정 72px 3개가 360px 에서 넘침 → 트랙을 균등 분배 */
            .hms-row { gap: 6px; }
            .hms-cell { flex: 1 1 0; min-width: 0; }
            .hms-cell input { width: 100%; min-width: 0; }

            /* 모달 — 화면폭에서 32px 빼되 최대 480px, 세로는 화면 안에 들어오게 */
            .modal-content {
                max-width: min(480px, calc(100vw - 32px));
                width: 100%;
                max-height: 90vh;
                overflow-y: auto;
                padding: 18px;
            }
            .modal-confirm { max-width: min(520px, calc(100vw - 32px)); }
            /* 확인 메시지 본문은 모달이 이미 스크롤되므로 자체 cap 을 더 낮춰 버튼이 보이게 */
            .modal-confirm .msg { max-height: 42vh; }
            /* 선택 삭제 리스트 — 모달 내부 높이에 맞춰 축소 */
            .modal-content [style*="max-height:320px"] { max-height: 50vh !important; }
        }
    </style>
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="settingsApp()" x-init="init()" x-cloak>

        <!-- fallback 슬림 헤더 (shell.js 가 제거) -->
        <header class="dsp-appbar">
            <span class="dsp-title">설정</span>
            <span class="dsp-badge">정적</span>
            <div class="spacer"></div>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">

            <!-- 로딩 -->
            <div x-show="loading && !s" class="progress-bar progress-bar-indeterminate mb-4">
                <div class="progress-bar-fill"></div>
            </div>

            <template x-if="s">
                <div class="settings-page">
                    <!-- 상단 툴바 — (왼쪽) 유형별 탭 + (오른쪽) 되돌리기/저장.
                         이상·알람 분석 페이지의 .ds-topbar 레이아웃과 통일(별도 제목 헤더 없음). -->
                    <div class="ds-topbar">
                        <nav class="set-tabs" role="tablist" style="margin-bottom:0;">
                            <button class="set-tab" :class="{ 'is-active': activeTab === 'general' }" @click="setTab('general')" role="tab">
                                <span class="material-icons">settings</span> 일반
                            </button>
                            <button class="set-tab" :class="{ 'is-active': activeTab === 'monitoring' }" @click="setTab('monitoring')" role="tab">
                                <span class="material-icons">speed</span> 모니터링·정합
                            </button>
                            <button class="set-tab" :class="{ 'is-active': activeTab === 'anomaly' }" @click="setTab('anomaly')" role="tab">
                                <span class="material-icons">filter_list</span> 이상치·알람
                            </button>
                            <button class="set-tab" :class="{ 'is-active': activeTab === 'data' }" @click="setTab('data')" role="tab">
                                <span class="material-icons">storage</span> 모델·데이터
                            </button>
                            <button class="set-tab" :class="{ 'is-active': activeTab === 'advanced' }" @click="setTab('advanced')" role="tab">
                                <span class="material-icons">tune</span> 고급
                            </button>
                        </nav>

                        <div class="ds-topbar-actions" style="justify-content:flex-end;">
                            <button class="btn btn-sm btn-outlined color-default" @click="reload()" :disabled="busy">
                                <span class="material-icons">refresh</span> 되돌리기
                            </button>
                            <button class="btn btn-sm" :class="settingsDirty ? 'btn-filled' : ''" @click="save()" :disabled="busy">
                                <span class="material-icons">save</span> <span x-text="settingsDirty ? '저장*' : '저장'"></span>
                            </button>
                        </div>
                    </div>

                    <div class="settings-grid">

                            <!-- AASX 모델 -->
                            <div class="card" x-show="activeTab === 'data'">
                                <div class="card-header">
                                    <span class="material-icons">schema</span>
                                    <span>AASX 모델</span>
                                </div>
                                <div class="card-content">
                                    <div class="settings-note">
                                        <small>
                                            Promaker 와 공유하는 AASX 모델 파일. 경로는 두 앱 공통 고정값으로 운영됩니다.<br />
                                            <strong>Promaker 에서 같은 경로에 저장</strong>한 뒤 아래 "모델 다시 불러오기" 를 누르면 dspilot 에 반영됩니다.
                                        </small>
                                    </div>

                                    <div class="form-group mb-2">
                                        <label class="form-label">파일 경로 (고정)</label>
                                        <input class="form-field mono" :value="s.aasxFilePath" readonly
                                               style="background:var(--color-surface-variant);" />
                                    </div>

                                    <div class="settings-status-grid">
                                        <span class="lbl">파일 상태</span>
                                        <template x-if="aasx.exists"><span class="val" style="color:var(--color-success);" x-text="'존재함 (' + aasx.sizeDisplay + ')'"></span></template>
                                        <template x-if="!aasx.exists"><span class="val" style="color:var(--color-error);">파일 없음 — Promaker 에서 먼저 저장하세요</span></template>

                                        <span class="lbl">파일 수정</span>
                                        <span class="val" x-text="aasx.writeTimeLocal"></span>

                                        <span class="lbl">마지막 로드</span>
                                        <span class="val" x-text="aasx.lastLoadedLocal"></span>

                                        <span class="lbl">동기화</span>
                                        <span class="val" :style="`color:${aasx.syncColor};`" x-text="aasx.syncText"></span>
                                    </div>

                                    <button class="btn btn-outlined w-100" @click="downloadAasx()" :disabled="!aasx.exists">
                                        <span class="material-icons">download</span>
                                        project.aasx 다운로드
                                    </button>
                                    <small class="settings-hint">
                                        현재 공유 폴더의 AASX 모델 파일을 그대로 내려받습니다. (Promaker 백업·이관용)
                                    </small>
                                    <hr class="divider my-3" />
                                    <button class="btn btn-outlined w-100" @click="reloadAasx()" :disabled="busy || !aasx.exists">
                                        <span class="material-icons">refresh</span>
                                        AASX 모델 다시 불러오기
                                    </button>
                                    <small class="settings-hint">
                                        디스크의 AASX 파일을 다시 읽어 메모리 모델을 갱신합니다.
                                        DB / 통계 / 히스토리는 그대로 유지됩니다.
                                        모델 정의가 바뀌었다면 아래 "DB 재구축" 도 함께 실행하세요.
                                    </small>
                                    <hr class="divider my-3" />
                                    <button class="btn btn-outlined w-100" @click="rebuildAasx()" :disabled="busy || !aasx.exists">
                                        <span class="material-icons">sync</span>
                                        모델 정의 동기화 (Reload + Resync)
                                    </button>
                                    <small class="settings-hint">
                                        AASX 재로딩 + 모델 정의 동기화(UPSERT) + 사라진 Flow 정리 + 레이아웃 자동 재배치.
                                        살아남은 Flow 의 통계/히스토리는 보존됩니다.
                                    </small>
                                </div>
                            </div>

                            <!-- 데이터베이스 -->
                            <div class="card" x-show="activeTab === 'data'">
                                <div class="card-header">
                                    <span class="material-icons">storage</span>
                                    <span>데이터베이스</span>
                                </div>
                                <div class="card-content">

                                            plc.db 파일이 저장될 폴더. 서비스 모드에서 <code>%APPDATA%</code> 는 SYSTEM 계정 경로로 해석되므로 사용 금지.

                                    <small class="settings-hint">
                                        평균·누적 통계만 리셋하고 raw 데이터(plcTagLog·히스토리·알림)는 그대로 둡니다.
                                        모델이나 head/tail 이 바뀌어 평균을 새로 잡을 때 사용하세요. 대부분은 이것으로 충분합니다.
                                    </small>

                                    <button class="btn btn-outlined color-warning w-100" @click="openSelectiveDel()" :disabled="busy">
                                        <span class="material-icons">event</span> 오래된 데이터 삭제
                                    </button>
                                    <small class="settings-hint">
                                        AASX 갱신일을 골라 그 이전의 raw 데이터를 정리합니다(디스크 확보용). 선택 시각 이후는 보존됩니다.
                                    </small>
                                    <hr class="divider my-3" />
                                    <button class="btn btn-outlined color-error w-100" @click="rebuildDatabase()" :disabled="busy">
                                        <span class="material-icons">delete_forever</span> 전체 초기화
                                    </button>
                                    <small class="settings-hint">
                                        ⚠️ plc.db 를 통째로 지우고 다시 만듭니다. <strong>raw 데이터가 전부 사라집니다.</strong>
                                    </small>
                                    <small class="settings-hint">
                                        현재 DB: <span class="mono" x-text="s.dbPath"></span>

                            <!-- 사용자 정의 에러 (읽기전용) — Promaker/AASX 에서 정의된 UserTag 조건 목록 조회 -->
                            <div class="card" x-show="activeTab === 'monitoring'">
                                <div class="card-header">
                                    <span class="material-icons">rule</span>
                                    <span>사용자 정의 에러</span>
                                </div>
                                <div class="card-content">
                                    <div class="settings-note">
                                        <small>
                                            Promaker 의 사용자 태그 패널에서 정의한 <strong>사용자 정의 에러(UserTag)</strong> 조건 목록입니다.
                                            여기서는 <strong>조회만</strong> 가능하며 추가·수정은 Promaker 에서 합니다.
                                            발생 이력·추이는 <a href="/uptime-alarm" style="color:var(--color-primary);">이상·알람 분석</a> 페이지에서 확인하세요.
                                        </small>
                                    </div>

                                    <template x-if="!ude.loading && ude.items.length > 0">
                                        <div>

                                                <div class="ude-search">
                                                    <span class="material-icons">search</span>
                                                    <input type="text" class="form-field" placeholder="이름·주소·조건 검색" x-model="ude.q" @input="udeResetPage()" />
                                                    <button x-show="ude.q" class="btn-icon" @click="ude.q=''; udeResetPage()" title="지우기"><span class="material-icons">close</span></button>
                                                </div>
                                                <select class="form-field ude-sel" x-model.number="ude.pageSize" @change="udeResetPage()">
                                                    <option :value="20">20개씩</option>
                                                    <option :value="50">50개씩</option>
                                                    <option :value="100">100개씩</option>
                                                </select>
                                            </div>
                                            <div class="ude-scroll">
                                                <table class="ds-table ude-table">
                                                    <thead><tr>
                                                        <th @click="udeSort('systemName')">System <span class="material-icons ude-sort" x-text="udeSortIcon('systemName')"></span></th>
                                                        <th @click="udeSort('name')">이름 <span class="material-icons ude-sort" x-text="udeSortIcon('name')"></span></th>
                                                        <th @click="udeSort('tagAddress')">주소 <span class="material-icons ude-sort" x-text="udeSortIcon('tagAddress')"></span></th>
                                                        <th @click="udeSort('valueType')">타입 <span class="material-icons ude-sort" x-text="udeSortIcon('valueType')"></span></th>
                                                        <th @click="udeSort('match')">매칭 조건 <span class="material-icons ude-sort" x-text="udeSortIcon('match')"></span></th>
                                                    </tr></thead>
                                                    <tbody>
                                                        <template x-for="d in udePaged" :key="d.tagAddress + '|' + d.name">
                                                            <tr>
                                                                <td data-label="System" x-text="d.systemName"></td>
                                                                <td data-label="이름"><strong x-text="d.name"></strong></td>
                                                                <td data-label="주소"><span style="font-family:var(--font-mono);" x-text="d.tagAddress"></span></td>
                                                                <td data-label="타입" x-text="d.valueType"></td>
                                                                <td data-label="매칭 조건" x-text="describeUdeOp(d.matchOp, d.matchValue)"></td>
                                                            </tr>
                                                        </template>
                                                        <template x-if="udeFiltered.length === 0">
                                                            <tr><td colspan="5" style="text-align:center; color:var(--text-secondary); padding:16px;">검색 조건에 맞는 항목이 없습니다.</td></tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                            <!-- 페이징 -->
                                            <div class="ude-pager" x-show="udeFiltered.length > 0">
                                                <span class="ude-pager-info">
                                                    총 <strong x-text="udeFiltered.length"></strong>건 ·
                                                    <span x-text="(ude.page * ude.pageSize + 1)"></span>–<span x-text="Math.min((ude.page + 1) * ude.pageSize, udeFiltered.length)"></span>
                                                </span>
                                                <div class="ude-pager-nav">
                                                    <button class="btn btn-sm btn-outlined" @click="ude.page = 0" :disabled="ude.page === 0" title="처음"><span class="material-icons">first_page</span></button>
                                                    <button class="btn btn-sm btn-outlined" @click="udePrevPage()" :disabled="ude.page === 0">이전</button>
                                                    <span class="ude-pager-page"><span x-text="ude.page + 1"></span> / <span x-text="udeMaxPage"></span></span>
                                                    <button class="btn btn-sm btn-outlined" @click="udeNextPage()" :disabled="ude.page + 1 >= udeMaxPage">다음</button>
                                                    <button class="btn btn-sm btn-outlined" @click="ude.page = udeMaxPage - 1" :disabled="ude.page + 1 >= udeMaxPage" title="마지막"><span class="material-icons">last_page</span></button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="!ude.loading && ude.items.length === 0 && !ude.error">
                                        <div class="settings-note" style="margin-top:0;">
                                            <small>정의된 사용자 정의 에러가 없습니다. Promaker 의 사용자 태그 패널에서 추가하세요.</small>
                                        </div>
                                    </template>
                                    <div x-show="ude.error" class="alert alert-error" style="margin-bottom:8px;"><span class="material-icons">error</span><span x-text="ude.error"></span></div>
                                    <button class="btn btn-outlined w-100" style="margin-top:10px;" @click="loadUserDefinedErrors()" :disabled="ude.loading">
                                        <span class="material-icons">refresh</span> 새로고침 (<span x-text="ude.items.length"></span>건)
                                    </button>
                                </div>
                            </div>

                            <!-- 동작시간 이상감지 (실측 자동 보정 + 실시간 학습 통합) -->
                            <div class="card" x-show="activeTab === 'monitoring'">
                                <div class="card-header">
                                    <span class="material-icons">tune</span>
                                    <span>동작시간 이상감지</span>
                                </div>
                                <div class="card-content">
                                    <small class="settings-hint" style="display:block;margin:0 0 12px;">
                                        설비별 실측 duration 으로 <strong>동작 초과(ActionOver)</strong> · <strong>동작 미달(ActionUnder)</strong> 을 감지합니다.
                                        아래에서 임계를 실측으로 확정(보정)해야 감지가 무장됩니다.
                                    </small>

                                    <!-- ── 1. 실측 자동 보정 (AASX 임계 산출 — 감지 무장) ── -->
                                    <p style="font-size:0.78rem;font-weight:700;margin:0 0 4px;">1. 실측 자동 보정 (AASX 임계 산출)</p>
                                    <small class="settings-hint" style="display:block;margin:0 0 10px;">실측 duration 을 AASX 에 확정해 감지 임계를 무장합니다. 실시간 학습(맨 아래) 여부와 무관하게 동작합니다.</small>

                                    <label class="switch mb-2">
                                        <input type="checkbox" x-model="s.autoCalibration.enabled" />
                                        클린 가동 누적 시 자동 실행
                                    </label>
                                    <small class="settings-hint">Flow 가 아래 클린 가동 횟수를 채우면 1회 자동 보정. 끄면 수동("지금 실측값 채우기")만 동작합니다.</small>

                                    <div class="form-group" style="margin-top:12px;">
                                        <label class="form-label">최소 클린 가동 횟수</label>
                                        <input type="number" class="form-field mono" x-model.number="s.autoCalibration.minCleanCycles" min="1" max="1000" placeholder="10" />
                                        <small class="settings-hint">이상치 제외 가동시간 존재 가동 기준. 기본 10.</small>
                                    </div>

                                    <!-- 동작 초과(ActionOver) — Max 임계 (상시 적용) -->
                                    <div class="form-group" style="margin-top:14px;margin-bottom:0;">
                                        <label class="form-label">동작 초과(ActionOver) — Max 임계 산출 <span style="font-weight:400;color:var(--color-text-secondary);">· 상시 적용</span></label>
                                        <div style="margin-top:4px;">
                                            <div style="display:flex;align-items:center;gap:6px;">
                                                <span style="font-size:0.8rem;white-space:nowrap;">여유율 +</span>
                                                <input type="text" inputmode="decimal" class="form-field mono"
                                                       :value="s.autoCalibration.medianMarginMaxPct == null ? '' : Math.round(s.autoCalibration.medianMarginMaxPct * 10000) / 100"
                                                       @change="s.autoCalibration.medianMarginMaxPct = pctToFrac($event.target.value)"
                                                       placeholder="60" style="width:90px;" />
                                                <span style="font-size:0.8rem;white-space:nowrap;">%</span>
                                            </div>
                                            <small class="settings-hint">Max = 실측 중앙값 × (1 + 여유율%). 예: 60 = +60%. 기본 60. 관측된 정상 최대(통신 이상치 제외)보다 작게 잡히지는 않습니다.</small>
                                        </div>
                                        <div style="margin-top:10px;">
                                            <div style="display:flex;align-items:center;gap:6px;">
                                                <span style="font-size:0.8rem;white-space:nowrap;">+ 추가 여유값</span>
                                                <input type="text" inputmode="decimal" class="form-field mono"
                                                       :value="(s.autoCalibration.marginMaxAbsMs ?? 5000) / 1000"
                                                       @change="s.autoCalibration.marginMaxAbsMs = secToMs($event.target.value)"
                                                       placeholder="5" style="width:90px;" />
                                                <span style="font-size:0.8rem;white-space:nowrap;">초</span>
                                            </div>
                                            <small class="settings-hint">Max = (위 산출값) + 이 초. "정상보다 N초 더 걸리면 정지" 절대 버퍼. 예: 5 = +5초. 기본 5초.</small>
                                        </div>
                                    </div>

                                    <!-- 동작 미달(ActionUnder) — Min 임계 (선택 / opt-in) -->
                                    <div class="form-group" style="margin-top:14px;margin-bottom:0;">
                                        <label class="switch mb-2">
                                            <input type="checkbox" x-model="s.autoCalibration.fillMin" />
                                            동작 미달(ActionUnder) 감지 — 최소값(Min)도 실측 기록
                                        </label>
                                        <small class="settings-hint">켜면 p05 기반 MinDuration 을 AASX 에 기록해 동작 미달 감지를 활성화합니다. 실시간 학습 여부와 무관.</small>
                                        <div x-show="s.autoCalibration.fillMin" x-cloak>
                                            <div class="form-group" style="margin:12px 0 0;">
                                                <label class="form-label">Min 백분위수 (PercentileMin)</label>
                                                <input type="number" class="form-field mono" x-model.number="s.autoCalibration.percentileMin" min="0" max="50" step="1" placeholder="5" />
                                                <small class="settings-hint">Min 기준 백분위수. 기본 5 (p5).</small>
                                            </div>
                                            <div class="form-group" style="margin:8px 0 0;">
                                                <label class="form-label">최소값 추가 여유율 (%)</label>
                                                <input type="text" inputmode="decimal" class="form-field mono"
                                                       :value="s.autoCalibration.marginMinPct == null ? '' : Math.round(s.autoCalibration.marginMinPct * 10000) / 100"
                                                       @change="s.autoCalibration.marginMinPct = pctToFrac($event.target.value)"
                                                       placeholder="3" />
                                                <small class="settings-hint">Min = pN × (1 − 여유율%). 예: 3 = −3%, 10.5 = −10.5% 추가 여유.</small>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 실행 & 상태 -->
                                    <div class="settings-status-grid" style="margin:14px 0 0;">
                                        <span class="lbl">마지막 실측 적용</span>
                                        <span class="val" x-text="s.autoCalibration.lastAppliedAt || '없음'"></span>
                                        <span class="lbl">자동 1회 완료</span>
                                        <span class="val" x-text="s.autoCalibration.completedAt || '미실행 (대기 중)'"></span>
                                    </div>
                                    <small class="settings-hint" x-show="s.autoCalibration.lastAppliedSummary"
                                           x-text="'최근 기록: ' + (s.autoCalibration.lastAppliedSummary || '')"></small>

                                    <!-- 이상감지 게이트 상태 (stale = 확정값 ≠ 현재 모델 duration → ActionOver/Under 조용히 안 뜸) -->
                                    <div class="settings-status-grid" style="margin:12px 0 0;" x-show="calib.loaded">
                                        <span class="lbl">이상감지 게이트</span>
                                        <span class="val">
                                            <template x-if="calib.staleCount === 0">
                                                <span style="color:var(--color-success,#2e9e5b);font-weight:700;">정상 — 확정 Work 게이트 열림</span>
                                            </template>
                                            <template x-if="calib.staleCount > 0">
                                                <span style="color:var(--color-warning,#e67e22);font-weight:700;"
                                                      x-text="'재측정 필요 ' + calib.staleCount + '개' + (calib.autoEnabled ? ' — 자동 측정 중' : ' — 수동 채우기 필요')"></span>
                                            </template>
                                        </span>
                                    </div>
                                    <div x-show="calib.staleCount > 0" x-cloak style="margin-top:6px;">
                                        <small class="settings-hint" x-show="calib.autoEnabled">
                                            모델이 바뀐(재발행 등) Work 의 확정값이 어긋나 게이트가 닫혔습니다. 새 클린 가동이 쌓이는 대로 자동 재측정되어 다시 열립니다.
                                        </small>
                                        <small class="settings-hint" x-show="!calib.autoEnabled" style="color:var(--color-warning,#e67e22);">
                                            자동 보정(1번)이 꺼져 있어 자동 복구되지 않습니다. 아래 "지금 실측값 채우기" 를 누르거나 자동 보정을 켜세요.
                                        </small>
                                        <ul style="margin:6px 0 0;padding-left:18px;font-size:0.74rem;line-height:1.7;">
                                            <template x-for="w in calib.stale" :key="w.workId">
                                                <li>
                                                    <strong x-text="w.name"></strong>
                                                    <template x-if="w.staleMax"><span x-text="' · Max 확정 ' + w.calibMaxMs + 'ms ≠ 모델 ' + (w.modelMaxMs ?? '—') + 'ms'"></span></template>
                                                    <template x-if="w.staleMin"><span x-text="' · Min 확정 ' + w.calibMinMs + 'ms ≠ 모델 ' + (w.modelMinMs ?? '—') + 'ms'"></span></template>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>

                                    <button class="btn btn-outlined w-100" style="margin-top:12px;" @click="fillAutoCalibration()" :disabled="busy || autoCal.running">
                                        <span class="material-icons" x-text="autoCal.running ? 'refresh' : 'sync'"></span>
                                        <span x-text="autoCal.running ? '채우는 중…' : '지금 실측값 채우기 (재시도)'"></span>
                                    </button>
                                    <small class="settings-hint">완료 여부와 무관하게 현재 실측값으로 적합 Flow 디바이스 duration 을 즉시 재기록합니다.</small>

                                    <button class="btn btn-outlined w-100" style="margin-top:10px; color:var(--color-warning, #e67e22); border-color:var(--color-warning, #e67e22);"
                                            @click="clearCalibrationRanges()" :disabled="busy || autoCal.running">
                                        <span class="material-icons">restart_alt</span>
                                        <span>Min/Max 전부 초기화 (null)</span>
                                    </button>
                                    <small class="settings-hint">모든 디바이스의 이상감지 Min/Max 를 전부 비웁니다(Duration 은 보존). 잘못 보정된 임계를 한 번에 되돌릴 때 사용.</small>

                                    <!-- ── 2. 실시간 학습 (Agent 자동) — 선택 ── -->
                                    <hr class="divider" style="margin:16px 0;" />
                                    <p style="font-size:0.78rem;font-weight:700;margin:0 0 4px;">2. 실시간 학습 (Agent 자동)</p>
                                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                                        <input type="checkbox" x-model="autoCalibrate" @change="applyAutoCalibrate()" :disabled="!scanConnected" />
                                        <span x-text="autoCalibrate ? 'ON — 실시간 학습 사용 (Agent 자동)' : 'OFF — 미사용'"></span>
                                    </label>
                                    <small class="settings-hint">
                                        ON: Agent 가 실측 duration 을 라이브 학습 — 설비 노화 드리프트 추적('기준선 동결')과, 동작 미달을 켠 경우 그 판정의 라이브 기준으로 사용(3회 관측 후 avg ± 마진).
                                        <strong>동작 초과(ActionOver)·센서 이상과는 무관</strong>합니다.
                                        <span x-show="!scanConnected"><strong> — Agent 미연결 상태입니다.</strong></span>
                                    </small>

                                    <div x-show="autoCalibrate" style="margin-top:12px;">
                                        <button class="btn btn-outlined w-100" @click="freezeHealthBaseline()" :disabled="!scanConnected">
                                            <span class="material-icons">ac_unit</span> 기준선 동결 (지금 동결)
                                        </button>
                                        <small class="settings-hint">
                                            현재 학습된 분포를 건강 기준선으로 고정합니다. 이후 가동은 이 기준 대비 드리프트(설비 노화)로 추적됩니다.
                                            <span x-show="!scanConnected"><strong> — Agent 미연결 상태입니다.</strong></span>
                                        </small>
                                    </div>
                                </div>
                            </div>

                            <!-- PLC 스캔 주기 (Agent 동기화) -->
                            <div class="card" x-show="activeTab === 'monitoring'">
                                <div class="card-header">
                                    <span class="material-icons">speed</span>
                                    <span>PLC 스캔 주기</span>
                                </div>
                                <div class="card-content">
                                    <div style="display:flex; align-items:center; gap:10px;">
                                        <input type="range" min="10" max="500" step="10" style="flex:1"
                                               x-model.number="scanMs" @change="applyScanInterval()" :disabled="!scanConnected" />
                                        <strong style="min-width:64px; text-align:right;" x-text="scanMs + ' ms'"></strong>
                                    </div>
                                    <small class="settings-hint">
                                        Agent 의 PLC 폴링 주기입니다 (10~500ms, 10ms 단위, 기본 100ms).
                                        변경은 재시작 없이 즉시 적용되고 Promaker 와도 자동 동기화됩니다.

                                </div>

                             @mouseenter="$el.style.background='var(--color-surface-hover, rgba(0,0,0,0.04))'"
                             @mouseleave="$el.style.background=''">
                            <span class="material-icons" style="color:var(--color-azure, #0078d4); flex-shrink:0;">history</span>
                            <div style="flex:1; min-width:0;">
                                <div style="font-weight:600; font-size:14px;" x-text="e.changedAtLocal"></div>
                                <div class="settings-hint" style="margin:0; font-size:12px;" x-text="e.source + (e.notes ? ' · ' + e.notes : '')"></div>
                            </div>
                            <span class="material-icons" style="color:var(--color-text-secondary); font-size:18px; flex-shrink:0;">chevron_right</span>
                        </div>
                    </template>
                </div>
                <div style="margin-top:16px; display:flex; justify-content:flex-end;">
                    <button class="btn btn-outlined color-default" @click="selectiveDel.show = false">닫기</button>
                </div>
            </div>
        </div>

        <!-- 확인 모달 (showConfirm 대체) -->
        <div class="modal-overlay" x-show="confirm.show" style="display:none; z-index:3000;" @click="confirmCancel()">
            <div class="modal-content modal-confirm" @click.stop>
                <h3 x-text="confirm.title"></h3>
                <div class="msg" x-text="confirm.message"></div>
                <div class="actions">
                    <button class="btn btn-outlined color-default" @click="confirmCancel()" x-text="confirm.cancelText"></button>
                    <button class="btn btn-filled" @click="confirmOk()" x-text="confirm.okText"></button>
                </div>
            </div>
        </div>

        <!-- 토스트 -->
        <div class="dsp-toast" :class="toast.type" x-show="toast.show" x-transition style="display:none;" x-text="toast.msg"></div>
    </div>

    <script src="/lib/signalr.min.js"></script>
    <script>
        function settingsApp() {
            return {
                s: null, aasx: {}, loading: true, busy: false, dark: false,
                settingsDirty: false,
                toast: { show: false, msg: '', type: 'success' },
                confirm: { show: false, title: '', message: '', okText: '확인', cancelText: '취소', _resolve: null },
                selectiveDel: { show: false, loading: false, entries: [] },
                rt: { connected: false },
                autoCal: { running: false },
                calib: { loaded: false, autoEnabled: true, staleCount: 0, stale: [] }, // 이상감지 게이트 상태 배지 (this.s 밖 — dirty 미유발)
                _conn: null, _toastTimer: null, _calibTimer: null,
                activeTab: 'general', // 유형별 탭: general | monitoring | anomaly | data | advanced (항상 기본=일반, 위치 미저장)
                svcRestartOpen: false, // 고급 탭 "서비스 재시작" 카드 — 기본 접힘(위험 작업)
                scanMs: 100, scanConnected: false, // PLC 스캔 주기 (Agent 동기화 — 기본 100ms)
                autoCalibrate: true, // 자동 duration 정합 ON/OFF (Agent 동기화)
                // 사용자 정의 에러(UserTag 정의) 읽기전용 목록 — filter/sort/page 클라이언트 처리
                ude: { loading: false, items: [], error: '', q: '', sortKey: 'name', sortDir: 'asc', page: 0, pageSize: 20 },

                async init() {
                    this.dark = localStorage.getItem('dspilot-theme') === 'dark';
                    window.addEventListener('storage', (e) => { if (e.key === 'dspilot-theme') this.dark = e.newValue === 'dark'; });
                    await this.load();
                    // load() 완료 후에 watch 등록 — 초기 할당으로 dirty 가 트리거되지 않도록 nextTick 후 설정.
                    this.$nextTick(() => { this.$watch('s', () => { this.settingsDirty = true; }); });
                    this.connectSignalR();
                    this.demoStartTicker();
                    this.loadScanInterval();
                    this.loadAutoCalibrate();
                    this.loadCalibStatus();
                    // 게이트 상태 폴링 — stale-repair 루프(≥1분)가 자동 재측정하면 30초 내 배지 반영.
                    this._calibTimer = setInterval(() => this.loadCalibStatus(), 30000);
                    this.loadUserDefinedErrors();
                    // 더티 가드 등록 — 미저장 설정 변경 이탈 방지
                    window.dspDirtyRegister(() => this.settingsDirty);
                },

                // ── 사용자 정의 에러(UserTag 정의) 읽기전용 조회 — Promaker/AASX 정의를 경량 엔드포인트로 가져온다.
                async loadUserDefinedErrors() {
                    this.ude.loading = true; this.ude.error = '';
                    try {
                        this.ude.items = await this.apiGet('/api/user-tags/definitions');
                    } catch (e) {
                        this.ude.error = '사용자 정의 에러 목록을 불러오지 못했습니다: ' + e.message;
                        this.ude.items = [];
                    } finally { this.ude.loading = false; }
                },
                // 매칭 조건 표기 — 사용자 정의 에러(UserTag)는 AbnormalDetect 가 아닌 값/엣지 조건.
                describeUdeOp(op, mv) {
                    const v = (mv == null || mv === '') ? '?' : mv;
                    switch (op) {
                        case 'RisingEdge': return '0 → 1'; case 'FallingEdge': return '1 → 0'; case 'Changed': return '값 변경';
                        case 'Eq': return '= ' + v; case 'Neq': return '≠ ' + v;
                        case 'Gt': return '> ' + v; case 'Gte': return '≥ ' + v;
                        case 'Lt': return '< ' + v; case 'Lte': return '≤ ' + v;
                        default: return op || '?';
                    }
                },
                // 검색어 필터 + 정렬 적용된 전체 목록
                get udeFiltered() {
                    const q = (this.ude.q || '').trim().toLowerCase();
                    let list = (this.ude.items || []).filter(d => {
                        if (q) {
                            const hay = [d.systemName, d.name, d.tagAddress, d.valueType, this.describeUdeOp(d.matchOp, d.matchValue)]
                                .map(x => (x || '').toString().toLowerCase()).join(' ');
                            if (!hay.includes(q)) return false;
                        }
                        return true;
                    });
                    const key = this.ude.sortKey, dir = this.ude.sortDir === 'asc' ? 1 : -1;
                    const val = (d) => key === 'match' ? this.describeUdeOp(d.matchOp, d.matchValue) : (d[key] ?? '');
                    return [...list].sort((a, b) => dir * val(a).toString().localeCompare(val(b).toString(), undefined, { numeric: true }));
                },
                get udeMaxPage() { return Math.max(1, Math.ceil(this.udeFiltered.length / this.ude.pageSize)); },
                // 현재 페이지에 표시할 항목
                get udePaged() {
                    const start = this.ude.page * this.ude.pageSize;
                    return this.udeFiltered.slice(start, start + this.ude.pageSize);
                },
                // 정렬 열 헤더 클릭 — 같은 열이면 방향 토글, 다른 열이면 오름차순 시작
                udeSort(key) {
                    if (this.ude.sortKey === key) this.ude.sortDir = this.ude.sortDir === 'asc' ? 'desc' : 'asc';
                    else { this.ude.sortKey = key; this.ude.sortDir = 'asc'; }
                    this.ude.page = 0;
                },
                udeSortIcon(key) {
                    if (this.ude.sortKey !== key) return 'unfold_more';
                    return this.ude.sortDir === 'asc' ? 'arrow_upward' : 'arrow_downward';
                },
                // 필터 변경 시 첫 페이지로
                udeResetPage() { this.ude.page = 0; },
                udePrevPage() { if (this.ude.page > 0) this.ude.page--; },
                udeNextPage() { if (this.ude.page + 1 < this.udeMaxPage) this.ude.page++; },

                // ── 자동 duration 정합 — Agent abnormal 판정 기준(실측 학습 ↔ 모델 확정값) 전환. 전 인스턴스 동기화.
                async loadAutoCalibrate() {
                    try {
                        const d = await this.apiGet('/api/settings/auto-calibrate');
                        this.autoCalibrate = !!d.on;
                        this.scanConnected = this.scanConnected || !!d.connected;
                    } catch (e) { /* 미연결 — scanConnected 가 disable 처리 */ }
                },
                // ── 이상감지 게이트 상태 — 확정값 ≠ 현재 모델 duration 인(stale) Work 배지. this.s 밖이라 dirty 미유발.
                async loadCalibStatus() {
                    try {
                        const d = await this.apiGet('/api/settings/calibration-status');
                        this.calib = {
                            loaded: !!d.loaded,
                            autoEnabled: !!d.autoEnabled,
                            staleCount: d.staleCount | 0,
                            stale: d.stale || [],
                        };
                    } catch (e) { /* 비치명 — 배지 미표시 */ }
                },
                async applyAutoCalibrate() {
                    try {
                        await this.apiPost('/api/settings/auto-calibrate', { on: !!this.autoCalibrate });
                        this.showToast(`자동 duration 정합 ${this.autoCalibrate ? 'ON' : 'OFF'}`, 'success');
                    } catch (e) {
                        this.showToast('자동 정합 변경 실패 — Agent 연결 상태를 확인하세요.', 'error');
                        this.loadAutoCalibrate();
                    }
                },

                // ── PLC 스캔 주기 — Agent 게이트웨이 라이브 설정. 변경은 재시작 없이 즉시 적용되고
                //    Promaker 등 모든 클라이언트와 SignalR 로 자동 동기화된다.
                async loadScanInterval() {
                    try {
                        const d = await this.apiGet('/api/settings/plc-scan-interval');
                        if (d.ms !== null && d.ms !== undefined) this.scanMs = d.ms;
                        this.scanConnected = !!d.connected;
                    } catch (e) { this.scanConnected = false; }
                },
                async applyScanInterval() {
                    try {
                        const d = await this.apiPost('/api/settings/plc-scan-interval', { ms: this.scanMs | 0 });
                        this.scanMs = d.ms;
                        this.showToast(`PLC 스캔 주기 ${d.ms}ms 적용됨 (재시작 없음)`, 'success');
                    } catch (e) {
                        this.showToast('스캔 주기 변경 실패 — Agent 연결 상태를 확인하세요.', 'error');
                        this.loadScanInterval();
                    }
                },

                // ── 건강 기준선 수동 동결 — hub 브로드캐스트로 전 인스턴스(Promaker 등) 동시 동결.
                async freezeHealthBaseline() {
                    const ok = await this.askConfirm('건강 기준선 동결',
                        '학습 중인 device duration 기준선을 현재 분포로 동결합니다.\n이후 가동은 이 기준 대비 드리프트(노화)로 추적됩니다. 진행할까요?');
                    if (!ok) return;
                    try {
                        await this.apiPost('/api/settings/health-baseline-freeze', {});
                        this.showToast('건강 기준선 동결 요청 전송됨 — 전 인스턴스 동시 적용', 'success');
                    } catch (e) {
                        this.showToast('동결 요청 실패 — Agent 연결 상태를 확인하세요.', 'error');
                    }
                },

                destroy() { this._conn?.stop(); clearTimeout(this._demoTimer); },

                // 유형별 탭 전환 — 항상 기본 '일반'에서 시작, 위치는 저장하지 않는다.
                setTab(tab) {
                    this.activeTab = tab;
                },

                // 테마 변경: .dsp-page(Alpine) + <html> + 셸 레이아웃 + 다른 탭까지 모두 반영.
                // shell.js 는 storage 이벤트를 듣고 layout/<html> 에 dark-theme 를 토글한다.
                toggleTheme() { this.setTheme(!this.dark); },
                setTheme(dark) {
                    this.dark = dark;
                    const val = this.dark ? 'dark' : 'light';
                    localStorage.setItem('dspilot-theme', val);
                    document.documentElement.classList.toggle('dark-theme', this.dark);
                    window.dispatchEvent(new StorageEvent('storage', { key: 'dspilot-theme', newValue: val }));
                },

                async apiGet(url) {
                    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },
                async apiPost(url, body) {
                    const opts = { method: 'POST', headers: { 'Accept': 'application/json' } };
                    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
                    const res = await fetch(url, opts);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },

                async load() {
                    this.loading = true;
                    try {
                        const d = await this.apiGet('/api/settings');
                        this.s = d;
                        // 배너 표시 레벨은 체크박스 배열 바인딩이라 항상 배열이어야 함(서버 null/구버전 방어). 기본 Error.
                        if (!Array.isArray(this.s.abnormalAlarmDisplayLevels)) this.s.abnormalAlarmDisplayLevels = ['Error'];
                        this.settingsDirty = false;
                        // $watch 콜백은 queueMicrotask로 지연 → 위 false를 덮어씀. 동일 큐에 재reset 적재.
                        queueMicrotask(() => { this.settingsDirty = false; });
                        this.aasx = d.aasxStatus || {};
                    } catch (e) {
                        this.showToast('설정을 불러오지 못했습니다: ' + e.message, 'error');
                    } finally { this.loading = false; }
                },
                // % 문자열 → 소수 분수(예: "10.5" → 0.105). 로케일(콤마) 허용·공백 제거, 빈값/무효는 null.
                // type=number 의 로케일(소수점) 검증으로 특정 기기에서 입력이 지워지던 문제 회피(type=text 파싱).
                pctToFrac(v) {
                    if (v == null) return null;
                    const t = String(v).trim().replace(',', '.');
                    if (t === '') return null;
                    const n = parseFloat(t);
                    return (isFinite(n) && n >= 0) ? n / 100 : null;
                },
                // 초 문자열 → ms(정수). 로케일(콤마) 허용, 빈값/무효는 0. ActionOver 절대 추가 여유값 입력용.
                secToMs(v) {
                    const t = String(v ?? '').trim().replace(',', '.');
                    const n = parseFloat(t);
                    return (isFinite(n) && n >= 0) ? Math.round(n * 1000) : 0;
                },
                async reload() {
                    await this.load();
                    this.showToast('설정을 다시 불러왔습니다.', 'info');
                },
                async refreshAasxStatus() {
                    try { this.aasx = await this.apiGet('/api/settings/aasx-status'); }
                    catch (e) { /* 503 already flagged */ }
                },

                // ── project.aasx 다운로드 (Content-Disposition: attachment → 브라우저가 저장) ──
                downloadAasx() {
                    if (!this.aasx.exists) return;
                    const a = document.createElement('a');
                    a.href = '/api/settings/download-aasx';
                    a.download = 'project.aasx';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                },

                // ── 이상 알람 배너 데모 미리보기 ── 설정 속도값으로 샘플 메시지를 실제 배너처럼 한 건씩 세로 티커 전환(값 변경 즉시 반영) ──
                demoMsgs: [
                    '투입.투입 / Conveyor1.MOVE: 동작 지연(시간 초과) (ActionOver)',
                    '검사.검사 / Inspector2.CHECK: 센서 단선/이탈 (SensorOpen)',
                    '이송.이송 / Transfer1.MOVE: 동작 과속(시간 미만) (ActionUnder)'
                ],
                demoIndex: 0, _demoTimer: null,
                get demoCurrent() { return this.demoMsgs[this.demoIndex % this.demoMsgs.length]; },
                // 대시보드와 동일: 전환 간격(초) → ms. 1~30초 클램프. 기본 3초.
                get demoDwellMs() {
                    return Math.max(1000, Math.min(30000, Math.round((this.s?.alarmTickerIntervalSec || 3) * 1000)));
                },
                demoStartTicker() {
                    clearTimeout(this._demoTimer);
                    const tick = () => {
                        this.demoIndex = (this.demoIndex + 1) % this.demoMsgs.length;
                        this._demoTimer = setTimeout(tick, this.demoDwellMs);
                    };
                    this._demoTimer = setTimeout(tick, this.demoDwellMs);
                },

                // ── H/M/S ↔ ms (Settings.razor 의 MaxCycle*/MinCycle* getter/setter 와 동일) ──
                get maxCycleHours() { return Math.floor((this.s?.historyView.maxCycleTimeMs || 0) / 3600000); },
                get maxCycleMinutes() { return Math.floor((this.s?.historyView.maxCycleTimeMs || 0) % 3600000 / 60000); },
                get maxCycleSeconds() { return Math.floor((this.s?.historyView.maxCycleTimeMs || 0) % 60000 / 1000); },
                setMaxCycle(unit, val) {
                    val = parseInt(val, 10) || 0;
                    let h = this.maxCycleHours, m = this.maxCycleMinutes, sec = this.maxCycleSeconds;
                    if (unit === 'h') h = val; else if (unit === 'm') m = val; else sec = val;
                    this.s.historyView.maxCycleTimeMs = h * 3600000 + m * 60000 + sec * 1000;
                },
                get minCycleHours() { return Math.floor((this.s?.historyView.minCycleTimeMs || 0) / 3600000); },
                get minCycleMinutes() { return Math.floor((this.s?.historyView.minCycleTimeMs || 0) % 3600000 / 60000); },
                get minCycleSeconds() { return Math.floor((this.s?.historyView.minCycleTimeMs || 0) % 60000 / 1000); },
                setMinCycle(unit, val) {
                    val = parseInt(val, 10) || 0;
                    let h = this.minCycleHours, m = this.minCycleMinutes, sec = this.minCycleSeconds;
                    if (unit === 'h') h = val; else if (unit === 'm') m = val; else sec = val;
                    this.s.historyView.minCycleTimeMs = h * 3600000 + m * 60000 + sec * 1000;
                },

                // ── 저장 ──
                async save() {
                    if (this.busy) return;
                    this.busy = true;
                    try {
                        const hv = this.s.historyView;
                        const body = {
                            dbDir: this.s.dbDir || '',
                            logLevelDefault: this.s.logLevelDefault,
                            maxCycleTimeMs: hv.maxCycleTimeMs | 0,
                            minCycleTimeMs: hv.minCycleTimeMs | 0,
                            maxCallGoingTimeMs: hv.maxCallGoingTimeMs | 0,
                            minCallGoingTimeMs: hv.minCallGoingTimeMs | 0,
                            cycleAverageWindow: (hv.cycleAverageWindow ?? 20) | 0,
                            heatmapCautionPct: +(hv.heatmapCautionPct ?? 10),
                            heatmapDangerPct: +(hv.heatmapDangerPct ?? 30),
                            alarmTickerIntervalSec: (this.s.alarmTickerIntervalSec ?? 3) | 0,
                            abnormalAlarmResetIntervalHours: (this.s.abnormalAlarmResetIntervalHours ?? 24) | 0,
                            abnormalAlarmDisplayLevels: Array.isArray(this.s.abnormalAlarmDisplayLevels) ? this.s.abnormalAlarmDisplayLevels : [],
                            autoCalibration: {
                                enabled: !!this.s.autoCalibration?.enabled,
                                minCleanCycles: (this.s.autoCalibration?.minCleanCycles ?? 10) | 0,
                                medianMarginMaxPct: +(this.s.autoCalibration?.medianMarginMaxPct ?? 0.60),
                                marginMaxAbsMs: (this.s.autoCalibration?.marginMaxAbsMs ?? 5000) | 0,
                                fillMin: !!this.s.autoCalibration?.fillMin,
                                percentileMin: +(this.s.autoCalibration?.percentileMin ?? 5),
                                marginMinPct: +(this.s.autoCalibration?.marginMinPct ?? 0.03)
                            }
                        };
                        const r = await this.apiPost('/api/settings/save', body);
                        this.showToast(r.message, r.ok ? 'success' : 'error');
                        // 저장이 ConnectionString 을 정규화하므로 재로딩.
                        if (r.ok) await this.load();
                    } catch (e) {
                        this.showToast('저장 실패: ' + e.message, 'error');
                    } finally { this.busy = false; }
                },

                // ── 라이프사이클 mutation (RebuildResult { success, message } 반환) ──
                async runLifecycle(url, refreshAasx) {
                    if (this.busy) return;
                    this.busy = true;
                    try {
                        const r = await this.apiPost(url);
                        this.showToast(r.message, r.success ? 'success' : 'error');
                        if (refreshAasx) await this.refreshAasxStatus();
                    } catch (e) {
                        this.showToast('실패: ' + e.message, 'error');
                    } finally { this.busy = false; }
                },

                async reloadAasx() {
                    const ok = await this.askConfirm('AASX 모델 다시 불러오기',
                        '디스크의 AASX 파일을 다시 읽어 메모리 모델을 갱신합니다.\n\n경로: ' + this.s.aasxFilePath + '\n\n' +
                        '• AASX 재파싱 → 메모리 DsStore 갱신\n• DB / 통계 / 히스토리는 그대로 유지\n• 모델 정의가 바뀌었다면 이어서 "DB 재구축" 실행 필요',
                        '다시 불러오기', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/reload', true);
                },
                async rebuildAasx() {
                    const ok = await this.askConfirm('모델 정의 동기화',
                        'AASX 를 다시 읽어 모델 정의를 동기화(UPSERT)하고, 새 모델에 없는 Flow 의 dspFlow/dspCall/dspFlowHistory 를 정리합니다.\n\n' +
                        '• 살아남은 Flow 의 통계/히스토리는 보존\n• 레이아웃은 Flow 집합이 바뀐 경우 자동 재배치 (이전 layout 백업)',
                        '동기화', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/rebuild-aasx', true);
                },
                async invalidateCaches() {
                    const ok = await this.askConfirm('통계 재계산',
                        '평균·누적 통계를 리셋합니다.\n\n' +
                        '• raw 데이터(plcTagLog, dspFlowHistory, 알림 이력)는 그대로 보존\n' +
                        '• 서비스 재시작 불필요 — 다음 가동부터 새 평균이 다시 쌓입니다.',
                        '재계산', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/invalidate-caches', false);
                },
                async rebuildDatabase() {
                    // 가장 파괴적 (plcTagLog 포함 raw 삭제) — confirm 가드 필수.
                    const ok = await this.askConfirm('⚠️ 전체 초기화 — raw 데이터 삭제',
                        'plc.db 를 통째로 삭제하고 스키마부터 다시 만듭니다.\n\n' +
                        'plcTagLog(수 GB 가능)·히스토리·알림 이력·모든 통계가 영구히 사라집니다.\n\n' +
                        '대부분은 "통계 재계산" 으로 충분합니다. 정말 raw 데이터까지 모두 삭제할까요?',
                        '전체 삭제', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/rebuild-database', true);
                },
                async resetSettings() {
                    // appsettings 설정값을 코드 기본값으로 — 구버전 stale 설정 복구용. PLC 데이터는 보존.
                    const ok = await this.askConfirm('모든 설정 기본값으로 초기화',
                        '이상치 필터·대시보드 윈도우·시프트·OEE 신호·CCTV 카메라·DB 경로·로그 수준 등 모든 설정값을 기본값으로 되돌립니다.\n\n' +
                        '• PLC 원시 데이터(plcTagLog 등)는 삭제되지 않습니다\n' +
                        '• CCTV 카메라 목록이 비워집니다\n' +
                        '• DB 경로·포트 등 호스트 설정은 서비스 재시작 후 적용\n\n' +
                        '업그레이드 시 이전 설정이 보존되므로, 구버전 설정이 문제를 일으킬 때만 사용하세요.',
                        '초기화', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/reset-defaults', false);
                    // 초기화된 값으로 폼 갱신
                    await this.load();
                },

                // ── 실측 duration 자동 보정 즉시 실행 ("지금 실측값 채우기") — CompletedAt 무시하고 재보정 ──
                async fillAutoCalibration() {
                    if (this.busy || this.autoCal.running) return;
                    const baseMsg =
                        '현재까지 수집된 실측값으로 적합 Flow 디바이스의 Duration/Max(및 설정 시 Min)를 project.aasx 에 즉시 기록합니다.\n\n' +
                        '• 클린 가동이 충분한 Flow 의 디바이스만 보정\n' +
                        '• 측정 span 이 있는 디바이스만 덮어씁니다\n' +
                        '• 완료 여부와 무관하게 다시 실행할 수 있습니다';
                    if (this.settingsDirty) {
                        const ok = await this.askConfirm('저장 후 실측값 채우기',
                            '⚠️ 저장되지 않은 설정 변경이 있습니다. 설정을 먼저 저장한 뒤 실측값을 채웁니다.\n\n' + baseMsg,
                            '저장 후 채우기', '취소');
                        if (!ok) return;
                        await this.save();
                        // save() 성공 시 load()→settingsDirty=false. 여전히 dirty면 저장 실패.
                        if (this.settingsDirty) return;
                    } else {
                        const ok = await this.askConfirm('지금 실측값 채우기', baseMsg, '실측값 채우기', '취소');
                        if (!ok) return;
                    }
                    this.autoCal.running = true;
                    try {
                        const r = await this.apiPost('/api/settings/auto-calibrate/run');
                        this.showToast(r.message, r.success ? 'success' : 'error');
                        if (r.success) { await this.load(); await this.loadCalibStatus(); }
                    } catch (e) {
                        this.showToast('실측값 채우기 실패: ' + e.message, 'error');
                    } finally { this.autoCal.running = false; }
                },


                // ── 모든 디바이스 Min/Max 전부 초기화(null) — Duration 은 보존 ──
                async clearCalibrationRanges() {
                    if (this.busy || this.autoCal.running) return;
                    const ok = await this.askConfirm('Min/Max 전부 초기화',
                        '모든 디바이스의 이상감지 Min/Max(최소/최대 소요시간)를 project.aasx 에서 전부 비웁니다(null).\n\n' +
                        '• Duration(거동 구동 평균)은 그대로 보존됩니다\n' +
                        '• 잘못 보정된 임계값을 한 번에 초기화할 때 사용\n' +
                        '• 다시 "지금 실측값 채우기" 로 재보정할 수 있습니다',
                        '전부 초기화', '취소');
                    if (!ok) return;
                    this.autoCal.running = true;
                    try {
                        const r = await this.apiPost('/api/settings/auto-calibrate/clear-ranges');
                        this.showToast(r.message, r.success ? 'success' : 'error');
                        if (r.success) await this.load();
                    } catch (e) {
                        this.showToast('초기화 실패: ' + e.message, 'error');
                    } finally { this.autoCal.running = false; }
                },

                // ── 서비스 재시작 (target = agent | mtx | dspilot | all) — 접힘 카드 + 확인 팝업 가드 ──
                // agent/mtx: 백엔드 인라인 동기 실행 → 실제 결과 토스트, 화면 유지.
                // dspilot/all: DSPilot 이 자신을 재시작 → detached 배치. 화면 연결이 잠시 끊겼다가 SignalR 자동 재연결.
                async restartService(target) {
                    if (this.busy) return;
                    const meta = {
                        agent: { name: 'Promaker.Agent', self: false },
                        mtx: { name: 'DSPilot MediaMTX', self: false },
                        dspilot: { name: 'DSPilot', self: true },
                        all: { name: '세 서비스 전체 (MediaMTX · Promaker.Agent · DSPilot)', self: true },
                    }[target];
                    if (!meta) return;
                    const selfNote = meta.self
                        ? '\n• 이 화면의 실시간 연결이 잠시 끊겼다가 자동으로 다시 연결됩니다\n• DSPilot 서비스는 응답 후 약 2초 뒤 재시작됩니다'
                        : '';
                    const ok = await this.askConfirm('⚠️ 서비스 재시작',
                        `${meta.name} 를 재시작합니다.\n\n` +
                        '• 해당 서비스의 모니터링·데이터 수집이 수 초간 중단됩니다' + selfNote +
                        '\n\n정말 재시작할까요?',
                        '재시작', '취소');
                    if (!ok) return;
                    this.busy = true;
                    try {
                        const r = await this.apiPost('/api/settings/restart-services', { target });
                        this.showToast(r.message, r.success ? 'success' : 'error');
                    } catch (e) {
                        this.showToast('서비스 재시작 요청 실패: ' + e.message, 'error');
                    } finally { this.busy = false; }
                },

                // ── AASX 갱신일 기준 선택 삭제 ──
                async openSelectiveDel() {
                    this.selectiveDel.show = true;
                    this.selectiveDel.loading = true;
                    this.selectiveDel.entries = [];
                    try {
                        const data = await this.apiGet('/api/settings/aasx-changelog');
                        this.selectiveDel.entries = data;
                    } catch (e) {
                        this.showToast('이력을 불러오지 못했습니다: ' + e.message, 'error');
                        this.selectiveDel.show = false;
                    } finally {
                        this.selectiveDel.loading = false;
                    }
                },
                async selectiveDelChoose(entry) {
                    this.selectiveDel.show = false;
                    const ok = await this.askConfirm(
                        '⚠️ 데이터 선택 삭제',
                        `선택 시각: ${entry.changedAtLocal}\n\n` +
                        '해당 시각 이전의 다음 데이터를 삭제합니다:\n' +
                        '• plcTagLog (PLC 신호 시계열)\n' +
                        '• userTagAlertLog / userTagAlertDaily (알림 이력)\n' +
                        '• dspFlowHistory (Flow 가동 이력)\n' +
                        '• oeeDowntimeEvent (OEE 정지 이벤트)\n\n' +
                        '선택 시각 이후 데이터는 보존됩니다.\n' +
                        '계속하시겠습니까?',
                        '삭제', '취소');
                    if (!ok) return;
                    if (this.busy) return;
                    this.busy = true;
                    try {
                        const r = await this.apiPost('/api/settings/delete-data-before', { cutoffIso: entry.cutoffIso });
                        this.showToast(r.message, r.success ? 'success' : 'error');
                    } catch (e) {
                        this.showToast('삭제 실패: ' + e.message, 'error');
                    } finally {
                        this.busy = false;
                    }
                },

                // ── 확인 모달 (Promise 기반 — Blazor showConfirm 대체) ──
                askConfirm(title, message, okText, cancelText) {
                    return new Promise((resolve) => {
                        this.confirm = { show: true, title, message, okText: okText || '확인', cancelText: cancelText || '취소', _resolve: resolve };
                    });
                },
                confirmOk() { const r = this.confirm._resolve; this.confirm.show = false; this.confirm._resolve = null; if (r) r(true); },
                confirmCancel() { const r = this.confirm._resolve; this.confirm.show = false; this.confirm._resolve = null; if (r) r(false); },

                // ── SignalR — 외부에서 AASX 가 바뀌면 (Promaker agent 등) 상태 배지 자동 갱신 ──
                connectSignalR() {
                    if (!window.signalR) return;
                    const conn = new signalR.HubConnectionBuilder().withUrl('/hubs/monitoring').withAutomaticReconnect([0, 0, 1000, 3000, 5000, 10000]).build();
                    conn.on('DatabaseRebuilt', () => this.refreshAasxStatus());
                    // 자동 보정 적용 → 카드의 시각/요약 갱신(알림 토스트는 공용 셸 shell.js 가 표시).
                    // ⚠ 편집 중(입력 포커스)·미저장 상태에는 재로드 스킵 — this.s 전체 교체가 입력 중인 값을 지우던 버그 방지.
                    conn.on('AutoCalibrationApplied', () => {
                        const ae = document.activeElement;
                        const editing = ae && ['INPUT', 'SELECT', 'TEXTAREA'].includes(ae.tagName);
                        if (!this.settingsDirty && !editing) this.load();
                    });
                    // PLC 스캔 주기 동기화 — Promaker/다른 클라이언트가 바꾸면 슬라이더 실시간 갱신.
                    conn.on('ScanIntervalChanged', (ms) => { this.scanMs = ms; this.scanConnected = true; });
                    conn.on('AutoCalibrateChanged', (on) => { this.autoCalibrate = !!on; this.scanConnected = true; });
                    conn.onreconnected(() => { this.rt.connected = true; this.refreshAasxStatus(); });
                    conn.onreconnecting(() => { this.rt.connected = false; });
                    conn.onclose(() => { this.rt.connected = false; });
                    conn.start().then(() => { this.rt.connected = true; }).catch(() => { this.rt.connected = false; });
                    this._conn = conn;
                },

                showToast(msg, type) {
                    this.toast = { show: true, msg, type: type || 'success' };
                    clearTimeout(this._toastTimer);
                    this._toastTimer = setTimeout(() => { this.toast.show = false; }, 4000);
                }
            };
        }
    </script>
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
</body>

</html>
