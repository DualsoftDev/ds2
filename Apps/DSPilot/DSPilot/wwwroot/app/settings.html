<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>설정 — DSPilot</title>

    <!--
      격리형 호스팅 레퍼런스 #5 (Settings). FIRST heavy-mutation 페이지 — mutation-controller convention 확립.
      서버/모델 = C#(/api/settings/*), 뷰 = Alpine + fetch.
      GET /api/settings (전체) + /aasx-status. POST /save·/reload·/rebuild-aasx·/invalidate-caches·
      /clear-flow-history·/rebuild-database·/restore-flow-defaults — 모두 antiforgery 미적용 평범한 JSON fetch.
      파괴적 POST(rebuild-database / clear-flow-history)는 confirm() 가드 필수.
      Blazor IJSRuntime showSnackbar/showConfirm 라운드트립은 inline Alpine 토스트 + 모달로 대체.
      ConnectionString↔DB폴더 분리 / H·M·S↔ms 변환은 서버(SettingsController)에서 처리.
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/theme.css" rel="stylesheet" />
    <link href="/css/components.css" rel="stylesheet" />
    <link href="/css/dark-theme.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />

    <style>
        [x-cloak] { display: none !important; }

        /* ── 독립 셸 (cctv.html / dashboard.html 과 동일) ── */
        .dsp-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); color: var(--color-text-primary); font-family: 'Noto Sans KR', sans-serif; }
        .dsp-appbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; background: var(--color-appbar-bg, var(--color-surface)); color: var(--color-appbar-text, var(--color-text-primary)); border-bottom: 1px solid var(--color-lines); box-shadow: var(--shadow-1); position: sticky; top: 0; z-index: 50; flex-shrink: 0; }
        .dsp-appbar .dsp-title { font-size: 18px; font-weight: 800; }
        .dsp-appbar .dsp-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--color-primary); color: #fff; }
        .dsp-appbar .spacer { flex: 1; }
        .dsp-appbar a { color: inherit; text-decoration: none; opacity: 0.8; font-size: 14px; }
        .dsp-appbar a:hover { opacity: 1; text-decoration: underline; }
        .dsp-main { flex: 1; min-height: 0; padding: 16px; max-width: 1280px; margin: 0 auto; width: 100%; }
        .btn.btn-primary { background: var(--color-primary); color: #fff; border: 1px solid var(--color-primary); }
        .btn.btn-primary:hover { filter: brightness(1.05); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(2px); }
        .modal-content { background: var(--color-surface); border-radius: 12px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        @keyframes heatmap-indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

        /* 간이 토스트 (cctv.html 과 동일) */
        .dsp-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2500; padding: 10px 18px; border-radius: 8px; color: #fff; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); max-width: 90vw; }
        .dsp-toast.success { background: #2e7d32; }
        .dsp-toast.error { background: #c62828; }
        .dsp-toast.info { background: #1565c0; }

        /* ── Settings 레이아웃 (Settings.razor inline-style 을 클래스로 정리) ── */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 900px) { .settings-grid { grid-template-columns: 1fr; } }
        .settings-col { display: flex; flex-direction: column; gap: 16px; }
        .settings-actions { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 16px; }
        .settings-note { padding: 8px 12px; margin-bottom: 12px; background: var(--color-surface-variant, #f5f5f5); border-radius: 6px; border-left: 3px solid var(--color-primary); }
        .settings-note small { color: var(--color-text-secondary); line-height: 1.5; }
        .settings-hint { color: var(--color-text-secondary); margin-top: 6px; display: block; }
        .settings-status-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; margin: 8px 0 12px; }
        .settings-status-grid .lbl { color: var(--color-text-secondary); }
        .hms-row { display: flex; gap: 8px; align-items: center; }
        .hms-cell { display: flex; align-items: center; gap: 4px; }
        .hms-cell input { width: 70px; text-align: center; }
        .hms-cell span { font-size: 13px; color: var(--color-text-secondary); }
        .cam-card { border: 1px solid var(--color-lines, #e0e0e0); border-radius: 6px; padding: 10px; margin-bottom: 8px; }
        .cam-row1 { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
        .mono { font-family: monospace; font-size: 12px; }
        .divider { border: none; border-top: 1px solid var(--color-lines, #e0e0e0); }
        .settings-page code { background: rgba(0,0,0,0.04); padding: 1px 6px; border-radius: 4px; font-family: 'Consolas','Courier New',monospace; font-size: 0.8125rem; }
        .dark-theme .settings-page code { background: rgba(255,255,255,0.08); }
        .modal-confirm { max-width: 520px; }
        .modal-confirm h3 { margin: 0 0 12px; font-size: 18px; }
        .modal-confirm .msg { white-space: pre-line; color: var(--color-text-secondary); line-height: 1.6; font-size: 14px; max-height: 50vh; overflow-y: auto; }
        .modal-confirm .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="settingsApp()" x-init="init()" x-cloak>

        <!-- 데모 만료 -->
        <div class="modal-overlay" x-show="demoBlocked" style="z-index:4000;">
            <div class="modal-content" style="max-width:480px; text-align:center;">
                <h2 style="color:var(--color-warning, #f0883e); margin:0 0 12px;">DEMO 만료</h2>
                <p>데모 사용 시간(3시간)이 종료되었습니다.</p>
                <p>서비스 관리자에게 문의해 주세요.</p>
            </div>
        </div>

        <header class="dsp-appbar">
            <span class="dsp-title">설정</span>
            <span class="dsp-badge">정적/격리</span>
            <div class="spacer"></div>
            <a href="/settings" title="Blazor 버전과 비교">Blazor 버전</a>
            <a href="/app/dashboard.html">대시보드</a>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환" style="margin-left:8px;">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">
            <!-- 로딩 -->
            <div x-show="loading && !s" style="height:4px; background:var(--color-surface-variant, #e0e0e0); border-radius:2px; overflow:hidden;">
                <div style="height:100%; width:25%; background:var(--color-primary); animation: heatmap-indeterminate 1.5s infinite ease-in-out;"></div>
            </div>

            <template x-if="s">
                <div class="settings-page">
                    <!-- 상단 액션 -->
                    <div class="settings-actions">
                        <button class="btn btn-outlined" @click="reload()" :disabled="busy">
                            <span class="material-icons" style="font-size:18px;">refresh</span> 되돌리기
                        </button>
                        <button class="btn btn-filled" @click="save()" :disabled="busy">
                            <span class="material-icons" style="font-size:18px;">save</span> 저장
                        </button>
                    </div>

                    <div class="settings-grid">
                        <!-- 왼쪽 열 -->
                        <div class="settings-col">

                            <!-- AASX 모델 -->
                            <div class="card" style="box-shadow: var(--shadow-2);">
                                <div class="card-header">
                                    <span class="material-icons mr-2">schema</span>
                                    <h6 class="typo-h6">AASX 모델</h6>
                                </div>
                                <div class="card-content">
                                    <div class="settings-note">
                                        <small>
                                            Promaker 와 공유하는 AASX 모델 파일. 경로는 두 앱 공통 고정값으로 운영됩니다.<br />
                                            <strong>Promaker 에서 같은 경로에 저장</strong>한 뒤 아래 "모델 다시 불러오기" 를 누르면 dspilot 에 반영됩니다.
                                        </small>
                                    </div>

                                    <div class="form-group mb-2">
                                        <label class="form-label">파일 경로 (고정)</label>
                                        <input class="form-field mono" :value="s.aasxFilePath" readonly
                                               style="background:var(--color-surface-variant, #f7f7f7);" />
                                    </div>

                                    <div class="settings-status-grid">
                                        <span class="lbl">파일 상태</span>
                                        <template x-if="aasx.exists"><span style="color:#27ae60;" x-text="'존재함 (' + aasx.sizeDisplay + ')'"></span></template>
                                        <template x-if="!aasx.exists"><span style="color:#c0392b;">파일 없음 — Promaker 에서 먼저 저장하세요</span></template>

                                        <span class="lbl">파일 수정</span>
                                        <span x-text="aasx.writeTimeLocal"></span>

                                        <span class="lbl">마지막 로드</span>
                                        <span x-text="aasx.lastLoadedLocal"></span>

                                        <span class="lbl">동기화</span>
                                        <span :style="`color:${aasx.syncColor};`" x-text="aasx.syncText"></span>
                                    </div>

                                    <button class="btn btn-outlined" style="width:100%;" @click="reloadAasx()" :disabled="busy || !aasx.exists">
                                        <span class="material-icons" style="font-size:18px;">refresh</span>
                                        AASX 모델 다시 불러오기
                                    </button>
                                    <small class="settings-hint">
                                        디스크의 AASX 파일을 다시 읽어 메모리 모델을 갱신합니다.
                                        DB / 통계 / 히스토리는 그대로 유지됩니다.
                                        모델 정의가 바뀌었다면 아래 "DB 재구축" 도 함께 실행하세요.
                                    </small>
                                    <hr class="divider my-3" />
                                    <button class="btn btn-outlined" style="width:100%;" @click="rebuildAasx()" :disabled="busy || !aasx.exists">
                                        <span class="material-icons" style="font-size:18px;">sync</span>
                                        모델 정의 동기화 (Reload + Resync)
                                    </button>
                                    <small class="settings-hint">
                                        AASX 재로딩 + 모델 정의 동기화(UPSERT) + 사라진 Flow 정리 + 레이아웃 자동 재배치.
                                        살아남은 Flow 의 통계/히스토리는 보존됩니다.
                                    </small>
                                </div>
                            </div>

                            <!-- 데이터베이스 -->
                            <div class="card" style="box-shadow: var(--shadow-2);">
                                <div class="card-header">
                                    <span class="material-icons mr-2">storage</span>
                                    <h6 class="typo-h6">데이터베이스</h6>
                                </div>
                                <div class="card-content">
                                    <div class="form-group mb-3">
                                        <label class="form-label">DB 저장 폴더</label>
                                        <input class="form-field" x-model="s.dbDir" placeholder="%ProgramData%/DualSoft/Shared" />
                                        <small class="settings-hint">
                                            plc.db 파일이 저장될 폴더. 서비스 모드에서 <code>%APPDATA%</code> 는 SYSTEM 계정 경로로 해석되므로 사용 금지.
                                        </small>
                                    </div>
                                    <hr class="divider my-3" />
                                    <button class="btn btn-outlined" style="width:100%;" @click="invalidateCaches()" :disabled="busy">
                                        <span class="material-icons" style="font-size:18px;">restart_alt</span> 캐시 재계산 (raw 보존)
                                    </button>
                                    <small class="settings-hint">
                                        dspFlow / dspCall 의 평균/누적 통계만 NULL 초기화. plcTagLog · dspFlowHistory · userTagAlertLog 는 그대로 보존.
                                        head/tail 이 바뀌었거나 모델이 크게 바뀌어 새 baseline 으로 평균을 다시 누적하고 싶을 때 사용.
                                        다음 사이클부터 자연스럽게 누적 시작.
                                    </small>
                                    <hr class="divider my-3" />
                                    <button class="btn btn-outlined" style="width:100%; color:#e67e22; border-color:#e67e22;" @click="clearFlowHistory()" :disabled="busy">
                                        <span class="material-icons" style="font-size:18px;">delete_sweep</span> Flow 히스토리 삭제
                                    </button>
                                    <small class="settings-hint">
                                        dspFlowHistory + Call 통계 초기화. plcTagLog 는 보존. Flow/Call 정의와 AASX 도 유지.
                                    </small>
                                    <hr class="divider my-3" />
                                    <button class="btn btn-outlined" style="width:100%; color:#c0392b; border-color:#c0392b;" @click="rebuildDatabase()" :disabled="busy">
                                        <span class="material-icons" style="font-size:18px;">delete_forever</span> 전체 초기화 (plcTagLog 포함 삭제)
                                    </button>
                                    <small class="settings-hint">
                                        ⚠️ plc.db 파일 자체를 삭제하고 스키마부터 재생성. plcTagLog (수 GB 단위 가능), dspFlowHistory, userTagAlertLog 등
                                        <strong>raw 데이터를 모두 잃습니다.</strong> 대부분의 경우 위의 "캐시 재계산" 으로 충분합니다.
                                    </small>
                                    <small class="settings-hint">
                                        현재 DB: <span x-text="s.dbPath"></span>
                                    </small>
                                </div>
                            </div>

                            <!-- 로깅 -->
                            <div class="card" style="box-shadow: var(--shadow-2);">
                                <div class="card-header">
                                    <span class="material-icons mr-2">bug_report</span>
                                    <h6 class="typo-h6">로깅</h6>
                                </div>
                                <div class="card-content">
                                    <div class="form-group">
                                        <label class="form-label">로그 수준</label>
                                        <select class="form-select" x-model="s.logLevelDefault">
                                            <template x-for="level in s.logLevels" :key="level">
                                                <option :value="level" x-text="level"></option>
                                            </template>
                                        </select>
                                        <small class="settings-hint">
                                            세부 카테고리별 로그 수준은 <code>appsettings.json</code> 에서 직접 편집.
                                        </small>
                                    </div>
                                </div>
                            </div>

                            <!-- UI -->
                            <div class="card" style="box-shadow: var(--shadow-2);">
                                <div class="card-header">
                                    <span class="material-icons mr-2">settings</span>
                                    <h6 class="typo-h6">사용자 인터페이스</h6>
                                </div>
                                <div class="card-content">
                                    <label class="switch mb-2">
                                        <input type="checkbox" x-model="s.showPlcDebug" />
                                        PLC 디버그 페이지 표시
                                    </label>
                                    <small class="settings-hint">
                                        왼쪽 메뉴에 PLC 디버그 항목을 노출합니다.
                                    </small>
                                </div>
                            </div>
                        </div>

                        <!-- 오른쪽 열 -->
                        <div class="settings-col">

                            <!-- 이상치 필터 -->
                            <div class="card" style="box-shadow: var(--shadow-2);">
                                <div class="card-header">
                                    <span class="material-icons mr-2">filter_list</span>
                                    <h6 class="typo-h6">이상치 필터</h6>
                                </div>
                                <div class="card-content">
                                    <div class="settings-note">
                                        <small>저장하면 서버 재시작 없이 즉시 적용됩니다.</small>
                                    </div>

                                    <h6 class="typo-subtitle2" style="margin-bottom:8px;">
                                        <span class="material-icons" style="font-size:16px; vertical-align:middle; margin-right:4px;">timer_off</span>
                                        비가동 사이클 판정
                                    </h6>
                                    <small style="color: var(--color-text-secondary); display:block; margin-bottom:8px;">
                                        CT가 최대 제한을 초과하거나 최소 제한에 미달하면 비가동 사이클로 판정. 대시보드·동작편차·Flow 평균에서 제외, 사이클 분석에서 회색 배경 표시.
                                    </small>
                                    <div class="form-group">
                                        <label class="form-label">사이클 시간 최대 제한 (초과 시 제외)</label>
                                        <div class="hms-row">
                                            <div class="hms-cell"><input type="number" class="form-field" :value="maxCycleHours" @input="setMaxCycle('h', $event.target.value)" min="0" max="99" /><span>시</span></div>
                                            <div class="hms-cell"><input type="number" class="form-field" :value="maxCycleMinutes" @input="setMaxCycle('m', $event.target.value)" min="0" max="59" /><span>분</span></div>
                                            <div class="hms-cell"><input type="number" class="form-field" :value="maxCycleSeconds" @input="setMaxCycle('s', $event.target.value)" min="0" max="59" /><span>초</span></div>
                                        </div>
                                        <small class="settings-hint">가장 긴 Flow 의 평균 CT + 여유시간 권장. 모두 0이면 비활성.</small>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">사이클 시간 최소 제한 (미달 시 제외)</label>
                                        <div class="hms-row">
                                            <div class="hms-cell"><input type="number" class="form-field" :value="minCycleHours" @input="setMinCycle('h', $event.target.value)" min="0" max="99" /><span>시</span></div>
                                            <div class="hms-cell"><input type="number" class="form-field" :value="minCycleMinutes" @input="setMinCycle('m', $event.target.value)" min="0" max="59" /><span>분</span></div>
                                            <div class="hms-cell"><input type="number" class="form-field" :value="minCycleSeconds" @input="setMinCycle('s', $event.target.value)" min="0" max="59" /><span>초</span></div>
                                        </div>
                                        <small class="settings-hint">오감지·노이즈로 인한 짧은 사이클 제외용. 모두 0이면 비활성.</small>
                                    </div>

                                    <hr class="divider" style="margin:16px 0;" />

                                    <h6 class="typo-subtitle2" style="margin-bottom:8px;">
                                        <span class="material-icons" style="font-size:16px; vertical-align:middle; margin-right:4px;">speed</span>
                                        개별 Call 실행시간 제한
                                    </h6>
                                    <small style="color: var(--color-text-secondary); display:block; margin-bottom:8px;">
                                        GoingTime 이 최대 초과 또는 최소 미달이면 동작편차 통계에서 제외.
                                    </small>
                                    <div class="form-group">
                                        <label class="form-label">최대 실행시간 (ms, 초과 시 제외)</label>
                                        <input type="number" class="form-field" x-model.number="s.historyView.maxCallGoingTimeMs" min="1000" max="600000" placeholder="30000" />
                                        <small class="settings-hint">기본: 30,000ms (30초)</small>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">최소 실행시간 (ms, 미달 시 제외)</label>
                                        <input type="number" class="form-field" x-model.number="s.historyView.minCallGoingTimeMs" min="0" max="600000" placeholder="0" />
                                        <small class="settings-hint">오감지·노이즈로 인한 짧은 동작 제외용. 0이면 비활성.</small>
                                    </div>
                                </div>
                            </div>

                            <!-- Flow CT 기준 -->
                            <div class="card" style="box-shadow: var(--shadow-2);">
                                <div class="card-header">
                                    <span class="material-icons mr-2">restart_alt</span>
                                    <h6 class="typo-h6">Flow CT 기준</h6>
                                </div>
                                <div class="card-content">
                                    <button class="btn btn-outlined" style="width:100%;" @click="restoreFlowDefaults()" :disabled="busy">
                                        <span class="material-icons" style="font-size:18px;">restart_alt</span>
                                        AASX 기준으로 복원
                                    </button>
                                    <small class="settings-hint">
                                        Flow 별 사용자 start/end Call override 를 모두 제거하고 AASX 해석 결과로 되돌립니다.
                                        통계/히스토리는 보존.
                                    </small>
                                </div>
                            </div>

                            <!-- CCTV -->
                            <div class="card" style="box-shadow: var(--shadow-2);">
                                <div class="card-header">
                                    <span class="material-icons mr-2">videocam</span>
                                    <h6 class="typo-h6">CCTV (RTSP)</h6>
                                </div>
                                <div class="card-content">
                                    <div class="settings-note">
                                        <small>
                                            RTSP 카메라를 등록하면 <strong>MediaMTX</strong>(별도 서비스)가 받아 WebRTC 로 재게시하고,
                                            <a href="/app/cctv.html">CCTV 페이지</a>에서 시청합니다. 저장 시 MediaMTX 에 자동 반영됩니다.
                                        </small>
                                    </div>

                                    <div class="form-group mb-2">
                                        <label class="form-label">MediaMTX 제어 API</label>
                                        <input class="form-field mono" x-model="s.cctv.mediaMtxApiUrl" placeholder="http://localhost:9997" />
                                    </div>
                                    <div class="form-group mb-3">
                                        <label class="form-label">WebRTC 포트</label>
                                        <input type="number" class="form-field" x-model.number="s.cctv.webRtcPort" min="1" max="65535" placeholder="8889" style="width:120px;" />
                                    </div>

                                    <hr class="divider my-2" />

                                    <template x-if="s.cctv.cameras.length === 0">
                                        <small style="color: var(--color-text-secondary); display:block; margin:8px 0;">등록된 카메라가 없습니다.</small>
                                    </template>
                                    <template x-for="(cam, i) in s.cctv.cameras" :key="i">
                                        <div class="cam-card">
                                            <div class="cam-row1">
                                                <input class="form-field" x-model="cam.name" placeholder="이름 (예: line1-entry)" style="flex:1;" />
                                                <label class="switch" style="margin:0; white-space:nowrap;">
                                                    <input type="checkbox" x-model="cam.enabled" /> 사용
                                                </label>
                                                <button class="btn btn-sm" style="color:#c0392b;" @click="removeCamera(i)" title="삭제">
                                                    <span class="material-icons" style="font-size:18px;">delete</span>
                                                </button>
                                            </div>
                                            <input class="form-field mono" x-model="cam.rtspUrl" placeholder="rtsp://user:pass@192.168.0.10:554/stream1" />
                                        </div>
                                    </template>

                                    <button class="btn btn-outlined btn-sm" style="width:100%;" @click="addCamera()">
                                        <span class="material-icons" style="font-size:16px;">add</span> 카메라 추가
                                    </button>
                                    <small class="settings-hint">
                                        MediaMTX 동기화 상태: <span :style="`color:${s.cctv.syncOk ? '#27ae60' : '#c0392b'};`" x-text="s.cctv.syncMessage"></span>
                                    </small>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </template>
        </main>

        <!-- 확인 모달 (showConfirm 대체) -->
        <div class="modal-overlay" x-show="confirm.show" style="display:none; z-index:3000;" @click="confirmCancel()">
            <div class="modal-content modal-confirm" @click.stop>
                <h3 x-text="confirm.title"></h3>
                <div class="msg" x-text="confirm.message"></div>
                <div class="actions">
                    <button class="btn btn-outlined" @click="confirmCancel()" x-text="confirm.cancelText"></button>
                    <button class="btn btn-primary" @click="confirmOk()" x-text="confirm.okText"></button>
                </div>
            </div>
        </div>

        <!-- 토스트 -->
        <div class="dsp-toast" :class="toast.type" x-show="toast.show" x-transition style="display:none;" x-text="toast.msg"></div>
    </div>

    <script src="/lib/signalr.min.js"></script>
    <script>
        function settingsApp() {
            return {
                s: null, aasx: {}, loading: true, busy: false, dark: false, demoBlocked: false,
                toast: { show: false, msg: '', type: 'success' },
                confirm: { show: false, title: '', message: '', okText: '확인', cancelText: '취소', _resolve: null },
                _conn: null, _toastTimer: null,

                async init() {
                    this.dark = localStorage.getItem('dspilot-theme') === 'dark';
                    window.addEventListener('storage', (e) => { if (e.key === 'dspilot-theme') this.dark = e.newValue === 'dark'; });
                    await this.load();
                    this.connectSignalR();
                },
                toggleTheme() { this.dark = !this.dark; localStorage.setItem('dspilot-theme', this.dark ? 'dark' : 'light'); },

                async apiGet(url) {
                    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                    if (res.status === 503) { this.demoBlocked = true; throw new Error('demo-blocked'); }
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },
                async apiPost(url, body) {
                    const opts = { method: 'POST', headers: { 'Accept': 'application/json' } };
                    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
                    const res = await fetch(url, opts);
                    if (res.status === 503) { this.demoBlocked = true; throw new Error('demo-blocked'); }
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },

                async load() {
                    this.loading = true;
                    try {
                        const d = await this.apiGet('/api/settings');
                        this.s = d;
                        this.aasx = d.aasxStatus || {};
                    } catch (e) {
                        if (e.message !== 'demo-blocked') this.showToast('설정을 불러오지 못했습니다: ' + e.message, 'error');
                    } finally { this.loading = false; }
                },
                async reload() {
                    await this.load();
                    this.showToast('설정을 다시 불러왔습니다.', 'info');
                },
                async refreshAasxStatus() {
                    try { this.aasx = await this.apiGet('/api/settings/aasx-status'); }
                    catch (e) { /* 503 already flagged */ }
                },

                // ── H/M/S ↔ ms (Settings.razor 의 MaxCycle*/MinCycle* getter/setter 와 동일) ──
                get maxCycleHours() { return Math.floor((this.s?.historyView.maxCycleTimeMs || 0) / 3600000); },
                get maxCycleMinutes() { return Math.floor((this.s?.historyView.maxCycleTimeMs || 0) % 3600000 / 60000); },
                get maxCycleSeconds() { return Math.floor((this.s?.historyView.maxCycleTimeMs || 0) % 60000 / 1000); },
                setMaxCycle(unit, val) {
                    val = parseInt(val, 10) || 0;
                    let h = this.maxCycleHours, m = this.maxCycleMinutes, sec = this.maxCycleSeconds;
                    if (unit === 'h') h = val; else if (unit === 'm') m = val; else sec = val;
                    this.s.historyView.maxCycleTimeMs = h * 3600000 + m * 60000 + sec * 1000;
                },
                get minCycleHours() { return Math.floor((this.s?.historyView.minCycleTimeMs || 0) / 3600000); },
                get minCycleMinutes() { return Math.floor((this.s?.historyView.minCycleTimeMs || 0) % 3600000 / 60000); },
                get minCycleSeconds() { return Math.floor((this.s?.historyView.minCycleTimeMs || 0) % 60000 / 1000); },
                setMinCycle(unit, val) {
                    val = parseInt(val, 10) || 0;
                    let h = this.minCycleHours, m = this.minCycleMinutes, sec = this.minCycleSeconds;
                    if (unit === 'h') h = val; else if (unit === 'm') m = val; else sec = val;
                    this.s.historyView.minCycleTimeMs = h * 3600000 + m * 60000 + sec * 1000;
                },

                // ── 카메라 편집 (로컬 Alpine 상태 — 저장 시 일괄 전송) ──
                addCamera() { this.s.cctv.cameras.push({ name: 'camera' + (this.s.cctv.cameras.length + 1), rtspUrl: '', enabled: true }); },
                removeCamera(i) { this.s.cctv.cameras.splice(i, 1); },

                // ── 저장 ──
                async save() {
                    if (this.busy) return;
                    this.busy = true;
                    try {
                        const hv = this.s.historyView;
                        const body = {
                            dbDir: this.s.dbDir || '',
                            logLevelDefault: this.s.logLevelDefault,
                            showPlcDebug: !!this.s.showPlcDebug,
                            maxCycleTimeMs: hv.maxCycleTimeMs | 0,
                            minCycleTimeMs: hv.minCycleTimeMs | 0,
                            maxCallGoingTimeMs: hv.maxCallGoingTimeMs | 0,
                            minCallGoingTimeMs: hv.minCallGoingTimeMs | 0,
                            mediaMtxApiUrl: this.s.cctv.mediaMtxApiUrl,
                            webRtcPort: this.s.cctv.webRtcPort | 0,
                            cameras: this.s.cctv.cameras.map(c => ({ name: c.name, rtspUrl: c.rtspUrl, enabled: !!c.enabled }))
                        };
                        const r = await this.apiPost('/api/settings/save', body);
                        this.showToast(r.message, r.ok ? 'success' : 'error');
                        // 저장이 ConnectionString 을 정규화하고 CCTV 동기화 상태가 바뀌므로 재로딩.
                        if (r.ok) await this.load();
                    } catch (e) {
                        if (e.message !== 'demo-blocked') this.showToast('저장 실패: ' + e.message, 'error');
                    } finally { this.busy = false; }
                },

                // ── 라이프사이클 mutation (RebuildResult { success, message } 반환) ──
                async runLifecycle(url, refreshAasx) {
                    if (this.busy) return;
                    this.busy = true;
                    try {
                        const r = await this.apiPost(url);
                        this.showToast(r.message, r.success ? 'success' : 'error');
                        if (refreshAasx) await this.refreshAasxStatus();
                    } catch (e) {
                        if (e.message !== 'demo-blocked') this.showToast('실패: ' + e.message, 'error');
                    } finally { this.busy = false; }
                },

                async reloadAasx() {
                    const ok = await this.askConfirm('AASX 모델 다시 불러오기',
                        '디스크의 AASX 파일을 다시 읽어 메모리 모델을 갱신합니다.\n\n경로: ' + this.s.aasxFilePath + '\n\n' +
                        '• AASX 재파싱 → 메모리 DsStore 갱신\n• DB / 통계 / 히스토리는 그대로 유지\n• 모델 정의가 바뀌었다면 이어서 "DB 재구축" 실행 필요',
                        '다시 불러오기', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/reload', true);
                },
                async rebuildAasx() {
                    const ok = await this.askConfirm('모델 정의 동기화',
                        'AASX 를 다시 읽어 모델 정의를 동기화(UPSERT)하고, 새 모델에 없는 Flow 의 dspFlow/dspCall/dspFlowHistory 를 정리합니다.\n\n' +
                        '• 살아남은 Flow 의 통계/히스토리는 보존\n• 레이아웃은 Flow 집합이 바뀐 경우 자동 재배치 (이전 layout 백업)',
                        '동기화', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/rebuild-aasx', true);
                },
                async invalidateCaches() {
                    const ok = await this.askConfirm('캐시 재계산',
                        'dspFlow / dspCall 의 평균과 누적 통계를 NULL 로 초기화합니다.\n\n' +
                        '• plcTagLog, dspFlowHistory, userTagAlertLog 등 raw 데이터는 그대로 보존\n' +
                        '• 엔진 in-memory Welford 누적기 reset\n' +
                        '• 다음 사이클 완료 시점부터 새 평균이 자연스럽게 누적\n' +
                        '• 서비스 재시작 불필요\n\n' +
                        'head/tail 이 바뀌었거나 모델이 크게 변경되어 평균을 새 baseline 으로 다시 측정하고 싶을 때 사용하세요.',
                        '재계산', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/invalidate-caches', false);
                },
                async clearFlowHistory() {
                    // 파괴적 — confirm 가드 필수.
                    const ok = await this.askConfirm('Flow 히스토리 삭제',
                        'dspFlowHistory 와 Call 통계(평균/표준편차/사이클 카운트) 를 모두 초기화합니다.\n\n' +
                        'Flow/Call 정의는 유지되며, 즉시 새 사이클부터 다시 측정됩니다. 서버 재시작 불필요.',
                        '초기화', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/clear-flow-history', false);
                },
                async rebuildDatabase() {
                    // 가장 파괴적 (plcTagLog 포함 raw 삭제) — confirm 가드 필수.
                    const ok = await this.askConfirm('⚠️ 전체 초기화 — raw 데이터 삭제',
                        'plc.db 파일을 완전히 삭제하고 스키마부터 재생성합니다.\n\n' +
                        '다음 데이터가 영구히 사라집니다:\n' +
                        '• plcTagLog (PLC 신호 시계열 — 수 GB 단위 가능)\n' +
                        '• dspFlowHistory (Flow 사이클 히스토리 전체)\n' +
                        '• userTagAlertLog / userTagAlertDaily (알림 이력)\n' +
                        '• aasxChangeLog / flowBoundaryChangeLog (변경 이력)\n' +
                        '• 모든 통계 / 평균\n\n' +
                        '대부분의 경우 "캐시 재계산" 으로 충분합니다.\n' +
                        '정말 raw 데이터까지 모두 삭제하시겠습니까?',
                        '전체 삭제', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/rebuild-database', true);
                },
                async restoreFlowDefaults() {
                    const ok = await this.askConfirm('Flow CT 기준 복원',
                        'Flow별 사용자 start/end Call override를 모두 제거하고 AASX 기준으로 다시 적용하시겠습니까?',
                        '복원', '취소');
                    if (!ok) return;
                    await this.runLifecycle('/api/settings/restore-flow-defaults', false);
                },

                // ── 확인 모달 (Promise 기반 — Blazor showConfirm 대체) ──
                askConfirm(title, message, okText, cancelText) {
                    return new Promise((resolve) => {
                        this.confirm = { show: true, title, message, okText: okText || '확인', cancelText: cancelText || '취소', _resolve: resolve };
                    });
                },
                confirmOk() { const r = this.confirm._resolve; this.confirm.show = false; this.confirm._resolve = null; if (r) r(true); },
                confirmCancel() { const r = this.confirm._resolve; this.confirm.show = false; this.confirm._resolve = null; if (r) r(false); },

                // ── SignalR — 외부에서 AASX 가 바뀌면 (Promaker agent 등) 상태 배지 자동 갱신 ──
                connectSignalR() {
                    if (!window.signalR) return;
                    const conn = new signalR.HubConnectionBuilder().withUrl('/hubs/monitoring').withAutomaticReconnect([0, 0, 1000, 3000, 5000, 10000]).build();
                    conn.on('DatabaseRebuilt', () => this.refreshAasxStatus());
                    conn.onreconnected(() => this.refreshAasxStatus());
                    conn.start().catch(() => {});
                    this._conn = conn;
                },

                showToast(msg, type) {
                    this.toast = { show: true, msg, type: type || 'success' };
                    clearTimeout(this._toastTimer);
                    this._toastTimer = setTimeout(() => { this.toast.show = false; }, 4000);
                }
            };
        }
    </script>
    <script defer src="/lib/alpine.min.js"></script>
</body>

</html>
