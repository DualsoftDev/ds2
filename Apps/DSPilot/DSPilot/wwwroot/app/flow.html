<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Workspace — DSPilot</title>

    <!--
      DSPilot 정적 호스팅 — Flow Workspace (FlowWorkspace.razor 이전).
      서버/모델 = C#(/api/flow/*, /api/dashboard/flows/*, /api/call-test/*, /api/cycle-analysis/export-excel),
      뷰 = 정적 HTML/CSS/JS(Alpine + Chart.js + vanilla SVG + SignalR). 디자인 시스템: /css/ds.css.
      진입: ?name=<flowName> (이 Flow 1개에 스코프됨 — Flow 선택 드롭다운 없음).
      구성: 헤더 카드 + KPI 6셀 + 기간별 추이(클라 집계)
            + 사이클 분석(구 cycle-time-analysis 전체 기능: 간트/Head·Tail 적용·저장/Excel/정렬/최대Gap/드래그 구간통계)
            + 최근 히스토리(구 대시보드 하단: 테이블↔차트 + 이상치 제외 범위 필터, 서버 공유).
      구 'Flow CT 기준' override 패널은 제거 — 사이클 분석의 'Head/Tail 적용(저장)' 이 동일 엔드포인트
      (/api/flow/{name}/cycle-override) 로 더 풍부하게 대체한다.
      실시간: /hubs/monitoring SignalR 이벤트 → /api/flow/{name} + 히스토리 디바운스 refetch.
              사이클 분석(간트)은 줌/선택 보존을 위해 수동 새로고침(프리셋/새로고침 버튼).
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/ds.css" rel="stylesheet" />

    <link href="/css/flow-workspace.css" rel="stylesheet" />
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="flowApp()" x-init="init()" x-cloak>

        <!-- fallback 슬림 헤더 (shell.js 가 제거) -->
        <header class="dsp-appbar">
            <span class="dsp-title">Flow Workspace</span>
            <span class="dsp-badge">정적</span>
            <div class="spacer"></div>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">

            <!-- 상단 툴바 -->
            <div class="ds-topbar">
                <div class="ds-topbar-titles">
                    <h2 x-text="flow ? flow.flowName : (flowName || 'Flow')"></h2>
                    <div class="ds-breadcrumb">
                        <span x-text="flow && flow.systemName ? flow.systemName : '-'"></span> · Flow Workspace
                    </div>
                </div>
            </div>

            <!-- 로딩/오류 -->
            <div x-show="loading && !flow" class="progress-bar progress-bar-indeterminate" style="margin-bottom:12px;"><div class="progress-bar-fill"></div></div>
            <div class="alert alert-error" x-show="error" style="margin-bottom:12px;"><span class="material-icons">error</span><span x-text="error"></span></div>

            <!-- Flow 없음 -->
            <template x-if="!loading && !error && !flow">
                <div class="card fw-section">
                    <div class="ds-empty">
                        <span class="material-icons">account_tree</span>
                        <div class="ds-empty-title">선택 가능한 Flow가 없습니다</div>
                        <div class="ds-empty-desc">URL 에 <span style="font-family:var(--font-mono);">?name=&lt;Flow이름&gt;</span> 으로 Flow 를 지정하세요. AASX 프로젝트가 로드되어 있어야 합니다.</div>
                    </div>
                </div>
            </template>

            <template x-if="flow">
                <div class="fw-grid">

                    <!-- ════ 탭 바 ════ -->
                    <div class="fw-tabs">
                        <button :class="tab === 'trend' ? 'is-active' : ''" @click="setTab('trend')">
                            <span class="material-icons">timeline</span> 기간별 추이
                        </button>
                        <button :class="tab === 'cycle' ? 'is-active' : ''" @click="setTab('cycle')">
                            <span class="material-icons">account_tree</span> 사이클 분석
                        </button>
                    </div>

                    <!-- ════ 공용 툴바: 이상치 제외 필터 (이 Flow · 서버 공유 · 사이클분석·히스토리 전 탭 적용) ════ -->
                    <div class="fw-toolbar" x-show="flow" x-cloak>
                        <button class="btn" :class="_exRange ? 'btn-filled' : 'btn-outlined color-default'"
                                @click="openRangeModal()"
                                title="최소·최대 가동시간을 지정해 그 범위를 벗어난 사이클(이상치)을 사이클 목록·차트·히스토리에서 제외합니다 — 이 Flow 에 적용·서버 공유">
                            <span class="material-icons" style="font-size:18px; vertical-align:middle;">tune</span>
                            <span x-text="_exRange ? ('이상치 범위 ' + rangeLabel) : '이상치 범위 설정'"></span>
                        </button>
                        <span class="hist-filter-chip" x-show="_exRange && (excludedCount > 0 || excludedCycleCount > 0)" x-cloak>
                            <span x-text="(tab === 'cycle' ? excludedCycleCount : excludedCount) + '개 제외됨 · 평균 재계산'"></span>
                            <button class="hfc-reset" @click="resetExclusions()" title="제외 해제 (전체 복원)">
                                <span class="material-icons">restart_alt</span> 초기화
                            </button>
                        </span>
                        <label class="fw-tb-check" :class="{ 'is-on': excludeIncomplete }"
                               title="완료신호(Tail InTag↑)가 없는 미완료 사이클을 사이클 목록·차트·히스토리·평균에서 제외합니다. 보통 로깅/서비스 중단으로 완료신호가 누락된 구간이라 가동시간이 부정확합니다. 해제하면 어두운 회색 막대로 표시하되 평균·가동률 집계에는 계속 포함하지 않습니다.">
                            <input type="checkbox" x-model="excludeIncomplete" @change="onExcludeIncompleteChanged()" />
                            미완료 제외
                            <span class="fw-tb-badge" x-show="incompleteCount > 0" x-text="incompleteCount"></span>
                        </label>
                    </div>

                    <!-- ════ 기간별 추이 ════ -->
                    <section class="card fw-section" x-show="tab === 'trend'">
                        <div class="ds-card-h">
                            <div>
                                <h4>기간별 추이</h4>
                                <span class="ds-card-h-sub" x-text="trendSubtitle"></span>
                            </div>
                            <div class="fw-period-controls">
                                <div class="segmented">
                                    <button :class="period === 'today' ? 'is-active' : ''" @click="setPeriod('today')">오늘</button>
                                    <button :class="period === '7d' ? 'is-active' : ''" @click="setPeriod('7d')">지난 7일</button>
                                    <button :class="period === '30d' ? 'is-active' : ''" @click="setPeriod('30d')">지난 30일</button>
                                    <button :class="period === '60d' ? 'is-active' : ''" @click="setPeriod('60d')">지난 60일</button>
                                </div>
                            </div>
                        </div>

                        <div x-show="trendLoading" class="ds-empty">
                            <span class="material-icons">hourglass_top</span>
                            <div class="ds-empty-title">히스토리 데이터를 불러오는 중...</div>
                        </div>

                        <template x-if="!trendLoading && trend.cycleCount === 0">
                            <div class="ds-empty">
                                <span class="material-icons">timeline</span>
                                <div class="ds-empty-title">선택 기간에 기록된 사이클이 없습니다</div>
                                <div class="ds-empty-desc">기간을 넓히거나, 사이클이 기록될 때까지 기다려 주세요.</div>
                            </div>
                        </template>

                        <template x-if="!trendLoading && trend.cycleCount > 0">
                            <div>
                                <div class="fw-chart-tall"><canvas x-ref="trendChart"></canvas></div>

                                <div class="fw-chart-row">
                                    <div>
                                        <div class="ds-card-h"><h4 style="font-size:0.78rem;">사이클 수</h4></div>
                                        <div class="fw-chart-md"><canvas x-ref="countChart"></canvas></div>
                                    </div>
                                    <div>
                                        <div class="ds-card-h"><h4 style="font-size:0.78rem;">시간 구성</h4></div>
                                        <div class="fw-chart-md"><canvas x-ref="distChart"></canvas></div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </section>

                    <!-- ════ 사이클 분석 (구 cycle-time-analysis 전체 기능, 이 Flow 스코프) ════ -->
                    <section class="card fw-section" x-show="tab === 'cycle'">
                        <div class="ds-card-h" style="margin-bottom:12px;">
                            <div>
                                <h4>사이클 분석</h4>
                                <span class="ds-card-h-sub">신호 간트 · Head/Tail 사이클 경계 적용(저장) · 드래그 구간통계 · Excel</span>
                            </div>
                            <span class="ct-live" x-show="isLoading || overlayBusy"
                                  title="데이터/오버레이 갱신 중"
                                  style="display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border:1px solid var(--color-lines-strong); border-radius:var(--radius-sm); font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--color-text-secondary);">
                                <span>SYNC · 갱신중</span>
                            </span>
                        </div>

                        <div class="call-test-page">
                            <!-- 컨트롤 (Flow 는 이 페이지로 고정 → 시간 범위만) -->
                            <div class="call-test-controls">
                                <!-- 시간 프리셋 + 직접 지정(기간) — 세그먼트 통일 (가동시간 페이지 스타일과 동일) -->
                                <div class="ct-range-field">
                                    <div class="segmented">
                                        <button :class="timePreset === 'm1' ? 'is-active' : ''" @click="setRecentMinutes(1)">1분</button>
                                        <button :class="timePreset === 'm5' ? 'is-active' : ''" @click="setRecentMinutes(5)">5분</button>
                                        <button :class="timePreset === 'm30' ? 'is-active' : ''" @click="setRecentMinutes(30)">30분</button>
                                        <button :class="timePreset === 'h1' ? 'is-active' : ''" @click="setRecentHours(1)">1시간</button>
                                        <button :class="timePreset === 'h24' ? 'is-active' : ''" @click="setRecentHours(24)">24시간</button>
                                        <button :class="rangePopupOpen ? 'is-active' : ''" @click="rangePopupOpen = !rangePopupOpen"
                                                title="분석할 시작·종료 시각을 직접 지정">
                                            <span class="material-icons">calendar_today</span>기간
                                        </button>
                                    </div>
                                    <div class="ct-range-popup" x-show="rangePopupOpen" x-transition
                                         @click.outside="rangePopupOpen = false">
                                        <div class="ct-field">
                                            <label>시작</label>
                                            <input type="datetime-local" step="1" class="form-field" x-model="startTime" @change="onTimeChanged()" />
                                        </div>
                                        <div class="ct-field">
                                            <label>종료</label>
                                            <input type="datetime-local" step="1" class="form-field" x-model="endTime" @change="onTimeChanged()" />
                                        </div>
                                    </div>
                                </div>
                                <!-- 사이클 개수 프리셋 -->
                                <div class="ct-cycle-presets">
                                    <span class="ct-preset-sep" title="사이클 개수 기준 — 최근 발생한 N개 사이클이 들어오도록 시간 범위를 자동 설정">사이클</span>
                                    <div class="segmented">
                                        <button :class="cyclePreset === 20 ? 'is-active' : ''" @click="setRecentCycles(20)" :disabled="isLoading || !selectedFlow">최근 20</button>
                                        <button :class="cyclePreset === 50 ? 'is-active' : ''" @click="setRecentCycles(50)" :disabled="isLoading || !selectedFlow">최근 50</button>
                                        <button :class="cyclePreset === 100 ? 'is-active' : ''" @click="setRecentCycles(100)" :disabled="isLoading || !selectedFlow">최근 100</button>
                                    </div>
                                </div>
                            </div>

                            <!-- 오류 -->
                            <div class="alert alert-error" x-show="errorMessage">
                                <span class="material-icons">error</span>
                                <span x-text="errorMessage"></span>
                            </div>

                            <!-- 로딩 (최초 로드만 큰 스피너 — 재로딩은 기존 간트를 유지해 스크롤 위치가 튀지 않게 한다. 진행표시는 헤더 SYNC 배지) -->
                            <template x-if="isLoading && callLanes.length === 0">
                                <div class="ct-loading">
                                    <div class="spinner"></div>
                                    <p>데이터 로딩 중…</p>
                                </div>
                            </template>

                            <!-- 데이터 없음 -->
                            <template x-if="!isLoading && callLanes.length === 0">
                                <div class="ct-empty">
                                    <span class="material-icons">hourglass_disabled</span>
                                    <p>선택한 시간 범위에 신호 이벤트가 없습니다.</p>
                                    <p class="ct-empty-hint">시간 범위를 늘리거나 프리셋 버튼을 사용해 보세요.</p>
                                </div>
                            </template>

                            <!-- 본문 (재로딩 중에도 마운트 유지 → 페이지가 접혀 상단으로 튀지 않음) -->
                            <template x-if="callLanes.length > 0">
                                <div style="display:flex; flex-direction:column; gap:12px;">
                                    <!-- 사이클 요약: 액션 바 (KPI 카드는 CALL 간트 헤더로 이동) -->
                                    <div class="ct-summary">
                                        <!-- 상태 + 액션 -->
                                        <div class="ct-action-bar">
                                            <div class="ct-ctbasis">
                                                <span class="ct-ctbasis-k">가동시간 기준</span>
                                                <span class="ct-chip" :class="isOverride ? 'is-custom' : ''"
                                                      x-text="isOverride ? '사용자 지정' : 'AASX 기본'"
                                                      :title="isOverride ? '이 Flow 의 사이클 경계가 사용자 지정(저장됨)으로 적용 중' : 'AASX 프로젝트 정의 Head/Tail 적용 중'"></span>
                                            </div>
                                            <span class="ct-action-spacer"></span>
                                            <span x-show="recomputeBusy || recomputeMsg" class="ct-recompute"
                                                  :class="recomputeError ? 'is-err' : ''" x-text="recomputeMsg"></span>
                                            <span x-show="applyDurMsg" class="ct-recompute" x-text="applyDurMsg"></span>
                                            <button class="btn btn-sm btn-outlined" @click="applyAllDurations()"
                                                    :disabled="applyDurBusy || !hasApplicableDurations"
                                                    title="이 구간에서 실측된 모든 ApiCall 의 평균/min/max 를 각 Device Work 에 일괄 기록 (평균→Duration, min→MinDuration, max→MaxDuration)">
                                                <span class="material-icons" style="font-size:15px; vertical-align:middle;">timer</span>
                                                실측 적용
                                            </button>
                                            <button class="btn" :class="userOverrodeHeadTail ? 'btn-primary' : 'btn-outlined color-default'" @click="applyHeadTail()"
                                                    :disabled="overlayBusy || recomputeBusy || !headCallId || !tailCallId"
                                                    title="현재 Head/Tail 을 이 Flow 의 사이클 경계로 저장하고, 이 Flow 의 과거 이력 전체를 새 경계로 재계산합니다(백그라운드, 진행률 표시) — 라이브 가동시간·대시보드에 과거 포함 반영">
                                                <span class="material-icons" style="font-size:18px; vertical-align:middle;">save</span>
                                                <span x-text="userOverrodeHeadTail ? '적용(저장)*' : '적용(저장)'"></span>
                                            </button>
                                            <button class="btn btn-outlined" @click="restoreAasxDefault()"
                                                    :disabled="overlayBusy || recomputeBusy || !projectHeadId || !projectTailId"
                                                    title="AASX 프로젝트 기본 Head/Tail 로 되돌리고 저장된 사용자 지정을 제거합니다">
                                                AASX 기본값 복원
                                            </button>
                                            <button class="btn btn-outlined color-default" @click="exportExcel()"
                                                    :disabled="exporting || !selectedFlow"
                                                    title="현재 Flow·시간범위의 IO 세그먼트를 Excel(.xlsx) 로 내보냅니다">
                                                <span class="material-icons" style="font-size:18px; vertical-align:middle;">download</span>
                                                <span x-text="exporting ? 'Excel 생성 중…' : 'Excel 다운로드'"></span>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- 간트 툴바: 보기 전환 + 휠 확대/축소 (순서는 Head↑/Tail↓ 고정) -->
                                    <div class="ct-gantt-toolbar">
                                        <div class="ct-seg">
                                            <button :class="viewMode === 'bar' ? 'active' : ''" @click="setView('bar')"
                                                    title="실행(InTag ∪ OutTag 합집합) 막대그래프">막대</button>
                                            <button :class="viewMode === 'line' ? 'active' : ''" @click="setView('line')"
                                                    title="OutTag(명령=시작)·InTag(응답=완료) 신호 라인 그래프">InOut 라인</button>
                                        </div>
                                        <span class="ct-tb-hint">휠 = 확대/축소 · 간트 가로 드래그 = 구간 선택</span>
                                        <div class="spacer"></div>
                                        <div class="ct-zoom">
                                            <button @click="zoomBy(1/1.3)" :disabled="zoom <= 1" title="축소">−</button>
                                            <span class="ct-zoom-val" x-text="Math.round(zoom * 100) + '%'"></span>
                                            <button @click="zoomBy(1.3)" :disabled="zoom >= 24" title="확대">＋</button>
                                            <button class="ct-zoom-reset" @click="resetZoom()" :disabled="zoom <= 1" title="전체 보기로 리셋">전체</button>
                                        </div>
                                    </div>

                                    <!-- 간트 layout -->
                                    <div class="ct-gantt-layout">
                                        <div class="ct-lane-sidebar">
                                            <div class="ct-sidebar-header" :style="`height:${TOP_MARGIN}px;`">
                                                <span class="ct-sh-title">CALL</span>
                                                <span class="ct-sh-stats">
                                                    <span class="ct-sh-stat is-primary" x-show="avgCycleMs !== null" title="가동시간 평균 (시작 → 다음 시작)">
                                                        <i>가동 평균</i><b x-text="formatMs(avgCycleMs)"></b>
                                                    </span>
                                                    <span class="ct-sh-stat" x-show="avgActiveMs !== null" title="동작시간 평균 (시작 → 완료)">
                                                        <i>동작 평균</i><b x-text="formatMs(avgActiveMs)"></b>
                                                    </span>
                                                </span>
                                            </div>
                                            <div class="ct-ribbon-side" x-show="cycleBoundaries.length" :style="`height:${RIBBON_H}px;`">
                                                <span class="rs-t">사이클</span>
                                                <span class="rs-sub">동작시간 · 대기시간 · 가동률</span>
                                                <span x-show="tailCompletionSource === 'OutTag'" class="rs-sub" style="margin-top:2px;color:#b26a00;background:#fff3e0;border:1px solid #ffcc80;border-radius:3px;padding:0 4px;font-size:9px;" title="이 Flow 의 Tail Call 에 응답(InTag)이 없어 명령 종료(OutTag↓)로 동작시간을 추정합니다. 검증된 완료가 아니라 명령 ON 시간입니다.">명령 ON 추정</span>
                                            </div>
                                            <template x-for="row in laneRows" :key="row.key">
                                                <div :class="rowClass(row)" :style="`height:${row.h}px;`">
                                                    <!-- ── CALL 행 ── -->
                                                    <button x-show="row.kind === 'call'" class="ct-expand-btn"
                                                            :disabled="!hasApiCalls(row.lane)"
                                                            @click="toggleExpand(row.lane.callId)"
                                                            :title="hasApiCalls(row.lane) ? 'ApiCall 펼치기/접기 (실측 duration)' : 'ApiCall 없음'"
                                                            x-text="!hasApiCalls(row.lane) ? '·' : (expandedCalls[row.lane.callId] ? '▾' : '▸')"></button>
                                                    <template x-if="row.kind === 'call'">
                                                        <div class="ct-lane-name-block">
                                                            <div class="ct-lane-name">
                                                                <span x-text="row.lane.callName"></span>
                                                                <template x-if="headCallId === row.lane.callId"><span class="ct-badge head">시작</span></template>
                                                                <template x-if="tailCallId === row.lane.callId"><span class="ct-badge tail">끝</span></template>
                                                            </div>
                                                            <div class="ct-lane-work" x-text="row.lane.workName"></div>
                                                            <div class="ct-lane-row-leg" x-show="row.lane.outTag || row.lane.inTag">
                                                                <span class="leg-out" x-show="row.lane.outTag"><i></i><span x-text="row.lane.outTag"></span></span>
                                                                <span class="leg-in"  x-show="row.lane.inTag"><i></i><span x-text="row.lane.inTag"></span></span>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <template x-if="row.kind === 'call'">
                                                        <div class="ct-lane-tags">
                                                            <button :class="'ct-tag-btn head ' + (headCallId === row.lane.callId ? 'active' : '')"
                                                                    @click="toggleHead(row.lane.callId)"
                                                                    :disabled="overlayBusy"
                                                                    title="시작으로 지정: 이 Call 의 OutTag↑(PLC 명령) 가 사이클 시작 경계가 됩니다">시작</button>
                                                            <button :class="'ct-tag-btn tail ' + (tailCallId === row.lane.callId ? 'active' : '')"
                                                                    @click="toggleTail(row.lane.callId)"
                                                                    :disabled="overlayBusy"
                                                                    title="끝으로 지정: 이 Call 의 InTag↑(PLC 응답) 가 사이클 완료 마커가 됩니다">끝</button>
                                                        </div>
                                                    </template>
                                                    <!-- ── ApiCall 서브행 (실측 vs 현재 AASX) ── -->
                                                    <template x-if="row.kind === 'api'">
                                                        <div class="ct-api-block">
                                                            <div class="ct-api-info">
                                                                <div class="ct-api-name">
                                                                    <span class="ct-api-dot"></span>
                                                                    <span x-text="row.ac.name"></span>
                                                                    <span class="ct-api-tags" x-text="(row.ac.outTag ? ('OUT ' + row.ac.outTag) : '') + (row.ac.inTag ? ('  IN ' + row.ac.inTag) : '')"></span>
                                                                </div>
                                                                <div class="ct-api-stats">
                                                                    <span class="ct-api-meas" x-show="row.m.count > 0">
                                                                        <span class="m"><i>실측</i><b x-text="row.m.count + '회'"></b></span>
                                                                        <span class="m"><i>min</i><b x-text="formatMs(row.m.min)"></b></span>
                                                                        <span class="m"><i>평균</i><b x-text="formatMs(row.m.mean)"></b></span>
                                                                        <span class="m"><i>max</i><b x-text="formatMs(row.m.max)"></b></span>
                                                                    </span>
                                                                    <span class="ct-api-meas ct-api-nodata" x-show="row.m.count === 0">이 구간 실측 없음(명령~응답 쌍 0)</span>
                                                                    <span class="ct-api-cur">
                                                                        <span class="m"><i>현재 AASX</i></span>
                                                                        <span class="m"><i>D</i><b x-text="fmtAasx(row.ac.currentDurationMs)"></b></span>
                                                                        <span class="m"><i>min</i><b x-text="fmtAasx(row.ac.currentMinMs)"></b></span>
                                                                        <span class="m"><i>max</i><b x-text="fmtAasx(row.ac.currentMaxMs)"></b></span>
                                                                    </span>
                                                                </div>
                                                            </div>
                                                            <button class="ct-api-apply" x-show="canApplyApi(row.lane, row.ac)"
                                                                    :disabled="applyDurBusy"
                                                                    @click="applyApiCallDuration(row)"
                                                                    title="이 ApiCall 의 실측 평균/min/max 를 대상 Work 의 Duration/Min/Max 로 AASX 에 기록">적용</button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="ct-gantt-chart-area" x-ref="chartArea"
                                             x-init="$el.addEventListener('wheel', (e) => onWheel(e), { passive: false }); $el.addEventListener('touchstart', (e) => onDragStartTouch(e), { passive: false })"
                                             @mousedown="onDragStart($event)">
                                            <div class="ct-gantt-wrapper" x-html="svgMarkup"></div>
                                            <!-- 드래그 선택 구간 플로팅 툴팁 (간트 위 겹침) — 통계 + 해당 영역 보기 -->
                                            <template x-if="selectedRange">
                                                <div class="ct-sel-tip" @mousedown.stop @touchstart.stop
                                                     :style="`left:${selTipCenterPx}px; top:${selTipTopPx}px;`">
                                                    <div class="ct-sel-tip-head">
                                                        <span class="ct-sel-tip-title">선택 구간</span>
                                                        <span class="ct-sel-tip-time"
                                                              x-text="hms2k(new Date(selectedRange.startMs)) + ' ~ ' + hms2k(new Date(selectedRange.endMs))"></span>
                                                        <button class="ct-sel-tip-x" @click="clearRangeSelection()" title="선택 구간 해제">✕</button>
                                                    </div>
                                                    <div class="ct-sel-tip-stats">
                                                        <div><i>구간 길이</i><b x-text="formatMs(selRangeLenMs)"></b></div>
                                                        <div><i>사이클 수</i><b x-text="selHasCycles ? (selCycleCount + '개') : '–'"></b></div>
                                                        <div class="run"><i>동작</i><b x-text="selHasCycles ? formatMs(selActiveMs) : '–'"></b></div>
                                                        <div class="idle"><i>대기</i><b x-text="selHasCycles ? formatMs(selWaitMs) : '–'"></b></div>
                                                    </div>
                                                    <button class="btn btn-sm btn-filled ct-sel-tip-apply" @click="applyRangeAsPeriod()" :disabled="isLoading"
                                                            title="선택 구간을 분석 시작·종료 시간으로 설정하고 다시 로드">
                                                        <span class="material-icons" style="font-size:15px; vertical-align:middle;">search</span>
                                                        해당 영역 보기
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- 간트 신호 범례 -->
                                    <div class="ct-legend">
                                        <span><i class="ct-sw ct-sw-out"></i> OutTag (명령 = 시작)</span>
                                        <span><i class="ct-sw ct-sw-in"></i> InTag (응답 = 완료)</span>
                                        <span><i class="ct-sw ct-sw-going"></i> 실행 배경</span>
                                        <span><i class="ct-sw ct-sw-head"></i> 시작</span>
                                        <span><i class="ct-sw ct-sw-tail"></i> 끝</span>
                                        <span><i class="ct-sw ct-sw-cycle-edge"></i> 사이클 경계</span>
                                        <template x-if="selectedRange">
                                            <span><i class="ct-sw ct-sw-range"></i> 드래그 선택 구간</span>
                                        </template>
                                    </div>
                                    <!-- 리본(MT·WT) 범례 — Tail 지정 시에만 표시 -->
                                    <template x-if="tailCallId !== null">
                                        <div class="ct-legend" style="margin-top:4px;">
                                            <span style="color:var(--color-text-primary);font-weight:700;">상단 리본 = 사이클별 동작시간·대기시간 비율 + 가동률</span>
                                            <span><i class="ct-sw ct-sw-active-band"></i> 동작시간</span>
                                            <span><i class="ct-sw ct-sw-idle-band"></i> 대기시간</span>
                                        </div>
                                    </template>

                                </div>
                            </template>
                        </div>
                    </section>

                </div>
            </template>

            <!-- ── 이상치 제외 범위 팝업 (이 Flow 의 최소·최대 CT) ── -->
            <div class="modal-overlay" x-show="rangeModalOpen" x-cloak style="z-index:2000;" @click="closeRangeModal()">
                <div class="modal-content shift-modal" @click.stop>
                    <div class="sm-head">
                        <span class="sm-title">🔎 이상치 제외 · <span x-text="histFlowName"></span></span>
                        <button class="btn-icon" @click="closeRangeModal()" title="닫기">
                            <span class="material-icons">close</span>
                        </button>
                    </div>
                    <div class="sm-body">
                        <div class="sm-hint" style="margin-bottom:14px;">
                            <span class="material-icons">info</span>
                            <span>
                                설정한 <b>최소 ~ 최대</b> 가동시간 범위를 벗어난 사이클을 차트·테이블·평균에서 제외합니다.
                                한쪽만 입력해도 됩니다 (예: <b>최대</b>만 입력 = 그보다 긴 사이클만 제외). 새 사이클이 들어와도 범위가 유지됩니다.
                            </span>
                        </div>

                        <!-- 현재 데이터 범위 안내 -->
                        <div class="form-group" x-show="flowHistory.length > 0">
                            <label class="form-label">현재 가동시간 범위 (참고)</label>
                            <div class="form-helper" style="margin:0;">
                                최소 <b x-text="fmt(histCtMinMs)"></b> · 최대 <b x-text="fmt(histCtMaxMs)"></b> · 평균 <b x-text="histAvgCt > 0 ? fmt(histAvgCt) : '--'"></b>
                            </div>
                        </div>

                        <!-- 제외 범위 입력 — 최소/최대 각각 단위(초/분/시간) 드롭다운 선택. 내부 관리값은 초. -->
                        <div class="form-group">
                            <label class="form-label">제외 기준 범위</label>
                            <div class="sm-times">
                                <div>
                                    <div class="form-helper" style="margin:0 0 5px;">최소 시간</div>
                                    <div class="range-row">
                                        <input type="number" class="form-field" min="0" step="any" placeholder="제한 없음" x-model="rangeForm.min" />
                                        <select class="form-select range-unit" :value="rangeForm.minUnit" @change="changeUnit('min', $event.target.value)" title="최소 시간 단위">
                                            <option value="s">초</option>
                                            <option value="m">분</option>
                                            <option value="h">시간</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <div class="form-helper" style="margin:0 0 5px;">최대 시간</div>
                                    <div class="range-row">
                                        <input type="number" class="form-field" min="0" step="any" placeholder="제한 없음" x-model="rangeForm.max" />
                                        <select class="form-select range-unit" :value="rangeForm.maxUnit" @change="changeUnit('max', $event.target.value)" title="최대 시간 단위">
                                            <option value="s">초</option>
                                            <option value="m">분</option>
                                            <option value="h">시간</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <!-- 입력값 → 실제 적용 범위 미리보기 (단위 환산 확인용) -->
                            <div class="form-helper" style="margin:7px 0 0;" x-show="rangePreviewLabel" x-text="rangePreviewLabel"></div>
                        </div>
                    </div>
                    <div class="sm-foot">
                        <button class="btn btn-outlined" @click="resetExclusions(); closeRangeModal()" :disabled="!_exRange" title="이 Flow 의 제외 범위 해제 (전체 복원)">제외 해제</button>
                        <button class="btn btn-filled" @click="applyRange()">
                            <span class="material-icons" style="font-size:17px;">check</span> 적용
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/lib/signalr.min.js"></script>
    <script src="/lib/chart.umd.min.js"></script>
    <script src="/app/flow-workspace.js"></script>
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
</body>

</html>
