<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Workspace — DSPilot</title>

    <!--
      DSPilot 정적 호스팅 — Flow Workspace (FlowWorkspace.razor 이전).
      서버/모델 = C#(/api/flow/*, /api/dashboard/flows/*), 뷰 = 정적 HTML/CSS/JS(Alpine + Chart.js + SignalR).
      디자인 시스템: /css/ds.css.
      진입: ?name=<flowName>. 헤더 카드 + Flow CT 기준(override 저장) + KPI 6셀 + 기간별 추이(클라 집계).
      실시간: /hubs/monitoring SignalR 이벤트 → /api/flow/{name} 디바운스 refetch (대시보드와 동일).
      정직성: Call Inventory(In/Out Tag, per-call 상태표) 는 API 노출이 없어 재현하지 않고 .ds-empty 로 명시.
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/ds.css" rel="stylesheet" />

    <style>
        [x-cloak] { display: none !important; }

        .dsp-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); color: var(--color-text-primary); font-family: var(--font-family); }
        .dsp-appbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; background: var(--color-appbar-bg); color: var(--color-appbar-text); border-bottom: 1px solid var(--color-lines-strong); position: sticky; top: 0; z-index: 50; flex-shrink: 0; }
        .dsp-appbar .dsp-title { font-size: 18px; font-weight: 700; }
        .dsp-appbar .spacer { flex: 1; }
        .dsp-main { flex: 1; min-height: 0; padding: 16px 20px 24px; max-width: 1400px; margin: 0 auto; width: 100%; }

        .fw-grid { display: flex; flex-direction: column; gap: 16px; }
        .fw-section { padding: 18px 20px; }

        /* 헤더 카드 */
        .fw-hero { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
        .fw-hero-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--color-text-secondary); font-size: 0.86rem; }
        .fw-hero-meta b { color: var(--color-text-primary); font-weight: 700; }
        .fw-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .fw-info-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: color-mix(in srgb, var(--color-primary) 8%, transparent); color: var(--color-primary); }

        /* Cycle 기준 그리드 */
        .fw-cycle-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 4px; }
        @media (max-width: 900px) { .fw-cycle-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .fw-field { display: flex; flex-direction: column; gap: 6px; }
        .fw-field label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-secondary); }
        .fw-input, .fw-select { width: 100%; padding: 8px 10px; border: 1px solid var(--color-lines-strong); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text-primary); font-size: 0.86rem; font-family: var(--font-family); }
        .fw-input:disabled { background: var(--color-surface-variant); color: var(--color-text-secondary); }
        .fw-cycle-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
        .fw-cycle-note { font-size: 0.78rem; color: var(--color-text-secondary); }
        .fw-badge { padding: 4px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
        .fw-badge.is-default { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
        .fw-badge.is-override { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--color-warning); }

        /* KPI 6셀 */
        .fw-kpi-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
        @media (max-width: 1200px) { .fw-kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 720px) { .fw-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .fw-kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
        .fw-kpi-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-secondary); }
        .fw-kpi-value { font-size: 1.5rem; font-weight: 800; color: var(--color-text-primary); line-height: 1.1; font-variant-numeric: tabular-nums; }
        .fw-kpi-sub { font-size: 0.74rem; color: var(--color-text-secondary); }

        /* 추이 KPI 행 */
        .fw-trend-kpi-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
        @media (max-width: 900px) { .fw-trend-kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .fw-trend-kpi { background: color-mix(in srgb, var(--color-primary) 4%, var(--color-surface)); border: 1px solid var(--color-lines); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
        .fw-trend-kpi-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-secondary); }
        .fw-trend-kpi-value { font-size: 1.35rem; font-weight: 800; color: var(--color-text-primary); line-height: 1.1; font-variant-numeric: tabular-nums; }
        .fw-trend-kpi-sub { font-size: 0.74rem; color: var(--color-text-secondary); }

        .fw-chart-tall { position: relative; height: 320px; margin-bottom: 16px; }
        .fw-chart-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        @media (max-width: 900px) { .fw-chart-row { grid-template-columns: 1fr; } }
        .fw-chart-md { position: relative; height: 260px; }

        .fw-period-controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    </style>
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="flowApp()" x-init="init()" x-cloak>

        <!-- 데모 만료 -->
        <div class="modal-overlay" x-show="demoBlocked" style="z-index:3000;">
            <div class="modal-content demo-blocked-card" style="max-width:480px; text-align:center;">
                <span class="material-icons demo-blocked-icon">hourglass_disabled</span>
                <h3>DEMO 만료</h3>
                <p>데모 사용 시간(3시간)이 종료되었습니다.</p>
                <p>서비스 관리자에게 문의해 주세요.</p>
            </div>
        </div>

        <!-- fallback 슬림 헤더 (shell.js 가 제거) -->
        <header class="dsp-appbar">
            <span class="dsp-title">Flow Workspace</span>
            <span class="dsp-badge">정적</span>
            <div class="spacer"></div>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">

            <!-- 상단 툴바 -->
            <div class="ds-topbar">
                <div class="ds-topbar-titles">
                    <h2 x-text="flow ? flow.flowName : (flowName || 'Flow')"></h2>
                    <div class="ds-breadcrumb">
                        <span x-text="flow && flow.systemName ? flow.systemName : '-'"></span> · Flow Workspace
                    </div>
                </div>
                <div class="ds-topbar-actions">
                    <span class="ds-live" :class="rt.connected ? 'is-live' : 'is-poll'"
                          :title="rt.connected ? 'SignalR 실시간 연결됨' : '폴링(10초) 모드'">
                        <span class="ds-live-dot"></span>
                        <span x-text="rt.connected ? 'LIVE' : 'POLL'"></span>
                    </span>
                    <button class="btn btn-sm btn-outlined" @click="refreshAll()">
                        <span class="material-icons" style="font-size:16px;">refresh</span> 새로고침
                    </button>
                </div>
            </div>

            <!-- 로딩/오류 -->
            <div x-show="loading && !flow" class="progress-bar progress-bar-indeterminate" style="margin-bottom:12px;"><div class="progress-bar-fill"></div></div>
            <div class="alert alert-error" x-show="error" style="margin-bottom:12px;"><span class="material-icons">error_outline</span><span x-text="error"></span></div>

            <!-- Flow 없음 -->
            <template x-if="!loading && !error && !flow">
                <div class="card fw-section">
                    <div class="ds-empty">
                        <span class="material-icons">account_tree</span>
                        <div class="ds-empty-title">선택 가능한 Flow가 없습니다</div>
                        <div class="ds-empty-desc">URL 에 <span style="font-family:var(--font-mono);">?name=&lt;Flow이름&gt;</span> 으로 Flow 를 지정하세요. AASX 프로젝트가 로드되어 있어야 합니다.</div>
                    </div>
                </div>
            </template>

            <template x-if="flow">
                <div class="fw-grid">

                    <!-- ════ 헤더 카드 ════ -->
                    <section class="card fw-section">
                        <div class="fw-hero">
                            <div style="flex:1; min-width:0;">
                                <div class="fw-hero-meta">
                                    <span>System <b x-text="flow.systemName || '-'"></b></span>
                                    <span>Works <b x-text="flow.worksCount"></b></span>
                                    <span>Calls <b x-text="flow.callsCount"></b></span>
                                    <span>업데이트 <b x-text="updateTime"></b></span>
                                </div>
                                <div class="fw-chips">
                                    <span class="ds-status" :class="stateClass(flow.state)" x-text="flow.state || 'No Data'"></span>
                                    <template x-if="flow.currentStartCall">
                                        <span class="fw-info-chip">Start: <span x-text="flow.currentStartCall"></span></span>
                                    </template>
                                    <template x-if="flow.currentEndCall">
                                        <span class="fw-info-chip">End: <span x-text="flow.currentEndCall"></span></span>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- ════ Flow CT 기준 ════ -->
                    <section class="card fw-section">
                        <div class="ds-card-h">
                            <h4>Flow CT 기준</h4>
                            <span class="fw-badge" :class="flow.isOverride ? 'is-override' : 'is-default'"
                                  x-text="flow.isOverride ? '사용자 override 사용 중' : '현재 AASX 기본값 사용 중'"></span>
                        </div>
                        <div class="ds-card-h-sub" style="margin:-8px 0 12px;">AASX 기본 start/end Call을 기준으로 사용자 override를 저장합니다.</div>

                        <div class="fw-cycle-grid">
                            <div class="fw-field">
                                <label>AASX 기본 시작 Call</label>
                                <input class="fw-input" :value="flow.aasxDefaultStartCall || '-'" disabled />
                            </div>
                            <div class="fw-field">
                                <label>AASX 기본 종료 Call</label>
                                <input class="fw-input" :value="flow.aasxDefaultEndCall || '-'" disabled />
                            </div>
                            <div class="fw-field">
                                <label>Cycle 시작 Call</label>
                                <select class="fw-select" x-model="selStart" :disabled="flow.callOptions.length === 0">
                                    <!-- callOptions 는 work 간 동일 Call 명이 중복될 수 있어(BuildCallOptions 미dedup) :key 에 index 합성 → 중복키로 인한 x-for 재배치 크래시 방지 -->
                                    <template x-for="(o, i) in flow.callOptions" :key="o + '|' + i"><option :value="o" x-text="o"></option></template>
                                </select>
                            </div>
                            <div class="fw-field">
                                <label>Cycle 종료 Call</label>
                                <select class="fw-select" x-model="selEnd" :disabled="flow.callOptions.length === 0">
                                    <!-- callOptions 는 work 간 동일 Call 명이 중복될 수 있어(BuildCallOptions 미dedup) :key 에 index 합성 → 중복키로 인한 x-for 재배치 크래시 방지 -->
                                    <template x-for="(o, i) in flow.callOptions" :key="o + '|' + i"><option :value="o" x-text="o"></option></template>
                                </select>
                            </div>
                        </div>

                        <div class="fw-cycle-actions">
                            <button class="btn btn-sm btn-filled" @click="saveCycleOverride()" :disabled="flow.callOptions.length === 0 || saving">
                                <span class="material-icons" style="font-size:16px;">save</span>
                                <span x-text="saving ? '저장 중...' : 'CT 기준 저장'"></span>
                            </button>
                            <span class="fw-cycle-note">AASX 기본값과 동일하게 저장하면 override는 제거됩니다.</span>
                            <span class="fw-cycle-note" x-show="cycleMsg" x-text="cycleMsg" style="color:var(--color-primary); font-weight:600;"></span>
                        </div>
                    </section>

                    <!-- ════ KPI 6셀 ════ -->
                    <div class="fw-kpi-grid">
                        <article class="card fw-kpi">
                            <span class="fw-kpi-label">Current CT</span>
                            <strong class="fw-kpi-value" x-text="fmtDur(kpi('currentCt'))"></strong>
                            <span class="fw-kpi-sub">Flow 총 시간</span>
                        </article>
                        <article class="card fw-kpi">
                            <span class="fw-kpi-label">MT</span>
                            <strong class="fw-kpi-value" x-text="fmtDur(kpi('currentMt'))"></strong>
                            <span class="fw-kpi-sub">가동 시간</span>
                        </article>
                        <article class="card fw-kpi">
                            <span class="fw-kpi-label">WT</span>
                            <strong class="fw-kpi-value" x-text="fmtDur(kpi('currentWt'))"></strong>
                            <span class="fw-kpi-sub">대기 시간</span>
                        </article>
                        <article class="card fw-kpi">
                            <span class="fw-kpi-label">Active Calls</span>
                            <strong class="fw-kpi-value" x-text="kpi('activeCalls') ?? '—'"></strong>
                            <span class="fw-kpi-sub">현재 Going 상태</span>
                        </article>
                        <article class="card fw-kpi">
                            <span class="fw-kpi-label">Error Calls</span>
                            <strong class="fw-kpi-value" x-text="kpi('errorCalls') ?? '—'"></strong>
                            <span class="fw-kpi-sub">오류 상태 Call</span>
                        </article>
                        <article class="card fw-kpi">
                            <span class="fw-kpi-label">Avg Call Time</span>
                            <strong class="fw-kpi-value" x-text="fmtDur(kpi('avgCallTimeMs'))"></strong>
                            <span class="fw-kpi-sub">평균 Going 시간</span>
                        </article>
                    </div>

                    <!-- ════ 기간별 추이 ════ -->
                    <section class="card fw-section">
                        <div class="ds-card-h">
                            <div>
                                <h4>기간별 추이</h4>
                                <span class="ds-card-h-sub" x-text="trendSubtitle"></span>
                            </div>
                            <div class="fw-period-controls">
                                <button class="btn btn-sm" :class="period === 'today' ? 'btn-filled' : 'btn-outlined'" @click="setPeriod('today')">오늘</button>
                                <button class="btn btn-sm" :class="period === '7d' ? 'btn-filled' : 'btn-outlined'" @click="setPeriod('7d')">지난 7일</button>
                                <button class="btn btn-sm" :class="period === '30d' ? 'btn-filled' : 'btn-outlined'" @click="setPeriod('30d')">지난 30일</button>
                                <button class="btn btn-sm" :class="period === '60d' ? 'btn-filled' : 'btn-outlined'" @click="setPeriod('60d')">지난 60일</button>
                            </div>
                        </div>

                        <div x-show="trendLoading" class="ds-empty">
                            <span class="material-icons">hourglass_top</span>
                            <div class="ds-empty-title">히스토리 데이터를 불러오는 중...</div>
                        </div>

                        <template x-if="!trendLoading && trend.cycleCount === 0">
                            <div class="ds-empty">
                                <span class="material-icons">timeline</span>
                                <div class="ds-empty-title">선택 기간에 기록된 사이클이 없습니다</div>
                                <div class="ds-empty-desc">기간을 넓히거나, 사이클이 기록될 때까지 기다려 주세요.</div>
                            </div>
                        </template>

                        <template x-if="!trendLoading && trend.cycleCount > 0">
                            <div>
                                <div class="fw-trend-kpi-row">
                                    <article class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">사이클 수</span>
                                        <strong class="fw-trend-kpi-value" x-text="trend.cycleCount.toLocaleString()"></strong>
                                        <span class="fw-trend-kpi-sub">비가동 <span x-text="trend.idleCount.toLocaleString()"></span> 건</span>
                                    </article>
                                    <article class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">평균 CT</span>
                                        <strong class="fw-trend-kpi-value" x-text="fmtDur(trend.avgCT)"></strong>
                                        <span class="fw-trend-kpi-sub">최소 <span x-text="fmtDur(trend.minCT)"></span> · 최대 <span x-text="fmtDur(trend.maxCT)"></span></span>
                                    </article>
                                    <article class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">평균 MT</span>
                                        <strong class="fw-trend-kpi-value" x-text="fmtDur(trend.avgMT)"></strong>
                                        <span class="fw-trend-kpi-sub">가동 시간</span>
                                    </article>
                                    <article class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">평균 WT</span>
                                        <strong class="fw-trend-kpi-value" x-text="fmtDur(trend.avgWT)"></strong>
                                        <span class="fw-trend-kpi-sub">대기 시간</span>
                                    </article>
                                    <article class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">가동률</span>
                                        <strong class="fw-trend-kpi-value" x-text="(trend.utilization * 100).toFixed(1) + '%'"></strong>
                                        <span class="fw-trend-kpi-sub">MT / (MT + WT)</span>
                                    </article>
                                </div>

                                <div class="fw-chart-tall"><canvas x-ref="trendChart"></canvas></div>

                                <div class="fw-chart-row">
                                    <div>
                                        <div class="ds-card-h"><h4 style="font-size:0.78rem;">사이클 수</h4></div>
                                        <div class="fw-chart-md"><canvas x-ref="countChart"></canvas></div>
                                    </div>
                                    <div>
                                        <div class="ds-card-h"><h4 style="font-size:0.78rem;">시간 구성</h4></div>
                                        <div class="fw-chart-md"><canvas x-ref="distChart"></canvas></div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </section>

                    <!-- ════ Call Inventory (미재현 — 정직성 표기) ════ -->
                    <section class="card fw-section">
                        <div class="ds-card-h">
                            <h4>Call Inventory</h4>
                            <span class="ds-card-h-sub">Work / Call / InTag / OutTag / 상태</span>
                        </div>
                        <div class="ds-empty">
                            <span class="material-icons">table_rows</span>
                            <div class="ds-empty-title">per-Call 인벤토리는 정적 미러에서 아직 제공되지 않습니다</div>
                            <div class="ds-empty-desc">
                                Call 별 In/Out Tag · 상태 · Going 횟수 · 평균 시간 표는 전용 직렬화 엔드포인트가 없어 재현하지 않았습니다(가짜 데이터 금지).
                                Flow 단위 상태/MT/WT/CT 와 사이클 추이는 위에서 실데이터로 표시됩니다.
                            </div>
                            <span class="ds-empty-tag">준비중</span>
                        </div>
                    </section>

                </div>
            </template>
        </main>
    </div>

    <script src="/lib/signalr.min.js"></script>
    <script src="/lib/chart.umd.min.js"></script>
    <script>
        function flowApp() {
            return {
                flowName: null,
                flow: null,
                loading: true, error: null, demoBlocked: false, dark: false,
                saving: false, cycleMsg: '',
                selStart: '', selEnd: '',
                rt: { connected: false },

                // 기간별 추이
                period: 'today',
                trendLoading: false,
                trend: { cycleCount: 0, idleCount: 0, avgCT: null, avgMT: null, avgWT: null, minCT: null, maxCT: null, utilization: 0, totalMt: 0, totalWt: 0 },
                buckets: [],
                granularity: 'hour',
                periodStart: null, periodEnd: null,
                _trendSeq: 0,

                _conn: null, _dt: null, _pollTimer: null,
                _charts: { trend: null, count: null, dist: null },

                async init() {
                    this.dark = localStorage.getItem('dspilot-theme') === 'dark';
                    window.addEventListener('storage', (e) => { if (e.key === 'dspilot-theme') this.dark = e.newValue === 'dark'; });
                    this.flowName = new URLSearchParams(location.search).get('name');
                    this.computePeriod('today');
                    await this.loadFlow();
                    if (this.flow) await this.reloadTrend();
                    this.connectSignalR();
                    this._pollTimer = setInterval(() => this.loadFlow(true), 10000);
                },

                destroy() {
                    clearInterval(this._pollTimer);
                    clearTimeout(this._dt);
                    this._conn?.stop();
                },

                toggleTheme() { this.dark = !this.dark; localStorage.setItem('dspilot-theme', this.dark ? 'dark' : 'light'); },

                async apiGet(url) {
                    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                    if (res.status === 503) { this.demoBlocked = true; throw new Error('demo-blocked'); }
                    if (res.status === 404) throw new Error('not-found');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },
                async apiPost(url, body) {
                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) });
                    if (res.status === 503) { this.demoBlocked = true; throw new Error('demo-blocked'); }
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },

                async loadFlow(silent) {
                    if (!this.flowName) { this.loading = false; this.flow = null; return; }
                    if (!silent) this.loading = true;
                    try {
                        const data = await this.apiGet('/api/flow/' + encodeURIComponent(this.flowName));
                        const firstLoad = !this.flow;
                        this.flow = data;
                        this.error = null;
                        // 사용자가 편집 중이 아닐 때만 드롭다운 동기화 (silent refetch 가 선택 덮어쓰지 않게)
                        if (firstLoad || !this.saving) {
                            this.selStart = data.currentStartCall || (data.callOptions[0] || '');
                            this.selEnd = data.currentEndCall || (data.callOptions[0] || '');
                        }
                    } catch (e) {
                        if (e.message === 'not-found') this.error = "Flow '" + this.flowName + "' 을(를) 찾을 수 없습니다.";
                        else if (e.message !== 'demo-blocked') this.error = 'Flow 데이터를 불러오지 못했습니다: ' + e.message;
                    } finally { this.loading = false; }
                },

                async refreshAll() { await this.loadFlow(); if (this.flow) await this.reloadTrend(); },

                kpi(field) { return (this.flow && this.flow.kpi) ? this.flow.kpi[field] : null; },

                get updateTime() {
                    if (!this.flow || !this.flow.timestamp) return '-';
                    const d = new Date(this.flow.timestamp); if (isNaN(d)) return '-';
                    const p = (x) => String(x).padStart(2, '0');
                    return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
                },

                stateClass(s) {
                    switch ((s || '').toLowerCase()) {
                        case 'going': return 'warn';
                        case 'finish': return 'info';
                        case 'error': case 'abort': return 'bad';
                        case 'ready': return 'ok';
                        default: return 'info';
                    }
                },

                async saveCycleOverride() {
                    if (!this.flow || this.saving) return;
                    this.saving = true; this.cycleMsg = '';
                    try {
                        const data = await this.apiPost('/api/flow/' + encodeURIComponent(this.flow.flowName) + '/cycle-override',
                            { startCallName: this.selStart, endCallName: this.selEnd });
                        this.flow = data;
                        this.selStart = data.currentStartCall || (data.callOptions[0] || '');
                        this.selEnd = data.currentEndCall || (data.callOptions[0] || '');
                        this.cycleMsg = data.isOverride ? '사용자 override 저장됨' : 'AASX 기본값으로 저장됨';
                    } catch (e) {
                        if (e.message !== 'demo-blocked') this.cycleMsg = '저장 실패: ' + e.message;
                    } finally { this.saving = false; }
                },

                // ── 실시간 (디바운스 refetch) ──
                connectSignalR() {
                    if (!window.signalR) return;
                    const conn = new signalR.HubConnectionBuilder().withUrl('/hubs/monitoring').withAutomaticReconnect([0, 0, 1000, 3000, 5000, 10000]).build();
                    const trigger = () => { clearTimeout(this._dt); this._dt = setTimeout(() => this.loadFlow(true), 250); };
                    conn.on('CallStateChangedBatch', trigger);
                    conn.on('CallStateChanged', trigger);
                    conn.on('DatabaseRebuilt', () => { this.refreshAll(); });
                    conn.on('FlowHistoryCleared', () => { this.refreshAll(); });
                    conn.onreconnected(() => { this.rt.connected = true; this.loadFlow(true); });
                    conn.onreconnecting(() => { this.rt.connected = false; });
                    conn.onclose(() => { this.rt.connected = false; });
                    conn.start().then(() => { this.rt.connected = true; }).catch(() => { this.rt.connected = false; });
                    this._conn = conn;
                },

                // ── 기간/버킷 ──
                computePeriod(preset) {
                    const now = new Date();
                    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    this.period = preset;
                    if (preset === 'today') { this.periodStart = startOfDay; this.granularity = 'hour'; }
                    else if (preset === '7d') { this.periodStart = new Date(startOfDay.getTime() - 6 * 864e5); this.granularity = 'day'; }
                    else if (preset === '30d') { this.periodStart = new Date(startOfDay.getTime() - 29 * 864e5); this.granularity = 'day'; }
                    else if (preset === '60d') { this.periodStart = new Date(startOfDay.getTime() - 59 * 864e5); this.granularity = 'week'; }
                    else { this.periodStart = startOfDay; this.granularity = 'hour'; this.period = 'today'; }
                    this.periodEnd = now;
                },
                async setPeriod(preset) { this.computePeriod(preset); await this.reloadTrend(); },

                get trendSubtitle() {
                    const fmt = (d) => { if (!d) return '-'; const p = (x) => String(x).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
                    const g = this.granularity === 'hour' ? '1시간' : this.granularity === 'day' ? '1일' : this.granularity === 'week' ? '1주' : this.granularity;
                    return `현재 기간: ${fmt(this.periodStart)} ~ ${fmt(this.periodEnd)} (버킷: ${g}, 사이클 ${this.trend.cycleCount.toLocaleString()} 건)`;
                },

                async reloadTrend() {
                    if (!this.flow) return;
                    const seq = ++this._trendSeq;
                    this.trendLoading = true;
                    try {
                        // 대시보드 히스토리 재사용 (최신순, 비가동 제외). 기간/버킷은 클라에서 집계.
                        const hist = await this.apiGet('/api/dashboard/flows/' + encodeURIComponent(this.flow.flowName) + '/history?limit=2000');
                        if (seq !== this._trendSeq) return;
                        const startMs = this.periodStart.getTime(), endMs = this.periodEnd.getTime();
                        const rows = (hist || []).filter(h => { const t = new Date(h.recordedAt).getTime(); return t >= startMs && t <= endMs; });
                        this.buildStats(rows);
                        this.buckets = this.buildBuckets(rows);
                        this.$nextTick(() => this.drawCharts());
                    } catch (e) {
                        if (seq === this._trendSeq && e.message !== 'demo-blocked') { this.resetStats(); this.buckets = []; }
                    } finally { if (seq === this._trendSeq) this.trendLoading = false; }
                },

                resetStats() { this.trend = { cycleCount: 0, idleCount: 0, avgCT: null, avgMT: null, avgWT: null, minCT: null, maxCT: null, utilization: 0, totalMt: 0, totalWt: 0 }; },

                buildStats(rows) {
                    this.resetStats();
                    if (rows.length === 0) return;
                    const ct = rows.filter(r => r.ct != null).map(r => r.ct);
                    const mt = rows.filter(r => r.mt != null).map(r => r.mt);
                    const wt = rows.filter(r => r.wt != null).map(r => r.wt);
                    const avg = (a) => a.reduce((s, v) => s + v, 0) / a.length;
                    const sum = (a) => a.reduce((s, v) => s + v, 0);
                    this.trend.cycleCount = rows.length;
                    this.trend.idleCount = rows.filter(r => r.isIdle).length;
                    if (ct.length) { this.trend.avgCT = avg(ct); this.trend.minCT = Math.min(...ct); this.trend.maxCT = Math.max(...ct); }
                    if (mt.length) this.trend.avgMT = avg(mt);
                    if (wt.length) this.trend.avgWT = avg(wt);
                    this.trend.totalMt = sum(mt); this.trend.totalWt = sum(wt);
                    const denom = this.trend.totalMt + this.trend.totalWt;
                    this.trend.utilization = denom > 0 ? this.trend.totalMt / denom : 0;
                },

                truncBucket(d) {
                    if (this.granularity === 'hour') return new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours());
                    if (this.granularity === 'week') { const wd = new Date(d.getFullYear(), d.getMonth(), d.getDate()); wd.setDate(wd.getDate() - wd.getDay()); return wd; }
                    return new Date(d.getFullYear(), d.getMonth(), d.getDate()); // day
                },
                buildBuckets(rows) {
                    if (rows.length === 0) return [];
                    const map = new Map();
                    for (const r of rows) {
                        const key = this.truncBucket(new Date(r.recordedAt)).getTime();
                        let a = map.get(key);
                        if (!a) { a = { key, count: 0, idle: 0, sCt: 0, nCt: 0, sMt: 0, nMt: 0, sWt: 0, nWt: 0 }; map.set(key, a); }
                        a.count++; if (r.isIdle) a.idle++;
                        if (r.ct != null) { a.sCt += r.ct; a.nCt++; }
                        if (r.mt != null) { a.sMt += r.mt; a.nMt++; }
                        if (r.wt != null) { a.sWt += r.wt; a.nWt++; }
                    }
                    return [...map.values()].sort((x, y) => x.key - y.key).map(a => ({
                        ts: a.key,
                        avgCT: a.nCt > 0 ? a.sCt / a.nCt : 0,
                        avgMT: a.nMt > 0 ? a.sMt / a.nMt : 0,
                        avgWT: a.nWt > 0 ? a.sWt / a.nWt : 0,
                        count: a.count, idle: a.idle,
                    }));
                },

                drawCharts() {
                    if (!window.Chart) return;
                    Object.values(this._charts).forEach(c => { if (c) c.destroy(); });
                    this._charts = { trend: null, count: null, dist: null };
                    if (this.trend.cycleCount === 0) return;

                    const labelFor = (ts) => {
                        const d = new Date(ts); const p = (x) => String(x).padStart(2, '0');
                        if (this.granularity === 'hour') return `${p(d.getHours())}:00`;
                        return `${p(d.getMonth() + 1)}-${p(d.getDate())}`;
                    };
                    const labels = this.buckets.map(b => labelFor(b.ts));
                    const toSec = (ms) => Math.round(ms / 1000 * 10) / 10;
                    const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#888';
                    const cPrimary = css('--color-primary') || '#1f3a5f';
                    const cSecondary = css('--color-secondary') || '#009bb4';
                    const grid = 'rgba(128,128,128,0.15)';

                    if (this.$refs.trendChart) {
                        this._charts.trend = new Chart(this.$refs.trendChart, {
                            type: 'line',
                            data: { labels, datasets: [
                                { label: '평균 CT (s)', data: this.buckets.map(b => toSec(b.avgCT)), borderColor: cPrimary, backgroundColor: 'transparent', tension: 0.25, borderWidth: 2 },
                                { label: '평균 MT (s)', data: this.buckets.map(b => toSec(b.avgMT)), borderColor: cSecondary, backgroundColor: 'transparent', tension: 0.25, borderWidth: 2 },
                                { label: '평균 WT (s)', data: this.buckets.map(b => toSec(b.avgWT)), borderColor: '#e0a82e', backgroundColor: 'transparent', tension: 0.25, borderWidth: 2 },
                            ]},
                            options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'top' } }, scales: { x: { grid: { color: grid } }, y: { beginAtZero: true, grid: { color: grid }, title: { display: true, text: '초' } } } }
                        });
                    }
                    if (this.$refs.countChart) {
                        this._charts.count = new Chart(this.$refs.countChart, {
                            type: 'bar',
                            data: { labels, datasets: [{ label: '사이클 수', data: this.buckets.map(b => b.count), backgroundColor: cPrimary }] },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { color: grid } }, y: { beginAtZero: true, grid: { color: grid } } } }
                        });
                    }
                    if (this.$refs.distChart) {
                        this._charts.dist = new Chart(this.$refs.distChart, {
                            type: 'doughnut',
                            data: { labels: ['가동(MT)', '대기(WT)'], datasets: [{ data: [this.trend.totalMt, this.trend.totalWt], backgroundColor: [cPrimary, cSecondary] }] },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                        });
                    }
                },

                fmtDur(ms) {
                    if (ms == null || ms <= 0) return '—';
                    return (ms / 1000).toFixed(1) + ' sec';
                }
            };
        }
    </script>
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
</body>
