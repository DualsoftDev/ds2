<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사이클 분석 — DSPilot</title>

    <!--
      DSPilot 정적 호스팅 — Swiss Technical 리디자인 (Cycle-Time Analysis).
      서버=C#(/api/cycle-analysis/flows|latest-time|gantt-data|export-excel), 뷰=Alpine + 순수 JS SVG 렌더.
      디자인 시스템: /css/swiss.css (토큰/컴포넌트/다크). 페이지 고유 클래스(gantt-*/sel-*/gantt-info-*)만 인라인.
      base 갠트 SVG / lane 정렬 / zoom / 바 선택 오버레이 / GAP top-5 / CSV / Excel 을 전부 클라이언트에서 처리.
      crosshair=/js/gantt-crosshair.js, 툴팁/scrollIntoView=/js/cycle-time-chart.js 재사용(클릭은 로컬 Alpine state).
      gantt-* SVG 색은 swiss.css 가 재정의한 var(--gantt-*) 토큰을 그대로 참조 → 다크 자동.
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/swiss.css" rel="stylesheet" />

    <style>
        [x-cloak] { display: none !important; }

        /* ── 독립 셸 (shell.js 미동작 시 fallback) ── */
        .dsp-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); color: var(--color-text-primary); font-family: var(--font-family); }
        .dsp-appbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; background: var(--color-appbar-bg); color: var(--color-appbar-text); border-bottom: 1px solid var(--color-lines-strong); position: sticky; top: 0; z-index: 50; flex-shrink: 0; }
        .dsp-appbar .dsp-title { font-size: 18px; font-weight: 700; }
        .dsp-appbar .spacer { flex: 1; }
        .dsp-main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 20px 20px; max-width: 1600px; margin: 0 auto; width: 100%; box-sizing: border-box; }

        /* ── 콘텐츠 페이지 헤더 (셸이 제거하지 않는 영역 → 실시간/조회 상태 노출) ── */
        .cta-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--color-text-primary); flex-wrap: wrap; }
        .cta-toolbar .cta-head { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
        .cta-toolbar .cta-index { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; color: var(--color-primary); letter-spacing: 0.04em; }
        .cta-toolbar .cta-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.015em; }
        .cta-status { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--color-lines-strong); border-radius: var(--radius-sm); font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-variant-numeric: tabular-nums; color: var(--color-text-secondary); }
        .cta-status .cta-status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .cta-status.is-loaded { color: var(--color-success); border-color: color-mix(in srgb, var(--color-success) 50%, transparent); }
        .cta-status.is-loading { color: var(--color-warning); border-color: color-mix(in srgb, var(--color-warning) 50%, transparent); }
        .cta-status.is-loading .cta-status-dot { animation: cta-pulse 1.4s ease-in-out infinite; }
        @keyframes cta-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        /* ── 필터 패널 (스위스 헤어라인 박스) ── */
        .cycle-time-analysis { width: 100%; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; min-height: 0; flex: 1; }
        .chart-filter-panel { background: var(--color-surface); border: 1px solid var(--color-lines); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 14px; }
        .chart-filter-panel h4 { margin: 0 0 14px 0; color: var(--color-text-primary); font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; }
        .filter-row { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-row:last-child { margin-bottom: 0; }
        .filter-group { min-width: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .filter-group > label { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-secondary); }
        .filter-group input[type="datetime-local"], .filter-group select { min-width: 150px; }
        .filter-group input[type="range"] { flex: 1; accent-color: var(--color-primary); }
        .filter-zoom-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.82rem; color: var(--color-text-primary); }
        .time-preset-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }

        /* 병목 배너 — swiss.css 의 .bottleneck-banner / -active / -muted / -icon / -label / -value / -unit / -lane / -cta 사용. 여백만 보정. */
        .bottleneck-banner { margin-top: 0; margin-bottom: 14px; }

        /* Gantt Info Bar — 평면 잉크 바, 헤어라인, 모노 수치 */
        .gantt-info-bar { background: var(--color-surface-variant); color: var(--color-text-primary); border: 1px solid var(--color-lines); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 14px; display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
        .info-item { display: flex; gap: 7px; align-items: baseline; }
        .info-item .label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-secondary); }
        .info-item .value { font-size: 0.85rem; font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-text-primary); }
        .gantt-info-controls { display: flex; align-items: center; gap: 10px; margin-left: 8px; flex-wrap: wrap; min-width: 0; }
        .gantt-info-controls .gap-picker-select { max-width: 100%; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.74rem; }
        .gantt-info-label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--color-text-primary); font-size: 0.8rem; font-weight: 600; }
        .gantt-info-label input[type="checkbox"] { accent-color: var(--color-primary); width: 15px; height: 15px; cursor: pointer; }
        .gantt-info-separator { color: var(--color-lines-strong); margin: 0 2px; }
        .gantt-info-hint { font-size: 0.68rem; color: var(--color-text-secondary); }
        .gantt-idle-legend { display: flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 600; color: var(--color-text-secondary); }
        .gantt-idle-swatch { display: inline-block; width: 16px; height: 12px; background: var(--gantt-idle-swatch-bg, #9e9e9e); opacity: 0.55; border-radius: 1px; border: 1px solid var(--color-lines-strong); }
        .gantt-info-export { margin-left: 0; white-space: nowrap; }
        .gantt-info-actions { display: flex; gap: 5px; margin-left: auto; flex-wrap: wrap; }

        /* Gantt Chart Container */
        .gantt-chart-container { background: var(--color-surface); border: 1px solid var(--color-lines); border-radius: var(--radius-md); padding: 16px; margin-bottom: 0; overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 380px); min-height: 600px; flex: 1; }
        .gantt-chart-wrapper { display: inline-block; min-width: 100%; }
        .gantt-chart { display: block; border: 1px solid var(--color-lines); border-radius: var(--radius-sm); }

        /* Signal selection panel (sel-* 패밀리 — 토큰 기반, 다크 자동) */
        .sel-panel { background: var(--color-surface); border: 1px solid var(--color-lines); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 14px; animation: slideIn 0.25s ease-out; }
        .sel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--color-lines); flex-wrap: wrap; }
        .sel-selected-signal { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; flex-wrap: wrap; }
        .sel-selected-signal strong { font-size: 0.95rem; font-weight: 700; color: var(--color-text-primary); }
        .sel-badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
        .sel-badge-selected { background: color-mix(in srgb, var(--color-warning) 12%, transparent); color: var(--color-warning); border: 1px solid color-mix(in srgb, var(--color-warning) 40%, transparent); }
        .sel-badge-next { background: color-mix(in srgb, var(--color-success) 12%, transparent); color: var(--color-success); border: 1px solid color-mix(in srgb, var(--color-success) 40%, transparent); }
        .sel-event-type { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-secondary); background: var(--color-surface-variant); border: 1px solid var(--color-lines); padding: 1px 7px; border-radius: var(--radius-sm); }
        .sel-time { font-size: 0.78rem; color: var(--color-text-secondary); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
        .sel-info-row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
        .sel-gap-card { flex: 1; min-width: 160px; padding: 10px 14px; background: var(--color-surface-variant); border: 1px solid var(--color-lines); border-radius: var(--radius-sm); text-align: center; }
        .sel-gap-direction { font-size: 0.62rem; font-weight: 700; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .sel-arrow { display: inline-block; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
        .sel-arrow-left { border-right: 6px solid var(--color-text-secondary); }
        .sel-arrow-right { border-left: 6px solid var(--color-text-secondary); }
        .sel-gap-value { font-size: 1.1rem; font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-text-primary); margin-bottom: 3px; }
        .sel-gap-signal { font-size: 0.74rem; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sel-gap-signal span { color: var(--color-text-disabled); }
        .sel-cycle-card { flex: 1.2; min-width: 180px; padding: 10px 14px; background: color-mix(in srgb, var(--color-success) 8%, var(--color-surface)); border: 1px solid color-mix(in srgb, var(--color-success) 45%, transparent); border-radius: var(--radius-sm); text-align: center; }
        .sel-cycle-label { font-size: 0.62rem; font-weight: 700; color: var(--color-success); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px; }
        .sel-cycle-value { font-size: 1.3rem; font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--color-success); margin-bottom: 3px; }
        .sel-cycle-signal { font-size: 0.74rem; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Loading / empty / alert */
        .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px; color: var(--color-text-secondary); }
        .loading-container p { margin-top: 16px; font-size: 0.85rem; }
        .chart-loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--color-surface) 70%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--color-text-primary); font-weight: 700; font-size: 0.82rem; z-index: 100; border-radius: var(--radius-md); pointer-events: none; backdrop-filter: blur(1px); }
        .empty-state { text-align: center; padding: 72px 24px; color: var(--color-text-secondary); }
        .empty-state .material-icons { font-size: 56px; color: var(--color-text-disabled); margin-bottom: 12px; }
        .empty-state p { margin: 8px 0; font-size: 1rem; }
        .empty-state-hint { font-size: 0.8rem; color: var(--color-text-disabled); }

        /* ── SVG Gantt 스타일 — JS 렌더러(C# 이식)가 emit/target. 색은 var(--gantt-*) 토큰(다크 자동). 구조 CSS 보존. ── */
        .gantt-bg { fill: var(--gantt-bg); }
        .gantt-idle-region { fill: var(--gantt-idle-region-fill, #9e9e9e); opacity: 0.22; pointer-events: none; }
        .gantt-idle-label { fill: var(--gantt-sublabel); font-size: 11px; font-weight: 600; opacity: 0.8; pointer-events: none; }
        .gantt-lane-even { fill: var(--gantt-lane-even); stroke: var(--gantt-lane-border); stroke-width: 1; }
        .gantt-lane-odd { fill: var(--gantt-lane-odd); stroke: var(--gantt-lane-border); stroke-width: 1; }
        .gantt-lane-center { stroke: var(--gantt-lane-center); stroke-width: 1; }
        .gantt-lane-label { fill: var(--gantt-label); }
        .gantt-lane-sublabel { fill: var(--gantt-sublabel); }
        .gantt-axis { stroke: var(--gantt-axis); stroke-width: 2; }
        .gantt-tick { stroke: var(--gantt-axis); stroke-width: 1; }
        .gantt-tick-label { fill: var(--gantt-tick-label); }
        .gantt-bar-in { fill: var(--gantt-bar-in); stroke: var(--gantt-bar-in-stroke); stroke-width: 1; }
        .gantt-bar-out { fill: var(--gantt-bar-out); stroke: var(--gantt-bar-out-stroke); stroke-width: 1; }
        .gantt-bar-label { fill: #fff; }
        .gantt-gap-overlay { fill: var(--gantt-gap-fill); stroke: var(--gantt-gap-stroke); stroke-width: 2; }
        .gantt-gap-text { fill: var(--gantt-gap-text); }
        .gantt-gap-label-bg { fill: var(--gantt-connector-bg); stroke: var(--gantt-gap-text); stroke-width: 1.5; }
        .gantt-ct-label-bg { fill: var(--gantt-connector-bg); stroke: var(--gantt-ct-text); stroke-width: 1.5; }
        .gantt-cycletime-overlay { fill: var(--gantt-ct-fill); stroke: var(--gantt-ct-stroke); stroke-width: 2; }
        .gantt-cycletime-text { fill: var(--gantt-ct-text); }
        .gantt-cycletime-start { stroke: var(--gantt-ct-start); stroke-width: 2; }
        .gantt-cycletime-end { stroke: var(--gantt-ct-end); stroke-width: 2; }

        /* 병목 GAP scroll-to 하이라이트 — focusGap() 이 ~1.2s 동안 부여 */
        @keyframes gantt-gap-pulse {
            0%   { opacity: 0.0; }
            15%  { opacity: 0.95; }
            70%  { opacity: 0.85; }
            100% { opacity: 0.0; }
        }
        .gantt-gap-pulse { animation: gantt-gap-pulse 1.2s ease-in-out 1; }
        .gantt-gap-pulse-fill { fill: var(--gantt-gap-fill); }
        .gantt-gap-pulse-outline {
            fill: none;
            stroke: var(--gantt-gap-stroke);
            stroke-width: 3;
            stroke-dasharray: 6,4;
        }

        /* ── 다크 보강 (old dark-theme.css 미링크 → 페이지 고유 클래스의 다크 처리 인라인) ── */
        .dark-theme .gantt-idle-swatch { background: rgba(244, 242, 236, 0.40); }
        .dark-theme .gantt-idle-region { fill: rgba(244, 242, 236, 0.30); }
        .dark-theme .gantt-bar-label { fill: #fff; }

        @media (max-width: 1200px) { .gantt-chart-container { max-height: calc(100vh - 450px); min-height: 500px; } .gantt-info-bar { gap: 16px; } }
        @media (max-width: 1024px) { .gantt-chart-container { max-height: calc(100vh - 500px); min-height: 400px; } }
        @media (max-width: 768px) { .filter-row { flex-direction: column; align-items: stretch; } .gantt-info-bar { flex-direction: column; align-items: stretch; gap: 12px; } .gantt-info-actions { margin-left: 0; } .gantt-chart-container { max-height: 400px; min-height: 300px; } }
    </style>
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="cycleAnalysisApp()" x-init="init()" x-cloak>

        <!-- 데모 만료 -->
        <div class="modal-overlay" x-show="demoBlocked" style="z-index:3000;">
            <div class="modal-content demo-blocked-card" style="max-width:480px;">
                <span class="material-icons demo-blocked-icon">hourglass_disabled</span>
                <h3>DEMO 만료</h3>
                <p>데모 사용 시간(3시간)이 종료되었습니다.</p>
                <p>서비스 관리자에게 문의해 주세요.</p>
            </div>
        </div>

        <!-- fallback 슬림 헤더 (shell.js 가 제거) -->
        <header class="dsp-appbar">
            <span class="dsp-title">사이클 분석</span>
            <span class="dsp-badge">정적</span>
            <div class="spacer"></div>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">

            <!-- 콘텐츠 페이지 헤더: 번호 인덱스 + 제목 + 조회 상태 -->
            <div class="cta-toolbar">
                <div class="cta-head">
                    <span class="cta-index">03 / 사이클</span>
                    <span class="cta-title">사이클 분석</span>
                </div>
                <div class="spacer"></div>
                <span class="cta-status" :class="loading ? 'is-loading' : (data && data.items.length ? 'is-loaded' : '')"
                      :title="loading ? '갠트 데이터 조회 중' : (data && data.items.length ? '갠트 렌더링 완료' : '대기')">
                    <span class="cta-status-dot"></span>
                    <span x-text="loading ? 'LOADING · 조회중' : (data && data.items.length ? ('LOADED · ' + data.renderedEventCount) : 'IDLE · 대기')"></span>
                </span>
            </div>

            <div class="cycle-time-analysis">
                <!-- Flow 선택 -->
                <div class="chart-filter-panel">
                    <div class="filter-row">
                        <div class="filter-group">
                            <label>Flow 선택</label>
                            <select class="form-select" x-model="selectedFlow" @change="onFlowChanged()">
                                <option value="">-- Flow 선택 --</option>
                                <template x-for="f in flows" :key="f"><option :value="f" x-text="f"></option></template>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 시간 범위 -->
                <div class="chart-filter-panel" x-show="selectedFlow">
                    <h4>시간 범위 설정</h4>
                    <div class="filter-row">
                        <div class="filter-group">
                            <label>시작 시간</label>
                            <input type="datetime-local" step="1" class="form-field" x-model="startTime" @change="onTimeRangeChanged()" />
                            <div class="time-preset-buttons">
                                <button class="btn btn-sm btn-outlined color-default" @click="setDurationMinutes(1)">시작 1분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setDurationMinutes(2)">시작 2분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setDurationMinutes(5)">시작 5분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setDurationMinutes(10)">시작 10분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setDurationMinutes(30)">시작 30분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setDurationMinutes(60)">시작 1시간</button>
                            </div>
                        </div>
                        <div class="filter-group">
                            <label>종료 시간</label>
                            <input type="datetime-local" step="1" class="form-field" x-model="endTime" @change="onTimeRangeChanged()" />
                            <div class="time-preset-buttons">
                                <button class="btn btn-sm btn-outlined color-default" @click="setRecentMinutes(1)">최근 1분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setRecentMinutes(2)">최근 2분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setRecentMinutes(5)">최근 5분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setRecentMinutes(10)">최근 10분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setRecentMinutes(30)">최근 30분</button>
                                <button class="btn btn-sm btn-outlined color-default" @click="setRecentMinutes(60)">최근 1시간</button>
                            </div>
                        </div>
                    </div>

                    <div class="filter-row" x-show="data && data.items.length">
                        <div class="filter-group">
                            <label>정렬 방식</label>
                            <select class="form-select" x-model="chartSort" @change="onSortChanged()">
                                <option value="ByLane">Lane별</option>
                                <option value="ByTime">시간순</option>
                                <option value="ByCallName">Call 이름순</option>
                                <option value="ByGapSize">GAP 크기순</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Zoom</label>
                            <div class="d-flex align-center gap-3">
                                <input type="range" min="0.5" max="3.0" step="0.1" x-model="zoomLevel" @input="applyZoom()" />
                                <span class="filter-zoom-value" x-text="parseFloat(zoomLevel).toFixed(1) + 'x'"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 에러 -->
                <div class="alert alert-error mb-4" x-show="error">
                    <span class="material-icons">error_outline</span>
                    <span x-text="error"></span>
                </div>

                <!-- 로딩 (차트 없을 때) -->
                <div class="loading-container" x-show="loading && (!data || !data.items.length)">
                    <div class="spinner"></div>
                    <p>데이터 로딩 중...</p>
                </div>

                <!-- 결과 -->
                <template x-if="data && data.items.length">
                    <div style="display:flex; flex-direction:column; flex:1; min-height:0;">
                        <!-- 병목 배너 (swiss.css 가 스타일) -->
                        <button type="button"
                                class="bottleneck-banner"
                                :class="data.topGaps.length ? 'bottleneck-banner-active' : 'bottleneck-banner-muted'"
                                @click="focusLargestGap()" :disabled="!data.topGaps.length"
                                :title="data.topGaps.length ? '클릭 시 갠트에서 해당 GAP 강조' : 'GAP 없음'">
                            <span class="material-icons bottleneck-icon">warning_amber</span>
                            <span class="bottleneck-label">최대 GAP (병목)</span>
                            <template x-if="data.topGaps.length">
                                <span style="display:flex; align-items:center; gap:12px; flex:1; min-width:0;">
                                    <span class="bottleneck-value" x-text="(data.topGaps[0].duration / 1000).toFixed(2)"><span class="bottleneck-unit">s</span></span>
                                    <span class="bottleneck-lane" x-text="data.topGaps[0].laneName"></span>
                                    <span class="bottleneck-cta">클릭하여 갠트에서 보기 →</span>
                                </span>
                            </template>
                            <template x-if="!data.topGaps.length">
                                <span style="display:flex; align-items:center; gap:12px;">
                                    <span class="bottleneck-value">-</span>
                                    <span class="bottleneck-lane">GAP 없음</span>
                                </span>
                            </template>
                        </button>

                        <!-- Info Bar -->
                        <div class="gantt-info-bar">
                            <div class="info-item"><span class="label">Flow</span><span class="value" x-text="data.flowName"></span></div>
                            <div class="info-item"><span class="label">시간 범위</span><span class="value" x-text="data.startTimeDisplay + ' ~ ' + data.endTimeDisplay"></span></div>
                            <div class="info-item"><span class="label">총 이벤트</span><span class="value" x-text="data.totalEventCount + ' (' + data.renderedEventCount + ' 렌더링)'"></span></div>
                            <div class="info-item"><span class="label">Lane 수</span><span class="value" x-text="data.totalLanes"></span></div>
                            <div class="gantt-info-controls">
                                <label class="gantt-info-label">
                                    <input type="checkbox" x-model="showGapOverlay" @change="renderOverlay()" :disabled="!data.topGaps.length" /> GAP
                                </label>
                                <select class="form-select gap-picker-select" x-model.number="selectedGapIndex" @change="onGapPicked()"
                                        :disabled="!showGapOverlay || !data.topGaps.length" :style="(showGapOverlay && data.topGaps.length) ? 'opacity:1' : 'opacity:0.4'">
                                    <template x-if="!data.topGaps.length"><option value="-1">GAP 없음</option></template>
                                    <template x-for="(g, i) in data.topGaps" :key="i">
                                        <option :value="i" x-text="'#' + (i+1) + ': ' + (g.duration/1000).toFixed(2) + 's | ' + g.laneName + ' | ' + g.startDisplay + ' ~ ' + g.endDisplay"></option>
                                    </template>
                                </select>
                                <span class="gantt-info-separator">|</span>
                                <label class="gantt-info-label">
                                    <input type="checkbox" x-model="showCycleTimeOverlay" @change="renderOverlay()" /> Cycle Time
                                </label>
                                <span class="gantt-info-hint">신호 클릭 시 동일 신호의 다음 발생까지 표시</span>
                                <template x-if="data.idleRegions.length">
                                    <span style="display:flex;align-items:center;gap:6px;">
                                        <span class="gantt-info-separator">|</span>
                                        <span class="gantt-idle-legend"><span class="gantt-idle-swatch"></span>비가동 구간</span>
                                    </span>
                                </template>
                            </div>
                            <div class="gantt-info-actions">
                                <button class="btn btn-sm btn-outlined color-default gantt-info-export" @click="refreshLatest()" :disabled="loading" title="최신 데이터까지 포함해 다시 조회 (현재 윈도우 길이 유지)">
                                    <span class="material-icons" style="font-size:15px;">refresh</span>새로고침
                                </button>
                                <button class="btn btn-sm btn-outlined color-default gantt-info-export" @click="exportCsv()" :disabled="!data || !data.items.length">CSV 내보내기</button>
                                <button class="btn btn-sm btn-filled gantt-info-export" @click="exportExcel()" :disabled="!data || !data.items.length || exporting">
                                    <span x-text="exporting ? 'Excel 생성 중…' : 'Excel 내보내기'"></span>
                                </button>
                            </div>
                        </div>

                        <!-- 선택 패널 -->
                        <template x-if="selectedItem">
                            <div class="sel-panel">
                                <div class="sel-header">
                                    <div class="sel-selected-signal">
                                        <span class="sel-badge sel-badge-selected">선택</span>
                                        <strong x-text="selectedItem.callName"></strong>
                                        <span class="sel-event-type" x-text="eventLabel(selectedItem.eventType)"></span>
                                        <span class="sel-time" x-text="hms(selectedItem.goingStartTime)"></span>
                                    </div>
                                    <button class="btn btn-sm btn-outlined" @click="clearSelection()" style="white-space:nowrap;">선택 해제</button>
                                </div>
                                <div class="sel-info-row">
                                    <div class="sel-gap-card">
                                        <div class="sel-gap-direction"><span class="sel-arrow sel-arrow-left"></span> 이전 GAP</div>
                                        <div class="sel-gap-value" x-text="previousGap !== null ? fmtGap(previousGap) : '-'"></div>
                                        <template x-if="previousItem">
                                            <div class="sel-gap-signal"><span x-text="previousItem.callName"></span> <span x-text="eventLabel(previousItem.eventType)"></span></div>
                                        </template>
                                    </div>
                                    <template x-if="comparisonItem">
                                        <div class="sel-cycle-card">
                                            <div class="sel-cycle-label">Cycle Time</div>
                                            <div class="sel-cycle-value" x-text="comparisonGap !== null ? fmtGap(comparisonGap) : '-'"></div>
                                            <div class="sel-cycle-signal">
                                                <span class="sel-badge sel-badge-next">다음</span>
                                                <span x-text="comparisonItem.callName"></span>
                                                <span class="sel-time" x-text="hms(comparisonItem.goingStartTime)"></span>
                                            </div>
                                        </div>
                                    </template>
                                    <div class="sel-gap-card">
                                        <div class="sel-gap-direction">다음 GAP <span class="sel-arrow sel-arrow-right"></span></div>
                                        <div class="sel-gap-value" x-text="nextGap !== null ? fmtGap(nextGap) : '-'"></div>
                                        <template x-if="nextItem">
                                            <div class="sel-gap-signal"><span x-text="nextItem.callName"></span> <span x-text="eventLabel(nextItem.eventType)"></span></div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Gantt -->
                        <div class="gantt-chart-container" x-ref="ganttContainer" style="position: relative;">
                            <div class="gantt-chart-wrapper" x-ref="ganttWrapper" style="transform-origin: top left; position: relative;">
                                <div x-ref="baseSvgHost"></div>
                                <svg x-ref="overlaySvg" class="gantt-chart-overlay-layer" xmlns="http://www.w3.org/2000/svg"
                                     style="position:absolute; top:0; left:0; pointer-events:none;"></svg>
                            </div>
                            <div class="chart-loading-overlay" x-show="loading">
                                <div class="spinner"></div><span>데이터 로딩 중...</span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 빈 상태 -->
                <template x-if="!loading && data && !data.items.length && selectedFlow">
                    <div class="empty-state">
                        <span class="material-icons">search_off</span>
                        <p>선택한 시간 범위에 분석할 데이터가 없습니다</p>
                        <p class="empty-state-hint">시간 범위를 변경하거나 프리셋 버튼을 사용해 보세요</p>
                    </div>
                </template>
                <template x-if="!selectedFlow">
                    <div class="empty-state">
                        <span class="material-icons">bar_chart</span>
                        <p>Flow를 선택하세요</p>
                    </div>
                </template>
            </div>
        </main>
    </div>

    <!-- 차트 click 위임 + 툴팁 (dotnetRef 없이 click 콜백만 로컬) / crosshair -->
    <script src="/js/cycle-time-chart.js"></script>
    <script src="/js/gantt-crosshair.js"></script>
    <script>
        // ── 차트 geometry — CycleTimeChartRenderer 상수와 동일 ──
        const G = { LEFT: 220, TOP: 60, LANE_H: 52, BAR_H: 14, PLOT_W: 2000 };

        function cycleAnalysisApp() {
            return {
                flows: [], selectedFlow: '',
                startTime: '', endTime: '',
                data: null, loading: false, error: null, demoBlocked: false, dark: false,
                exporting: false,

                chartSort: 'ByLane', zoomLevel: 1.0,
                showGapOverlay: true, showCycleTimeOverlay: true, selectedGapIndex: 0,

                // 선택 상태 (로컬 계산 — 서버 라운드트립 없음)
                selectedItem: null, comparisonItem: null, previousItem: null, nextItem: null,
                comparisonGap: null, previousGap: null, nextGap: null,

                // 렌더 캐시
                _geo: null,            // { chartStart(ms), xScale, displayLaneIndex{lane:idx}, width, height }
                _sortedItems: [],      // data-bar-idx 와 일치하는 정렬된 items
                _debounce: null,
                _pulseTimer: null,     // focusGap 하이라이트 제거 타이머

                async init() {
                    this.dark = localStorage.getItem('dspilot-theme') === 'dark';
                    window.addEventListener('storage', (e) => { if (e.key === 'dspilot-theme') this.dark = e.newValue === 'dark'; });
                    try {
                        this.flows = await this.apiGet('/api/cycle-analysis/flows');
                    } catch (e) { if (e.message !== 'demo-blocked') this.error = 'Flow 로딩 실패: ' + e.message; return; }
                    if (this.flows.length) {
                        this.selectedFlow = this.flows[0];
                        const latest = await this.fetchLatest();
                        this.endTime = latest;
                        this.startTime = this.addMinutes(latest, -1);
                        await this.loadGantt();
                    }
                },
                toggleTheme() { this.dark = !this.dark; localStorage.setItem('dspilot-theme', this.dark ? 'dark' : 'light'); this.$nextTick(() => this.renderOverlay()); },

                async apiGet(url) {
                    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                    if (res.status === 503) { this.demoBlocked = true; throw new Error('demo-blocked'); }
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },
                async apiPost(url, body) {
                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) });
                    if (res.status === 503) { this.demoBlocked = true; throw new Error('demo-blocked'); }
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },

                // ── 시간 헬퍼 (datetime-local 문자열 = 로컬 naive) ──
                async fetchLatest() {
                    try { const d = await this.apiGet('/api/cycle-analysis/latest-time'); return d.latest.slice(0, 19); }
                    catch { return this.nowLocal(); }
                },
                nowLocal() { const d = new Date(); return this.toLocalInput(d); },
                toLocalInput(d) { const p = (x) => String(x).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; },
                addMinutes(localStr, mins) { const d = this.parseLocal(localStr); d.setMinutes(d.getMinutes() + mins); return this.toLocalInput(d); },
                parseLocal(s) { const m = s.match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)(?::(\d+))?/); if (!m) return new Date(); return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]||0); },

                async onFlowChanged() {
                    this.clearSelectionState();
                    this.data = null;
                    if (!this.selectedFlow) return;
                    const latest = await this.fetchLatest();
                    this.endTime = latest;
                    this.startTime = this.addMinutes(latest, -1);
                    await this.loadGantt();
                },
                onTimeRangeChanged() {
                    clearTimeout(this._debounce);
                    this._debounce = setTimeout(() => { if (this.selectedFlow) this.loadGantt(); }, 500);
                },
                async setDurationMinutes(mins) { this.endTime = this.addMinutes(this.startTime, mins); if (this.selectedFlow) await this.loadGantt(); },
                async setRecentMinutes(mins) { const latest = await this.fetchLatest(); this.endTime = latest; this.startTime = this.addMinutes(latest, -mins); if (this.selectedFlow) await this.loadGantt(); },
                async refreshLatest() {
                    if (!this.selectedFlow) return;
                    const durMs = this.parseLocal(this.endTime) - this.parseLocal(this.startTime);
                    const dur = durMs > 0 ? durMs : 60000;
                    const latest = await this.fetchLatest();
                    this.endTime = latest;
                    const sd = new Date(this.parseLocal(latest).getTime() - dur);
                    this.startTime = this.toLocalInput(sd);
                    await this.loadGantt();
                },

                async loadGantt() {
                    this.loading = true; this.error = null;
                    try {
                        const d = await this.apiPost('/api/cycle-analysis/gantt-data', { flowName: this.selectedFlow, start: this.startTime, end: this.endTime });
                        this.data = d;
                        this.clearSelectionState();
                        this.selectedGapIndex = 0;
                        this.$nextTick(() => { this.renderChart(); });
                    } catch (e) {
                        if (e.message !== 'demo-blocked') this.error = '데이터 로딩 실패: ' + e.message;
                    } finally { this.loading = false; }
                },

                onSortChanged() { this.clearSelectionState(); this.$nextTick(() => this.renderChart()); },
                applyZoom() { if (this.$refs.ganttWrapper) this.$refs.ganttWrapper.style.transform = 'scale(' + this.zoomLevel + ')'; },

                // ════════════════════════════════════════════════════════════════
                //  렌더링 — CycleTimeChartRenderer.BuildBaseSvg + RenderDynamicOverlay 이식
                // ════════════════════════════════════════════════════════════════
                renderChart() {
                    if (!this.data || !this.data.items.length) { this.disposeJs(); return; }
                    const laneOrder = this.computeDisplayLaneOrder();
                    const displayLaneIndex = {}; laneOrder.forEach((lane, i) => displayLaneIndex[lane] = i);
                    this._sortedItems = this.computeSortedItems(laneOrder, displayLaneIndex);

                    const chartStart = new Date(this.data.chartStartTime).getTime();
                    const chartEnd = new Date(this.data.chartEndTime).getTime();
                    const cycleTime = Math.max(chartEnd - chartStart, 1);
                    const xScale = G.PLOT_W / cycleTime;
                    const width = G.LEFT + G.PLOT_W + 100;
                    const height = G.TOP + (this.data.totalLanes * G.LANE_H) + 100;
                    this._geo = { chartStart, xScale, displayLaneIndex, width, height };

                    // base SVG
                    this.$refs.baseSvgHost.innerHTML = this.buildBaseSvg(laneOrder, displayLaneIndex, chartStart, xScale, width, height);
                    const ov = this.$refs.overlaySvg;
                    ov.setAttribute('width', width); ov.setAttribute('height', height);

                    this.applyZoom();
                    this.renderOverlay();
                    this.initJs(chartStart, xScale);
                },

                buildBaseSvg(laneOrder, displayLaneIndex, chartStart, xScale, width, height) {
                    const d = this.data;
                    const chartEnd = new Date(d.chartEndTime).getTime();
                    let s = `<svg class="gantt-chart" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">`;
                    s += `<rect class="gantt-bg" width="100%" height="100%"/>`;
                    s += this.buildTimeAxis(chartStart, chartEnd);
                    s += this.buildLanes(laneOrder);
                    s += this.buildBars(chartStart, xScale, displayLaneIndex);
                    s += this.buildIdleRegions(chartStart, xScale);
                    s += `</svg>`;
                    return s;
                },
                buildTimeAxis(startMs, endMs) {
                    const tickCount = 20, dur = endMs - startMs, tickInterval = dur / tickCount;
                    let s = `<line class="gantt-axis" x1="${G.LEFT}" y1="${G.TOP-5}" x2="${G.LEFT+G.PLOT_W}" y2="${G.TOP-5}"/>`;
                    for (let i = 0; i <= tickCount; i++) {
                        const x = G.LEFT + (i * G.PLOT_W / tickCount);
                        const t = new Date(startMs + i * tickInterval);
                        s += `<line class="gantt-tick" x1="${x}" y1="${G.TOP-5}" x2="${x}" y2="${G.TOP-10}"/>`;
                        s += `<text class="gantt-tick-label" x="${x}" y="${G.TOP-15}" text-anchor="middle" font-size="10">${this.hmsTick(t)}</text>`;
                    }
                    return s;
                },
                buildLanes(laneOrder) {
                    const d = this.data; let s = '';
                    for (let dl = 0; dl < laneOrder.length; dl++) {
                        const lane = laneOrder[dl];
                        const y = G.TOP + dl * G.LANE_H;
                        const cls = dl % 2 === 0 ? 'gantt-lane-even' : 'gantt-lane-odd';
                        const cy = y + G.LANE_H / 2;
                        const label = (lane >= 0 && lane < d.laneLabels.length) ? d.laneLabels[lane] : ('Lane ' + lane);
                        s += `<rect class="${cls}" x="${G.LEFT}" y="${y}" width="${G.PLOT_W}" height="${G.LANE_H}"/>`;
                        s += `<line class="gantt-lane-center" x1="${G.LEFT}" y1="${cy}" x2="${G.LEFT+G.PLOT_W}" y2="${cy}"/>`;
                        s += `<text class="gantt-lane-label" x="${G.LEFT-10}" y="${cy-6}" text-anchor="end" dominant-baseline="middle" font-size="12" font-weight="600">${esc(label)}</text>`;
                        s += `<text class="gantt-lane-sublabel" x="${G.LEFT-10}" y="${cy+10}" text-anchor="end" dominant-baseline="middle" font-size="10">IN / OUT</text>`;
                    }
                    return s;
                },
                buildBars(chartStart, xScale, displayLaneIndex) {
                    let s = '';
                    const items = this._sortedItems;
                    for (let i = 0; i < items.length; i++) {
                        const item = items[i];
                        const dl = (displayLaneIndex[item.lane] !== undefined) ? displayLaneIndex[item.lane] : item.lane;
                        const laneTop = G.TOP + dl * G.LANE_H;
                        const y = item.eventType === 'InTag' ? laneTop + 7 : laneTop + 29;
                        const x = G.LEFT + ((new Date(item.goingStartTime).getTime() - chartStart) * xScale);
                        const durMs = item.durationMs;
                        const width = Math.max(2, Math.max(durMs, 1) * xScale);
                        const cls = item.eventType === 'InTag' ? 'gantt-bar-in' : 'gantt-bar-out';
                        s += `<g style="cursor:pointer" data-bar-idx="${i}"><rect class="${cls}" x="${x.toFixed(2)}" y="${y}" width="${width.toFixed(2)}" height="${G.BAR_H}" rx="4"/>`;
                        if (width > 30) {
                            s += `<text class="gantt-bar-label" x="${(x+width/2).toFixed(2)}" y="${y+G.BAR_H/2}" text-anchor="middle" dominant-baseline="middle" font-size="10" style="pointer-events:none">${item.eventType === 'InTag' ? 'In' : 'Out'}</text>`;
                        }
                        s += `</g>`;
                    }
                    return s;
                },
                buildIdleRegions(chartStart, xScale) {
                    const d = this.data; let s = '';
                    const totalH = d.totalLanes * G.LANE_H;
                    for (const r of d.idleRegions) {
                        const rs = new Date(r.start).getTime(), re = new Date(r.end).getTime();
                        let x = G.LEFT + Math.max(0, (rs - chartStart) * xScale);
                        let w = (re - rs) * xScale;
                        if (x + w < G.LEFT || x > G.LEFT + G.PLOT_W) continue;
                        if (x < G.LEFT) { w -= (G.LEFT - x); x = G.LEFT; }
                        if (x + w > G.LEFT + G.PLOT_W) w = G.LEFT + G.PLOT_W - x;
                        s += `<rect class="gantt-idle-region" x="${x.toFixed(2)}" y="${G.TOP}" width="${w.toFixed(2)}" height="${totalH}"/>`;
                        if (w > 30) s += `<text class="gantt-idle-label" x="${(x+w/2).toFixed(2)}" y="${G.TOP+16}" text-anchor="middle" dominant-baseline="middle">비가동</text>`;
                    }
                    return s;
                },

                // ── dynamic overlay (선택/CT/GAP) — RenderDynamicOverlay 이식 ──
                renderOverlay() {
                    const ov = this.$refs && this.$refs.overlaySvg;
                    if (!ov || !this._geo || !this.data || !this.data.items.length) return;
                    const { chartStart, xScale, displayLaneIndex } = this._geo;
                    const d = this.data;
                    let s = '';

                    // GAP 배경
                    const gap = this.activeGap();
                    if (this.showGapOverlay && gap) {
                        const gs = new Date(gap.start).getTime(), ge = new Date(gap.end).getTime();
                        const gx = G.LEFT + (gs - chartStart) * xScale;
                        const gw = (ge - gs) * xScale;
                        const gy = G.TOP + gap.lane * G.LANE_H;
                        s += `<rect class="gantt-gap-overlay" x="${gx.toFixed(2)}" y="${gy}" width="${gw.toFixed(2)}" height="${G.LANE_H}" stroke-dasharray="5,5"/>`;
                    }

                    // CT 배경 + 세로선
                    if (this.showCycleTimeOverlay && this.selectedItem && this.comparisonItem) {
                        let a = this.selectedItem, b = this.comparisonItem;
                        if (new Date(a.goingStartTime) > new Date(b.goingStartTime)) { [a, b] = [b, a]; }
                        const ax = new Date(a.goingStartTime).getTime(), bx = new Date(b.goingStartTime).getTime();
                        const ctX = G.LEFT + (ax - chartStart) * xScale;
                        const ctW = Math.max(2, (bx - ax) * xScale);
                        const totalH = d.totalLanes * G.LANE_H;
                        s += `<rect class="gantt-cycletime-overlay" x="${ctX.toFixed(2)}" y="${G.TOP}" width="${ctW.toFixed(2)}" height="${totalH}" stroke-dasharray="6,3"/>`;
                        s += `<line class="gantt-cycletime-start" x1="${ctX.toFixed(2)}" y1="${G.TOP}" x2="${ctX.toFixed(2)}" y2="${G.TOP+totalH}"/>`;
                        const ctEndX = ctX + ctW;
                        s += `<line class="gantt-cycletime-end" x1="${ctEndX.toFixed(2)}" y1="${G.TOP}" x2="${ctEndX.toFixed(2)}" y2="${G.TOP+totalH}"/>`;
                    }

                    // 하이라이트 rect (선택/비교/이전/다음) — 색은 swiss.css gantt 토큰으로 통일
                    const hl = (item, color, sw) => {
                        if (!item) return '';
                        const dl = (displayLaneIndex[item.lane] !== undefined) ? displayLaneIndex[item.lane] : item.lane;
                        const laneTop = G.TOP + dl * G.LANE_H;
                        const hy = item.eventType === 'InTag' ? laneTop + 7 : laneTop + 29;
                        const hx = G.LEFT + (new Date(item.goingStartTime).getTime() - chartStart) * xScale;
                        const hw = Math.max(2, Math.max(item.durationMs, 1) * xScale);
                        return `<rect x="${hx.toFixed(2)}" y="${hy}" width="${hw.toFixed(2)}" height="${G.BAR_H}" rx="4" fill="none" stroke="${color}" stroke-width="${sw}" pointer-events="none"/>`;
                    };
                    s += hl(this.selectedItem, '#B5740E', 3);
                    s += hl(this.comparisonItem, '#6B675A', 3);
                    s += hl(this.previousItem, '#B5740E', 2);
                    s += hl(this.nextItem, '#2E8B7A', 2);

                    // GAP 텍스트 라벨
                    if (this.showGapOverlay && gap) {
                        const gs = new Date(gap.start).getTime(), ge = new Date(gap.end).getTime();
                        const gx = G.LEFT + (gs - chartStart) * xScale;
                        const gw = (ge - gs) * xScale;
                        const gy = G.TOP + gap.lane * G.LANE_H;
                        const label = `${gap.laneName} GAP: ${(gap.duration/1000).toFixed(2)}s`;
                        const fs = 13, tw = label.length * (fs * 0.62), padX = 6, padY = 4;
                        const bgW = tw + padX*2, bgH = fs + padY*2;
                        const cx = gx + gw/2, cy = gy + G.LANE_H/2;
                        s += `<rect class="gantt-gap-label-bg" x="${(cx-bgW/2).toFixed(2)}" y="${(cy-bgH/2).toFixed(2)}" width="${bgW.toFixed(2)}" height="${bgH.toFixed(2)}" rx="4"/>`;
                        s += `<text class="gantt-gap-text" x="${cx.toFixed(2)}" y="${cy.toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="bold">${esc(label)}</text>`;
                    }

                    // CT 텍스트 라벨
                    if (this.showCycleTimeOverlay && this.selectedItem && this.comparisonItem) {
                        let a = this.selectedItem, b = this.comparisonItem;
                        if (new Date(a.goingStartTime) > new Date(b.goingStartTime)) { [a, b] = [b, a]; }
                        const ax = new Date(a.goingStartTime).getTime(), bx = new Date(b.goingStartTime).getTime();
                        const ctX = G.LEFT + (ax - chartStart) * xScale;
                        const ctW = Math.max(2, (bx - ax) * xScale);
                        const ctDur = bx - ax;
                        const label = `Δ ${(ctDur/1000).toFixed(2)}s`;
                        const fs = 13, tw = label.length * (fs * 0.65), padX = 6, padY = 4;
                        const bgW = tw + padX*2, bgH = fs + padY*2;
                        const cx = ctX + ctW/2, cy = G.TOP - 20;
                        s += `<rect class="gantt-ct-label-bg" x="${(cx-bgW/2).toFixed(2)}" y="${(cy-bgH/2).toFixed(2)}" width="${bgW.toFixed(2)}" height="${bgH.toFixed(2)}" rx="4"/>`;
                        s += `<text class="gantt-cycletime-text" x="${cx.toFixed(2)}" y="${cy.toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="bold">${esc(label)}</text>`;
                    }

                    ov.innerHTML = s;
                },

                activeGap() {
                    const gaps = this.data.topGaps;
                    if (!gaps.length) return null;
                    const i = (this.selectedGapIndex >= 0 && this.selectedGapIndex < gaps.length) ? this.selectedGapIndex : 0;
                    return gaps[i];
                },

                // ── lane order / item sort — GetDisplayLaneOrder / GetSortedItemsForDisplay 이식 ──
                computeDisplayLaneOrder() {
                    const d = this.data;
                    const byLane = {};
                    for (const it of d.items) { (byLane[it.lane] = byLane[it.lane] || []).push(it); }
                    const stats = Object.keys(byLane).map(k => {
                        const lane = +k;
                        const ordered = byLane[k].slice().sort((a,b) => new Date(a.goingStartTime) - new Date(b.goingStartTime));
                        const label = (lane >= 0 && lane < d.laneLabels.length) ? d.laneLabels[lane] : ('Lane ' + lane);
                        const firstStart = ordered.length ? new Date(ordered[0].goingStartTime).getTime() : Infinity;
                        let maxGap = 0;
                        for (let i = 0; i < ordered.length - 1; i++) {
                            const ce = new Date(ordered[i].finishTime || ordered[i].goingStartTime).getTime();
                            const ns = new Date(ordered[i+1].goingStartTime).getTime();
                            maxGap = Math.max(maxGap, ns - ce);
                        }
                        return { lane, label, firstStart, maxGap };
                    });
                    let sorted;
                    switch (this.chartSort) {
                        case 'ByTime': sorted = stats.sort((a,b) => a.firstStart - b.firstStart || a.lane - b.lane); break;
                        case 'ByCallName': sorted = stats.sort((a,b) => a.label.toLowerCase().localeCompare(b.label.toLowerCase()) || a.lane - b.lane); break;
                        case 'ByGapSize': sorted = stats.sort((a,b) => b.maxGap - a.maxGap || a.firstStart - b.firstStart || a.lane - b.lane); break;
                        default: sorted = stats.sort((a,b) => a.lane - b.lane); break;
                    }
                    return sorted.map(s => s.lane);
                },
                computeSortedItems(laneOrder, displayLaneIndex) {
                    const items = this.data.items.slice();
                    const ts = (i) => new Date(i.goingStartTime).getTime();
                    switch (this.chartSort) {
                        case 'ByTime': return items.sort((a,b) => ts(a) - ts(b));
                        case 'ByLane': return items.sort((a,b) => a.lane - b.lane || ts(a) - ts(b));
                        case 'ByCallName':
                        case 'ByGapSize':
                            return items.sort((a,b) => (displayLaneIndex[a.lane] ?? a.lane) - (displayLaneIndex[b.lane] ?? b.lane) || ts(a) - ts(b));
                        default: return items.sort((a,b) => a.lane - b.lane || ts(a) - ts(b));
                    }
                },

                // ── JS interop (재사용) ──
                initJs(chartStart, xScale) {
                    const container = this.$refs.ganttContainer;
                    if (!container) return;
                    // 클릭 위임: dotnetRef 대신 로컬 핸들러로 바 클릭 처리.
                    if (window.cycleTimeChart) {
                        window.cycleTimeChart.init(container, { invokeMethodAsync: (_m, idx) => { this.onBarClicked(idx); return Promise.resolve(); } });
                        window.cycleTimeChart.setTooltips(container, this.buildTooltips());
                    }
                    // crosshair: snap edges = 각 item 시작/끝
                    if (window.ganttCrosshair) {
                        const snapEdges = [];
                        for (const item of this._sortedItems) {
                            const st = new Date(item.goingStartTime).getTime();
                            const x = G.LEFT + (st - chartStart) * xScale;
                            snapEdges.push({ x: Math.round(x), timeMs: st });
                            if (item.durationMs > 0) {
                                const endX = Math.round(x + Math.max(2, item.durationMs * xScale));
                                snapEdges.push({ x: endX, timeMs: st + item.durationMs });
                            }
                        }
                        window.ganttCrosshair.init(container, {
                            leftMargin: G.LEFT, topMargin: G.TOP, plotWidth: G.PLOT_W,
                            plotHeight: this.data.totalLanes * G.LANE_H, xScale,
                            chartStartTimeMs: chartStart, snapEdges
                        });
                    }
                },
                disposeJs() {
                    const container = this.$refs && this.$refs.ganttContainer;
                    if (!container) return;
                    if (window.cycleTimeChart) window.cycleTimeChart.dispose(container);
                    if (window.ganttCrosshair) window.ganttCrosshair.dispose(container);
                },
                buildTooltips() {
                    return this._sortedItems.map(item => {
                        const ev = item.eventType === 'InTag' ? 'InTag' : 'OutTag';
                        const end = item.finishTime ? this.hms(item.finishTime) : '진행중';
                        return `Call: ${item.callName}\nWork: ${item.workName}\nTag: ${item.tagName} (${item.tagAddress})\nEvent: ${ev}\nStart: ${this.hms(item.goingStartTime)}\nEnd: ${end}\nDuration: ${(item.durationMs/1000).toFixed(1)} (sec)`;
                    });
                },

                // ── 바 클릭 → 로컬 선택 계산 (OnBarClicked / SelectItem 이식) ──
                onBarClicked(idx) {
                    if (idx < 0 || idx >= this._sortedItems.length) return;
                    const item = this._sortedItems[idx];
                    if (this.selectedItem === item) { this.clearSelection(); return; }
                    this.selectedItem = item;
                    this.comparisonItem = null; this.comparisonGap = null;
                    this.calcItemGaps(item);
                    this.autoMatchCycleTime(item);
                    this.renderOverlay();
                },
                calcItemGaps(item) {
                    this.previousGap = null; this.nextGap = null; this.previousItem = null; this.nextItem = null;
                    const same = this.data.items.filter(i => i.lane === item.lane).sort((a,b) => new Date(a.goingStartTime) - new Date(b.goingStartTime));
                    const idx = same.indexOf(item);
                    if (idx === -1) return;
                    if (idx > 0) {
                        this.previousItem = same[idx-1];
                        const pe = new Date(this.previousItem.finishTime || this.previousItem.goingStartTime).getTime();
                        this.previousGap = new Date(item.goingStartTime).getTime() - pe;
                    }
                    if (idx < same.length - 1) {
                        this.nextItem = same[idx+1];
                        const ce = new Date(item.finishTime || item.goingStartTime).getTime();
                        this.nextGap = new Date(this.nextItem.goingStartTime).getTime() - ce;
                    }
                },
                autoMatchCycleTime(item) {
                    // 동일 (tagAddress, eventType) 의 다음 발생
                    const group = this.data.items
                        .filter(i => i.tagAddress === item.tagAddress && i.eventType === item.eventType)
                        .sort((a,b) => new Date(a.goingStartTime) - new Date(b.goingStartTime));
                    const pivot = new Date(item.goingStartTime).getTime();
                    const next = group.find(i => new Date(i.goingStartTime).getTime() > pivot);
                    if (!next) return;
                    this.comparisonItem = next;
                    this.comparisonGap = new Date(next.goingStartTime).getTime() - pivot;
                },
                clearSelection() { this.clearSelectionState(); this.renderOverlay(); },
                clearSelectionState() {
                    this.selectedItem = null; this.comparisonItem = null; this.previousItem = null; this.nextItem = null;
                    this.comparisonGap = null; this.previousGap = null; this.nextGap = null;
                },

                // ── 병목 배너 클릭 → 최대 GAP 으로 스크롤 + 하이라이트 ──
                focusLargestGap() {
                    if (!this.data.topGaps.length) return;
                    this.showGapOverlay = true; this.selectedGapIndex = 0;
                    this.renderOverlay();
                    this.focusGap(0);
                },
                // ── GAP 드롭다운 선택 → 오버레이 갱신 + 해당 GAP 으로 스크롤 + 하이라이트 ──
                onGapPicked() {
                    this.renderOverlay();
                    if (this.showGapOverlay) this.focusGap(this.selectedGapIndex);
                },
                // selectedGapIndex 의 GAP x 위치가 가로 스크롤 컨테이너 가운데에 오도록 부드럽게 스크롤하고
                // ~1.2s 펄스 하이라이트를 띄운다. (self-contained — CSS 는 page <style>, 로직은 여기.)
                focusGap(index) {
                    const c = this.$refs && this.$refs.ganttContainer;
                    const gaps = this.data && this.data.topGaps;
                    if (!c || !this._geo || !gaps || !gaps.length) return;
                    const i = (index >= 0 && index < gaps.length) ? index : 0;
                    const gap = gaps[i];
                    const { chartStart, xScale } = this._geo;
                    const gs = new Date(gap.start).getTime(), ge = new Date(gap.end).getTime();
                    // SVG 좌표(zoom 미반영) → 화면 좌표는 zoomLevel 배.
                    const z = parseFloat(this.zoomLevel) || 1;
                    const gxMid = (G.LEFT + ((gs + ge) / 2 - chartStart) * xScale) * z;
                    const gyTop = (G.TOP + gap.lane * G.LANE_H) * z;
                    // 가로: GAP 중앙이 컨테이너 가운데로. 세로: GAP lane 이 보이도록.
                    const targetLeft = Math.max(0, gxMid - c.clientWidth / 2);
                    const targetTop = Math.max(0, gyTop - c.clientHeight / 2 + (G.LANE_H * z) / 2);
                    try { c.scrollTo({ left: targetLeft, top: targetTop, behavior: 'smooth' }); }
                    catch (_) { c.scrollLeft = targetLeft; c.scrollTop = targetTop; }
                    this.pulseGap(gap);
                },
                // 오버레이 위에 펄스용 rect(채움+테두리)을 그렸다가 ~1.2s 뒤 제거.
                pulseGap(gap) {
                    const ov = this.$refs && this.$refs.overlaySvg;
                    if (!ov || !this._geo) return;
                    clearTimeout(this._pulseTimer);
                    const old = ov.querySelector('.gantt-gap-pulse-group');
                    if (old) old.remove();
                    const { chartStart, xScale } = this._geo;
                    const gs = new Date(gap.start).getTime(), ge = new Date(gap.end).getTime();
                    const gx = G.LEFT + (gs - chartStart) * xScale;
                    const gw = Math.max(2, (ge - gs) * xScale);
                    const gy = G.TOP + gap.lane * G.LANE_H;
                    const ns = 'http://www.w3.org/2000/svg';
                    const g = document.createElementNS(ns, 'g');
                    g.setAttribute('class', 'gantt-gap-pulse-group gantt-gap-pulse');
                    g.setAttribute('pointer-events', 'none');
                    const mk = (cls) => {
                        const r = document.createElementNS(ns, 'rect');
                        r.setAttribute('class', cls);
                        r.setAttribute('x', gx.toFixed(2)); r.setAttribute('y', gy);
                        r.setAttribute('width', gw.toFixed(2)); r.setAttribute('height', G.LANE_H);
                        r.setAttribute('rx', '4');
                        return r;
                    };
                    g.appendChild(mk('gantt-gap-pulse-fill'));
                    g.appendChild(mk('gantt-gap-pulse-outline'));
                    ov.appendChild(g);
                    this._pulseTimer = setTimeout(() => {
                        const node = ov.querySelector('.gantt-gap-pulse-group');
                        if (node) node.remove();
                    }, 1250);
                },

                // ── CSV (CycleTimeChartExporter.BuildCsvBytes 포맷 동일, 클라이언트 빌드) ──
                exportCsv() {
                    if (!this.data || !this.data.items.length) return;
                    const esc2 = (v) => { v = (v ?? '').toString(); return (v.includes(',') || v.includes('"') || v.includes('\n')) ? '"' + v.replace(/"/g, '""') + '"' : v; };
                    const lines = ['CallName,WorkName,FlowName,TagName,TagAddress,EventType,GoingStartTime,FinishTime,Duration(ms),Lane'];
                    const sorted = this.data.items.slice().sort((a,b) => new Date(a.goingStartTime) - new Date(b.goingStartTime));
                    for (const it of sorted) {
                        const et = it.eventType === 'InTag' ? 'IN' : 'OUT';
                        const finish = it.finishTime ? this.fullTs(it.finishTime) : '';
                        lines.push([esc2(it.callName), esc2(it.workName), esc2(it.flowName), esc2(it.tagName), esc2(it.tagAddress), et, this.fullTs(it.goingStartTime), finish, it.durationMs, it.lane].join(','));
                    }
                    const csv = '﻿' + lines.join('\n');  // UTF-8 BOM
                    const t = new Date(); const p = (x) => String(x).padStart(2, '0');
                    const fn = `CycleAnalysis_${this.data.flowName}_${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}_${p(t.getHours())}${p(t.getMinutes())}${p(t.getSeconds())}.csv`;
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = fn;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                },

                // ── Excel — 서버(CycleTimeChartExporter.BuildExcelBytes)에서 .xlsx 생성 후 blob 다운로드 ──
                async exportExcel() {
                    if (!this.data || !this.data.items.length || this.exporting) return;
                    this.exporting = true; this.error = null;
                    try {
                        const res = await fetch('/api/cycle-analysis/export-excel', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ flowName: this.selectedFlow, start: this.startTime, end: this.endTime })
                        });
                        if (res.status === 503) { this.demoBlocked = true; return; }
                        if (!res.ok) throw new Error('HTTP ' + res.status);

                        // 파일명: Content-Disposition 우선, 없으면 클라이언트 구성.
                        let fn = this.excelFileName();
                        const cd = res.headers.get('Content-Disposition');
                        if (cd) {
                            const star = cd.match(/filename\*=(?:UTF-8'')?([^;]+)/i);
                            const plain = cd.match(/filename="?([^";]+)"?/i);
                            if (star) { try { fn = decodeURIComponent(star[1].trim()); } catch (_) {} }
                            else if (plain) { fn = plain[1].trim(); }
                        }

                        const blob = await res.blob();
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = fn;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                    } catch (e) {
                        this.error = 'Excel 내보내기 실패: ' + e.message;
                    } finally {
                        this.exporting = false;
                    }
                },
                excelFileName() {
                    const t = new Date(); const p = (x) => String(x).padStart(2, '0');
                    return `CycleTime_${this.selectedFlow}_${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}_${p(t.getHours())}${p(t.getMinutes())}${p(t.getSeconds())}.xlsx`;
                },

                // ── 포맷 헬퍼 ──
                eventLabel(et) { return et === 'InTag' ? 'IN' : 'OUT'; },
                fmtGap(ms) { return (ms / 1000).toFixed(1) + ' (sec)'; },   // FormatDurationTooltip 동일
                hms(iso) { const d = new Date(iso); const p = (x) => String(x).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,'0')}`; },
                hmsTick(d) { const p = (x) => String(x).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; },
                fullTs(iso) { const d = new Date(iso); const p = (x) => String(x).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,'0')}`; }
            };
        }

        function esc(v) {
            if (v == null) return '';
            return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
        }
    </script>
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
</body>

</html>
