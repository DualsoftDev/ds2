<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>생산효율 현황 — DSPilot</title>

    <!--
      DSPilot 정적 호스팅 — 생산효율 현황 페이지 (view=teep, 생산효율 TEEP).
      설비효율(OEE A·P·Q)은 물리 분리된 uptime-oee.html(/uptime-oee) 담당 — 구 내부 탭(?section=) 폐지(2026-07-03).
      공용 스타일/스크립트 = /css/uptime-workspace.css · /app/uptime-workspace.js
        (설비효율 uptime-oee.html · 이상·알람 uptime-alarm.html 과 SSOT 1벌 공유 — window.DSP_UPTIME_VIEW 로 도메인 분기).
      서버/모델 = C#(/api/oee/summary·teep·planned-stops), 뷰 = 정적 HTML/CSS/JS(Alpine + SignalR).
      차트 캔버스가 없어 Chart.js 번들은 로드하지 않는다(시간 분해는 순수 CSS 누적 막대).
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/ds.css" rel="stylesheet" />
    <link href="/css/uptime-workspace.css" rel="stylesheet" />
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="uptimeApp()" x-init="init()" x-cloak>

        <!-- fallback 슬림 헤더 (shell.js 가 제거) -->
        <header class="dsp-appbar">
            <span class="dsp-title">생산효율 현황</span>
            <span class="dsp-badge">정적</span>
            <div class="spacer"></div>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">

            <!-- 상단 툴바 (설비효율 페이지와 동일한 .ds-topbar 패턴: 좌측 기간 세그먼트 · 우측 설비칩/전체보기) -->
            <div class="ds-topbar">
                <div class="ds-topbar-actions">
                    <div class="segmented">
                        <button :class="period === 'today' ? 'is-active' : ''" @click="setPeriod('today')">오늘</button>
                        <button :class="period === '7d' ? 'is-active' : ''" @click="setPeriod('7d')">7일</button>
                        <button :class="period === '30d' ? 'is-active' : ''" @click="setPeriod('30d')">30일</button>
                        <button :class="period === '60d' ? 'is-active' : ''" @click="setPeriod('60d')">60일</button>
                        <button :class="period === 'custom' ? 'is-active' : ''" @click="toggleCustomPeriod()" title="날짜 직접 선택">
                            <span class="material-icons">calendar_today</span>기간
                        </button>
                    </div>
                    <template x-if="period === 'custom'">
                        <div class="up-custom-range">
                            <input type="datetime-local" class="up-period-input" x-model="customFrom" />
                            <span style="color:var(--color-text-secondary); font-size:0.85rem;">~</span>
                            <input type="datetime-local" class="up-period-input" x-model="customTo" />
                            <button class="btn btn-sm btn-primary" @click="applyCustomPeriod()" :disabled="!customFrom || !customTo">적용</button>
                        </div>
                    </template>
                </div>

                <!-- 오른쪽: 스코프(설비/시스템) 필터 상태 (설비효율 페이지와 동일 패턴) -->
                <div class="ds-topbar-actions" style="justify-content:flex-end;">
                    <template x-if="curFlow">
                        <span class="chip chip-info">설비: <b x-text="curFlow"></b></span>
                    </template>
                    <template x-if="!curFlow && curSystem">
                        <span class="chip chip-info">시스템: <b x-text="curSystem"></b></span>
                    </template>
                    <template x-if="curFlow || curSystem">
                        <a class="btn btn-sm btn-outlined color-default" href="/uptime-teep">
                            <span class="material-icons" style="font-size:15px;">clear</span> 전체 보기
                        </a>
                    </template>
                </div>
            </div>

            <!-- ═══════════════ 생산효율 (TEEP) — 캘린더 대비 실제 가동 (단순 가동형) ═══════════════ -->
            <div class="up-grid">

                <!-- ════ 생산효율 지표 (TEEP hero + 가동률 보조 + OEE 참조) ════ -->
                <section class="card up-section">
                    <div class="ds-card-h">
                        <h4>생산효율 지표</h4>
                        <span class="ds-card-h-sub" x-text="curFlow ? ('설비: ' + curFlow) : ((curSystem ? ('시스템: ' + curSystem) : '라인 전체') + ' · flow ' + (teep ? teep.flowCount : '—') + '개 합산')"></span>
                    </div>

                    <div class="up-oee-row">
                        <!-- TEEP (hero) -->
                        <div class="up-oee is-hero">
                            <div class="up-oee-label">생산효율 TEEP</div>
                            <div class="up-oee-value up-oee-mono" x-text="teep ? pct(teep.teep) : '—'"></div>
                            <div class="up-oee-note" x-text="teep ? (teep.teep != null ? '가동시간 ÷ 캘린더(전체 · 비생산 포함)' : (teep.teepNote || '산출 불가')) : '불러오는 중…'"></div>
                        </div>
                        <!-- 가동률 (보조) -->
                        <div class="up-oee">
                            <div class="up-oee-label">가동률 <span class="up-oee-chip">보조</span></div>
                            <div class="up-oee-value up-oee-mono" x-text="teep ? pct(teep.utilization) : '—'"></div>
                            <div class="up-oee-note">(캘린더 − 비생산) ÷ 캘린더</div>
                        </div>
                        <!-- 설비효율 OEE (참조 — 설비효율 현황 페이지) — 현재 기간·설비 선택을 그대로 실어 이동 -->
                        <div class="up-oee">
                            <div class="up-oee-label">설비효율 OEE <span class="up-oee-chip">참조</span></div>
                            <div class="up-oee-value up-oee-mono" x-text="oee ? pct(oee.oee) : '—'"></div>
                            <div class="up-oee-note"><a @click.prevent="location.href = '/uptime-oee' + location.search" style="cursor:pointer; color:var(--color-primary);">설비효율 현황에서 A·P·Q 보기 →</a></div>
                        </div>
                    </div>
                </section>

                <!-- ════ 생산효율 매트릭스 (P6 L0) — 라인 전체=3D 아이소(설비×시간×가동, 4시점 회전·행 하이라이트),
                     설비 선택=2D 막대(TEEP 높이, 같은 인코딩) ════
                     드릴 체인: 3D 큐브 클릭 → 이 페이지 설비(2D) 뷰 → 2D 막대 클릭 → /uptime-oee (L1 A·P·Q).
                     렌더는 uptime-workspace.js renderTeepMatrix(임퍼러티브 SVG) — 호스트 div 는 Alpine 테어다운을 피해
                     x-if 없이 상시 존재(x-show 로만 감춤). 데이터 = /api/oee/teep/matrix. -->
                <section class="card up-section">
                    <div class="ds-card-h">
                        <h4 x-text="curFlow ? ('생산효율 추이 — ' + curFlow) : '생산효율 매트릭스'"></h4>
                        <span class="ds-card-h-sub" x-text="teepMatrixSub()"></span>
                    </div>

                    <div x-show="teepMatrixMode()">
                        <!-- 3D 뷰 컨트롤 — 시점 스텝 회전(±90°, 가림 회피) -->
                        <div class="up-tm-controls" x-show="teepMatrixMode() === 'iso'">
                            <button class="btn-icon" @click="teepIsoRotate(-1)" title="시점 왼쪽으로 90° 회전"><span class="material-icons">rotate_left</span></button>
                            <button class="btn-icon" @click="teepIsoRotate(1)" title="시점 오른쪽으로 90° 회전"><span class="material-icons">rotate_right</span></button>
                            <span class="up-tm-controls-hint" x-text="'시점 ' + (teepIsoRot + 1) + '/4 — 앞 막대에 가리면 회전, 설비에 올리면 그 행만 강조'"></span>
                        </div>
                        <div class="up-tm-scroll">
                            <div id="teep-matrix-host" class="up-tm-host"></div>
                        </div>
                        <!-- 범례 — 색은 가동(초록)/정지(빨강) 2색만(OEE 등급별 색 스케일은 2026-07-08 단순화로 제거).
                             데이터색은 JS 팔레트(TM_RUN_FACES/TM_DOWN_FACES)와 동일 고정값(3D 는 우측면 톤 기준). -->
                        <div class="up-teep-legend" x-show="teepMatrixMode()">
                            <div class="up-teep-leg" style="font-weight:700;"><span x-text="teepMatrixMode() === 'iso' ? '높이' : '막대 높이'"></span>=가동량(TEEP)</div>
                            <div class="up-teep-leg"><span class="sw" style="background:#4CAF50;"></span>가동</div>
                            <div class="up-teep-leg"><span class="sw" style="background:#C62828;"></span>정지</div>
                            <div class="up-teep-leg" x-show="teepShowPlanned()"><span class="sw sw-plan"></span>계획 기준선</div>
                        </div>
                        <div class="up-form-hint" style="margin-top:6px;" x-show="teepMatrixInsight()" x-text="teepMatrixInsight()"></div>
                    </div>

                    <template x-if="!teepMatrixMode()">
                        <div class="ds-empty">
                            <span class="material-icons">hourglass_empty</span>
                            <div class="ds-empty-title" x-text="teepMatrixError ? '불러오기 실패' : (teepMatrix ? '표시할 매트릭스 데이터가 없습니다' : '불러오는 중…')"></div>
                            <div class="ds-empty-desc" x-text="teepMatrixError || '표준 CT(14일 평균)를 가진 설비의 가동 데이터가 쌓이면 자동 표시됩니다.'"></div>
                        </div>
                    </template>
                </section>

                <!-- ════ 시간 분해 (캘린더 = 가동 + 정지 + 비생산 + 미계측 + 잔여) ════
                     잔여(residualMs)는 표시하지 않는다 — 달력에서 설명되지 않은 시간은 지표가 아니라 수집 상태의
                     문제이므로 '데이터 무결성' 카드가 전담한다(2026-08-21). DTO 필드는 그 카드용으로 유지. -->
                <section class="card up-section">
                    <div class="ds-card-h">
                        <h4>시간 분해 (캘린더 기준)</h4>
                        <span class="ds-card-h-sub" x-text="teep && teep.calendarMs > 0 ? ('캘린더 ' + durShort(teep.calendarMs)) : ''"></span>
                    </div>

                    <template x-if="teep && teep.calendarMs > 0">
                        <div>
                            <!-- 누적 막대 — 색 SSOT는 설비효율 페이지와 동일(가동=--oee-run 솔리드 / 정지=고장 빗금 /
                                 비생산=남색 슬레이트 빗금). "가동=솔리드, 비가동·제외=빗금" 규칙 공유. -->
                            <div style="display:flex; height:26px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--color-lines);">
                                <div class="up-bar-seg" :style="`width:${teepPct('runningMs')}%; background:var(--oee-run);`" :title="'가동 ' + teepPct('runningMs') + '%'"><span class="up-bar-lbl" x-show="parseFloat(teepPct('runningMs')) >= 6" x-text="teepPct('runningMs') + '%'"></span></div>
                                <div class="up-bar-seg hatch-fault" :style="`width:${teepPct('downMs')}%;`" :title="'정지 ' + teepPct('downMs') + '%'"><span class="up-bar-lbl" x-show="parseFloat(teepPct('downMs')) >= 6" x-text="teepPct('downMs') + '%'"></span></div>
                                <div class="up-bar-seg hatch-nonprod" :style="`width:${teepPct('nonProdMs')}%;`" :title="'비생산 ' + teepPct('nonProdMs') + '%'"><span class="up-bar-lbl" x-show="parseFloat(teepPct('nonProdMs')) >= 6" x-text="teepPct('nonProdMs') + '%'"></span></div>
                                <!-- 미계측(수신 공백, §3.4) = 비생산과 별도 표기(회색 빗금) — 데이터 있을 때만 노출 -->
                                <template x-if="(teep.unmeasuredMs || 0) > 0">
                                    <div class="up-bar-seg hatch-unmeas" :style="`width:${teepPct('unmeasuredMs')}%;`" :title="'미계측 ' + teepPct('unmeasuredMs') + '%'"><span class="up-bar-lbl up-bar-lbl-dark" x-show="parseFloat(teepPct('unmeasuredMs')) >= 6" x-text="teepPct('unmeasuredMs') + '%'"></span></div>
                                </template>
                            </div>
                            <!-- 범례 + 값 -->
                            <div class="up-teep-legend">
                                <div class="up-teep-leg"><span class="sw" style="background:var(--oee-run);"></span>가동 <b x-text="durShort(teep.runningMs)"></b> <em x-text="'(' + teepPct('runningMs') + '%)'"></em></div>
                                <div class="up-teep-leg"><span class="sw hatch-fault"></span>정지 <b x-text="durShort(teep.downMs)"></b> <em x-text="'(' + teepPct('downMs') + '%)'"></em></div>
                                <div class="up-teep-leg"><span class="sw hatch-nonprod"></span>비생산 <b x-text="durShort(teep.nonProdMs || 0)"></b> <em x-text="'(' + teepPct('nonProdMs') + '%)'"></em></div>
                                <template x-if="(teep.unmeasuredMs || 0) > 0">
                                    <div class="up-teep-leg"><span class="sw hatch-unmeas"></span>미계측 <b x-text="durShort(teep.unmeasuredMs || 0)"></b> <em x-text="'(' + teepPct('unmeasuredMs') + '%)'"></em></div>
                                </template>
                            </div>
                            <div class="up-form-hint" style="margin-top:12px;">
                                <b>TEEP</b> = 가동 ÷ 캘린더 전체(비생산·미계측 포함) — 성능·품질(P·Q)은 <b>설비효율(OEE)</b> 페이지 참조.
                            </div>
                        </div>
                    </template>

                    <template x-if="!teep || teep.calendarMs <= 0">
                        <div class="ds-empty">
                            <span class="material-icons">hourglass_empty</span>
                            <div class="ds-empty-title" x-text="teepError ? '불러오기 실패' : '표시할 생산효율 데이터가 없습니다'"></div>
                            <div class="ds-empty-desc" x-text="teepError || (teep && teep.teepNote) || '표준 CT(14일 평균)를 가진 설비의 가동 데이터가 쌓이면 자동 표시됩니다.'"></div>
                        </div>
                    </template>
                </section>

                <!-- ════ 날짜별 비생산 패턴 — 행=날짜(최근이 위) × 24h 트랙, 기간에 맞춰 행 수 변동(오늘=1행, 7일=7행 …) ════
                     데이터 = /api/oee/planned-stops/actual 의 days(로컬 날짜별 접기 — 각 날을 자정 경계로 독립 접기라
                     union 접기의 ≥24h 전체 채움 퇴화 없음). 색 SSOT = 시간 분해 막대와 동일(비생산=hatch-nonprod /
                     미계측=hatch-unmeas). 비생산은 시스템(전역) 단위 — 설비(flow) 선택과 무관하게 시스템 전체 표시. -->
                <section class="card up-section" x-show="!curFlow" x-cloak>
                    <div class="ds-card-h">
                        <h4>날짜별 비생산 패턴</h4>
                        <span class="ds-card-h-sub" x-text="teepNpSub()"></span>
                    </div>

                    <template x-if="teepNpDays().length > 0">
                        <div>
                            <div class="up-teep-legend" style="margin-top:0; margin-bottom:9px;">
                                <div class="up-teep-leg"><span class="sw hatch-nonprod"></span>비생산 (자동 감지 + 수동 시간대)</div>
                                <div class="up-teep-leg"><span class="sw" style="width:3px; background:var(--color-primary);"></span>지금</div>
                            </div>
                            <div class="up-npd" :class="teepNpDense() ? 'is-dense' : ''">
                                <template x-for="d in teepNpDays()" :key="d.date">
                                    <div class="up-npd-row" :class="teepNpDayInfo(d).isToday ? 'is-today' : ''">
                                        <div class="up-npd-date" :class="{ 'is-sun': teepNpDayInfo(d).dow === 0, 'is-sat': teepNpDayInfo(d).dow === 6 }" x-text="teepNpDayInfo(d).label"></div>
                                        <div class="up-npd-track">
                                            <!-- 미계측(§3.4)은 windows 에 합쳐 옴(표시 정책 2026-07-04) — unmeasuredWindows 는 데이터 보존용 -->
                                            <template x-for="(w, i) in (d.windows || [])" :key="'n' + i">
                                                <div class="up-npd-win hatch-nonprod" :style="psWinStyle(w)" :title="teepNpWinTitle(d, w, '비생산')"></div>
                                            </template>
                                            <template x-if="teepNpDayInfo(d).isToday">
                                                <div class="up-npd-now" :style="`left:${nowMin() / 1440 * 100}%;`"></div>
                                            </template>
                                        </div>
                                        <div class="up-npd-sum" x-text="teepNpDayMs(d) > 0 ? durShort(teepNpDayMs(d)) : '—'"></div>
                                    </div>
                                </template>
                                <!-- 시각 눈금 — sticky bottom(스크롤 중에도 상시 노출 + 트랙과 정확 정렬), 좌 날짜/우 합계 컬럼과 동일 flex 골격 -->
                                <div class="up-npd-row up-npd-axis">
                                    <div class="up-npd-date"></div>
                                    <div class="up-ptl-hours" style="flex:1; margin-top:0;">
                                        <span>00</span><span>03</span><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span>
                                    </div>
                                    <div class="up-npd-sum"></div>
                                </div>
                            </div>
                            <div class="up-form-hint" style="margin-top:10px;">
                                행 = 그 날 가용성에서 제외된 <b>비생산</b> 시간대, 우측 = 일 합계.
                            </div>
                        </div>
                    </template>

                    <template x-if="teepNpDays().length === 0">
                        <div class="ds-empty">
                            <span class="material-icons">event_busy</span>
                            <div class="ds-empty-title" x-text="teepNonProdError ? '불러오기 실패' : '불러오는 중…'"></div>
                            <div class="ds-empty-desc" x-text="teepNonProdError || ''"></div>
                        </div>
                    </template>
                </section>


                <!-- ════ 데이터 무결성 — OEE 페이지와 같은 카드(공용 uptime-workspace.js/css).
                     TEEP 는 달력 축이라 "설명되지 않은 시간"이 남을 수 있고, 그 원인은 지표가 아니라
                     수집 상태다. 두 페이지가 같은 수집률을 보게 해 판단 기준을 하나로 둔다. ════ -->
                <section class="card up-section" id="measure-quality-section">
                    <div class="ds-card-h">
                        <h4>데이터 무결성</h4>
                        <span class="ds-card-h-sub">정상 가동시간을 얼마나 수집했는가 — OEE·TEEP 와 별개 축(지표에 반영되지 않음)</span>
                        <span style="flex:1;"></span>
                        <span class="up-oee-chip" x-show="mq" x-cloak
                              x-text="mq ? ('전체 수집률 ' + mqPct(mqLineCollectRate)) : ''"
                              title="수집한 가동 중 정상으로 인정돼 지표 산출에 쓰인 비율입니다. 나머지는 비가동으로 계상되거나(정지) 완료 신호 미검출로 빠집니다."></span>
                    </div>

                    <template x-if="mq && (mq.totalCycles > 0 || (mq.flows && mq.flows.length > 0))">
                        <div>
                            <!-- 라인 합계 — 큰 수치 3개 -->
                            <div class="up-mq-top">
                                <div class="up-mq-kpi">
                                    <div class="up-mq-lbl">정상 수집률</div>
                                    <div class="up-mq-val up-oee-mono" x-text="mqPct(mqLineCollectRate)"></div>
                                    <div class="up-mq-note" x-text="mq.normalCycles.toLocaleString() + ' / ' + mq.totalCycles.toLocaleString() + ' 가동 — 지표 산출의 근거'"></div>
                                </div>
                                <div class="up-mq-kpi">
                                    <div class="up-mq-lbl">완료신호 미검출</div>
                                    <div class="up-mq-val up-oee-mono" x-text="mqPct(mq.incompleteRate)"></div>
                                    <div class="up-mq-note" x-text="mq.incompleteCycles.toLocaleString() + '건 · IO 엣지 유실 정황'"></div>
                                </div>
                                <div class="up-mq-kpi">
                                    <div class="up-mq-lbl">정지로 계상</div>
                                    <div class="up-mq-val up-oee-mono" x-text="mq.excludedCycles.toLocaleString()"></div>
                                    <div class="up-mq-note">비가동 판정으로 가용성에서 손실로 잡힌 수</div>
                                </div>
                            </div>

                            <!-- 경계(Head/Tail) 이상 — 지표가 조용히 틀리는 가장 흔한 원인. 지정으로 유도한다. -->
                            <div class="up-mq-bnd" x-show="mqIssueRows.length > 0" x-cloak>
                                <span class="material-icons">rule_folder</span>
                                <div>
                                    <b>설비 경계(시작/완료 동작) 확인이 필요합니다</b> — 경계가 실제 동작과 어긋나면
                                    가동이 0건으로 남거나 가동시간이 배로 계상됩니다.
                                    <template x-for="f in mqIssueRows" :key="'bnd-'+f.flowName">
                                        <div class="up-mq-bnd-row">
                                            <a :href="'/flow-cycle?flow=' + encodeURIComponent(f.flowName)" x-text="f.flowName"></a>
                                            <span class="tag" x-text="mqIssueLabel(f)"></span>
                                            <span x-text="mqIssueText(f)"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- 측정 불가 설비 — 제외율이 아무리 낮아도 이게 있으면 라인 지표를 그대로 믿을 수 없다 -->
                            <div class="up-mq-unmeas" x-show="mq.unmeasurableFlowCount > 0" x-cloak>
                                <span class="material-icons">report_off</span>
                                <div>
                                    <b><span x-text="mq.unmeasurableFlowCount"></span>대가 측정되지 않고 있습니다</b> —
                                    표준 가동시간(14일 평균)이 학습되지 않아 가동/정지 판정도, 대기 분류도 되지 않습니다.
                                    해당 설비는 <b>가용성·OEE 모두 산출되지 않습니다</b> — 근사값을 만들지 않습니다.
                                    사이클이 한 건도 없으면 <b>설비 경계(Head/Tail) 지정</b>을 먼저 확인하세요 —
                                    한 번도 동작하지 않는 Call 이 Head 로 잡히면 사이클이 영구히 기록되지 않습니다.
                                </div>
                            </div>

                            <div class="up-mq-link">
                                OEE 는 <b>수집된 정상 가동시간만</b>으로 산출합니다 — 수집되지 않은 시간은 지표에 어떤 상태로도
                                반영되지 않습니다. 그래서 <b>이 수집률이 곧 지표의 신뢰 범위</b>입니다.
                                <a href="/uptime-oee#availability-section">가용성 정산 보기</a>
                            </div>

                            <button class="btn btn-sm btn-outlined color-default up-mq-toggle" @click="mqOpen = !mqOpen">
                                <span class="material-icons" style="font-size:16px;" x-text="mqOpen ? 'expand_less' : 'expand_more'"></span>
                                <span x-text="mqOpen ? '설비별 상세 접기' : '설비별로 나눠 보기 (' + mqRows.length + '대)'"></span>
                            </button>

                            <!-- 설비별 상세 — 제외율 내림차순(나쁜 설비가 위로) -->
                            <div class="up-mq-rows" x-show="mqOpen" x-cloak>
                                <div class="up-mq-row up-mq-head">
                                    <span>설비</span>
                                    <span class="up-mq-bar-h">정상 수집률</span>
                                    <span class="num">수집률</span>
                                    <span class="num">미검출</span>
                                    <span class="num">가동 수</span>
                                </div>
                                <template x-for="f in mqRows" :key="f.flowName">
                                    <div class="up-mq-row" :class="(curFlow === f.flowName ? 'is-cur ' : '') + (f.measurable === false ? 'is-unmeas' : '')">
                                        <a class="up-mq-name" :href="'/uptime-oee?flow=' + encodeURIComponent(f.flowName)"
                                           :title="f.measurable === false
                                                   ? (f.flowName + ' — 측정 불가: 표준 가동시간 미학습(클린샘플 0). 설비 경계(Head/Tail) 지정을 확인하세요.')
                                                   : (f.flowName + ' — 비가동 경계 ' + durShort(f.thresholdMs))"
                                           x-text="f.flowName"></a>
                                        <span class="up-mq-bnd-chip" x-show="!!f.boundaryIssue" x-cloak
                                              :title="mqIssueText(f)" x-text="mqIssueLabel(f)"></span>
                                        <!-- 축 = 이 기간 최댓값 대비(mqBarW). 원수치는 옆 열/툴팁. -->
                                        <template x-if="f.measurable !== false">
                                            <div class="up-mq-bar"
                                                 :title="'정상 ' + f.normalCycles.toLocaleString() + ' / 가동 ' + f.totalCycles.toLocaleString()
                                                         + ' (' + mqPct(mqCollectRate(f)) + ') · 정지로 계상 ' + f.excludedCycles.toLocaleString()
                                                         + ' · 비가동 경계 ' + durShort(f.thresholdMs)">
                                                <div class="seg ex" :style="`width:${mqBarW(mqCollectRate(f))}`"></div>
                                            </div>
                                        </template>
                                        <template x-if="f.measurable === false">
                                            <span class="up-mq-unmeas-tag">측정 불가 — 표준 가동시간 미학습(클린샘플 0)</span>
                                        </template>
                                        <span class="num up-mq-rate" x-text="f.measurable === false ? '—' : mqPct(mqCollectRate(f))"></span>
                                        <span class="num" x-text="f.measurable === false ? '—' : f.incompleteCycles.toLocaleString()"></span>
                                        <span class="num" x-text="f.measurable === false ? '0' : f.totalCycles.toLocaleString()"></span>
                                    </div>
                                </template>
                            </div>

                            <div class="up-mq-foot">
                                IO 신호로 관측한 논리적 인과와 실제 설비 사이에는 구조적 괴리가 있고, PLC 수집도 100% 가
                                되지 않습니다. 그래서 지표는 <b>수집된 정상 가동시간만</b>을 근거로 삼고, 못 본 시간은 어떤
                                상태도 주장하지 않습니다. 수집률이 낮다고 설비가 나쁜 것이 아니라 <b>지표의 근거가 얇다</b>는
                                뜻이며, <b>절대 수치보다 추세와 설비 편중</b>이 점검 신호입니다.
                            </div>
                        </div>
                    </template>

                    <template x-if="mq && mq.totalCycles === 0 && (!mq.flows || mq.flows.length === 0)">
                        <div class="ds-empty">
                            <span class="material-icons">rule</span>
                            <div class="ds-empty-title">이 기간 집계할 가동 데이터가 없습니다</div>
                            <div class="ds-empty-desc">가동이 기록되면 설비별 사이클 제외·누락률이 표시됩니다.</div>
                        </div>
                    </template>
                    <template x-if="!mq">
                        <div class="ds-empty">
                            <span class="material-icons">hourglass_empty</span>
                            <div class="ds-empty-title">계측 품질을 불러오는 중…</div>
                            <div class="ds-empty-desc">표준 가동시간(14일 평균)이 학습된 설비부터 표시됩니다.</div>
                        </div>
                    </template>
                </section>

            </div>
        </main>

    </div>

    <script src="/lib/signalr.min.js"></script>
    <script>window.DSP_UPTIME_VIEW = "teep";</script>
    <script src="/app/uptime-workspace.js"></script>
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
</body>

</html>
