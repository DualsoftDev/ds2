<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기간별 추이 — DSPilot</title>

    <!--
      DSPilot 정적 호스팅 — Flow Workspace (FlowWorkspace.razor 이전).
      서버/모델 = C#(/api/flow/*, /api/dashboard/flows/*, /api/call-test/*, /api/cycle-analysis/export-excel),
      뷰 = 정적 HTML/CSS/JS(Alpine + Chart.js + vanilla SVG + SignalR). 디자인 시스템: /css/ds.css.
      진입: ?name=<flowName> (이 Flow 1개에 스코프됨 — Flow 선택 드롭다운 없음).
            ?name= 없이 진입하면 전체 추이(allMode) — nav 트리의 모든 Flow 히스토리를 합산해 라인 전체 추이를 본다.
      구성: 헤더 카드 + KPI 6셀 + 기간별 추이(클라 집계)
            + 사이클 분석(구 cycle-time-analysis 전체 기능: 간트/Head·Tail 적용·저장/Excel/정렬/최대Gap/드래그 구간통계)
            + 최근 히스토리(구 대시보드 하단: 테이블↔차트 + 이상치 제외 범위 필터, 서버 공유).
      구 'Flow CT 기준' override 패널은 제거 — 사이클 분석의 'Head/Tail 적용(저장)' 이 동일 엔드포인트
      (/api/flow/{name}/cycle-override) 로 더 풍부하게 대체한다.
      실시간: /hubs/monitoring SignalR 이벤트 → /api/flow/{name} + 히스토리 디바운스 refetch.
              사이클 분석(간트)은 줌/선택 보존을 위해 수동 새로고침(프리셋/새로고침 버튼).
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/ds.css" rel="stylesheet" />

    <link href="/css/flow-workspace.css" rel="stylesheet" />
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="flowApp()" x-init="init()" x-cloak>

        <!-- fallback 슬림 헤더 (shell.js 가 제거) -->
        <header class="dsp-appbar">
            <span class="dsp-title">기간별 추이</span>
            <span class="dsp-badge">정적</span>
            <div class="spacer"></div>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">

            <!-- 상단 툴바 (종합효율 현황 페이지와 동일한 .ds-topbar 패턴: 좌측 기간 세그먼트 · 우측 설비칩/전체보기/내보내기) -->
            <div class="ds-topbar">
                <div class="ds-topbar-actions">
                    <div class="ct-range-field">
                        <div class="segmented">
                            <button :class="period === 'today' ? 'is-active' : ''" @click="setPeriod('today')">오늘</button>
                            <button :class="period === '7d' ? 'is-active' : ''" @click="setPeriod('7d')">7일</button>
                            <button :class="period === '30d' ? 'is-active' : ''" @click="setPeriod('30d')">30일</button>
                            <button :class="period === '60d' ? 'is-active' : ''" @click="setPeriod('60d')">60일</button>
                            <button :class="(period === 'custom' || trendRangeOpen) ? 'is-active' : ''" @click="openTrendRange()"
                                    title="조회할 시작·종료 날짜를 직접 지정">
                                <span class="material-icons">calendar_today</span>기간
                            </button>
                        </div>
                        <div class="ct-range-popup" x-show="trendRangeOpen" x-transition @click.outside="trendRangeOpen = false">
                            <div class="ct-field">
                                <label>시작</label>
                                <input type="datetime-local" step="1" class="form-field" x-model="customStart" @change="onTrendRangeChanged()" />
                            </div>
                            <div class="ct-field">
                                <label>종료</label>
                                <input type="datetime-local" step="1" class="form-field" x-model="customEnd" @change="onTrendRangeChanged()" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 오른쪽: 설비(Flow) 필터 상태 + 전체 보기 + Excel 내보내기 (종합효율 현황 페이지와 동일 패턴) -->
                <div class="ds-topbar-actions" style="justify-content:flex-end;">
                    <template x-if="!allMode && (flow || flowName)">
                        <span class="chip chip-info">설비: <b x-text="flow ? flow.flowName : flowName"></b></span>
                    </template>
                    <template x-if="!allMode && (flow || flowName)">
                        <a class="btn btn-sm btn-outlined color-default" href="/flow-trend">
                            <span class="material-icons" style="font-size:15px;">clear</span> 전체 보기
                        </a>
                    </template>
                </div>
                <template x-teleport="#dsp-header-actions">
                    <button class="btn btn-sm btn-outlined color-default" @click="exportTrendExcel()" :disabled="trendExporting || !(trend.cycleCount > 0)"
                            title="차트와 데이터를 Excel(.xlsx) 로 내보냅니다">
                        <span class="material-icons" style="font-size:15px;">download</span>
                        <span x-text="trendExporting ? 'Excel 생성 중…' : 'Excel 다운로드'"></span>
                    </button>
                </template>
            </div>

            <!-- 로딩/오류 -->
            <div x-show="loading && !flow" class="progress-bar progress-bar-indeterminate" style="margin-bottom:12px;"><div class="progress-bar-fill"></div></div>
            <div class="alert alert-error" x-show="error" style="margin-bottom:12px;"><span class="material-icons">error</span><span x-text="error"></span></div>

            <!-- Flow 없음 (전체 추이 모드에서는 숨김) -->
            <template x-if="!loading && !error && !flow && !allMode">
                <div class="card fw-section">
                    <div class="ds-empty">
                        <span class="material-icons">account_tree</span>
                        <div class="ds-empty-title">선택 가능한 Flow가 없습니다</div>
                        <div class="ds-empty-desc">URL 에 <span style="font-family:var(--font-mono);">?name=&lt;Flow이름&gt;</span> 으로 Flow 를 지정하세요.</div>
                    </div>
                </div>
            </template>

            <template x-if="flow || allMode">
                <div class="fw-grid">
                    <!-- ════ 기간별 추이 ════ -->
                    <section class="card fw-section" x-show="tab === 'trend'">
                        <div class="ds-card-h">
                            <h4>기간별 추이</h4>
                            <span class="ds-card-h-sub" x-text="trendSubtitle"></span>
                        </div>

                        <div x-show="trendLoading" class="ds-empty">
                            <span class="material-icons">hourglass_top</span>
                            <div class="ds-empty-title">히스토리 데이터를 불러오는 중...</div>
                        </div>

                        <template x-if="!trendLoading && trend.cycleCount === 0">
                            <div class="ds-empty">
                                <span class="material-icons">timeline</span>
                                <div class="ds-empty-title">선택 기간에 기록된 가동이 없습니다</div>
                                <div class="ds-empty-desc">기간을 넓히거나, 가동이 기록될 때까지 기다려 주세요.</div>
                            </div>
                        </template>

                        <template x-if="!trendLoading && trend.cycleCount > 0">
                            <div>
                                <!-- 요약 KPI (기간 전체) -->
                                <div class="fw-trend-kpi-row">
                                    <div class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">가동 횟수</span>
                                        <span class="fw-trend-kpi-value" x-text="trend.cycleCount.toLocaleString() + '회'"></span>
                                        <span class="fw-trend-kpi-sub" x-text="'비가동 ' + trend.idleCount.toLocaleString() + '회'"></span>
                                    </div>
                                    <div class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">평균 가동시간</span>
                                        <span class="fw-trend-kpi-value" x-text="fmtDur(trend.avgCT)"></span>
                                        <span class="fw-trend-kpi-sub" x-text="fmtDur(trend.minCT) + ' ~ ' + fmtDur(trend.maxCT)"></span>
                                    </div>
                                    <div class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">평균 동작시간</span>
                                        <span class="fw-trend-kpi-value" style="color:var(--dash-mt,#12A594);" x-text="fmtDur(trend.avgMT)"></span>
                                        <span class="fw-trend-kpi-sub">실제 동작(MT)</span>
                                    </div>
                                    <div class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">평균 대기시간</span>
                                        <span class="fw-trend-kpi-value" x-text="fmtDur(trend.avgWT)"></span>
                                        <span class="fw-trend-kpi-sub">대기(WT)</span>
                                    </div>
                                    <div class="fw-trend-kpi">
                                        <span class="fw-trend-kpi-label">가동률</span>
                                        <span class="fw-trend-kpi-value" x-text="Math.round(trend.utilization * 100) + '%'"></span>
                                        <span class="fw-trend-kpi-sub">동작 ÷ 전체</span>
                                    </div>
                                </div>

                                <div class="ds-card-h fw-chart-h">
                                    <h4 style="font-size:0.78rem;">가동시간 구성 <span class="fw-chart-h-hint">버킷별 평균 · 동작 + 대기</span></h4>
                                </div>
                                <div class="fw-chart-tall"><canvas x-ref="trendChart"></canvas></div>
                                <div class="fw-chart-note" x-show="trendClipped" x-cloak>
                                    <span class="material-icons">info</span>
                                    한 구간의 대기시간이 유난히 길어(가동 정지 등) 세로축을 축약했습니다. ▲ 표시 막대는 실제값이 더 크며, 막대에 마우스를 올리면 정확한 값을 볼 수 있습니다.
                                </div>

                                <div class="ds-card-h fw-chart-h"><h4 style="font-size:0.78rem;">가동횟수</h4></div>
                                <div class="fw-chart-md"><canvas x-ref="countChart"></canvas></div>
                            </div>
                        </template>
                    </section>
                </div>
            </template>
        </main>
    </div>

    <script src="/lib/signalr.min.js"></script>
    <script src="/lib/chart.umd.min.js"></script>
    <script>window.DSP_FLOW_VIEW = "trend";</script>
    <script src="/app/flow-workspace.js"></script>
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
</body>

</html>
