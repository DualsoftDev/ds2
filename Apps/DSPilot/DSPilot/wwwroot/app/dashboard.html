<!DOCTYPE html>
<html lang="ko"><head>

<!--
  DSPilot 메인 대시보드 — stitch "Industrial Insight" 디자인(Tailwind self-host).
  (구 dashboard2.html 을 dashboard.html 로 승격 — 구 dashboard.html 기능을 전부 흡수한 단일 메인)
    · 기능 : KPI 띠 / CCTV 영상벽(대체이미지) / CT 비교 도넛(Chart.js) /
             시프트 설정·카운트다운 / UserTag 이상 배너 / SignalR 실시간 + 5초 폴링.
    · 셸: 공통 shell.js 가 사이드바(navmenu)+상단 헤더를 생성하고 .dsp-page 를 main 안으로 이동.
          (구 stitch 자체 사이드바/헤더 마크업 제거됨)
    · 라이브러리: 자체호스팅(/lib/*). Tailwind·폰트·아이콘도 self-host(/css/stitch.css, /css/fonts.css).
    · 테마: <html> 에 .dark + .dark-theme 동시 토글 → Tailwind dark: 변형과
           이식 컴포넌트(CSS 변수)·Chart.js getComputedStyle 가 모두 다크 적응.
-->
<!-- Tailwind: CDN(런타임 JIT) 대신 self-host 빌드 산출물 사용(오프라인). 토큰/유틸은 tailwind.theme.js + `npm run build:css` 로 생성 -->
<link rel="stylesheet" href="/css/stitch.css"/>
<!-- 폰트: Google Fonts CDN 대신 self-host(오프라인). Inter(라틴) + Material Symbols + Noto Sans KR(한글) = /css/fonts.css -->
<link rel="stylesheet" href="/css/fonts.css"/>
<!-- CCTV 영상벽(읽기 전용) 임베드 스타일 — .cctv-wall-embed 스코프. dashboard2 에 없는 토큰은 자체 정의(라이트+다크). -->
<link rel="stylesheet" href="/css/cctv-wall.css"/>
<script id="tailwind-config" type="text/plain" data-note="비활성(미실행): stitch 토큰은 tailwind.theme.js 로 이관, /css/stitch.css 로 빌드. 아래는 참고용.">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#0058be",
                        "on-primary-fixed-variant": "#3c475a",
                        "tertiary-fixed": "#fadfb8",
                        "background": "#f7f9fb",
                        "on-surface-variant": "#45474c",
                        "inverse-primary": "#bcc7de",
                        "on-secondary-container": "#fefcff",
                        "primary-fixed-dim": "#bcc7de",
                        "on-secondary-fixed": "#001a42",
                        "primary": "#091426",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#1e1200",
                        "outline-variant": "#c5c6cd",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f7f9fb",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-container": "#a38c6a",
                        "tertiary-fixed-dim": "#ddc39d",
                        "surface-container-high": "#e6e8ea",
                        "inverse-on-surface": "#eff1f3",
                        "on-background": "#191c1e",
                        "secondary-container": "#2170e4",
                        "on-primary-container": "#8590a6",
                        "inverse-surface": "#2d3133",
                        "on-primary-fixed": "#111c2d",
                        "surface": "#f7f9fb",
                        "surface-dim": "#d8dadc",
                        "secondary-fixed": "#d8e2ff",
                        "on-tertiary-fixed": "#271902",
                        "secondary-fixed-dim": "#adc6ff",
                        "primary-fixed": "#d8e3fb",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "on-tertiary-fixed-variant": "#564427",
                        "surface-tint": "#545f73",
                        "on-error": "#ffffff",
                        "surface-container": "#eceef0",
                        "outline": "#75777d",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "primary-container": "#1e293b",
                        "surface-container-highest": "#e0e3e5",
                        "on-secondary-fixed-variant": "#004395",

                    },
                    "borderRadius": {

                    },

                    },

                    },

                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

        }
    </script>
<style>
        [x-cloak] { display: none !important; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        body { background-color: #f7f9fb; font-family: 'Inter', 'Noto Sans KR', sans-serif; overflow-x: hidden; }
        html.dark body { background-color: #0b1220; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        /* ──────────────────────────────────────────────────────────────
           이식 컴포넌트 토큰 — ds.css/swiss.css 를 로드하지 않으므로(stitch 디자인 보존)
           dashboard.html 마크업이 쓰는 CSS 변수/베이스 컴포넌트 클래스를 여기 재정의한다.
           Chart.js(renderCtDonut)가 getComputedStyle(documentElement)로
           읽으므로 데이터 토큰은 :root / html.dark-theme 에 둔다. (stitch Industrial Insight 팔레트) */
        :root {
            --color-background: #f7f9fb;
            --color-surface: #ffffff;
            --color-surface-variant: #f1f5f9;
            --color-lines: #e2e8f0;
            --color-lines-strong: #cbd5e1;
            --color-border: #e2e8f0;
            --cyan-bg: #eef2f8;
            --cyan-soft: #e2e8f0;

            --color-text-primary: #0f1b2d;
            --color-text-secondary: #45556c;
            --color-text-disabled: #8694a6;

            --color-primary: #0058be;
            --color-primary-rgb: 0, 88, 190;
            --color-primary-strong: #00468f;
            --color-action-default: #0058be;
            --navy: #091426;
            --navy-2: #1e293b;

            --green: #16a34a;  --color-success: #16a34a;  --color-success-rgb: 22, 163, 74;
            --amber: #d97706;  --color-warning: #d97706;  --color-warning-rgb: 217, 119, 6;
            --red:   #dc2626;  --color-error: #dc2626;    --color-error-rgb: 220, 38, 38;
            /* MTBF/MTTR 카드 전용 러스트(벽돌빛). 가동중 주황(--amber/--dash-mt)과 겹쳐 보여 분리,
               단 알람 빨강(--red)만큼 튀지 않는 중간 톤. */
            --rust: #b5533c;
            /* 병목(최대 CT) 강조 = 온브랜드 딥 애저. 빨강(에러)과 분리해 오인 방지. */
            --ct-bottleneck: #1e3a8a;  --ct-bottleneck-rgb: 30, 58, 138;
            --color-info: #0058be;
            --ct: #16a34a;

            --dash-mt: #fb8c00;   /* 동작(가동)시간 = 주황 (OutTag 시작 계열, 신호색 통일) */
            --dash-wt: #AEB9C6;   /* 대기시간 = 쿨그레이 */

            /* 폰트 / 라운드 / 그림자 */
            --font-family: 'Inter', 'Noto Sans KR', sans-serif;
            --font-mono: 'Inter', 'Noto Sans KR', ui-monospace, 'Cascadia Code', Consolas, monospace;
            --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
            --shadow-card: 0 2px 4px rgba(15, 27, 45, 0.05);
            --shadow-card-hover: 0 6px 18px rgba(0, 88, 190, 0.14);
            --shadow-modal: 0 24px 64px rgba(15, 27, 45, 0.22);
            --shadow-2: 0 24px 64px rgba(15, 27, 45, 0.22);
        }
        /* 다크: stitch 네이비/블루를 어둡게 적응 — <html>.dark-theme 토글 시 적용 */
        .dark-theme {
            --color-background: #0b1220;
            --color-surface: #131d2e;
            --color-surface-variant: #1a2740;
            --color-lines: rgba(148, 178, 214, 0.13);
            --color-lines-strong: rgba(148, 178, 214, 0.26);
            --color-border: rgba(148, 178, 214, 0.13);
            --cyan-bg: #16243a;
            --cyan-soft: #1d3050;
            --color-text-primary: #e7eef8;
            --color-text-secondary: #9fb0c8;
            --color-text-disabled: #64758c;
            --color-primary: #4d9fff;
            --color-primary-rgb: 77, 159, 255;
            --color-primary-strong: #7eb8ff;
            --color-action-default: #4d9fff;
            --navy: #060c16;
            --navy-2: #16273a;
            --green: #2bbf6a;  --color-success: #2bbf6a;  --color-success-rgb: 43, 191, 106;
            --amber: #f59e0b;  --color-warning: #f59e0b;  --color-warning-rgb: 245, 158, 11;
            --red:   #f26d6d;  --color-error: #f26d6d;    --color-error-rgb: 242, 109, 109;
            /* 다크: 러스트도 한 톤 밝게(어두운 배경 가독). 에러 빨강(#f26d6d)보다 주황쪽. */
            --rust: #e07a5c;
            /* 다크: 어두운 배경에서 묻히지 않도록 밝은 애저(같은 계열). */
            --ct-bottleneck: #3b82f6;  --ct-bottleneck-rgb: 59, 130, 246;
            --color-info: #4d9fff;
            --ct: #2bbf6a;
            --dash-mt: #FFA726;   /* 동작(가동)시간 = 밝은 주황 */
            --dash-wt: #64748B;   /* 대기시간 = 슬레이트 그레이 */
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.45);
            --shadow-card-hover: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        /* ── .material-icons → Material Symbols Outlined (CDN 폰트) 재지정 (마크업 변경 없이 글리프) ── */
        .material-icons {
            font-family: 'Material Symbols Outlined';
            font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
            letter-spacing: normal; text-transform: none; display: inline-block;
            white-space: nowrap; word-wrap: normal; direction: ltr; vertical-align: middle;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        /* ── 베이스 컴포넌트 (ds.css/swiss.css 재현, stitch 팔레트) ── */
        /* 통일 버튼(swiss.css 와 동일 스펙) — 채움+그림자+볼드+8px. stitch 팔레트 토큰 사용. */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 700; font-family: var(--font-family); cursor: pointer; background: var(--color-surface-variant); border: 1px solid var(--color-lines-strong); color: var(--color-text-primary); box-shadow: 0 1px 2px rgba(15,30,50,0.10); transition: background 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease, transform 0.1s ease; white-space: nowrap; text-decoration: none; line-height: 1.6; }
        .btn:hover { background: color-mix(in srgb, var(--color-text-primary) 8%, var(--color-surface-variant)); box-shadow: 0 2px 6px rgba(15,30,50,0.15); }
        .btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 1px rgba(15,30,50,0.12); }
        .btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; transform: none; }
        .btn .material-icons { font-size: 18px; }
        .btn-filled, .btn.btn-primary { background: var(--color-primary); color: #fff; border-color: transparent; box-shadow: 0 2px 5px color-mix(in srgb, var(--color-primary) 45%, transparent); }
        .btn-filled:hover, .btn.btn-primary:hover { background: var(--color-primary-strong); border-color: transparent; box-shadow: 0 4px 10px color-mix(in srgb, var(--color-primary) 50%, transparent); }
        .btn-filled.color-warning { background: var(--color-warning); border-color: transparent; box-shadow: 0 2px 5px rgba(0,0,0,.16); } .btn-filled.color-success { background: var(--color-success); border-color: transparent; box-shadow: 0 2px 5px rgba(0,0,0,.16); } .btn-filled.color-error { background: var(--color-error); border-color: transparent; box-shadow: 0 2px 5px rgba(0,0,0,.16); }
        .btn-outlined { background: var(--color-surface); border: 1px solid var(--color-primary); color: var(--color-primary); box-shadow: 0 1px 2px rgba(15,30,50,0.06); }
        .btn-outlined:hover { background: color-mix(in srgb, var(--color-primary) 10%, var(--color-surface)); }
        .btn-outlined.color-warning { background: color-mix(in srgb, var(--color-warning) 12%, var(--color-surface)); border-color: var(--color-warning); color: var(--color-warning); } .btn-outlined.color-success { background: color-mix(in srgb, var(--color-success) 10%, var(--color-surface)); border-color: var(--color-success); color: var(--color-success); } .btn-outlined.color-error { background: color-mix(in srgb, var(--color-error) 10%, var(--color-surface)); border-color: var(--color-error); color: var(--color-error); }
        .btn-sm { padding: 5px 12px; font-size: 0.8125rem; border-radius: 7px; } .btn-sm .material-icons { font-size: 15px; }
        .dark-theme .btn { box-shadow: 0 1px 2px rgba(0,0,0,0.4); } .dark-theme .btn:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        .btn-icon { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border-radius: 50%; background: transparent; border: none; cursor: pointer; color: inherit; transition: background 0.15s ease; } .btn-icon:hover { background: color-mix(in srgb, var(--color-text-primary) 8%, transparent); } .btn-icon .material-icons { font-size: 22px; } .btn-icon.btn-sm { width: 32px; height: 32px; } .btn-icon.btn-sm .material-icons { font-size: 19px; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 6px; }
        .form-helper { font-size: 0.75rem; color: var(--color-text-secondary); margin-top: 4px; }
        .form-field, .form-select { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--color-lines-strong); border-radius: var(--radius-sm); font-size: 0.875rem; font-family: var(--font-family); background: var(--color-surface); color: var(--color-text-primary); box-sizing: border-box; transition: border-color 0.15s ease; }
        .form-field:focus, .form-select:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-primary) 20%, transparent); }
        .form-field::placeholder { color: var(--color-text-disabled); }
        .form-select { cursor: pointer; }

        .alert { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--color-lines); border-left: 3px solid var(--color-text-secondary); border-radius: var(--radius-sm); font-size: 0.82rem; background: var(--color-surface); }
        .alert .material-icons { font-size: 19px; flex-shrink: 0; }
        .alert span:not(.material-icons) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .alert-info { border-left-color: var(--color-info); color: var(--color-info); background: color-mix(in srgb, var(--color-info) 7%, var(--color-surface)); }
        .alert-error { border-left-color: var(--color-error); color: var(--color-error); background: color-mix(in srgb, var(--color-error) 7%, var(--color-surface)); }
        .mb-4 { margin-bottom: 14px; }

        .progress-bar { width: 100%; height: 3px; background: var(--color-lines); overflow: hidden; border-radius: 2px; }
        .progress-bar-fill { height: 100%; background: var(--color-primary); transition: width 0.3s ease; }
        .progress-bar-indeterminate .progress-bar-fill { width: 30%; animation: progress-slide 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes progress-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

        .modal-overlay { position: fixed; inset: 0; z-index: 1200; background: rgba(15, 27, 45, 0.46); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .dark-theme .modal-overlay { background: rgba(0, 0, 0, 0.62); }
        .modal-content { background: var(--color-surface); border: 1px solid var(--color-lines-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); max-height: 86vh; overflow-y: auto; padding: 24px; color: var(--color-text-primary); }

        .ds-table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
        .ds-table th, .ds-table td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--color-lines); }
        .ds-table th { background: var(--cyan-bg); color: var(--color-primary-strong); font-weight: 700; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); }
        .ds-table .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
        .ds-table tbody tr:hover { background: color-mix(in srgb, var(--color-primary) 5%, transparent); }

        .ds-status { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 0.62rem; font-weight: 700; font-family: var(--font-mono); letter-spacing: 0.03em; }
        .ds-status.ok { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
        .ds-status.warn { background: color-mix(in srgb, var(--amber) 18%, transparent); color: #8A5808; }
        .dark-theme .ds-status.warn { color: var(--amber); }
        .ds-status.bad { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
        .ds-status.info { background: color-mix(in srgb, var(--color-primary) 16%, transparent); color: var(--color-primary-strong); }

        .ds-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 36px 24px; color: var(--color-text-disabled); border: 1.5px dashed var(--color-lines-strong); border-radius: var(--radius-md); background: var(--color-surface-variant); }
        .ds-empty .material-icons { font-size: 40px; opacity: 0.7; }
        .ds-empty .ds-empty-title { font-size: 0.92rem; font-weight: 700; color: var(--color-text-secondary); }
        .ds-empty .ds-empty-desc { font-size: 0.74rem; max-width: 520px; line-height: 1.55; }

        .ds-card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .ds-card-h h4 { font-size: 0.95rem; font-weight: 700; color: var(--color-text-primary); letter-spacing: -0.01em; margin: 0; }
        .ds-card-h .ds-card-h-sub { font-size: 0.66rem; color: var(--color-text-disabled); font-family: var(--font-mono); }

        /* ════════════════════════════════════════════════════════════════════════
           ↓↓↓ dashboard.html <style> 이식 (KPI/CCTV 카드/CT도넛/시프트·이상치
                모달/에러배너). stitch 토큰 var() 참조. ↓↓↓
           ════════════════════════════════════════════════════════════════════════ */

        /* ── 콘텐츠 상단 라이브 배지 ── */
        .dash-live { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--color-lines-strong); border-radius: var(--radius-sm); font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-variant-numeric: tabular-nums; }
        .dash-live .dash-live-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .dash-live.is-live { color: var(--color-success); border-color: color-mix(in srgb, var(--color-success) 50%, transparent); }
        .dash-live.is-live .dash-live-dot { animation: dash-pulse 1.6s ease-in-out infinite; }
        .dash-live.is-poll { color: var(--color-text-secondary); }
        .dash-live.is-warn { color: var(--color-warning); border-color: color-mix(in srgb, var(--color-warning) 50%, transparent); }
        .dash-live.is-warn .dash-live-dot { animation: dash-pulse 1.6s ease-in-out infinite; }
        @keyframes dash-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ── 경로이탈 이상감지 알람 배너 (fliptext 참고: bg-yellow-400 px-6 py-4 + 경고 아이콘 + 세로 티커 + 분자/분모 인디케이터 + 상세확인 버튼) ── 데이터는 abnormals[] */
        .flow-alarm { display: flex; align-items: center; padding: 16px 24px; margin-bottom: 14px; flex-shrink: 0; overflow: hidden; border-radius: var(--radius-md); background: #facc15; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.06); }
        .flow-alarm-icon { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-right: 16px; padding-right: 12px; z-index: 10; background: #facc15; }
        .flow-alarm-icon svg { width: 34px; height: 34px; color: #000; flex-shrink: 0; }
        .flow-alarm-track { flex: 1; min-width: 0; position: relative; height: 42px; overflow: hidden; display: flex; align-items: center; }
        /* 세로 티커 전환(fliptext 방식): 한 번에 한 건만 보이고, abnIndex 변경 시 :key 재생성으로 아래→위 슬라이드 인. outer(.flow-alarm-msg)가 클립+세로 플립(translateY). */
        .flow-alarm-msg { display: block; width: 100%; font-size: 1.7rem; font-weight: 700; color: #dc2626; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; will-change: transform; }
        .flow-alarm-msg-anim { animation: flow-alarm-flip 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes flow-alarm-flip { 0% { transform: translateY(108%); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .flow-alarm-msg-anim { animation: none; } }
        /* 가로 루프(한 방향 연속): 같은 문구 2벌(원본 seg + 복제 dup)을 한 줄로 두고 한 세그먼트(텍스트+gap)만큼 왼쪽으로 흘린 뒤 0 으로 되돌린다.
           되돌아온 순간 복제본이 원본 자리에 와 있어 끊김 없이 이어진다(좌우 왕복 아님). 잘릴 때만 JS(abnMeasure)가 is-marquee + --marquee-shift/-gap/-dur 주입.
           flip(translateY, outer)·loop(translateX, inner) 은 서로 다른 요소라 겹쳐 동작. 평소엔 복제본 숨김 + 첫 세그먼트만 ellipsis(모션축소 폴백). */
        .flow-alarm-loop { display: flex; width: max-content; align-items: center; }

        .flow-alarm-msg:not(.is-marquee) .flow-alarm-loop { width: 100%; }
        .flow-alarm-msg:not(.is-marquee) .flow-alarm-seg { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

        /* 분자/분모 인디케이터: 현재건 / 전체건 (fliptext 의 "1 / 3" sync pill) */
        .flow-alarm-idx { flex-shrink: 0; margin-left: 16px; z-index: 10; font-size: 0.95rem; font-weight: 800; color: #000; background: rgba(0,0,0,0.14); border: 1px solid rgba(0,0,0,0.1); border-radius: 9999px; padding: 4px 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .flow-alarm-idx b { font-size: 1.1rem; }

           기준은 바로 위 .flow-alarm-overlay(position:relative) 래퍼. 전체화면 배너(.flow-alarm-fs)는 자체 규칙이 있어 제외. */
        .flow-alarm-overlay { position: relative; }

        @media (min-width: 1024px) {

<body class="bg-background text-on-background">
<!-- 공통 셸(shell.js)이 사이드바(DUAL 로고 navmenu)+상단 헤더를 생성하고 .dsp-page 를 그 안으로 이동시킨다. -->
<div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="dashboardApp()" x-init="init()" x-cloak>

    <!-- 사이드바(navmenu)·상단 헤더는 공통 셸(shell.js)이 생성한다. (구 stitch 자체 사이드바/헤더 제거) -->
    <div class="p-container-margin space-y-gutter">

            <!-- 로딩 / 오류 / 데이터 없음 -->
            <div class="mb-4 progress-bar progress-bar-indeterminate" x-show="loading"><div class="progress-bar-fill"></div></div>
            <div class="alert alert-error mb-4" x-show="error" x-cloak><span class="material-icons">error</span><span x-text="error" :title="error"></span></div>
            <div class="alert alert-info mb-4" x-show="!loading && !error && !hasData" x-cloak><span class="material-icons">info</span><span>PLC 데이터가 수집되면 자동으로 표시됩니다.</span></div>

            <!-- 알람 배너 + KPI 행 래퍼: 배너를 KPI 카드 위에 겹쳐 띄우기 위한 position:relative 기준(.flow-alarm-overlay) -->
            <div class="flow-alarm-overlay">

            <!-- ── 경로이탈 이상감지 알람 배너 (fliptext 참고) ── abnormals[] → 세로 티커(한 건씩 전환) + 분자/분모 인디케이터, SignalR "AbnormalDetected" 라이브 갱신 -->
            <!-- 평소 흐름에서 빠져 KPI 카드 위에 떠서 덮는다(아래 요소를 밀어내지 않음) -->
            <div class="flow-alarm" x-show="abnormals.length" x-cloak x-transition.opacity>
                <div class="flow-alarm-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                </div>
                <div class="flow-alarm-track" @mouseenter="abnPause(true)" @mouseleave="abnPause(false)">
                    <template x-for="m in [abnCurrent]" :key="abnIndex">
                        <span class="flow-alarm-msg flow-alarm-msg-anim" :title="m">
                            <span class="flow-alarm-loop"><span class="flow-alarm-seg" x-text="m"></span><span class="flow-alarm-seg flow-alarm-dup" x-text="m" aria-hidden="true"></span></span>
                        </span>
                    </template>
                </div>
                <span class="flow-alarm-idx" x-show="abnormals.length > 1" x-cloak><b x-text="abnIndex + 1"></b> / <span x-text="abnormalOverflow ? '10+' : abnormals.length"></span></span>
                <button type="button" class="flow-alarm-btn" @click="gotoAbnormal(abnormals[abnIndex])" title="가동시간·이상 페이지에서 상세 확인">상세 확인</button>
            </div>

            <!-- ════════════ Summary Row — 일간 지표 (어제 대비 등락) ════════════ -->
            <!-- 4개 카드: 가동횟수 · OEE 종합 · MTBF · MTTR. 각 카드는 하루 단위로 오늘(00:00~현재)을
                 어제 같은 시각(어제 00:00~24시간 전)과 공정 비교해 등락(▲/▼·%·시간차)을 표시한다.
                 데이터 = /api/oee/summary 를 오늘/어제 2회 호출 → cmp.today / cmp.yesterday (loadCompare).
                 색 규칙: 개선=초록 / 악화=빨강 (MTTR 만 낮을수록 개선이라 방향 반대). 카드 클릭 → 설비효율 현황 페이지. -->
            <div class="dash-kpi-grid">

                <!-- ① 가동횟수 (오늘 vs 어제 같은 시각) — azure -->
                <div class="border p-card-padding rounded-xl shadow-sm relative overflow-hidden group cursor-pointer transition-all"
                     style="background: color-mix(in srgb, var(--color-primary) 8%, var(--color-surface)); border-color: color-mix(in srgb, var(--color-primary) 26%, transparent);"
                     @click="openOutputFlowModal()" title="클릭하여 출력(생산 기준) Flow 지정">
                    <div class="flex items-center gap-2 mb-1 flex-wrap">
                        <span class="font-label-sm text-label-sm opacity-80 uppercase tracking-tighter" style="color:var(--color-primary-strong);">가동횟수</span>
                        <span class="px-1.5 py-px rounded text-[10px] font-bold bg-surface-container-high text-on-surface-variant">일간</span>
                        <!-- 출력 기준 표시: 지정 Flow 없으면 [자동](전체 flow 평균), 있으면 [선택 flow명] -->
                        <span class="px-1.5 py-px rounded text-[10px] font-bold"
                              style="background: color-mix(in srgb, var(--color-primary) 16%, transparent); color:var(--color-primary-strong);"
                              x-text="outFlowSaved.length ? outFlowSaved.join(', ') : '자동'"
                              :title="outFlowSaved.length ? ('출력 기준 Flow: ' + outFlowSaved.join(', ')) : '출력 기준: 자동(전체 Flow 평균)'"></span>
                    </div>
                    <h4 class="font-display-metrics text-display-metrics leading-none mt-2" style="color:var(--color-primary);"
                        x-text="cmp.today ? (cmp.today.totalCount ?? 0).toLocaleString() + '회' : '—'"></h4>
                    <div class="mt-3 flex items-center gap-1.5 flex-wrap" x-html="cmpBadge('count')"></div>
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity" style="color:var(--color-primary);">
                        <span class="material-icons" style="font-size:120px; line-height:1;">autorenew</span>
                    </div>
                </div>

                <!-- ② OEE 종합 — green -->
                <div class="border p-card-padding rounded-xl shadow-sm relative overflow-hidden group cursor-pointer transition-all"
                     style="background: color-mix(in srgb, var(--green) 9%, var(--color-surface)); border-color: color-mix(in srgb, var(--green) 26%, transparent);"
                     @click="window.location='/uptime-oee'" title="설비효율 현황 페이지로 이동">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-label-sm text-label-sm opacity-90 uppercase tracking-tighter" style="color:var(--green);">OEE 종합</span>
                        <span class="px-1.5 py-px rounded text-[10px] font-bold bg-surface-container-high text-on-surface-variant">일간</span>
                    </div>
                    <h4 class="font-display-metrics text-display-metrics leading-none mt-2" style="color:var(--green);"
                        x-text="(cmp.today && cmp.today.oee != null) ? (cmp.today.oee * 100).toFixed(1) + '%' : '—'"></h4>
                    <div class="mt-3 flex items-center gap-1.5 flex-wrap" x-html="cmpBadge('oee')"></div>
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity" style="color:var(--green);">
                        <span class="material-icons" style="font-size:120px; line-height:1;">insights</span>
                    </div>
                </div>

                <!-- ③ MTBF (평균 무고장 시간 — 높을수록 좋음) — rust (가동중 주황과 구분) -->
                <div class="border p-card-padding rounded-xl shadow-sm relative overflow-hidden group cursor-pointer transition-all"
                     style="background: color-mix(in srgb, var(--rust) 9%, var(--color-surface)); border-color: color-mix(in srgb, var(--rust) 26%, transparent);"
                     @click="window.location='/uptime-oee'" title="설비효율 현황 페이지로 이동 · MTBF = 연속 비가동 onset 간격 평균">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-label-sm text-label-sm opacity-90 uppercase tracking-tighter" style="color:var(--rust);">MTBF</span>
                        <span class="px-1.5 py-px rounded text-[10px] font-bold bg-surface-container-high text-on-surface-variant">일간</span>
                    </div>
                    <h4 class="font-display-metrics text-display-metrics leading-none mt-2" style="color:var(--rust);"
                        x-text="cmp.today ? (cmp.today.failureCount === 0 ? '무고장' : durShort(cmp.today.mtbf)) : '—'"></h4>
                    <div class="mt-3 flex items-center gap-1.5 flex-wrap" x-html="cmpBadge('mtbf')"></div>
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity" style="color:var(--rust);">
                        <span class="material-icons" style="font-size:120px; line-height:1;">timer</span>
                    </div>
                </div>

                <!-- ④ MTTR (평균 복구 시간 — 낮을수록 좋음) — rust (가동중 주황과 구분) -->
                <div class="border p-card-padding rounded-xl shadow-sm relative overflow-hidden group cursor-pointer transition-all"
                     style="background: color-mix(in srgb, var(--rust) 9%, var(--color-surface)); border-color: color-mix(in srgb, var(--rust) 26%, transparent);"
                     @click="window.location='/uptime-oee'" title="설비효율 현황 페이지로 이동 · MTTR = 비가동 onset→회복 평균">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-label-sm text-label-sm opacity-90 uppercase tracking-tighter" style="color:var(--rust);">MTTR</span>
                        <span class="px-1.5 py-px rounded text-[10px] font-bold bg-surface-container-high text-on-surface-variant">일간</span>
                    </div>
                    <h4 class="font-display-metrics text-display-metrics leading-none mt-2" style="color:var(--rust);"
                        x-text="cmp.today ? (cmp.today.failureCount === 0 ? '무고장' : durShort(cmp.today.mttr)) : '—'"></h4>
                    <div class="mt-3 flex items-center gap-1.5 flex-wrap" x-html="cmpBadge('mttr')"></div>
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity" style="color:var(--rust);">
                        <span class="material-icons" style="font-size:120px; line-height:1;">build</span>
                    </div>
                </div>
            </div>
            </div><!-- /flow-alarm-overlay -->

            <!-- ════════════ Main Layout Grid ════════════ -->
            <div class="grid grid-cols-12 gap-gutter dash-grid-main">

                <!-- ── 레이아웃 (8/12) ── -->
                <div class="fl-fs layout-card col-span-12 md:col-span-12 lg:col-span-8 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm overflow-hidden flex flex-col" x-ref="layoutCard" style="min-height:360px;">
                    <div class="fl-fs-chrome p-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-low flex-wrap gap-3">
                        <div class="flex items-center gap-3">
                            <span class="font-headline-md text-headline-md text-primary">CCTV</span>
                            <span class="text-on-surface-variant opacity-60 text-label-sm">실시간 영상벽 · 오버레이 상태</span>
                        </div>
                        <div class="flex gap-2 items-center">
                            <!-- 라이브 CCTV ⇄ 대체 이미지 보기 전환 -->
                            <div class="flex bg-surface border border-outline-variant rounded p-0.5" title="라이브 CCTV / 등록한 대체 이미지 전환">
                                <button class="px-2 py-1 text-[10px] font-bold rounded-sm transition-all flex items-center gap-1"
                                        :class="!cctvImageMode ? 'bg-secondary text-white shadow-sm' : 'text-on-surface-variant hover:bg-surface-container-high'"
                                        @click="cctvSetImageMode(false)" title="라이브 CCTV 영상 보기">
                                    <span class="material-icons text-[14px]">videocam</span> CCTV
                                </button>
                                <button class="px-2 py-1 text-[10px] font-bold rounded-sm transition-all flex items-center gap-1"
                                        :class="cctvImageMode ? 'bg-secondary text-white shadow-sm' : 'text-on-surface-variant hover:bg-surface-container-high'"
                                        @click="cctvSetImageMode(true)" title="등록한 대체 이미지 보기">
                                    <span class="material-icons text-[14px]">image</span> 이미지
                                </button>
                            </div>
                            <!-- 센서이상 토글 — ON 이면 서버 메모리 센서에러(단선/오감지)를 오버레이에 빨강 표시하고,
                     우측 '가동시간 비교' 카드가 센서 이상 목록으로 전환된다. 라이브·이미지 모드 공통.
                     센서에러는 DB 미기록(메모리 전용)이라 이 버튼으로만 확인.
                     미해결 건수 배지는 토글 OFF 여도 표시(있는지 모르고 지나치는 것 방지). -->
                            <button class="relative px-2 py-1 text-[10px] font-bold rounded transition-all flex items-center gap-1 border border-outline-variant"
                                    :class="cctvAbnDetect ? 'bg-error text-white shadow-sm' : 'bg-surface text-on-surface-variant hover:bg-surface-container-high'"
                                    @click="cctvToggleAbnDetect()"
                                    title="센서이상 — 센서 단선/오감지를 오버레이와 우측 목록에 표시 (디바이스 재가동 시 자동 해제)">
                                <span class="material-icons text-[14px]">sensors_off</span> 센서이상
                                <!-- 미해결 센서에러 건수 배지 -->
                                <span x-show="cctvSensorCount > 0" x-cloak x-text="cctvSensorCount > 99 ? '99+' : cctvSensorCount"
                                      style="position:absolute; top:-7px; right:-7px; min-width:16px; height:16px; padding:0 4px;
                                             border-radius:8px; background:#d32f2f; color:#fff; font-size:9.5px; font-weight:800;
                                             line-height:16px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.35);"></span>
                            </button>
                            <!-- CCTV 설정 페이지로 이동 -->
                            <button class="p-1.5 hover:bg-surface-container-highest rounded transition-colors text-on-surface-variant flex items-center gap-1 text-[12px] font-bold"
                                    @click="goCctvSettings()" title="CCTV 설정 (카메라·오버레이 편집 페이지로 이동)">
                                <span class="material-icons text-[20px]">settings</span>
                                <span>설정</span>
                            </button>
                            <!-- 전체화면 -->
                            <button class="p-1.5 hover:bg-surface-container-highest rounded transition-colors text-on-surface-variant" @click="toggleFullscreen()" title="전체화면">
                                <span class="material-icons text-[20px]">fullscreen</span>
                            </button>
                        </div>
                    </div>

                    <div class="fl-fs-body flex-1 p-4 flex flex-col" style="min-height:0;">
                        <!-- ══════════ CCTV 영상벽 — /js/cctv-wall.js + /css/cctv-wall.css ══════════ -->
                        <div class="cctv-wall-embed">
                            <!-- 카메라 없음 -->
                            <template x-if="cctvLoaded && cctvWall.length === 0">
                                <div class="cctv-wall-empty">
                                    <span class="material-icons">videocam_off</span>
                                    <div style="font-weight:700; color:var(--color-text-secondary);">등록된 카메라가 없습니다</div>
                                    <div style="font-size:0.78rem;">상단 <b>[설정]</b> 을 눌러 CCTV 페이지에서 RTSP 카메라를 추가하세요.</div>
                                    <button class="btn btn-sm btn-outlined" @click="goCctvSettings()">
                                        <span class="material-icons" style="font-size:16px;">videocam</span> CCTV 설정 열기
                                    </button>
                                </div>
                            </template>

                            <!-- 영상벽 그리드 -->
                            <div class="cctv-wall-area" x-show="cctvWall.length > 0">
                                <div :class="'cctv-grid ' + cctvGridClass()" x-ref="cctvWallGrid">
                                    <template x-for="cam in cctvWallCams()" :key="cam.id">
                                        <div class="cctv-tile" :class="cctvSolo === cam.id ? 'is-solo' : ''">
                                            <div class="cctv-tile-bar" x-show="!cctvFullscreen">
                                                <span class="cctv-tile-name" x-text="cam.name"></span>
                                            </div>
                                            <div class="cctv-tile-stage">
                                                <!-- disablepictureinpicture: 브라우저 기본 PiP 는 영상 픽셀만 가져가 오버레이가 빠지므로 차단(PiP 기능 미지원) -->
                                                <video :id="'cctv-wall-' + cam.id" muted autoplay playsinline disablepictureinpicture
                                                       @loadedmetadata="cctvRecalcRects()" @playing="cctvMarkFrameSeen(cam.id)"></video>

                                                <!-- 대체 이미지: 이미지 보기 모드이거나, 영상 미표시(연결 실패 / 주소 없음 / 대기) 시 등록돼 있으면 이미지로 대체 -->
                                                <template x-if="cam.fallbackImage && (cctvImageMode || cctvTileStatus(cam.id) !== 'live')">
                                                    <img class="cctv-tile-fallback" :src="cam.fallbackImage" alt="" draggable="false" @load="cctvRecalcRects()">
                                                </template>
                                                <!-- 장애로 대체 이미지가 표시 중임을 알리는 우하단 배지 -->
                                                <template x-if="cctvFallbackBadge(cam)">
                                                    <span class="cctv-fallback-badge" :class="cctvTileStatus(cam.id)==='failed' ? 'is-failed' : ''">
                                                        <span class="material-icons">videocam_off</span>
                                                        <span x-text="cctvFallbackBadge(cam)"></span>
                                                    </span>
                                                </template>

                                                <!-- 이미지 보기 모드인데 등록된 대체 이미지가 없는 카메라 안내 -->
                                                <template x-if="cctvImageMode && !cam.fallbackImage">
                                                    <div class="cctv-tile-status is-failed">
                                                        <span class="material-icons">image_not_supported</span>
                                                        <span class="st-title">등록된 이미지 없음</span>
                                                        <span class="st-sub">CCTV 설정에서 대체 이미지를 등록하세요</span>
                                                    </div>
                                                </template>

                                                <!-- 연결 상태 오버레이 (연결 중 / 연결 실패) — 라이브 모드 + 대체 이미지가 없을 때만 -->
                                                <template x-if="!cctvImageMode && !cam.fallbackImage && cctvTileStatus(cam.id) === 'loading'">
                                                    <div class="cctv-tile-status is-loading">
                                                        <span class="cctv-spin"></span>
                                                        <span>연결 중…</span>
                                                    </div>
                                                </template>
                                                <template x-if="!cctvImageMode && !cam.fallbackImage && cctvTileStatus(cam.id) === 'failed'">
                                                    <div class="cctv-tile-status is-failed">
                                                        <span class="material-icons">videocam_off</span>
                                                        <span class="st-title">연결 실패</span>
                                                        <span class="st-sub">재연결을 시도하는 중…</span>
                                                    </div>
                                                </template>

                                                <div class="cctv-tile-btns">
                                                    <!-- 단독(확대) ⇄ 분할 토글 (카메라 2대 이상일 때만) -->
                                                    <button class="cctv-tile-zoom" @click.stop="cctvToggleSolo(cam.id)"
                                                            x-show="cctvWallCams().length > 1"
                                                            :title="cctvSolo === cam.id ? '분할 보기로 돌아가기' : '이 카메라만 크게 보기'">
                                                        <span class="material-icons" x-text="cctvSolo === cam.id ? 'close_fullscreen' : 'open_in_full'"></span>
                                                    </button>
                                                </div>

                                                <!-- 오버레이 레이어 (읽기 전용) -->
                                                <div class="cctv-ovl-layer">
                                                    <template x-for="b in cctvBoxesForCam(cam)" :key="b.id">
                                                        <span style="display:contents;">
                                                            <!-- Flow 영역 박스 -->
                                                            <template x-if="b.kind !== 'Call'">
                                                                <div class="cctv-ovl-box kind-flow"
                                                                     :class="'state-' + b.stateKey + (b.isAbnormal ? ' has-abnormal' : '') + (b.tagBelow ? ' tag-below' : '') + (b.tagInsetLeft ? ' tag-inset-left' : '')"
                                                                     :style="`left:${b.px.left}px; top:${b.px.top}px; width:${b.px.width}px; height:${b.px.height}px; --ovl-color:${b.color};`"
                                                                     @mouseenter="cctvSetHover(b, cam.id, $event)" @mouseleave="cctvClearHover()">
                                                                    <span class="cctv-kind-badge"><span class="material-icons">account_tree</span></span>
                                                                    <span class="cctv-ovl-chip">
                                                                        <span class="ovl-kind-tag">FLOW</span>
                                                                        <span class="ovl-chip-label" x-text="b.label"></span>
                                                                    </span>
                                                                </div>
                                                            </template>
                                                            <!-- Call 아이콘 핀 -->
                                                            <template x-if="b.kind === 'Call'">
                                                                <div class="cctv-ovl-pin"
                                                                     :class="'state-' + b.stateKey + (b.isAbnormal ? ' has-abnormal' : '')"
                                                                     :style="`left:${b.px.cx}px; top:${b.px.cy}px; --ovl-color:${b.color};`"
                                                                     @mouseenter="cctvSetHover(b, cam.id, $event)" @mouseleave="cctvClearHover()">
                                                                    <div class="cctv-pin-head"><span class="material-icons">memory</span></div>
                                                                    <div class="cctv-pin-stem"></div>
                                                                    <div class="cctv-pin-lbl"><span x-text="b.label"></span></div>
                                                                </div>
                                                            </template>
                                                        </span>
                                                    </template>
                                                </div>

                                                <!-- 호버 툴팁 (해당 타일에서만 마운트) -->
                                                <template x-if="cctvHover && cctvHover.camId === cam.id">
                                                    <div class="cctv-ovl-tip" :style="cctvTipStyle(cam)">
                                                        <div class="tip-head">
                                                            <span class="material-icons" x-text="cctvHover?.kind==='Call' ? 'memory' : 'account_tree'"></span>
                                                            <span class="tip-kind" x-text="cctvHover?.kind==='Call' ? 'CALL · 설비' : 'FLOW'"></span>
                                                            <span class="tip-state" x-text="cctvHover?.model?.stateLabel"></span>
                                                        </div>
                                                        <div class="tip-title" x-text="cctvHover?.model?.title"></div>
                                                        <div class="tip-rows">
                                                            <template x-if="cctvHover?.model?.flowName">
                                                                <span class="tk">Flow</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.flowName">
                                                                <span class="tv" x-text="cctvHover?.model?.flowName"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.systemName">
                                                                <span class="tk">시스템</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.systemName">
                                                                <span class="tv" x-text="cctvHover?.model?.systemName"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.callName">
                                                                <span class="tk">Call</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.callName">
                                                                <span class="tv mono" x-text="cctvHover?.model?.callName"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.workName">
                                                                <span class="tk">Work</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.workName">
                                                                <span class="tv" x-text="cctvHover?.model?.workName"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.device">
                                                                <span class="tk">설비</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.device">
                                                                <span class="tv mono" x-text="cctvHover?.model?.device"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.avgMs != null">
                                                                <span class="tk">평균 가동시간</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.avgMs != null">
                                                                <span class="tv" x-text="cctvFmtDuration(cctvHover?.model?.avgMs)"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.currentCt != null">
                                                                <span class="tk">현재 가동시간</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.currentCt != null">
                                                                <span class="tv" x-text="cctvFmtDuration(cctvHover?.model?.currentCt)"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.goingCount != null && cctvHover?.model?.goingCount > 0">
                                                                <span class="tk">진행 횟수</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.goingCount != null && cctvHover?.model?.goingCount > 0">
                                                                <span class="tv" x-text="cctvHover?.model?.goingCount + '회'"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.progressRate != null && cctvHover?.model?.progressRate > 0">
                                                                <span class="tk">진행률</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.progressRate != null && cctvHover?.model?.progressRate > 0">
                                                                <span class="tv" x-text="cctvFmtPct(cctvHover?.model?.progressRate)"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.movingStartName || cctvHover?.model?.movingEndName">
                                                                <span class="tk">이동 구간</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.movingStartName || cctvHover?.model?.movingEndName">
                                                                <span class="tv" x-text="(cctvHover?.model?.movingStartName || '?') + ' → ' + (cctvHover?.model?.movingEndName || '?')"></span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.errorText">
                                                                <span class="tk">이상</span>
                                                            </template>
                                                            <template x-if="cctvHover?.model?.errorText">
                                                                <span class="tv is-error" x-text="cctvHover?.model?.errorText"></span>
                                                            </template>
                                                        </div>
                                                        <!-- 센서이상 ON: 센서에러(단선/오감지) 상세 — 전용 블록(가시성: 빨강 배경 밴드 + 밝은 텍스트).
                                                 Call=그 디바이스 1건, Flow=그 flow 의 에러 전부. -->
                                                        <template x-if="(cctvHover?.model?.sensorErrors || []).length > 0">
                                                            <div class="tip-sensor">
                                                                <template x-for="se in cctvHover.model.sensorErrors" :key="se.device + se.occurredAt">
                                                                    <div class="ts-item">
                                                                        <div class="ts-head">
                                                                            <span class="material-icons">sensors_off</span>
                                                                            <span x-text="se.label + (se.device ? ' · ' + se.device : '')"></span>
                                                                        </div>
                                                                        <template x-if="se.sensorTag">
                                                                            <div class="ts-tag" x-text="'센서 ' + se.sensorTag"></div>
                                                                        </template>
                                                                        <div class="ts-time" x-text="se.occurredAt"></div>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>

                                                <template x-if="cctvOverlayCountFor(cam.name) > 0">
                                                    <div class="cctv-tile-ovl">
                                                        <span class="material-icons">label</span>
                                                        <span x-text="cctvOverlayCountFor(cam.name)"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ── 전체화면 전용 알람 배너 ── .fl-fs:fullscreen 시 상단 풀폭으로 표시 (fliptext 참고: 세로 티커 + 분자/분모) -->
                    <div class="flow-alarm flow-alarm-fs" x-show="abnormals.length" x-cloak x-transition.opacity>
                        <div class="flow-alarm-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                        </div>
                        <div class="flow-alarm-track" @mouseenter="abnPause(true)" @mouseleave="abnPause(false)">
                            <template x-for="m in [abnCurrent]" :key="abnIndex">
                                <span class="flow-alarm-msg flow-alarm-msg-anim" :title="m">
                                    <span class="flow-alarm-loop"><span class="flow-alarm-seg" x-text="m"></span><span class="flow-alarm-seg flow-alarm-dup" x-text="m" aria-hidden="true"></span></span>
                                </span>
                            </template>
                        </div>
                        <span class="flow-alarm-idx" x-show="abnormals.length > 1" x-cloak><b x-text="abnIndex + 1"></b> / <span x-text="abnormalOverflow ? '10+' : abnormals.length"></span></span>
                        <button type="button" class="flow-alarm-btn" @click="gotoAbnormal(abnormals[abnIndex])">상세 확인</button>
                    </div>
                </div>

                <!-- ── 사이클 비교 (4/12) — Chart.js 도넛. 센서이상(cctvAbnDetect) ON 이면 센서 이상 목록으로 전환 ── -->
                <div class="chart-card col-span-12 md:col-span-12 lg:col-span-4 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm overflow-hidden flex flex-col" style="min-height:460px;">

                    <!-- 센서이상 ON: 센서 이상(단선/오감지) 목록 — 서버 메모리, 디바이스당 마지막 발생 1건 -->
                    <template x-if="cctvAbnDetect">
                        <div style="display:flex; flex-direction:column; flex:1; min-height:0;">
                            <div class="p-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
                                <span class="font-headline-md text-headline-md flex items-center gap-2" style="color:#d32f2f;">
                                    <span class="material-icons text-[20px]">sensors_off</span> 센서 이상
                                </span>
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded"
                                      :style="cctvSensorCount > 0 ? 'background:#d32f2f; color:#fff;' : 'background:var(--color-surface); color:var(--color-text-secondary); border:1px solid var(--color-lines);'"
                                      x-text="cctvSensorCount + '건'"></span>
                            </div>
                            <div style="flex:1; min-height:0; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px;">
                                <template x-for="se in cctvSensorList" :key="(se.callId || '') + se.occurredAtLocal">
                                    <div style="border:1px solid var(--color-lines); border-left:4px solid #d32f2f; border-radius:8px; padding:10px 12px; background:var(--color-surface); display:flex; flex-direction:column; gap:4px;">
                                        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                                            <span style="font-weight:800; font-size:0.82rem; color:#d32f2f;" x-text="se.label || se.kindName"></span>
                                            <span style="font-size:0.68rem; color:var(--color-text-secondary); font-variant-numeric:tabular-nums;" x-text="se.occurredAtLocal"></span>
                                        </div>
                                        <div style="font-size:0.74rem; font-weight:700; color:var(--color-text);"
                                             x-text="[se.flowName, se.workName, se.callName].filter(Boolean).join(' / ')"></div>
                                        <template x-if="se.sensorTag">
                                            <div style="font-family:var(--font-mono); font-size:0.7rem; color:var(--color-text-secondary);" x-text="'센서 ' + se.sensorTag"></div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="cctvSensorCount === 0">
                                    <div class="ds-empty" style="padding:48px 0;">
                                        <span class="material-icons">sensors</span>
                                        <span class="ds-empty-title">미해결 센서 이상이 없습니다</span>
                                        <span class="ds-empty-desc">단선/오감지가 감지되면 여기와 CCTV 오버레이에 표시됩니다.</span>
                                    </div>
                                </template>
                            </div>
                            <div style="padding:8px 12px; border-top:1px solid var(--color-lines); font-size:0.66rem; color:var(--color-text-secondary);">
                                디바이스가 다시 가동되면 자동 해제 · 센서이상를 끄면 가동시간 비교로 돌아갑니다
                            </div>
                        </div>
                    </template>

                    <template x-if="!cctvAbnDetect">
                        <div style="display:contents;">
                            <div class="p-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
                                <span class="font-headline-md text-headline-md text-primary">가동시간 비교</span>
                                <div class="flex items-center gap-1.5">
                                    <div class="flex bg-surface border border-outline-variant rounded p-0.5">
                                        <button class="px-2 py-1 text-[10px] font-bold rounded-sm transition-all flex items-center gap-1"
                                                :class="!showAverage ? 'bg-secondary text-white shadow-sm' : 'text-on-surface-variant hover:bg-surface-container-high'"
                                                @click="setDisplayMode(false)" title="최근 가동시간 값 표시">
                                            <span class="material-icons text-[14px]">history</span> 최근
                                        </button>
                                        <button class="px-2 py-1 text-[10px] font-bold rounded-sm transition-all flex items-center gap-1"
                                                :class="showAverage ? 'bg-secondary text-white shadow-sm' : 'text-on-surface-variant hover:bg-surface-container-high'"
                                                @click="showAverage ? openAvgModal() : setDisplayMode(true)"
                                                :title="showAverage ? avgDays + '일 기준 평균 — 클릭하여 기간 변경' : '평균값 표시'">
                                            <span class="material-icons text-[14px]">analytics</span>
                                            <span x-text="showAverage ? '평균 · ' + avgDays + '일' : '평균'"></span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <template x-if="chartData.length > 0">
                                <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
                                    <div style="position:relative; flex:1; min-height:220px; padding:10px 4px 4px;" x-effect="renderCtDonut()" @mouseleave="chartHoverFlowName = null">
                                        <canvas x-ref="ctDonut"></canvas>
                                    </div>
                                    <!-- 도넛 아래 가로 막대: 강조(hover) flow 의 동작(MT)·대기(WT) 시간. 마우스를 떼면 안내문. -->
                                    <div class="ct-focusbar">
                                        <template x-if="focusRow">
                                            <div>
                                                <div class="ct-fb-head">
                                                    <span class="ct-fb-name" x-text="focusRow.flowName"></span>
                                                    <span class="ct-fb-ct">가동시간 <b x-text="fmt(focusRow.ct)"></b></span>
                                                </div>
                                                <div class="ct-fb-track" role="img" :aria-label="focusRow.flowName + ' 동작 ' + fmt(focusRow.mt) + ' 대기 ' + fmt(focusRow.wt)">
                                                    <div class="ct-fb-seg ct-fb-mt" :style="`width:${focusRow.ct>0 ? focusRow.mt*100/focusRow.ct : 0}%`" :title="'동작 ' + fmt(focusRow.mt)"></div>
                                                    <div class="ct-fb-seg ct-fb-wt" :style="`width:${focusRow.ct>0 ? focusRow.wt*100/focusRow.ct : 0}%`" :title="'대기 ' + fmt(focusRow.wt)"></div>
                                                </div>
                                                <div class="ct-fb-legend">
                                                    <span class="ct-fb-li"><span class="ct-fb-dot ct-fb-dot-mt"></span>동작 <b x-text="fmt(focusRow.mt)"></b> <em x-text="'(' + (focusRow.ct>0 ? Math.round(focusRow.mt*100/focusRow.ct) : 0) + '%)'"></em></span>
                                                    <span class="ct-fb-li"><span class="ct-fb-dot ct-fb-dot-wt"></span>대기 <b x-text="fmt(focusRow.wt)"></b> <em x-text="'(' + (focusRow.ct>0 ? Math.round(focusRow.wt*100/focusRow.ct) : 0) + '%)'"></em></span>
                                                </div>
                                            </div>
                                        </template>
                                        <template x-if="!focusRow">
                                            <div class="ct-fb-hint">
                                                <span class="material-icons">touch_app</span>
                                                Flow 에 마우스를 올리면 동작·대기 시간, 클릭하면 가동시간 분석으로 이동합니다
                                            </div>
                                        </template>
                                    </div>
                                    <div class="ct-legend">
                                        <template x-for="(f, i) in chartData" :key="f.flowName">
                                            <button class="ct-legend-item" :class="focusFlowName === f.flowName ? 'is-sel' : ''"
                                                    @mouseenter="hoverFlow(f.flowName)" @mouseleave="hoverFlow(null)"
                                                    @click="gotoFlowCycle(f.flowName)" :title="f.flowName + ' — 클릭: 가동시간 분석'">
                                                <span class="ct-legend-sw" :style="`background:${f.flowName === maxCtName ? 'var(--ct-bottleneck)' : ctPalette(i)}`"></span>
                                                <span class="ct-legend-name" x-text="f.flowName"></span>
                                                <span class="ct-legend-val" style="color:var(--dash-mt)" x-text="fmt(f.mt) + ' (' + (f.ct>0 ? Math.round(f.mt*100/f.ct) : 0) + '%)'"></span>
                                                <span style="font-size:0.6rem; color:var(--color-lines-strong); margin:0 2px;">|</span>
                                                <span class="ct-legend-val" style="color:var(--color-text-secondary)" x-text="fmt(f.wt) + ' (' + (f.ct>0 ? Math.round(f.wt*100/f.ct) : 0) + '%)'"></span>
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <template x-if="chartData.length === 0">
                                <div class="flex-1 flex items-center justify-center p-6">
                                    <div class="ds-empty" style="padding:32px 0;">
                                        <span class="material-icons">donut_large</span>
                                        <span class="ds-empty-title">Time 데이터가 없습니다</span>
                                        <span class="ds-empty-desc">가동이 수집되면 Flow별 가동시간이 도넛으로 표시됩니다.</span>
                                    </div>
                                </div>
                            </template>
                        </div><!-- /display:contents (센서이상 OFF = 가동시간 비교) -->
                    </template>
                </div>
            </div>

            <!-- agent 통신 상태(PROMAKER HUB · PLC 어댑터 · PLC 데이터)는 공통 셸(shell.js)
                 사이드바 하단의 "Agent 상태" 블록으로 이관됨 → 전 페이지 공통 표시. -->
        </div>

        <!-- ── 평균 기간 설정 다이얼로그 ── -->
        <div class="modal-overlay" x-show="avgModalOpen" x-cloak style="z-index:2100;" @click="closeAvgModal()">
            <div class="modal-content" style="max-width:320px;" @click.stop>
                <div class="sm-head">
                    <span class="sm-title">평균 기간 설정</span>
                    <button class="btn-icon" @click="closeAvgModal()" title="닫기"><span class="material-icons">close</span></button>
                </div>
                <div class="sm-body">
                    <div class="form-group">
                        <label class="form-label">기준 일수 (1~90일)</label>
                        <div class="flex items-center gap-2">
                            <input type="number" class="form-field" style="width:90px;"
                                   min="1" max="90" step="1"
                                   x-model.number="avgDaysForm"
                                   @keydown.enter="saveAvgDays()"
                                   @input="avgDaysForm = Math.max(1, Math.min(90, Math.round(avgDaysForm) || 1))" />
                            <span class="text-label-sm text-on-surface-variant">일</span>
                        </div>
                        <div class="form-helper" style="margin-top:6px;">
                            이 기간의 정상 가동(비가동 제외)을 모두 평균냅니다.
                        </div>
                    </div>
                    <div class="flex gap-2 justify-end" style="margin-top:16px;">
                        <button class="btn btn-sm btn-outlined" @click="closeAvgModal()">취소</button>
                        <button class="btn btn-sm" :class="(avgDaysForm !== avgDays) ? 'btn-primary' : ''" @click="saveAvgDays()">
                            <span class="material-icons" style="font-size:15px;">check</span> <span x-text="(avgDaysForm !== avgDays) ? '적용*' : '적용'"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ════════════ 출력(생산 기준) Flow 지정 모달 — 가동횟수 카드 클릭 ════════════ -->
        <!-- 미지정 = 자동(평균): 전체 flow 사이클수 합 ÷ 가동 flow 수. 지정 = 그 flow들의 사이클수 합.
             직렬 파이프라인은 같은 제품이 여러 flow를 지나 단순합이 과다 계상되므로 "완제품=1사이클" flow를 지정한다. -->
        <div class="modal-overlay" x-show="outFlowModalOpen" x-cloak style="z-index:2100;" @click="closeOutputFlowModal()">
            <div class="modal-content" style="max-width:420px;" @click.stop>
                <div class="sm-head">
                    <span class="sm-title">출력(생산 기준) Flow 지정</span>
                    <button class="btn-icon" @click="closeOutputFlowModal()" title="닫기"><span class="material-icons">close</span></button>
                </div>
                <div class="sm-body">
                    <div class="form-helper" style="margin-bottom:12px;">
                        <b>자동</b> = 전체 Flow 평균, <b>지정</b> = 해당 Flow 가동횟수(보통 마지막 공정).
                    </div>

                    <template x-if="outFlowLoading">
                        <div class="text-label-sm text-on-surface-variant" style="padding:12px 0;">불러오는 중…</div>
                    </template>

                    <template x-if="!outFlowLoading">
                        <div>
                            <label class="flex items-center gap-2" style="padding:8px 4px;border-bottom:1px solid var(--color-outline-variant,rgba(0,0,0,.08));cursor:pointer;">
                                <input type="radio" name="outflow-mode" :checked="outFlowSel.length === 0" @change="outFlowSel = []" style="accent-color:var(--color-primary);" />
                                <span style="font-weight:700;">자동 (전체 Flow 평균)</span>
                            </label>
                            <div style="max-height:260px;overflow-y:auto;margin-top:6px;">
                                <template x-for="fn in outFlowList" :key="fn">
                                    <label class="flex items-center gap-2" style="padding:7px 4px;cursor:pointer;">
                                        <input type="radio" name="outflow-mode" :value="fn" :checked="outFlowSel.length === 1 && outFlowSel[0] === fn" @change="selectOutputFlow(fn)" style="accent-color:var(--color-primary);" />
                                        <span x-text="fn" style="font-variant-numeric:tabular-nums;"></span>
                                    </label>
                                </template>
                                <template x-if="outFlowList.length === 0">
                                    <div class="text-label-sm text-on-surface-variant" style="padding:8px 4px;">선택 가능한 Flow가 없습니다.</div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <div class="flex gap-2 justify-end" style="margin-top:16px;">
                        <button class="btn btn-sm btn-outlined" @click="closeOutputFlowModal()">취소</button>
