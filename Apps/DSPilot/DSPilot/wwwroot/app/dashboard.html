<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대시보드 — DSPilot</title>

    <!--
      격리형 호스팅 레퍼런스 #2 (Dashboard).
      서버/모델 = C#(/api/dashboard/*), 뷰 = 정적 HTML/CSS/JS(Alpine + SVG + Chart 없음 + SignalR 실시간).
      Blazor /dashboard 와 동일 디자인 토큰 재사용. FlowLayoutSvg(도넛 게이지) 를 vanilla SVG 로 재구현.
      실시간: /hubs/monitoring SignalR 이벤트를 트리거로 /api/dashboard/snapshot 디바운스 refetch.

      CSS 규칙: 전역(/css/*.css + /css/flow-card.css)은 절대경로 링크로 그대로 적용.
      Dashboard.razor.css(스코프드)의 CT/ds-card/레이아웃 클래스만 아래 <style> 로 인라인.
      (다크 오버라이드 .dark-theme .ds-card/.ct-*/.fl-card 는 전역 dark-theme.css 에 있어 자동 적용)
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/theme.css" rel="stylesheet" />
    <link href="/css/components.css" rel="stylesheet" />
    <link href="/css/dark-theme.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
    <link href="/css/flow-card.css" rel="stylesheet" />

    <style>
        [x-cloak] { display: none !important; }

        /* ── 독립 셸 (heatmap.html 과 동일) ── */
        .dsp-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); color: var(--color-text-primary); font-family: 'Noto Sans KR', sans-serif; }
        .dsp-appbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; background: var(--color-appbar-bg, var(--color-surface)); color: var(--color-appbar-text, var(--color-text-primary)); border-bottom: 1px solid var(--color-lines); box-shadow: var(--shadow-1); position: sticky; top: 0; z-index: 50; flex-shrink: 0; }
        .dsp-appbar .dsp-title { font-size: 18px; font-weight: 800; }
        .dsp-appbar .dsp-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--color-primary); color: #fff; }
        .dsp-appbar .spacer { flex: 1; }
        .dsp-appbar a { color: inherit; text-decoration: none; opacity: 0.8; font-size: 14px; }
        .dsp-appbar a:hover { opacity: 1; text-decoration: underline; }
        .dsp-main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px; }
        .btn.btn-primary { background: var(--color-primary); color: #fff; border: 1px solid var(--color-primary); }
        .btn.btn-primary:hover { filter: brightness(1.05); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(2px); }
        .modal-content { background: var(--color-surface); border-radius: 12px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        @keyframes heatmap-indeterminate { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

        /* ── Dashboard.razor.css (스코프드) 에서 가져온 base 클래스 ── */
        .dashboard-grid { display: flex; gap: 12px; min-height: 0; flex: 1; }
        .dashboard-grid.grid-h { flex-direction: row; }
        .dashboard-grid.grid-v { flex-direction: column; }
        .widget-container { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
        @media (max-width: 1024px) {
            .dashboard-grid.grid-h { flex-direction: column !important; height: auto !important; }
            .dashboard-grid.grid-h > .widget-container { flex: 0 0 auto !important; height: 60vh !important; }
        }
        .ds-card { --u: clamp(10px, 1.3vh, 15px); border-radius: var(--radius-md); overflow: hidden; flex: 1; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--color-lines); background: var(--color-surface); box-shadow: var(--shadow-card); }
        .ds-card-header { padding: calc(var(--u) * 0.4) calc(var(--u) * 1.2); background: var(--color-background); border-bottom: 1px solid var(--color-lines); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 0.9); min-height: calc(var(--u) * 3.2); overflow: visible; flex-wrap: wrap; }
        .ct-section-title { font-size: calc(var(--u) * 1.1); color: var(--color-text-primary); font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
        .ds-card-header .btn-sm { padding: calc(var(--u) * 0.35) calc(var(--u) * 0.9); font-size: calc(var(--u) * 1.05); }
        .ds-card-header .btn-icon { width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); }
        .ds-card-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
        .layout-legend { display: flex; gap: calc(var(--u) * 0.9); flex-wrap: wrap; align-items: center; }
        .layout-legend-item { display: flex; align-items: center; gap: calc(var(--u) * 0.4); font-size: calc(var(--u) * 1.0); color: var(--color-text-secondary); font-weight: 500; }
        .layout-legend-dot { width: calc(var(--u) * 0.9); height: calc(var(--u) * 0.9); border-radius: 3px; flex-shrink: 0; }

        .ct-summary-bar { display: flex; flex-direction: row; gap: 8px; padding: 2px; margin-top: 12px; flex-shrink: 0; background: var(--color-background); border-bottom: 1px solid var(--color-lines); }
        .ct-summary-group { display: flex; gap: 2px; }
        .ct-summary-group.group-time { flex: 2; }
        .ct-summary-group.group-wait { flex: 1; }
        .ct-top-cell { flex: 1; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; background: var(--color-surface); border-radius: 4px; min-width: 0; }
        .ct-top-cell.danger { border-top: 3px solid #ef5350; }
        .ct-top-cell.warning { border-top: 3px solid var(--color-secondary); }
        .ct-top-cell.success { border-top: 3px solid #26a69a; }
        .ct-combined-cell { flex: 1; display: flex; background: var(--color-surface); border-radius: 8px; min-width: 0; overflow: hidden; }
        .ct-combined-half { flex: 1; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
        .ct-combined-half.danger { border-top: 3px solid #ef5350; }
        .ct-combined-half.success { border-top: 3px solid #26a69a; }
        .ct-combined-half + .ct-combined-half { border-left: 1px solid var(--color-lines); }
        .ct-combined-half, .ct-top-cell { cursor: pointer; transition: box-shadow 0.15s; }
        .ct-combined-half:hover, .ct-top-cell:hover { box-shadow: inset 0 0 0 1.5px var(--color-lines); }
        .ct-combined-half.active, .ct-top-cell.active { box-shadow: inset 0 0 0 2px var(--color-primary); background: color-mix(in srgb, var(--color-primary) 6%, var(--color-surface)); }
        .ct-summary-title { font-size: 13px; font-weight: 700; letter-spacing: 0.2px; }
        .ct-top-cell.danger .ct-summary-title, .ct-combined-half.danger .ct-summary-title { color: #ef5350; }
        .ct-top-cell.warning .ct-summary-title { color: var(--color-secondary); }
        .ct-top-cell.success .ct-summary-title, .ct-combined-half.success .ct-summary-title { color: #26a69a; }
        .ct-badge-pill { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 700; color: white; white-space: nowrap; flex-shrink: 0; line-height: 1.6; }
        .ct-chart-section { padding: 10px 12px; overflow-y: auto; flex: 1; min-height: 0; background: var(--color-surface); }
        .ct-summary-sub { font-size: 14px; color: var(--color-text-primary); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .ct-summary-value { font-size: 11px; font-weight: 600; color: var(--color-text-secondary); }
        .ct-chart-row { display: flex; flex-direction: column; padding: 7px 10px; border-radius: 6px; margin-bottom: 3px; border-left: 3px solid transparent; background: var(--color-background); position: relative; z-index: 0; }
        .ct-chart-row.highlighted { background: var(--color-surface); border: 1px solid var(--color-lines); border-left-width: 3px; }
        .ct-chart-row.selected { background: color-mix(in srgb, var(--color-primary) 8%, var(--color-surface)); border: 1.5px solid var(--color-primary); border-left-width: 3px; border-left-color: var(--color-primary); }
        .ct-chart-row:hover { background: color-mix(in srgb, var(--color-primary) 4%, var(--color-background)); z-index: 10; }
        .ct-chart-row.selected:hover { background: color-mix(in srgb, var(--color-primary) 12%, var(--color-surface)); }
        .ct-row-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; min-width: 0; }
        .ct-row-name { font-size: 13px; color: var(--color-text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
        .ct-process-number { font-size: 11px; font-weight: 700; color: var(--color-primary); min-width: 18px; text-align: center; flex-shrink: 0; }
        .ct-row-footer { display: flex; align-items: center; gap: 8px; }
        .ct-bar-track { flex: 1; height: 10px; background: transparent; border-radius: 10px; display: flex; }
        .ct-bar-mt { background: #0569A0; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .ct-bar-wt { background: var(--color-secondary); height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 0 10px 10px 0; }
        .ct-bar-track > :first-child { border-radius: 10px 0 0 10px; overflow: hidden; }
        .ct-bar-track > :last-child { border-radius: 0 10px 10px 0; overflow: hidden; }
        .ct-bar-track > :only-child { border-radius: 10px; overflow: hidden; }
        .ct-bar-pct { font-size: 9px; font-weight: 700; color: white; line-height: 1; white-space: nowrap; }
        .ct-row-time { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); white-space: nowrap; }
        .ct-row-detail-btn { flex-shrink: 0; align-self: center; padding: 2px 8px; font-size: 11px; font-weight: 600; color: var(--color-primary); background: transparent; border: 1px solid var(--color-primary); border-radius: 6px; cursor: pointer; line-height: 1.4; transition: background 0.12s ease, color 0.12s ease; }
        .ct-row-detail-btn:hover { background: var(--color-primary); color: #fff; }
        .ct-sort-select { padding: calc(var(--u) * 0.3) calc(var(--u) * 0.7); font-size: calc(var(--u) * 1.05); font-weight: 600; border: 1px solid var(--color-primary); border-radius: 6px; background: var(--color-surface); color: var(--color-primary); cursor: pointer; outline: none; }

        /* 팝업 모달 */
        .ct-popup-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; animation: ct-fade-in 0.15s ease; }
        @keyframes ct-fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes ct-scale-in { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .ct-popup-modal { background: var(--color-surface); border: 1px solid var(--color-lines); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); width: 380px; max-width: 90vw; overflow: hidden; animation: ct-scale-in 0.15s ease; }
        .ct-popup-header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; background: var(--color-background); border-bottom: 1px solid var(--color-lines); }
        .ct-popup-name { font-size: 16px; font-weight: 700; color: var(--color-text-primary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .ct-tooltip-state { font-size: 10px; font-weight: 700; color: #fff; padding: 1px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
        .ct-popup-close { flex-shrink: 0; color: var(--color-text-secondary); }
        .ct-popup-badges { display: flex; gap: 6px; padding: 10px 16px 0; flex-wrap: wrap; }
        .ct-popup-bar-section { padding: 14px 16px 6px; }
        .ct-popup-bar-track { height: 18px; display: flex; border-radius: 10px; overflow: hidden; }
        .ct-popup-bar-track > :first-child { border-radius: 10px 0 0 10px; }
        .ct-popup-bar-track > :last-child { border-radius: 0 10px 10px 0; }
        .ct-popup-bar-track > :only-child { border-radius: 10px; }
        .ct-popup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 6px 12px 16px; }
        .ct-popup-item { display: flex; flex-direction: column; gap: 2px; padding: 8px; border-radius: 6px; background: var(--color-background); }
        .ct-popup-label { font-size: 11px; color: var(--color-text-secondary); font-weight: 500; }
        .ct-popup-val { font-size: 18px; font-weight: 700; color: var(--color-text-primary); }
        .ct-popup-history { margin-top: 12px; border-top: 1px solid var(--color-lines); padding: 12px; }
        .ct-popup-history-header { display: flex; align-items: center; padding-bottom: 8px; font-size: 13px; color: var(--color-text-primary); }
        .ct-popup-history-list { max-height: 240px; overflow-y: auto; }
        .ct-history-item { padding: 8px; background: var(--color-background); border-radius: 6px; border: 1px solid var(--color-lines); margin-bottom: 8px; }
        .ct-history-item:last-child { margin-bottom: 0; }
        .ct-history-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 11px; }
        .ct-history-cycle { font-weight: 700; color: var(--color-primary); }
        .ct-history-time { color: var(--color-text-secondary); }
        .ct-history-bar { height: 8px; display: flex; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
        .ct-history-bar > :first-child { border-radius: 4px 0 0 4px; }
        .ct-history-bar > :last-child { border-radius: 0 4px 4px 0; }
        .ct-history-bar > :only-child { border-radius: 4px; }
        .ct-history-values { display: flex; gap: 12px; font-size: 11px; font-weight: 600; }
    </style>
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="dashboardApp()" x-init="init()" x-cloak>

        <!-- 데모 만료 -->
        <div class="modal-overlay" x-show="demoBlocked" style="z-index:3000;">
            <div class="modal-content" style="max-width:480px; text-align:center;">
                <h2 style="color:var(--color-warning, #f0883e); margin:0 0 12px;">DEMO 만료</h2>
                <p>데모 사용 시간(3시간)이 종료되었습니다.</p>
                <p>서비스 관리자에게 문의해 주세요.</p>
            </div>
        </div>

        <header class="dsp-appbar">
            <span class="dsp-title">대시보드</span>
            <span class="dsp-badge">정적/격리</span>
            <span class="ct-tooltip-state" :style="`background:${rt.connected ? '#4CAF50' : '#9e9e9e'};`"
                  :title="rt.connected ? 'SignalR 실시간 연결됨' : '폴링(10초) 모드'"
                  x-text="rt.connected ? 'LIVE' : 'POLL'"></span>
            <div class="spacer"></div>
            <a href="/dashboard" title="Blazor 버전과 비교">Blazor 버전</a>
            <a href="/app/heatmap.html">동작편차</a>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환" style="margin-left:8px;">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">
            <!-- 로딩 -->
            <div class="mb-4" x-show="loading" style="height:4px; background:var(--color-surface-variant, #e0e0e0); border-radius:2px; overflow:hidden;">
                <div style="height:100%; width:25%; background:var(--color-primary); animation: heatmap-indeterminate 1.5s infinite ease-in-out;"></div>
            </div>
            <!-- 오류 -->
            <div class="card mb-4" x-show="error" style="padding:16px; border-left:4px solid var(--color-error, #d32f2f);">
                <span class="material-icons" style="font-size:18px; vertical-align:middle; margin-right:8px; color:var(--color-error, #d32f2f);">error_outline</span>
                <span x-text="error"></span>
            </div>
            <!-- 데이터 없음 -->
            <div class="card mb-4" x-show="!loading && !error && !hasData" style="padding:16px; border-left:4px solid var(--color-info, #2196F3);">
                <span class="material-icons" style="font-size:18px; vertical-align:middle; margin-right:8px; color:var(--color-info, #2196F3);">info</span>
                <span>PLC 데이터가 수집되면 자동으로 표시됩니다.</span>
            </div>

            <!-- 위젯 그리드 -->
            <div :class="'dashboard-grid ' + (direction === 'horizontal' ? 'grid-h' : 'grid-v')">
                <template x-for="wid in visibleWidgets" :key="wid">
                    <div class="widget-container" :style="widgetStyle(wid)">

                        <!-- ── 도면 레이아웃 위젯 ── -->
                        <template x-if="wid === 'layout'">
                            <div class="ds-card" x-ref="layoutCard">
                                <div class="ds-card-header">
                                    <span class="ct-section-title">도면 레이아웃</span>
                                    <div style="display:flex; align-items:center; gap:calc(var(--u) * 0.7);">
                                        <div class="layout-legend">
                                            <template x-for="lg in stateLegend" :key="lg.label">
                                                <div class="layout-legend-item">
                                                    <span class="layout-legend-dot" :style="`background:${lg.color};`"></span>
                                                    <span x-text="lg.label"></span>
                                                </div>
                                            </template>
                                        </div>
                                        <a class="btn btn-sm btn-outlined" href="/editor">
                                            <span class="material-icons" style="font-size:calc(var(--u) * 1.3);">edit</span> 편집
                                        </a>
                                        <button class="btn btn-sm btn-outlined" @click="toggleFullscreen()" title="전체화면">
                                            <span class="material-icons" style="font-size:calc(var(--u) * 1.3);">fullscreen</span> 전체화면
                                        </button>
                                    </div>
                                </div>
                                <div class="ds-card-body" style="align-items:center; justify-content:center;">
                                    <template x-if="layout && layout.flowPlacements.length > 0">
                                        <div style="flex:1; min-height:0; width:100%; display:flex; justify-content:center; align-items:center; overflow:hidden; padding:12px;">
                                            <div x-ref="svgArea"
                                                 :style="`position:relative; width:100%; max-height:100%; aspect-ratio:${renderCanvasW}/${renderCanvasH}; overflow:hidden; background:var(--color-background);`"
                                                 @click="selectLayout(null)">
                                                <template x-if="layout.blueprintImagePath">
                                                    <img :src="'/' + layout.blueprintImagePath.replace(/^\/+/, '') + '?v=' + layout.imageVersion"
                                                         style="position:absolute; inset:0; width:100%; height:100%; opacity:0.3; pointer-events:none; object-fit:fill;" />
                                                </template>
                                                <template x-for="c in cards" :key="c.flowName">
                                                    <div :class="'fl-card ' + (c.selected ? 'fl-card-selected' : '')"
                                                         :style="`left:${c.leftPct}%; top:${c.topPct}%; width:${c.widthPct}%; height:${c.heightPct}%; --fc-accent:${c.accent}; --fc-state:${c.stateColor};`"
                                                         @click.stop="selectLayout(c.flowName)">
                                                        <div :class="'fc-cq ' + (c.isEmpty ? 'fc-cq-empty' : '')">
                                                            <div class="fc-root">
                                                                <div class="fc-header">
                                                                    <div class="fc-title" x-text="c.flowName"></div>
                                                                    <template x-if="c.badges.length > 0">
                                                                        <div class="fc-badges">
                                                                            <template x-for="bd in c.badges" :key="bd.label">
                                                                                <span class="fc-badge" :style="`background:${bd.color}; border-color:${bd.color}; color:#fff;`" x-text="bd.label"></span>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                                <div class="fc-body">
                                                                    <div class="fc-chart">
                                                                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                                                            <g transform="rotate(-90 50 50)">
                                                                                <circle class="fc-donut-bg" cx="50" cy="50" r="40" fill="none" stroke-width="10" />
                                                                                <circle class="fc-donut-arc" cx="50" cy="50" r="40" fill="none" stroke-width="10"
                                                                                        x-show="c.mtFrac > 0" :stroke-dasharray="c.sMtDash + ' ' + c.sCirc" stroke-linecap="round" />
                                                                            </g>
                                                                        </svg>
                                                                        <div class="fc-chart-center">
                                                                            <span class="fc-chart-label" x-text="fmtCard(c.total)"></span>
                                                                            <template x-if="c.stateLabel">
                                                                                <span class="fc-chart-state" x-text="c.stateLabel"></span>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                    <div class="fc-info">
                                                                        <div class="fc-status" x-text="c.stateLabel"></div>
                                                                        <div class="fc-time-row"><span class="fc-time-label">가동</span><span class="fc-time-value" x-text="fmtCard(c.mt)"></span></div>
                                                                        <div class="fc-time-row"><span class="fc-time-label">대기</span><span class="fc-time-value" x-text="fmtCard(c.wt)"></span></div>
                                                                    </div>
                                                                </div>
                                                                <div class="fc-progress">
                                                                    <div class="fc-progress-fill" :style="`width:${c.mtPercent}%`"></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="!layout || layout.flowPlacements.length === 0">
                                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--color-text-disabled); padding:40px 0;">
                                            <span class="material-icons" style="font-size:48px;">map</span>
                                            <span class="typo-body2">배치된 Flow 블럭이 없습니다</span>
                                            <a class="btn btn-sm btn-outlined" href="/editor">레이아웃 수정</a>
                                        </div>
                                    </template>
                                </div>
                            </div>

    <script src="/lib/signalr.min.js"></script>
    <script>
        function dashboardApp() {
            const SYSTEM_COLORS = ['#3D2F66', '#5B3F8C', '#6750A4', '#8C76C2', '#B197FC'];
            return {
                flows: [], layout: null, hasData: false, loading: true, error: null, demoBlocked: false, dark: false,
                transposed: false,
                selectedFlowName: null,
                popupFlow: null,
                flowHistory: [],
                showAverage: false,
                sortField: 'ct', sortDesc: true,
                flowProcessOrder: {},
                direction: 'horizontal', ratio: '1:3', widgetOrder: ['ct', 'layout'], hiddenWidgets: [],
                rt: { connected: false },
                stateLegend: [
                    { label: 'Ready', color: '#4CAF50' }, { label: 'Going', color: '#EAB308' },
                    { label: 'Finish', color: '#2196F3' }, { label: 'Error', color: '#F44336' }
                ],
                _conn: null, _dt: null, _ro: null, _sysColorIdx: {},

                async init() {
                    this.dark = localStorage.getItem('dspilot-theme') === 'dark';
                    window.addEventListener('storage', (e) => { if (e.key === 'dspilot-theme') this.dark = e.newValue === 'dark'; });
                    this.loadLayoutPrefs();
                    await this.loadSnapshot();
                    this.connectSignalR();
                    setInterval(() => this.loadSnapshot(), 10000);
                    document.addEventListener('fullscreenchange', () => {});
                },

                loadLayoutPrefs() {
                    try {
                        const json = localStorage.getItem('dsp-dashboard-layout-v5');
                        if (!json) return;
                        const d = JSON.parse(json);
                        if (Array.isArray(d.order)) {
                            const loaded = d.order.filter(s => this.widgetOrder.includes(s));
                            this.widgetOrder.forEach(w => { if (!loaded.includes(w)) loaded.push(w); });
                            this.widgetOrder = loaded;
                        }
                        if (Array.isArray(d.hidden)) this.hiddenWidgets = d.hidden;
                        if (typeof d.direction === 'string') this.direction = d.direction;
                        if (typeof d.ratio === 'string') this.ratio = d.ratio;
                    } catch (e) { /* ignore */ }
                },

                toggleTheme() { this.dark = !this.dark; localStorage.setItem('dspilot-theme', this.dark ? 'dark' : 'light'); },

                async apiGet(url) {
                    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                    if (res.status === 503) { this.demoBlocked = true; throw new Error('demo-blocked'); }
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },

                async loadSnapshot() {
                    try {
                        const data = await this.apiGet('/api/dashboard/snapshot');
                        this.flows = data.flows || [];
                        this.layout = data.layout || null;
                        this.hasData = data.hasData;
                        this.error = null;
                        // 공정 순서 맵
                        this.flowProcessOrder = {};
                        if (this.layout) {
                            const order = this.layout.flowProcessOrder || [];
                            const src = order.length ? order.map(o => o.flowName) : this.layout.flowPlacements.map(p => p.flowName);
                            src.forEach((n, i) => { this.flowProcessOrder[n] = i; });
                        }
                        // 열린 팝업 동기화 / 좀비 가드
                        if (this.popupFlow) {
                            const row = this.chartData.find(r => r.flowName === this.popupFlow.flowName);
                            const stillPlaced = this.layout && this.layout.flowPlacements.some(p => p.flowName === this.popupFlow.flowName);
                            if (row) this.popupFlow = { flowName: row.flowName, mt: row.mt, wt: row.wt, ct: row.ct, wtRatio: row.wtRatio };
                            else if (!stillPlaced) this.closePopup();
                        }
                        this.$nextTick(() => this.setupTranspose());
                    } catch (e) {
                        if (e.message !== 'demo-blocked') this.error = '데이터를 불러오지 못했습니다: ' + e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                // ── SignalR 실시간 (디바운스 refetch) ──
                connectSignalR() {
                    if (!window.signalR) return;
                    const conn = new signalR.HubConnectionBuilder()
                        .withUrl('/hubs/monitoring')
                        .withAutomaticReconnect([0, 0, 1000, 3000, 5000, 10000])
                        .build();
                    const trigger = () => this.debouncedLoad();
                    conn.on('CallStateChangedBatch', trigger);
                    conn.on('CallStateChanged', trigger);
                    conn.on('DatabaseRebuilt', () => { this.loadSnapshot(); });
                    conn.on('FlowHistoryCleared', trigger);
                    conn.onreconnected(() => { this.rt.connected = true; this.loadSnapshot(); });
                    conn.onreconnecting(() => { this.rt.connected = false; });
                    conn.onclose(() => { this.rt.connected = false; });
                    conn.start().then(() => { this.rt.connected = true; }).catch(() => { this.rt.connected = false; });
                    this._conn = conn;
                },
                debouncedLoad() { clearTimeout(this._dt); this._dt = setTimeout(() => this.loadSnapshot(), 200); },

                // ── 도면 레이아웃 (FlowLayoutSvg 재구현) ──
                get renderCanvasW() { if (!this.layout) return 1; return this.transposed ? this.layout.canvasHeight : this.layout.canvasWidth; },
                get renderCanvasH() { if (!this.layout) return 1; return this.transposed ? this.layout.canvasWidth : this.layout.canvasHeight; },
                get cards() { return this.layout ? this.layout.flowPlacements.map(fp => this.cardFor(fp)) : []; },

                cardFor(fp) {
                    const L = this.layout, t = this.transposed, pad = 4;
                    const col = t ? fp.row : fp.col, row = t ? fp.col : fp.row;
                    const colSpan = t ? fp.rowSpan : fp.colSpan, rowSpan = t ? fp.colSpan : fp.rowSpan;
                    const cellW = t ? L.cellHeight : L.cellWidth, cellH = t ? L.cellWidth : L.cellHeight;
                    const offsetX = t ? L.offsetY : L.offsetX, offsetY = t ? L.offsetX : L.offsetY;
                    const canvasW = t ? L.canvasHeight : L.canvasWidth, canvasH = t ? L.canvasWidth : L.canvasHeight;
                    const px = offsetX + col * cellW, py = offsetY + row * cellH;
                    const pw = colSpan * cellW, ph = rowSpan * cellH;
                    const innerW = pw - pad * 2, innerH = ph - pad * 2;
                    const f4 = (x) => x.toFixed(4);
                    const mtwt = this.flowMtWt(fp.flowName);
                    const mt = mtwt ? mtwt.mt : 0, wt = mtwt ? mtwt.wt : 0, total = mt + wt;
                    const isEmpty = !mtwt || total <= 0;
                    let accent, stateColor;
                    if (isEmpty) { accent = 'var(--color-text-secondary)'; stateColor = 'var(--color-text-secondary)'; }
                    else { accent = mt >= wt ? 'var(--color-primary)' : 'var(--color-secondary)'; stateColor = this.flowColor(fp.flowName, fp.systemId); }
                    const mtFrac = total > 0 ? mt / total : 0;
                    const circ = 2 * Math.PI * 40, mtDash = circ * mtFrac;
                    return {
                        flowName: fp.flowName,
                        leftPct: f4((px + pad) / canvasW * 100), topPct: f4((py + pad) / canvasH * 100),
                        widthPct: f4(innerW / canvasW * 100), heightPct: f4(innerH / canvasH * 100),
                        accent, stateColor, stateLabel: this.flowStateLabel(fp.flowName), isEmpty,
                        mt, wt, total, mtPercent: (mtFrac * 100).toFixed(1), mtFrac,
                        sMtDash: mtDash.toFixed(1), sCirc: circ.toFixed(1),
                        badges: this.flowBadges(fp.flowName),
                        selected: this.selectedFlowName === fp.flowName
                    };
                },

                flowMtWt(name) {
                    const s = this.flows.find(f => f.flowName === name);
                    if (this.showAverage) {
                        if (s && (s.avgMT != null || s.avgWT != null))
                            return { mt: s.avgMT != null ? Math.trunc(s.avgMT) : 0, wt: s.avgWT != null ? Math.trunc(s.avgWT) : 0 };
                        if (!s || (s.mt == null && s.wt == null)) return null;
                        return { mt: s.mt ?? 0, wt: s.wt ?? 0 };
                    }
                    if (!s || (s.mt == null && s.wt == null)) return null;
                    return { mt: s.mt ?? 0, wt: s.wt ?? 0 };
                },
                flowColor(name, systemId) {
                    const s = this.flows.find(f => f.flowName === name);
                    if (!s) return this.systemColor(systemId);
                    switch ((s.state || '').toLowerCase()) {
                        case 'ready': return '#4CAF50'; case 'going': return '#EAB308';
                        case 'finish': return '#2196F3'; case 'error': return '#F44336';
                        default: return '#4CAF50';
                    }
                },
                systemColor(systemId) {
                    if (!(systemId in this._sysColorIdx)) this._sysColorIdx[systemId] = Object.keys(this._sysColorIdx).length % SYSTEM_COLORS.length;
                    return SYSTEM_COLORS[this._sysColorIdx[systemId]];
                },
                flowStateLabel(name) { const s = this.flows.find(f => f.flowName === name); return (s && s.state) ? s.state : ''; },
                stateColor(name) {
                    switch ((this.flowStateLabel(name) || '').toLowerCase()) {
                        case 'ready': return '#4CAF50'; case 'going': return '#EAB308';
                        case 'finish': return '#2196F3'; case 'error': return '#F44336';
                        default: return '#4CAF50';
                    }
                },
                flowBadges(name) {
                    const b = [];
                    if (name === this.maxCtName) b.push({ label: '최대', color: '#ef5350' });
                    if (name === this.minCtName) b.push({ label: '최소', color: '#26a69a' });
                    if (name === this.maxWtName) b.push({ label: '대기', color: 'var(--color-secondary)' });
                    return b;
                },

                // ── 전치(transpose) — ResizeObserver + ShouldTranspose (1.15 hysteresis) ──
                setupTranspose() {
                    const area = this.$refs.svgArea;
                    if (!area || this._ro) return;
                    this._ro = new ResizeObserver(() => {
                        requestAnimationFrame(() => {
                            const parent = area.parentElement; if (!parent) return;
                            const pw = parent.clientWidth, ph = parent.clientHeight;
                            const next = this.shouldTranspose(pw, ph);
                            if (next !== this.transposed) this.transposed = next;
                        });
                    });
                    this._ro.observe(area.parentElement || area);
                },
                shouldTranspose(pw, ph) {
                    const L = this.layout;
                    if (!L || pw <= 0 || ph <= 0 || L.canvasWidth <= 0 || L.canvasHeight <= 0) return this.transposed;
                    const canvasAR = L.canvasWidth / L.canvasHeight;
                    const fitWidth = (w, h, ar) => Math.min(w, h * ar);
                    const asIsW = fitWidth(pw, ph, canvasAR);
                    const asIsArea = asIsW * (asIsW / canvasAR);
                    const trAR = 1 / canvasAR;
                    const trW = fitWidth(pw, ph, trAR);
                    const trArea = trW * (trW / trAR);
                    return this.transposed ? (trArea * 1.15 > asIsArea) : (trArea > asIsArea * 1.15);
                },

                // ── CT 분석 (UpdateChartCache 재구현) ──
                get metricRows() {
                    if (!this.layout) return [];
                    return this.layout.flowPlacements.map((fp, idx) => {
                        const s = this.flows.find(f => f.flowName === fp.flowName);
                        let mt, wt, ct;
                        if (this.showAverage) {
                            mt = (s && s.avgMT != null) ? Math.trunc(s.avgMT) : 0;
                            wt = (s && s.avgWT != null) ? Math.trunc(s.avgWT) : 0;
                            ct = (s && s.avgCT != null) ? Math.trunc(s.avgCT) : 0;
                            if (ct === 0) { mt = (s && s.mt != null) ? s.mt : 0; wt = (s && s.wt != null) ? s.wt : 0; ct = mt + wt; }
                        } else {
                            mt = (s && s.mt != null) ? s.mt : 0; wt = (s && s.wt != null) ? s.wt : 0; ct = mt + wt;
                        }
                        return { flowName: fp.flowName, mt, wt, ct, wtRatio: ct > 0 ? wt / ct : 0, idx };
                    }).filter(r => r.ct > 0);
                },
                get maxCtName() { const r = this.metricRows; return r.length ? r.reduce((a, b) => b.ct > a.ct ? b : a).flowName : null; },
                get minCtName() { const r = this.metricRows; return r.length > 1 ? r.reduce((a, b) => b.ct < a.ct ? b : a).flowName : null; },
                get maxWtName() { const r = this.metricRows; return r.length ? r.reduce((a, b) => b.wtRatio > a.wtRatio ? b : a).flowName : null; },
                get maxCtVal() { const r = this.metricRows; return r.length ? Math.max(...r.map(x => x.ct)) : 1; },
                get minCtVal() { const r = this.metricRows; return r.length ? Math.min(...r.map(x => x.ct)) : 0; },
                get maxWtRatio() { const n = this.maxWtName; const r = this.metricRows.find(x => x.flowName === n); return r ? r.wtRatio : 0; },
                get chartData() {
                    const r = this.metricRows.slice();
                    const f = this.sortField, desc = this.sortDesc;
                    const cmp = (a, b) => (a || '').localeCompare(b || '');
                    if (f === 'name') r.sort((a, b) => cmp(a.flowName, b.flowName));
                    else if (f === 'order') r.sort((a, b) => (this.flowProcessOrder[a.flowName] ?? a.idx) - (this.flowProcessOrder[b.flowName] ?? b.idx));
                    else { const k = f === 'mt' ? 'mt' : f === 'wt' ? 'wt' : 'ct'; r.sort((a, b) => a[k] - b[k]); }
                    if (desc) r.reverse();
                    return r;
                },
                isHighlighted(name) { return name === this.maxCtName || name === this.minCtName || name === this.maxWtName; },
                rowBorderStyle(name) {
                    const c = name === this.maxCtName ? '#ef5350' : name === this.minCtName ? '#26a69a' : name === this.maxWtName ? 'var(--color-secondary)' : '';
                    return c ? `border-left-color:${c};` : '';
                },
                barFill(flow) { return this.maxCtVal > 0 ? (flow.ct * 100 / this.maxCtVal) : 0; },
                barMt(flow) { return flow.ct > 0 ? (flow.mt * 100 / flow.ct) : 0; },
                barWt(flow) { return 100 - this.barMt(flow); },

                setDisplayMode(avg) { this.showAverage = avg; },

                // ── 선택/팝업 ──
                selectCt(name) {
                    this.selectedFlowName = (name && this.selectedFlowName === name) ? null : (name || null);
                    this.popupFlow = null;
                },
                async selectLayout(name) {
                    this.selectedFlowName = name;
                    if (name) {
                        const row = this.chartData.find(r => r.flowName === name);
                        this.popupFlow = row ? { flowName: row.flowName, mt: row.mt, wt: row.wt, ct: row.ct, wtRatio: row.wtRatio }
                                             : { flowName: name, mt: 0, wt: 0, ct: 0, wtRatio: 0 };
                        await this.loadHistory(name);
                    } else { this.popupFlow = null; this.flowHistory = []; }
                },
                closePopup() { this.popupFlow = null; this.flowHistory = []; },
                async loadHistory(name) {
                    try {
                        this.flowHistory = await this.apiGet('/api/dashboard/flows/' + encodeURIComponent(name) + '/history?limit=200');
                    } catch (e) { if (e.message !== 'demo-blocked') console.error('history failed', e); this.flowHistory = []; }
                },
                get popupMtPct() { return this.popupFlow && this.popupFlow.ct > 0 ? (this.popupFlow.mt * 100 / this.popupFlow.ct) : 0; },
                get popupWtPct() { return 100 - this.popupMtPct; },
                histMtPct(h) { const ct = h.ct ?? 0, mt = h.mt ?? 0; return ct > 0 ? (mt * 100 / ct) : 0; },
                histTime(iso) {
                    const d = new Date(iso); if (isNaN(d)) return '';
                    const p = (x) => String(x).padStart(2, '0');
                    return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
                },

                // ── 위젯 레이아웃 (읽기 전용 prefs) ──
                get visibleWidgets() { return this.widgetOrder.filter(w => !this.hiddenWidgets.includes(w)); },
                widgetStyle(id) {
                    const parts = (this.ratio || '1:3').split(':');
                    const left = parseInt(parts[0], 10) || 1, right = parseInt(parts[1], 10) || 1;
                    const flex = (this.widgetOrder.length > 0 && this.widgetOrder[0] === id) ? left : right;
                    return `flex:${flex}; min-width:0; min-height:0;`;
                },

                // ── 전체화면 (native) ──
                toggleFullscreen() {
                    const el = this.$refs.layoutCard;
                    if (!el) return;
                    if (!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen();
                    else document.exitFullscreen && document.exitFullscreen();
                },

                // ── 포맷터 ──
                // 카드용 (FlowLayoutSvg.FormatMs — 한국어)
                fmtCard(ms) {
                    if (ms <= 0) return '0초';
                    if (ms < 1000) return ms + 'ms';
                    if (ms < 60000) return (ms / 1000).toFixed(1) + '초';
                    if (ms < 3600000) return Math.floor(ms / 60000) + '분 ' + Math.floor(ms % 60000 / 1000) + '초';
                    return Math.floor(ms / 3600000) + '시 ' + Math.floor(ms % 3600000 / 60000) + '분';
                },
                // CT 테이블용 (Dashboard.FormatMs — 영어)
                fmt(ms) {
                    if (ms <= 0) return '0s';
                    if (ms < 1000) return ms + 'ms';
                    if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
                    if (ms < 3600000) return Math.floor(ms / 60000) + 'm ' + Math.floor(ms % 60000 / 1000) + 's';
                    return Math.floor(ms / 3600000) + 'h ' + Math.floor(ms % 3600000 / 60000) + 'm';
                }
            };
        }
    </script>
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
</body>
