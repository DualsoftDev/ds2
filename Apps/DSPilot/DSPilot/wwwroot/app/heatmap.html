<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>동작편차 — DSPilot</title>

    <!--
      DSPilot 정적 호스팅 — Swiss Technical 리디자인.
      서버/코어/모델은 C#(/api/heatmap/*), 뷰는 순수 HTML/CSS/JS(Alpine + Chart.js).
      디자인 시스템: /css/swiss.css (토큰/컴포넌트/다크). 페이지 고유 클래스(hm-*)만 인라인.
      viz 클래스(flow-dashboard-*, heatmap-*)와 heatmap-indeterminate keyframe 은 swiss.css 에 정의됨 → 참조만.
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/swiss.css" rel="stylesheet" />

    <style>
        [x-cloak] { display: none !important; }

        /* ── 독립 셸 (shell.js 미동작 시 fallback) ── */
        .dsp-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); color: var(--color-text-primary); font-family: var(--font-family); }
        .dsp-appbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; background: var(--color-appbar-bg); color: var(--color-appbar-text); border-bottom: 1px solid var(--color-lines-strong); position: sticky; top: 0; z-index: 50; flex-shrink: 0; }
        .dsp-appbar .dsp-title { font-size: 18px; font-weight: 700; }
        .dsp-appbar .spacer { flex: 1; }
        .dsp-main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 20px 24px; }

        /* ── 콘텐츠 상단 페이지 헤더 (셸이 제거하지 않는 영역 → 데이터 카운트 노출) ── */
        .hm-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid var(--color-text-primary); }
        .hm-toolbar .hm-head { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
        .hm-toolbar .hm-index { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; color: var(--color-primary); letter-spacing: 0.04em; }
        .hm-toolbar .hm-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.015em; }
        .hm-count { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--color-lines-strong); border-radius: var(--radius-sm); font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }

        /* ── 컨트롤 패널 폼 라벨/필드 ── */
        .hm-control-grid { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
        .hm-field-metric { flex: 0 0 auto; min-width: 180px; }
        .hm-field-filter { flex: 1; min-width: 220px; max-width: 420px; }
        .hm-control-actions { flex: 0 0 auto; display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }

        /* ── 4-up KPI 계기판 (metric-strip 셀) ── */
        .hm-kpi-label { font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--color-text-secondary); }
        .hm-kpi-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.7rem; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin-top: 4px; color: var(--color-text-primary); }
        .hm-kpi-sub { font-size: 0.66rem; color: var(--color-text-secondary); margin-top: 3px; font-weight: 600; }

        /* ── 범례 행 ── */
        .hm-legend-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }

        /* ── Flow 매트릭스 테이블 카드 헤더 (per-flow) ── */
        .hm-table-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--color-lines); flex-wrap: wrap; }
        .hm-table-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .hm-flow-title { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }

        /* ── Call 상세 모달 detail 카드 그리드 ── */
        .hm-detail-grid { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 720px) { .hm-detail-grid { grid-template-columns: 1fr 1fr; } }
        .hm-detail-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.25rem; font-weight: 700; line-height: 1.1; margin: 4px 0 2px; }
        /* "실행횟수" 카드 — 중립 잉크 톤 (의미 색 없음) */
        .hm-detail-card-neutral { background: var(--color-tertiary); }

        .hm-chart-box { height: 280px; position: relative; }
        .hm-chart-empty { color: var(--color-text-secondary); padding: 28px; text-align: center; background: var(--color-surface-variant); border: 1px solid var(--color-lines); border-radius: var(--radius-sm); }

        /* 정렬 가능 헤더의 도움말 점선 밑줄 (잉크 톤) */
        .hm-help { border-bottom: 1px dotted var(--color-lines-strong); cursor: help; }
    </style>
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="heatmapApp()" x-init="init()" x-cloak>

        <!-- 데모 만료 안내 (정적 셸은 demo 게이트 short-circuit 대상이지만, /api 는 503 → 그때 표시) -->
        <div class="modal-overlay" x-show="demoBlocked" style="z-index:2000;">
            <div class="modal-content demo-blocked-card" style="max-width:480px;">
                <span class="material-icons demo-blocked-icon">hourglass_disabled</span>
                <h3>DEMO 만료</h3>
                <p>데모 사용 시간(3시간)이 종료되었습니다.</p>
                <p>서비스 관리자에게 문의해 주세요.</p>
            </div>
        </div>

        <!-- fallback 슬림 헤더 (shell.js 가 제거) -->
        <header class="dsp-appbar">
            <span class="dsp-title">동작편차</span>
            <span class="dsp-badge">정적</span>
            <div class="spacer"></div>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">

            <!-- 콘텐츠 페이지 헤더: 번호 인덱스 + 제목 + 데이터 카운트 -->
            <div class="hm-toolbar">
                <div class="hm-head">
                    <span class="hm-index">02 / 편차</span>
                    <span class="hm-title">동작편차</span>
                </div>
                <div class="spacer"></div>
                <span class="hm-count" x-show="!loading && filteredGroups.length > 0">
                    <span x-text="filteredGroups.length + ' FLOW'"></span>
                    <span style="color:var(--color-lines-strong);">·</span>
                    <span x-text="totalCalls + ' CALL'"></span>
                </span>
            </div>

            <!-- 컨트롤 패널 -->
            <div class="dsp-panel mb-4">
                <div class="dsp-panel-body">
                    <div class="hm-control-grid">
                        <div class="hm-field-metric">
                            <label class="form-label">표시 메트릭</label>
                            <select class="form-select" x-model.number="selectedMetricIdx">
                                <template x-for="(m, i) in metrics" :key="m.key">
                                    <option :value="i" x-text="m.name"></option>
                                </template>
                            </select>
                        </div>
                        <div class="hm-field-filter">
                            <label class="form-label">Flow 필터</label>
                            <input class="form-field" x-model="flowFilter" placeholder="Flow 이름 검색..." />
                        </div>
                        <div class="hm-control-actions">
                            <button class="btn btn-filled" @click="loadData()">
                                <span class="material-icons">refresh</span> 새로고침
                            </button>
                            <button class="btn btn-outlined color-default" @click="allExpanded = !allExpanded">
                                <span class="material-icons" x-text="allExpanded ? 'unfold_less' : 'unfold_more'"></span>
                                <span x-text="allExpanded ? 'Flow Group Matrix 접기' : 'Flow Group Matrix 펼치기'"></span>
                            </button>
                            <button class="btn btn-outlined color-default" @click="exportCsv()" :disabled="filteredGroups.length === 0">
                                <span class="material-icons">file_download</span> CSV 내보내기
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 로딩 (헤어라인 indeterminate) -->
            <div class="mb-4 progress-bar progress-bar-indeterminate" x-show="loading" style="flex-shrink:0;">
                <div class="progress-bar-fill" style="animation: heatmap-indeterminate 1.5s infinite ease-in-out;"></div>
            </div>

            <!-- 오류 -->
            <div class="alert alert-error mb-4" x-show="error" style="flex-shrink:0;">
                <span class="material-icons">error_outline</span>
                <span x-text="error"></span>
            </div>

            <!-- 데이터 없음 -->
            <div class="alert alert-info mb-4" x-show="!loading && !error && filteredGroups.length === 0" style="flex-shrink:0;">
                <span class="material-icons">info</span>
                <span>표시할 데이터가 없습니다. PLC 데이터가 수집되면 자동으로 표시됩니다.</span>
            </div>

            <template x-if="!loading && filteredGroups.length > 0">
                <div>
                    <!-- 요약 계기판 (KPI metric-strip) -->
                    <div class="metric-strip mb-4">
                        <div>
                            <div class="hm-kpi-label">총 Flow</div>
                            <div class="hm-kpi-value" style="color:var(--color-primary);" x-text="filteredGroups.length"></div>
                        </div>
                        <div>
                            <div class="hm-kpi-label">총 Call</div>
                            <div class="hm-kpi-value" x-text="totalCalls"></div>
                        </div>
                        <div>
                            <div class="hm-kpi-label">이슈 Call</div>
                            <div class="hm-kpi-value" :style="`color:${issueCalls > 0 ? 'var(--color-error)' : 'var(--color-success)'};`" x-text="issueCalls"></div>
                        </div>
                        <div>
                            <div class="hm-kpi-label">선택 메트릭 평균</div>
                            <div class="hm-kpi-value" x-text="fmt(selectedMetric.key, selectedMetricAverage)"></div>
                            <div class="hm-kpi-sub" x-text="selectedMetric.name"></div>
                        </div>
                    </div>

                    <!-- 범례 -->
                    <div class="dsp-panel mb-4">
                        <div class="dsp-panel-body" style="padding:12px 16px;">
                            <div class="hm-legend-bar">
                                <span class="eyebrow" style="margin-right:8px;">범례</span>
                                <div class="heatmap-legend-item"><div class="heatmap-cell heatmap-excellent"></div><span class="typo-caption">우수</span></div>
                                <div class="heatmap-legend-item"><div class="heatmap-cell heatmap-good"></div><span class="typo-caption">양호</span></div>
                                <div class="heatmap-legend-item"><div class="heatmap-cell heatmap-fair"></div><span class="typo-caption">보통</span></div>
                                <div class="heatmap-legend-item"><div class="heatmap-cell heatmap-poor"></div><span class="typo-caption">개선필요</span></div>
                                <div class="heatmap-legend-item"><div class="heatmap-cell heatmap-critical"></div><span class="typo-caption">심각</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Flow Group Matrix 대시보드 -->
                    <div class="dsp-panel mb-4" x-show="allExpanded">
                        <div class="dsp-panel-head">
                            <div>
                                <div class="dsp-panel-title">Flow Group Matrix</div>
                                <div class="typo-body2" style="color:var(--color-text-secondary); margin-top:2px;">Flow 패널 안에 Work 블록과 Call 셀을 배치해 그룹 구조를 한눈에 봅니다.</div>
                            </div>
                            <span class="chip chip-primary" x-text="filteredGroups.length + ' Flows'"></span>
                        </div>
                        <div class="dsp-panel-body">
                            <div class="flow-dashboard-grid">
                                <template x-for="group in filteredGroups" :key="'fg-' + group.flowName">
                                    <section class="flow-dashboard-panel">
                                        <div class="flow-dashboard-panel-header">
                                            <div>
                                                <div class="flow-dashboard-panel-title" x-text="group.flowName"></div>
                                                <div class="flow-dashboard-panel-subtitle" x-text="'평균 ' + fmt(selectedMetric.key, flowAvgValue(group, selectedMetric.key))"></div>
                                            </div>
                                            <span class="chip chip-info" x-text="group.callCount + ' Calls'"></span>
                                        </div>
                                        <div class="flow-dashboard-work-grid">
                                            <template x-for="wg in workGroups(group)" :key="'wg-' + group.flowName + '-' + wg.workName">
                                                <div class="flow-dashboard-work-panel">
                                                    <div class="flow-dashboard-work-header">
                                                        <span x-text="wg.workName"></span>
                                                        <span x-text="wg.calls.length"></span>
                                                    </div>
                                                    <div class="flow-dashboard-call-grid" style="grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));">
                                                        <template x-for="call in wg.calls" :key="'fc-' + call.callId">
                                                            <div :class="'flow-dashboard-call-cell ' + colorClass(call, selectedMetric.key)"
                                                                 :title="callTooltip(call)" @click="selectCall(call)">
                                                                <div class="flow-dashboard-call-name" x-text="call.callName"></div>
                                                                <div class="flow-dashboard-call-value" x-text="fmt(selectedMetric.key, metricValue(call, selectedMetric.key))"></div>
                                                                <div class="flow-dashboard-call-meta" x-text="call.workName"></div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </section>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Flow 그룹별 매트릭스 히트맵 테이블 -->
                    <template x-for="group in filteredGroups" :key="'tbl-' + group.flowName">
                        <div class="dsp-panel mb-4">
                            <div class="hm-table-head">
                                <div class="hm-table-head-left">
                                    <button class="btn-icon btn-sm" @click="group.isExpanded = !group.isExpanded">
                                        <span class="material-icons" x-text="group.isExpanded ? 'expand_more' : 'chevron_right'"></span>
                                    </button>
                                    <h6 class="hm-flow-title" x-text="group.flowName"></h6>
                                    <span class="chip chip-info" x-text="group.callCount + ' Calls'"></span>
                                    <span class="chip chip-error" x-show="issueCount(group) > 0" x-text="issueCount(group) + ' 이슈'"></span>
                                </div>
                                <div class="d-flex" style="align-items:center; gap:4px;">
                                    <div :class="'heatmap-cell-mini ' + group.flowColorClassAvg" :title="'평균: ' + Math.round(group.flowAverageTime) + ' ms'">Avg</div>
                                    <div :class="'heatmap-cell-mini ' + group.flowColorClassStdDev" :title="'표준편차: ' + Math.round(group.flowAverageStdDev) + ' ms'">SD</div>
                                    <div :class="'heatmap-cell-mini ' + group.flowColorClassCV" :title="'변동계수: ' + group.flowAverageCV.toFixed(2)">CV</div>
                                </div>
                            </div>

                            <div class="table-container" x-show="group.isExpanded" style="overflow:auto;">
                                <table class="table table-hover heatmap-matrix-table" style="table-layout:fixed; width:100%;">
                                    <colgroup>
                                        <col style="width:22%;" /><col style="width:14%;" /><col style="width:12%;" />
                                        <col style="width:12%;" /><col style="width:12%;" /><col style="width:10%;" />
                                    </colgroup>
                                    <thead class="table-head-sticky">
                                        <tr>
                                            <th class="sortable" @click="sortBy('callName')">Call <span x-html="sortIcon('callName')"></span></th>
                                            <th class="sortable" @click="sortBy('workName')">Work <span x-html="sortIcon('workName')"></span></th>
                                            <th class="sortable heatmap-col-header" @click="sortBy('avg')">
                                                <span title="Call의 평균 실행 시간 (ms). 낮을수록 빠릅니다." class="hm-help">평균 <span x-html="sortIcon('avg')"></span></span>
                                            </th>
                                            <th class="sortable heatmap-col-header" @click="sortBy('stddev')">
                                                <span title="실행 시간의 표준편차 (ms). 낮을수록 안정적입니다." class="hm-help">표준편차 <span x-html="sortIcon('stddev')"></span></span>
                                            </th>
                                            <th class="sortable heatmap-col-header" @click="sortBy('cv')">
                                                <span title="변동계수 (CV) = 표준편차/평균. 0.1 미만: 안정, 0.3 이상: 불안정" class="hm-help">변동계수 <span x-html="sortIcon('cv')"></span></span>
                                            </th>
                                            <th style="text-align:center;"><span title="Call이 Going 상태로 전환된 총 횟수" class="hm-help">실행횟수</span></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="call in sortedCalls(group)" :key="'row-' + call.callId">
                                            <tr :class="'heatmap-matrix-row ' + (selectedCall && selectedCall.callId === call.callId ? 'selected' : '')"
                                                @click="selectCall(call)" :title="callTooltip(call)">
                                                <td class="heatmap-matrix-label" x-text="call.callName"></td>
                                                <td class="heatmap-matrix-label" x-text="call.workName"></td>
                                                <td style="text-align:center; padding:4px;">
                                                    <div :class="'heatmap-cell-compact ' + call.colorClassAvg" x-text="fmtShortAvg(call.averageGoingTime)"></div>
                                                </td>
                                                <td style="text-align:center; padding:4px;">
                                                    <div :class="'heatmap-cell-compact ' + call.colorClassStdDev" x-text="fmtShortAvg(call.stdDevGoingTime)"></div>
                                                </td>
                                                <td style="text-align:center; padding:4px;">
                                                    <div :class="'heatmap-cell-compact ' + call.colorClassCV" x-text="call.coefficientOfVariation.toFixed(2)"></div>
                                                </td>
                                                <td style="text-align:center;"><span class="typo-body2" style="font-family:var(--font-mono); font-variant-numeric:tabular-nums;" x-text="call.goingCount"></span></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </main>

        <!-- Call 상세 모달 -->
        <div class="modal-overlay" x-show="selectedCall" @click="closeModal()" style="display:none;" x-transition.opacity>
            <template x-if="selectedCall">
                <div class="modal-content" style="max-width:720px; width:90vw;" @click.stop>
                    <div class="d-flex" style="justify-content:space-between; align-items:center; margin-bottom:16px;">
                        <div>
                            <div class="eyebrow mb-1">Call 상세</div>
                            <h6 class="typo-h6" style="margin:0;" x-text="selectedCall.callName"></h6>
                            <span class="typo-caption" style="color:var(--color-text-secondary); font-family:var(--font-mono);"
                                  x-text="'Flow: ' + selectedCall.flowName + ' | Work: ' + selectedCall.workName"></span>
                        </div>
                        <button class="btn-icon btn-sm" @click="closeModal()"><span class="material-icons">close</span></button>
                    </div>

                    <div class="hm-detail-grid">
                        <div :class="'heatmap-detail-card ' + selectedCall.colorClassAvg">
                            <div class="typo-overline" style="color:inherit; opacity:0.85;">평균 시간</div>
                            <div class="hm-detail-value" x-text="formatMs(chartCount > 0 ? chartAvg : selectedCall.averageGoingTime)"></div>
                            <div class="typo-caption" style="color:inherit; opacity:0.7;">낮을수록 빠름</div>
                        </div>
                        <div :class="'heatmap-detail-card ' + selectedCall.colorClassStdDev">
                            <div class="typo-overline" style="color:inherit; opacity:0.85;">표준편차</div>
                            <div class="hm-detail-value" x-text="formatMs(chartCount > 0 ? chartStdDev : selectedCall.stdDevGoingTime)"></div>
                            <div class="typo-caption" style="color:inherit; opacity:0.7;">낮을수록 안정적</div>
                        </div>
                        <div :class="'heatmap-detail-card ' + selectedCall.colorClassCV">
                            <div class="typo-overline" style="color:inherit; opacity:0.85;">변동계수</div>
                            <div class="hm-detail-value" x-text="(chartCount > 0 ? chartCV : selectedCall.coefficientOfVariation).toFixed(2)"></div>
                            <div class="typo-caption" style="color:inherit; opacity:0.7;" x-text="cvStatus(chartCount > 0 ? chartCV : selectedCall.coefficientOfVariation)"></div>
                        </div>
                        <div class="heatmap-detail-card hm-detail-card-neutral">
                            <div class="typo-overline" style="color:inherit; opacity:0.85;">실행횟수</div>
                            <div class="hm-detail-value" x-text="(chartCount > 0 ? chartCount : selectedCall.goingCount) + '회'"></div>
                            <div class="typo-caption" style="color:inherit; opacity:0.7;" x-text="goingCountStatus(chartCount > 0 ? chartCount : selectedCall.goingCount)"></div>
                        </div>
                    </div>

                    <!-- 실행 이력 차트 -->
                    <div style="margin-top:16px; border-top:1px solid var(--color-lines); padding-top:16px;">
                        <div class="d-flex" style="align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
                            <span class="material-icons" style="font-size:18px; color:var(--color-primary);">show_chart</span>
                            <span class="typo-subtitle2">실행 시간 추이</span>
                            <span class="typo-caption" x-show="isChartLoading" style="color:var(--color-text-secondary);">로딩 중...</span>
                            <div class="d-flex" style="align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap;">
                                <div class="d-flex" style="gap:4px;" title="표시할 실행 이력의 기간을 선택합니다.">
                                    <button class="btn btn-sm" :class="historyPeriod === 'all' ? 'btn-primary' : 'btn-outlined color-default'" @click="setHistoryPeriod('all')">전체</button>
                                    <button class="btn btn-sm" :class="historyPeriod === 'today' ? 'btn-primary' : 'btn-outlined color-default'" @click="setHistoryPeriod('today')">오늘</button>
                                    <button class="btn btn-sm" :class="historyPeriod === '7d' ? 'btn-primary' : 'btn-outlined color-default'" @click="setHistoryPeriod('7d')">지난 7일</button>
                                    <button class="btn btn-sm" :class="historyPeriod === '30d' ? 'btn-primary' : 'btn-outlined color-default'" @click="setHistoryPeriod('30d')">지난 30일</button>
                                </div>
                                <label class="switch"
                                       title="이동평균의 0.5배~2배 범위를 벗어나는 회차(위·아래 스파이크)를 제외합니다.">
                                    <input type="checkbox" x-model="excludeDeviation" @change="onExcludeDeviationChange()" /> 스파이크 제외
                                </label>
                            </div>
                        </div>

                        <div x-show="callHistory.length > 0" class="hm-chart-box">
                            <canvas id="callHistoryChart"></canvas>
                        </div>
                        <div x-show="callHistory.length === 0 && !isChartLoading"
                             class="typo-body2 hm-chart-empty">
                            <span class="material-icons" style="font-size:32px; display:block; margin-bottom:8px; opacity:0.5;">timeline</span>
                            실행 이력이 없습니다.
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Chart.js + 기존 차트 인터롭(camelCase 키 기대 → API 도 camelCase) -->
    <script src="/lib/chart.umd.min.js"></script>
    <script src="/lib/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="/js/call-history-chart.js"></script>

    <!-- Alpine 컴포넌트 정의 (Alpine 보다 먼저 평가되어 전역 함수 등록) -->
    <script>
        function heatmapApp() {
            return {
                allGroups: [],
                loading: true,
                error: null,
                demoBlocked: false,
                flowFilter: '',
                selectedMetricIdx: 2, // 기본: 변동계수(CV) — Blazor SelectedMetric 기본값과 동일
                allExpanded: true,
                sortField: 'cv',
                sortAsc: false,
                selectedCall: null,
                callHistory: [],
                excludeDeviation: true,
                historyPeriod: 'all',
                isChartLoading: false,
                dark: false,

                metrics: [
                    { key: 'avg', name: '평균 시간 (ms)' },
                    { key: 'stddev', name: '표준편차 (ms)' },
                    { key: 'cv', name: '변동계수 (CV)' }
                ],

                get selectedMetric() { return this.metrics[this.selectedMetricIdx] || this.metrics[2]; },

                async init() {
                    this.dark = localStorage.getItem('dspilot-theme') === 'dark';
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'dspilot-theme') this.dark = e.newValue === 'dark';
                    });
                    await this.loadData();
                },

                toggleTheme() {
                    this.dark = !this.dark;
                    localStorage.setItem('dspilot-theme', this.dark ? 'dark' : 'light');
                },

                async apiGet(url) {
                    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                    if (res.status === 503) { this.demoBlocked = true; throw new Error('demo-blocked'); }
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },

                async loadData() {
                    this.loading = true; this.error = null;
                    try {
                        this.allGroups = await this.apiGet('/api/heatmap/data');
                        // 새로고침으로 데이터가 교체됐는데 열린 모달의 Call 이 더 이상 없으면 모달 정리(좀비 모달 방지)
                        if (this.selectedCall &&
                            !this.allGroups.some(g => (g.calls || []).some(c => c.callId === this.selectedCall.callId))) {
                            await this.closeModal();
                        }
                    } catch (e) {
                        if (e.message !== 'demo-blocked') this.error = '데이터를 불러오지 못했습니다: ' + e.message;
                        this.allGroups = [];
                    } finally {
                        this.loading = false;
                    }
                },

                get filteredGroups() {
                    const f = this.flowFilter.trim().toLowerCase();
                    if (!f) return this.allGroups;
                    return this.allGroups.filter(g => (g.flowName || '').toLowerCase().includes(f));
                },

                metricValue(call, key) {
                    if (key === 'avg') return call.averageGoingTime;
                    if (key === 'stddev') return call.stdDevGoingTime;
                    return call.coefficientOfVariation;
                },
                colorClass(call, key) {
                    if (key === 'avg') return call.colorClassAvg;
                    if (key === 'stddev') return call.colorClassStdDev;
                    return call.colorClassCV;
                },
                flowAvgValue(group, key) {
                    if (key === 'avg') return group.flowAverageTime;
                    if (key === 'stddev') return group.flowAverageStdDev;
                    return group.flowAverageCV;
                },

                // HeatmapPerformance.FormatMetricValue: avg/stddev → F0, cv → F2
                fmt(key, value) {
                    if (key === 'cv') return Number(value).toFixed(2);
                    return Math.round(Number(value)).toString();
                },
                // FormatMetricValueShort(AverageTime/StdDeviation): <1000 → 정수, else (x/1000)s
                fmtShortAvg(v) {
                    return v < 1000 ? Math.round(v).toString() : (v / 1000).toFixed(1) + 's';
                },

                isIssueCall(call) {
                    const c = this.colorClass(call, this.selectedMetric.key);
                    return c === 'heatmap-poor' || c === 'heatmap-critical';
                },
                issueCount(group) { return group.calls.filter(c => this.isIssueCall(c)).length; },

                get totalCalls() { return this.filteredGroups.reduce((s, g) => s + g.callCount, 0); },
                get issueCalls() { return this.filteredGroups.reduce((s, g) => s + this.issueCount(g), 0); },
                get selectedMetricAverage() {
                    const calls = this.filteredGroups.flatMap(g => g.calls);
                    if (calls.length === 0) return 0;
                    return calls.reduce((s, c) => s + this.metricValue(c, this.selectedMetric.key), 0) / calls.length;
                },

                workGroups(group) {
                    const map = {};
                    for (const call of group.calls) {
                        const w = (call.workName && call.workName.trim()) ? call.workName : 'No Work';
                        (map[w] = map[w] || []).push(call);
                    }
                    return Object.keys(map).sort((a, b) => a.localeCompare(b)).map(w => ({
                        workName: w,
                        calls: map[w].slice().sort((a, b) => (a.callName || '').localeCompare(b.callName || ''))
                    }));
                },

                sortedCalls(group) {
                    const calls = group.calls.slice();
                    const f = this.sortField, asc = this.sortAsc;
                    const cmp = (a, b) => (a || '').localeCompare(b || '');
                    if (f === 'callName') calls.sort((a, b) => asc ? cmp(a.callName, b.callName) : cmp(b.callName, a.callName));
                    else if (f === 'workName') calls.sort((a, b) => asc ? cmp(a.workName, b.workName) : cmp(b.workName, a.workName));
                    else {
                        const k = f === 'avg' ? 'averageGoingTime' : f === 'stddev' ? 'stdDevGoingTime' : 'coefficientOfVariation';
                        calls.sort((a, b) => asc ? a[k] - b[k] : b[k] - a[k]);
                    }
                    return calls;
                },
                sortBy(field) {
                    if (this.sortField === field) this.sortAsc = !this.sortAsc;
                    else { this.sortField = field; this.sortAsc = (field === 'callName' || field === 'workName'); }
                },
                sortIcon(field) {
                    if (this.sortField !== field) return '';
                    const icon = this.sortAsc ? 'arrow_upward' : 'arrow_downward';
                    return `<span class="material-icons sort-icon">${icon}</span>`;
                },

                cvStatus(cv) {
                    if (cv < 0.1) return '매우 안정적';
                    if (cv < 0.2) return '안정적';
                    if (cv < 0.3) return '보통';
                    if (cv < 0.5) return '불안정';
                    return '매우 불안정';
                },
                goingCountStatus(n) {
                    if (n >= 30) return '샘플 충분';
                    if (n >= 10) return '샘플 보통';
                    return '샘플 적음';
                },
                callTooltip(call) {
                    const key = this.selectedMetric.key;
                    return `[${call.callName}]\nFlow: ${call.flowName}\nWork: ${call.workName}\n`
                        + `평균: ${Math.round(call.averageGoingTime)} ms\n표준편차: ${Math.round(call.stdDevGoingTime)} ms\n`
                        + `변동계수: ${call.coefficientOfVariation.toFixed(2)} (${this.cvStatus(call.coefficientOfVariation)})\n`
                        + `실행횟수: ${call.goingCount}회\n${this.selectedMetric.name}: ${this.fmt(key, this.metricValue(call, key))}`;
                },

                // ── 차트/통계 (스파이크 제외 반영) ──
                get displayedHistory() {
                    if (!this.excludeDeviation || this.callHistory.length === 0) return this.callHistory;
                    const times = this.callHistory.map(r => r.goingTimeMs);
                    const n = times.length, half = Math.floor(5 / 2), result = [];
                    for (let i = 0; i < n; i++) {
                        const lo = Math.max(0, i - half), hi = Math.min(n - 1, i + half);
                        let sum = 0; for (let j = lo; j <= hi; j++) sum += times[j];
                        const ma = sum / (hi - lo + 1);
                        if (ma <= 0 || (times[i] >= ma * 0.5 && times[i] <= ma * 2.0)) result.push(this.callHistory[i]);
                    }
                    return result;
                },
                get chartAvg() { const d = this.displayedHistory; return d.length ? d.reduce((s, r) => s + r.goingTimeMs, 0) / d.length : 0; },
                get chartStdDev() { const d = this.displayedHistory; if (!d.length) return 0; const a = this.chartAvg; return Math.sqrt(d.reduce((s, r) => s + Math.pow(r.goingTimeMs - a, 2), 0) / d.length); },
                get chartCV() { return this.chartAvg > 0 ? this.chartStdDev / this.chartAvg : 0; },
                get chartCount() { return this.displayedHistory.length; },

                async selectCall(call) {
                    if (this.selectedCall && this.selectedCall.callId === call.callId) { await this.closeModal(); return; }
                    this.selectedCall = call;
                    this.callHistory = [];
                    await this.loadHistory();
                },
                async loadHistory() {
                    if (!this.selectedCall) return;
                    this.isChartLoading = true;
                    try {
                        this.callHistory = await this.apiGet(`/api/heatmap/call-history?callId=${encodeURIComponent(this.selectedCall.callId)}&period=${this.historyPeriod}`);
                        await this.renderChart();
                    } catch (e) {
                        if (e.message !== 'demo-blocked') console.error('history load failed', e);
                        this.callHistory = [];
                    } finally {
                        this.isChartLoading = false;
                    }
                },
                async setHistoryPeriod(p) {
                    if (this.historyPeriod === p) return;
                    this.historyPeriod = p;
                    await this.loadHistory();
                },
                async onExcludeDeviationChange() { await this.renderChart(); },
                async renderChart() {
                    const d = this.displayedHistory;
                    if (d.length === 0) { window.destroyCallHistoryChart(); return; }
                    const chartData = d.map(r => ({
                        executionNumber: r.executionNumber,
                        goingTimeMs: r.goingTimeMs,
                        timestamp: (r.timestamp || '').replace('T', ' ').slice(0, 19)
                    }));
                    const avg = this.selectedCall?.averageGoingTime ?? 0;
                    const sd = this.selectedCall?.stdDevGoingTime ?? 0;
                    // canvas 는 x-if(모달) + x-show(이력>0) 안에 있어 $nextTick 한 번으로 DOM 보장이 안 될 수 있으므로
                    // requestAnimationFrame 으로 최대 ~10프레임 폴링 후 렌더(Blazor 의 Task.Delay(50) 대체, 더 견고).
                    await this.$nextTick();
                    const draw = (attempt) => {
                        const cv = document.getElementById('callHistoryChart');
                        const box = cv && cv.parentElement;
                        // 캔버스 컨테이너가 실제 레이아웃 크기를 가질 때까지 대기.
                        // 0×0 상태(모달 mount/표시 직후)에서 Chart.js 를 만들면 캔버스가 0×0 으로 고정돼 빈 차트가 됨.
                        if (box && box.clientWidth > 0 && box.clientHeight > 0) {
                            window.renderCallHistoryChart('callHistoryChart', chartData, avg, sd);
                        } else if (attempt < 30) {
                            requestAnimationFrame(() => draw(attempt + 1));
                        }
                    };
                    draw(0);
                },
                async closeModal() {
                    this.selectedCall = null;
                    this.callHistory = [];
                    window.destroyCallHistoryChart();
                },

                formatMs(ms) {
                    if (ms <= 0) return '0s';
                    if (ms < 1000) return Math.round(ms) + 'ms';
                    if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
                    if (ms < 3600000) return Math.floor(ms / 60000) + 'm ' + Math.floor((ms % 60000) / 1000) + 's';
                    return Math.floor(ms / 3600000) + 'h ' + Math.floor((ms % 3600000) / 60000) + 'm';
                },

                exportCsv() {
                    const groups = this.filteredGroups;
                    if (groups.length === 0) return;
                    const esc = (v) => {
                        v = (v ?? '').toString();
                        return (v.includes(',') || v.includes('"') || v.includes('\n')) ? '"' + v.replace(/"/g, '""') + '"' : v;
                    };
                    const lines = ['Flow,Call,Work,평균(ms),표준편차(ms),변동계수,실행횟수'];
                    for (const g of groups) for (const c of this.sortedCalls(g)) {
                        lines.push([esc(c.flowName), esc(c.callName), esc(c.workName),
                            Math.round(c.averageGoingTime), Math.round(c.stdDevGoingTime),
                            c.coefficientOfVariation.toFixed(2), c.goingCount].join(','));
                    }
                    const pad = (x) => String(x).padStart(2, '0');
                    const t = new Date();
                    const name = `Heatmap_${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}_${pad(t.getHours())}${pad(t.getMinutes())}${pad(t.getSeconds())}.csv`;
                    const blob = new Blob(['﻿' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
                }
            };
        }
    </script>

    <!-- Alpine 마지막 로드 (defer) -->
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
