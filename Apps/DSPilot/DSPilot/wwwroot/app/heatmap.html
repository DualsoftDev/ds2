<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>동작편차 — DSPilot</title>

    <!--
      DSPilot 정적 호스팅 — DS Pilot(네이비/청록) 리디자인.
      서버/코어/모델은 C#(/api/heatmap/*), 뷰는 순수 HTML/CSS/JS(Alpine + Chart.js).
      디자인 시스템: /css/ds.css (swiss.css @import + mockup 팔레트). 공통 클래스(ds-topbar/ds-legend/ds-card-h)는 ds.css, 페이지 고유 클래스(hm-*)만 인라인.
      viz 클래스(flow-dashboard-*, heatmap-*)와 heatmap-indeterminate keyframe 은 swiss.css 에 정의됨 → 참조만.
      편차 기준: 시스템에 표준(takt) 시간이 없으므로 실측 기반만 사용(거짓 라벨 금지).
        주 지표 = 로버스트 CV(1.4826×MAD/중앙값, 서버 CallRobustStats) — 사람 개입·대기 표본이 섞인 이봉 분포에서
        평균/σ 기반 CV 가 수백%로 부풀던 오독(2026-07 200~350% 상시 빨강)을 해소. 평균/σ/CV 는 참고 표기로 유지.
        색(tier) = 절대 크기가 아니라 "최근(마지막 200회)이 평소(전체 이력) 대비 악화됐는가" — tierOf() 참조.
        서버 robust 미산출(부팅 직후 첫 TTL 스캔 전) 시 구 CV 절대 임계로 자동 폴백.
    -->
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/ds.css" rel="stylesheet" />

    <style>
        [x-cloak] { display: none !important; }

        /* ── 독립 셸 (shell.js 미동작 시 fallback) ── */
        .dsp-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--color-background); color: var(--color-text-primary); font-family: var(--font-family); }
        .dsp-appbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px; background: var(--color-appbar-bg); color: var(--color-appbar-text); border-bottom: 1px solid var(--color-lines-strong); position: sticky; top: 0; z-index: 50; flex-shrink: 0; }
        .dsp-appbar .dsp-title { font-size: 18px; font-weight: 700; }
        .dsp-appbar .spacer { flex: 1; }
        .dsp-main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 20px 24px; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* ── 데이터 카운트 pill (ds-topbar 액션 영역) ── */
        .hm-count { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--color-lines-strong); border-radius: var(--radius-lg); font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; background: var(--color-surface); }

        /* ── 4-up KPI 계기판 (metric-strip 셀) ── */
        .hm-kpi-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-disabled); }
        .hm-kpi-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.7rem; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; margin-top: 4px; color: var(--navy); }
        .dark-theme .hm-kpi-value { color: var(--color-text-primary); }
        .hm-kpi-sub { font-size: 0.66rem; color: var(--color-text-secondary); margin-top: 3px; font-weight: 600; }

        /* ── 범례 행 (ds-legend 기반, swiss heatmap 스와치 재사용) ── */
        .hm-legend-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
        .hm-legend-bar .heatmap-legend-item { margin: 0; }
        .hm-legend-bar .lg-item { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 600; color: var(--color-text-secondary); cursor: help; }
        /* ds.css 의 .lg-swatch 크기는 .ds-legend 스코프에만 정의 → 이 컨테이너에서도 보이도록 재정의 */
        .hm-legend-bar .lg-swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
        .hm-lg-label { font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-disabled); }
        .hm-lg-divider { width: 1px; height: 16px; background: var(--color-lines-strong); margin: 0 2px; }

        /* 보기 전환 세그먼트는 상단 .ds-topbar 로 이동(swiss.css 공용 .segmented 룩 사용) */

        /* ── Call 블럭 그리드(디바이스 카드) — mockup p3(P2) "색으로 즉시 진단" UX ──
           편차 등급은 변동계수 CV=σ/평균(평균 대비) 4구간 파생. takt/표준 시간 미사용. */
        .hm-flow-block-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 12px; flex-wrap: wrap; }
        .hm-flow-block-head .hm-fb-title { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.01em; margin: 0; color: var(--navy); }
        .dark-theme .hm-flow-block-head .hm-fb-title { color: var(--color-text-primary); }
        .hm-flow-block-head .hm-fb-sub { font-size: 0.7rem; color: var(--color-text-secondary); font-weight: 600; }

        .hm-block-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .hm-block {
            position: relative; display: flex; flex-direction: column; gap: 6px;
            padding: 14px 14px 12px; min-height: 118px; cursor: pointer;
            border-radius: var(--radius-md); border: 1px solid var(--color-lines);
            background: var(--color-surface); box-shadow: var(--shadow-1);
            transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
            outline: none;
        }
        /* hover: 살짝 확대 + 그림자 (mockup ② 시각 피드백) */
        .hm-block:hover { transform: scale(1.035); box-shadow: var(--shadow-card-hover); z-index: 1; }
        .hm-block:focus-visible { box-shadow: 0 0 0 3px rgba(var(--color-primary-rgb), 0.30); }
        /* 선택 카드: 청록 강조 테두리 (mockup ③ cb-selected) */
        .hm-block.is-active { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(var(--color-primary-rgb), 0.22); transform: scale(1.035); }

        /* 4단계 진단 배경/테두리 — 색 = "평소 대비 악화" 여부(로버스트 CV 기준). ds.css 토큰만 사용.
           steady = "변동 공정": 편차는 크지만 평소 수준(사람 개입 등 공정 특성) → 정보색(파랑), 경보 아님. */
        .hm-block.tier-normal  { background: rgba(var(--color-success-rgb), 0.14); border-color: rgba(var(--color-success-rgb), 0.45); }
        .hm-block.tier-steady  { background: rgba(var(--color-primary-rgb), 0.10); border-color: rgba(var(--color-primary-rgb), 0.40); }
        .hm-block.tier-caution { background: rgba(var(--color-warning-rgb), 0.16); border-color: rgba(var(--color-warning-rgb), 0.55); }
        .hm-block.tier-danger  { background: rgba(var(--color-error-rgb), 0.16); border-color: rgba(var(--color-error-rgb), 0.55); }

        .hm-block .hm-b-name { font-size: 0.78rem; font-weight: 700; color: var(--navy); line-height: 1.2; display: flex; align-items: center; gap: 4px; word-break: break-all; }
        .dark-theme .hm-block .hm-b-name { color: var(--color-text-primary); }
        .hm-block .hm-b-warn { color: var(--red); font-size: 0.9rem; line-height: 1; flex-shrink: 0; }
        .hm-block .hm-b-avg { display: flex; align-items: baseline; gap: 5px; margin-top: auto; }
        .hm-block .hm-b-avg .hm-b-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--navy); }
        .dark-theme .hm-block .hm-b-avg .hm-b-val { color: var(--color-text-primary); }
        .hm-block .hm-b-avg .hm-b-unit { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-disabled); }
        .hm-block .hm-b-dev { display: inline-flex; align-items: center; align-self: flex-start; padding: 2px 8px; border-radius: var(--radius-lg); font-size: 0.66rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .hm-block .hm-b-dev.tone-normal  { background: rgba(var(--color-success-rgb), 0.22); color: #1B7A50; }
        .hm-block .hm-b-dev.tone-steady  { background: rgba(var(--color-primary-rgb), 0.16); color: #0B5E97; }
        .hm-block .hm-b-dev.tone-caution { background: rgba(var(--color-warning-rgb), 0.30); color: #8A5E00; }
        .hm-block .hm-b-dev.tone-danger  { background: rgba(var(--color-error-rgb), 0.22); color: #B0271D; }
        .dark-theme .hm-block .hm-b-dev.tone-normal  { color: #4FD19A; }
        .dark-theme .hm-block .hm-b-dev.tone-steady  { color: #7CC4F5; }
        .dark-theme .hm-block .hm-b-dev.tone-caution { color: #E6B748; }
        .dark-theme .hm-block .hm-b-dev.tone-danger  { color: #F0705F; }

        /* 정상범위(P10~P90) 서브라인 + 지연 뱃지 — 지연은 정보 표시(경보색 금지, 대기·개입 추정 건수) */
        .hm-block .hm-b-range { font-size: 0.64rem; font-weight: 600; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
        .hm-block .hm-b-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .hm-delay-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: var(--radius-lg); font-size: 0.64rem; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--color-surface-variant); border: 1px solid var(--color-lines); color: var(--color-text-secondary); cursor: help; }
        .hm-delay-badge .material-icons { font-size: 12px; }

        /* ── 공유 tier 색(범례 3색) — 단일 소스 ──
           매트릭스 뱃지(.hm-b-dev.tone-*)와 동일 값. 테이블 색상 셀(.heatmap-cell-compact/-mini)이
           서버 5색(heatmap-*) 대신 이 클래스를 참조 → 범례·매트릭스·테이블 색상코드 통일(절대 CV tier).
           swiss.css 기본 .heatmap-cell-*는 color:#fff + 배경 없음이라, 본 인라인 규칙(ds.css 링크 뒤)이
           동일 명시도에서 소스 순서로 우선 적용됨. */
        .hm-tier-bg-normal  { background: rgba(var(--color-success-rgb), 0.22); color: #1B7A50; }
        .hm-tier-bg-steady  { background: rgba(var(--color-primary-rgb), 0.16); color: #0B5E97; }
        .hm-tier-bg-caution { background: rgba(var(--color-warning-rgb), 0.30); color: #8A5E00; }
        .hm-tier-bg-danger  { background: rgba(var(--color-error-rgb), 0.22); color: #B0271D; }
        .dark-theme .hm-tier-bg-normal  { color: #4FD19A; }
        .dark-theme .hm-tier-bg-steady  { color: #7CC4F5; }
        .dark-theme .hm-tier-bg-caution { color: #E6B748; }
        .dark-theme .hm-tier-bg-danger  { color: #F0705F; }

        /* ── 인라인 상세 패널 (가림 모달 → 컨텍스트 유지 펼침) ── */
        .hm-detail-panel { border-top: 4px solid var(--color-primary); }
        .hm-detail-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 0.6rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-primary-strong); }
        .hm-detail-cols { display: grid; gap: 18px; grid-template-columns: 1fr 1.6fr; align-items: start; }
        @media (max-width: 820px) { .hm-detail-cols { grid-template-columns: 1fr; } }
        .hm-info-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        .hm-info-table th { text-align: left; color: var(--color-text-secondary); font-weight: 600; padding: 6px 8px 6px 0; white-space: nowrap; vertical-align: top; width: 40%; }
        .hm-info-table td { padding: 6px 0; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--color-lines); }
        .hm-info-table tr:last-child td, .hm-info-table tr:last-child th { border-bottom: none; }
        .hm-info-table .hm-info-mono { font-family: var(--font-mono); }
        .hm-info-table .hm-info-strong { font-weight: 800; }

        /* ── Flow 매트릭스 테이블 카드 헤더 (per-flow) ── */
        .hm-table-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--color-lines); flex-wrap: wrap; }
        .hm-table-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .hm-flow-title { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.01em; margin: 0; color: var(--navy); }
        .dark-theme .hm-flow-title { color: var(--color-text-primary); }

        .hm-chart-box { height: 280px; position: relative; }
        .hm-chart-empty { color: var(--color-text-secondary); padding: 28px; text-align: center; background: var(--color-surface-variant); border: 1px solid var(--color-lines); border-radius: var(--radius-md); }

        /* 정렬 가능 헤더의 도움말 점선 밑줄 (잉크 톤) */
        .hm-help { border-bottom: 1px dotted var(--color-lines-strong); cursor: help; }

        /* ── 모바일(≤480px) ──
           데스크톱 레이아웃은 그대로 유지하고, 폰 폭(360~480px)에서만 reflow.
           ds.css 가 .btn/.btn-icon/.form-field/.modal 등 공통 터치 타깃은 이미 처리.
           아래는 heatmap 고유 클래스(hm-*)와 swiss.css 매트릭스 표 오버라이드만. */
        @media (max-width: 480px) {
            /* 슬림 헤더/메인 패딩 축소 */
            .dsp-appbar { padding: 0 12px; gap: 8px; }
            .dsp-appbar .dsp-title { font-size: 16px; }
            .dsp-main { padding: 12px 12px 20px; }

            /* 상단 툴바(.ds-topbar): 액션이 좁아서 줄바꿈 + 버튼 꽉 채움 */
            .ds-topbar-actions { width: 100%; }
            .ds-topbar-actions .btn { flex: 1 1 auto; justify-content: center; }
            .ds-topbar-actions .segmented { flex: 1 1 100%; }
            .ds-topbar-actions .segmented > button { flex: 1 1 50%; justify-content: center; }

            /* KPI 계기판: 4-up 이 좁아서 값/라벨 축소 */
            .hm-kpi-value { font-size: 1.25rem; }
            .hm-kpi-label { font-size: 0.56rem; letter-spacing: 0.06em; }
            .hm-kpi-sub { font-size: 0.6rem; }

            /* 범례 행 간격 정리 (줄바꿈 시 촘촘하게) */
            .hm-legend-bar { gap: 8px 12px; }
            .ds-legend { gap: 6px 12px; }

            /* 진단 블럭 그리드: 1열 단일 컬럼 */
            .hm-block-grid { grid-template-columns: 1fr; gap: 10px; }
            .hm-block { min-height: auto; padding: 12px; }
            .hm-block .hm-b-avg .hm-b-val { font-size: 1.3rem; }

            /* 상세 패널: 컬럼은 hm-detail-cols 가 이미 820px 에서 1열로 떨어짐 */
            .hm-detail-cols { gap: 14px; }

            /* 상세 차트 박스: 280px → 200px (responsive 캔버스가 추종) */
            .hm-chart-box { height: 200px; }

            /* 기간 버튼(전체/오늘/7일/30일): 2열 그리드로 깔끔하게 줄바꿈 */
            .hm-period-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
            .hm-period-btns .btn { width: 100%; justify-content: center; }

            /* 매트릭스 표(swiss.css) 오버라이드 — 클립 대신 가로 스크롤 + 폰트 축소.
               .table-container 는 이미 overflow:auto 라 스크롤되므로 -webkit 관성 스크롤만 보강. */
            .table-container { -webkit-overflow-scrolling: touch; }
            .heatmap-matrix-table { font-size: 0.72rem; min-width: 520px; }
            .heatmap-matrix-table th,
            .heatmap-matrix-table td { padding-left: 4px; padding-right: 4px; }
            .heatmap-matrix-label { max-width: 120px; }
            .hm-table-head { padding: 10px 12px; }
            .hm-flow-title { font-size: 0.88rem; }
        }
    </style>
</head>

<body>
    <div class="dsp-page" :class="{ 'dark-theme': dark }" x-data="heatmapApp()" x-init="init()" x-cloak>

        <!-- fallback 슬림 헤더 (shell.js 가 제거) -->
        <header class="dsp-appbar">
            <span class="dsp-title">동작편차</span>
            <span class="dsp-badge">정적</span>
            <div class="spacer"></div>
            <button class="btn-icon" @click="toggleTheme()" title="테마 전환">
                <span class="material-icons" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
            </button>
        </header>

        <main class="dsp-main">

            <!-- 상단 툴바 — 보기 전환 + ms 토글 + 다운로드 · (오른쪽) 설비 필터 상태.
                 uptime-oee / uptime-alarm 과 동일한 .ds-topbar 패턴(푸른 선 위 메뉴/다운로드, 아래 UI). -->
            <div class="ds-topbar">
                <div class="ds-topbar-actions">
                    <!-- 보기 전환: flow-call 매트릭스 ⇄ 테이블 나열 (한 번에 하나만) -->
                    <div class="segmented" role="tablist" aria-label="보기 전환">
                        <button type="button" role="tab" :aria-selected="viewMode === 'matrix'"
                                :class="viewMode === 'matrix' ? 'is-active' : ''" @click="viewMode = 'matrix'">
                            <span class="material-icons">grid_view</span> 매트릭스
                        </button>
                        <button type="button" role="tab" :aria-selected="viewMode === 'table'"
                                :class="viewMode === 'table' ? 'is-active' : ''" @click="viewMode = 'table'">
                            <span class="material-icons">table_rows</span> 테이블
                        </button>
                    </div>
                    <label class="switch" title="동작편차 시간을 ms(밀리초) 단위로 표시합니다. 해제 시 초 단위로 표시.">
                        <input type="checkbox" x-model="showMs" @change="onUnitChange()" /> ms로 보기
                    </label>
                </div>

                <!-- 오른쪽: 설비(Flow) 필터 상태 + Excel 다운로드 -->
                <div class="ds-topbar-actions" style="justify-content:flex-end;">
                    <template x-if="flowParam">
                        <span class="chip chip-info">설비: <b x-text="flowParam"></b></span>
                    </template>
                    <template x-if="flowParam">
                        <a class="btn btn-sm btn-outlined color-default" href="/heatmap">
                            <span class="material-icons" style="font-size:15px;">clear</span> 전체 보기
                        </a>
                    </template>
                </div>
                <template x-teleport="#dsp-header-actions">
                    <button class="btn btn-sm btn-outlined color-default" @click="exportExcel()" :disabled="excelExporting || filteredGroups.length === 0"
                            title="동작편차 데이터를 Excel(.xlsx) 로 내보냅니다">
                        <span class="material-icons" style="font-size:15px;">download</span>
                        <span x-text="excelExporting ? 'Excel 생성 중…' : 'Excel 다운로드'"></span>
                    </button>
                </template>
            </div>

            <!-- 로딩 (헤어라인 indeterminate) -->
            <div class="mb-4 progress-bar progress-bar-indeterminate" x-show="loading" style="flex-shrink:0;">
                <div class="progress-bar-fill" style="animation: heatmap-indeterminate 1.5s infinite ease-in-out;"></div>
            </div>

            <!-- 오류 -->
            <div class="alert alert-error mb-4" x-show="error" style="flex-shrink:0;">
                <span class="material-icons">error</span>
                <span x-text="error"></span>
            </div>

            <!-- 데이터 없음 — 정직한 빈 상태 -->
            <div class="ds-empty mb-4" x-show="!loading && !error && filteredGroups.length === 0" style="flex-shrink:0;">
                <span class="material-icons">grid_off</span>
                <div class="ds-empty-title">표시할 동작편차 데이터가 없습니다</div>
                <div class="ds-empty-desc">Call 실행 이력이 수집되면 히트맵이 자동 표시됩니다.</div>
                <span class="ds-empty-tag">데이터 수집 대기</span>
            </div>

            <template x-if="!loading && filteredGroups.length > 0">
                <div>
                    <!-- 범례 — 이상 진단(4색) / 편차 표기 두 그룹만. 정의·기준은 툴팁(title)으로. -->
                    <div class="card mb-4" style="padding:12px 16px;">
                        <div class="hm-legend-bar">
                            <span class="hm-lg-label">이상 진단</span>
                            <div class="lg-item" :title="'최근 편차 ±' + cautionPct + '% 미만'"><span class="lg-swatch" style="background:rgba(var(--color-success-rgb),0.30); border:1px solid rgba(var(--color-success-rgb),0.6);"></span> 안정</div>
                            <div class="lg-item" title="편차는 크지만 평소 수준 — 공정 특성"><span class="lg-swatch" style="background:rgba(var(--color-primary-rgb),0.22); border:1px solid rgba(var(--color-primary-rgb),0.5);"></span> 변동 공정</div>
                            <div class="lg-item" title="평소 대비 1.3배 이상 악화"><span class="lg-swatch" style="background:rgba(var(--color-warning-rgb),0.40); border:1px solid rgba(var(--color-warning-rgb),0.7);"></span> 주의</div>
                            <div class="lg-item" :title="'악화 + 최근 편차 ±' + dangerPct + '% 이상'"><span class="lg-swatch" style="background:rgba(var(--color-error-rgb),0.30); border:1px solid rgba(var(--color-error-rgb),0.6);"></span> 위험</div>
                            <template x-if="dangerCalls > 0">
                                <span class="ds-status bad" x-text="'위험 ' + dangerCalls + ' Call'"></span>
                            </template>
                            <span class="hm-lg-divider"></span>
                            <span class="hm-lg-label">편차 표기</span>
                            <div class="lg-item" title="중앙값 대비 로버스트 편차 — 대기·개입 표본 영향 최소화"><span class="hm-b-dev tone-normal" style="align-self:center;">±%</span> 편차</div>
                            <div class="lg-item" title="정상(중앙값)의 3배 초과 실행 수 — 대기·개입 추정"><span class="hm-delay-badge"><span class="material-icons">hourglass_empty</span>n</span> 지연</div>
                            <template x-if="totalGoingCount > 0">
                                <span style="margin-left:auto; color:var(--color-text-disabled); font-weight:700; font-size:0.66rem;"
                                      x-text="'N = ' + totalGoingCount.toLocaleString() + '회'"></span>
                            </template>
                        </div>
                    </div>

                    <!-- ════ Flow 그룹 루프: 매트릭스/테이블 카드 + (선택 Call 소속 그룹) 인라인 상세 ════
                         두 보기를 하나의 그룹 루프로 통합 → 상세 패널을 "선택 Call 이 속한 그룹의
                         매트릭스/테이블 카드 바로 아래"에 렌더(페이지 맨 끝 단일 패널 폐지).
                         상세 패널은 viewMode x-if 바깥(소속 그룹 기준)이라 보기 전환 시 캔버스가
                         유지됨 → 매트릭스⇄테이블 전환에도 차트 재그리기 불필요. -->
                    <template x-for="group in filteredGroups" :key="'grp-' + group.flowName">
                        <div>
                            <!-- 매트릭스 보기 카드 -->
                            <template x-if="viewMode === 'matrix'">
                                <div class="card mb-4" style="padding:14px 16px 16px;">
                                    <div class="hm-flow-block-head">
                                        <div style="min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                            <h6 class="hm-fb-title" x-text="group.flowName"></h6>
                                            <span class="chip chip-info" x-text="group.callCount + ' Calls'"></span>
                                            <span class="ds-status bad" x-show="flowDangerCount(group) > 0" x-text="'위험 ' + flowDangerCount(group)"></span>
                                        </div>
                                        <span class="hm-fb-sub">대표 실행시간(중앙값) · 정상범위 · 편차% · 지연 — 클릭으로 상세</span>
                                    </div>

                                    <div class="hm-block-grid">
                                        <template x-for="call in blockCalls(group)" :key="'blk-' + call.callId">
                                            <div :class="'hm-block tier-' + blockTier(call) + (selectedCall && selectedCall.callId === call.callId ? ' is-active' : '')"
                                                 role="button" tabindex="0"
                                                 :title="callTooltip(call)"
                                                 @click="selectCall(call)"
                                                 @keydown.enter.prevent="selectCall(call)"
                                                 @keydown.space.prevent="selectCall(call)">
                                                <div class="hm-b-name">
                                                    <span x-text="call.callName"></span>
                                                    <span class="hm-b-warn material-icons" style="font-size:14px;" x-show="blockTier(call) === 'danger'" title="위험 — 최근 편차가 평소 대비 악화됨">warning</span>
                                                </div>
                                                <div class="hm-b-avg">
                                                    <span class="hm-b-val" x-text="fmtShortAvg(callMedianVal(call))"></span>
                                                    <span class="hm-b-unit" x-text="call.medianGoingTime != null ? '중앙값' : 'avg'"></span>
                                                </div>
                                                <span class="hm-b-range" x-show="call.p10GoingTime != null" x-text="'보통 ' + rangeText(call)"></span>
                                                <div class="hm-b-foot">
                                                    <span :class="'hm-b-dev tone-' + blockTier(call)" x-text="devBadgeText(call)"></span>
                                                    <span class="hm-delay-badge" x-show="(call.delayCount || 0) > 0" :title="delayTooltip(call)">
                                                        <span class="material-icons">hourglass_empty</span><span x-text="'지연 ' + call.delayCount"></span>
                                                    </span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- 테이블 보기 카드 -->
                            <template x-if="viewMode === 'table'">
                                <div class="card mb-4">
                                    <div class="hm-table-head">
                                        <div class="hm-table-head-left">
                                            <button class="btn-icon btn-sm" @click="group.isExpanded = !group.isExpanded">
                                                <span class="material-icons" x-text="group.isExpanded ? 'expand_more' : 'chevron_right'"></span>
                                            </button>
                                            <h6 class="hm-flow-title" x-text="group.flowName"></h6>
                                            <span class="chip chip-info" x-text="group.callCount + ' Calls'"></span>
                                            <span class="chip chip-error" x-show="flowDangerCount(group) > 0" x-text="'위험 ' + flowDangerCount(group)"></span>
                                        </div>
                                        <div class="d-flex" style="align-items:center; gap:4px;">
                                            <span :class="'ds-status ' + tierStatusClass(flowTier(group))"
                                                  title="Flow 대표 상태 = 소속 Call 중 가장 나쁜 등급"
                                                  x-text="tierLabel(flowTier(group))"></span>
                                        </div>
                                    </div>

                                    <div class="table-container" x-show="group.isExpanded" style="overflow:auto;">
                                        <table class="table table-hover heatmap-matrix-table" style="table-layout:fixed; width:100%;">
                                            <colgroup>
                                                <col style="width:21%;" /><col style="width:13%;" /><col style="width:12%;" />
                                                <col style="width:18%;" /><col style="width:12%;" /><col style="width:10%;" /><col style="width:14%;" />
                                            </colgroup>
                                            <thead class="table-head-sticky">
                                                <tr>
                                                    <th class="sortable" @click="sortBy('callName')">Call <span x-html="sortIcon('callName')"></span></th>
                                                    <th class="sortable" @click="sortBy('workName')">Work <span x-html="sortIcon('workName')"></span></th>
                                                    <th class="sortable heatmap-col-header" @click="sortBy('median')">
                                                        <span :title="'실행시간 중앙값 (' + unitName + ') — 대기·개입 표본에 끌려가지 않는 대표값'" class="hm-help">대표시간 <span x-html="sortIcon('median')"></span></span>
                                                    </th>
                                                    <th class="heatmap-col-header">
                                                        <span title="P10 ~ P90 — 실행의 80%가 이 범위 안에 들어옵니다" class="hm-help">정상범위</span>
                                                    </th>
                                                    <th class="sortable heatmap-col-header" @click="sortBy('cv')">
                                                        <span :title="'중앙값 대비 로버스트 편차(%). 대기·개입 표본의 영향 최소화. 색 = 평소 대비 악화 여부(' + cautionPct + '/' + dangerPct + '% 임계)'" class="hm-help">편차 <span x-html="sortIcon('cv')"></span></span>
                                                    </th>
                                                    <th class="sortable heatmap-col-header" @click="sortBy('delay')">
                                                        <span title="정상(중앙값)의 3배를 초과한 실행 수 — 대기·사람 개입 추정 (편차와 분리 집계)" class="hm-help">지연 <span x-html="sortIcon('delay')"></span></span>
                                                    </th>
                                                    <th style="text-align:center;"><span title="Call이 Going 상태로 전환된 총 횟수" class="hm-help">실행횟수</span></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="call in sortedCalls(group)" :key="'row-' + call.callId">
                                                    <tr :class="'heatmap-matrix-row ' + (selectedCall && selectedCall.callId === call.callId ? 'selected' : '')"
                                                        @click="selectCall(call)" :title="callTooltip(call)">
                                                        <td class="heatmap-matrix-label" x-text="call.callName"></td>
                                                        <td class="heatmap-matrix-label" x-text="call.workName"></td>
                                                        <td style="text-align:center; padding:4px;">
                                                            <div :class="'heatmap-cell-compact hm-tier-bg-' + blockTier(call)" x-text="fmtShortAvg(callMedianVal(call))"></div>
                                                        </td>
                                                        <td style="text-align:center;">
                                                            <span class="typo-body2" style="font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:0.72rem;" x-text="rangeText(call)"></span>
                                                        </td>
                                                        <td style="text-align:center; padding:4px;">
                                                            <div :class="'heatmap-cell-compact hm-tier-bg-' + blockTier(call)" x-text="devBadgeText(call)"></div>
                                                        </td>
                                                        <td style="text-align:center;">
                                                            <span class="hm-delay-badge" x-show="(call.delayCount || 0) > 0" :title="delayTooltip(call)">
                                                                <span class="material-icons">hourglass_empty</span><span x-text="call.delayCount"></span>
                                                            </span>
                                                            <span x-show="!(call.delayCount > 0)" style="color:var(--color-text-disabled);">—</span>
                                                        </td>
                                                        <td style="text-align:center;"><span class="typo-body2" style="font-family:var(--font-mono); font-variant-numeric:tabular-nums;" x-text="call.goingCount"></span></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </template>

                            <!-- ════ 선택 Call 상세 — 소속 그룹의 매트릭스/테이블 카드 바로 아래 ════ -->
                            <template x-if="groupHasSelected(group)">
                                <div class="card mb-4 hm-detail-panel" x-transition.opacity x-ref="detail">
                                    <div class="dsp-panel-body">
                                <div class="d-flex" style="justify-content:space-between; align-items:flex-start; margin-bottom:14px;">
                                    <div style="min-width:0;">
                                        <div class="hm-detail-eyebrow mb-1"><span class="material-icons" style="font-size:14px;">search</span>선택된 Call · 상세</div>
                                        <h6 class="typo-h6" style="margin:2px 0 0; color:var(--color-text-primary);" x-text="selectedCall.callName"></h6>
                                        <span class="typo-caption" style="color:var(--color-text-secondary); font-family:var(--font-mono);"
                                              x-text="'Flow: ' + selectedCall.flowName + ' | Work: ' + (selectedCall.workName || '—')"></span>
                                    </div>
                                    <button class="btn-icon btn-sm" @click="closeChart()" title="상세 닫기"><span class="material-icons">close</span></button>
                                </div>

                                <div class="hm-detail-cols">
                                    <!-- 좌: 기본정보 행 테이블 -->
                                    <div>
                                        <div class="ds-card-h" style="margin-bottom:6px;"><h4>기본 정보</h4></div>
                                        <table class="hm-info-table">
                                            <tr><th>Call ID</th><td class="hm-info-mono" x-text="selectedCall.callId"></td></tr>
                                            <tr><th>Flow / Work</th><td x-text="selectedCall.flowName + ' / ' + (selectedCall.workName || '—')"></td></tr>
                                            <tr><th>대표 시간 (중앙값)</th><td class="hm-info-mono hm-info-strong" x-text="detailStats ? formatMs(detailStats.med) : '—'"></td></tr>
                                            <tr>
                                                <th>정상범위 (P10~P90)</th>
                                                <td class="hm-info-mono" x-text="detailStats ? (formatMs(detailStats.p10) + ' ~ ' + formatMs(detailStats.p90)) : '—'"></td>
                                            </tr>
                                            <tr>
                                                <th>편차 (중앙값 대비)</th>
                                                <td>
                                                    <span class="hm-info-mono hm-info-strong" x-text="detailStats ? ('±' + deviationPctFromCv(detailStats.rcv) + '%') : '—'"></span>
                                                    <span :class="'ds-status ' + tierStatusClass(blockTier(selectedCall))"
                                                          style="margin-left:6px;" x-text="tierLabel(blockTier(selectedCall))"></span>
                                                </td>
                                            </tr>
                                            <tr>
                                                <th>지연 (중앙값×3 초과)</th>
                                                <td class="hm-info-mono" x-text="detailStats ? (detailStats.delay + '회 (' + (detailStats.n > 0 ? (detailStats.delay * 100 / detailStats.n).toFixed(1) : '0.0') + '%)') : '—'"></td>
                                            </tr>
                                            <tr>
                                                <th>최소 / 최대</th>
                                                <td class="hm-info-mono" x-text="displayedMin === null ? '—' : (formatMs(displayedMin) + ' / ' + formatMs(displayedMax))"></td>
                                            </tr>
                                            <tr>
                                                <th>평균 / 표준편차 (참고)</th>
                                                <td class="hm-info-mono" x-text="formatMs(chartCount > 0 ? chartAvg : selectedCall.averageGoingTime) + ' / ' + formatMs(chartCount > 0 ? chartStdDev : selectedCall.stdDevGoingTime)"></td>
                                            </tr>
                                            <tr><th>변동계수 CV (참고)</th><td class="hm-info-mono" x-text="(chartCount > 0 ? chartCV : selectedCall.coefficientOfVariation).toFixed(2)"></td></tr>
                                            <tr><th>N (실행횟수)</th><td class="hm-info-mono" x-text="(chartCount > 0 ? chartCount : selectedCall.goingCount).toLocaleString() + '회'"></td></tr>
                                        </table>
                                        <div class="typo-caption" style="color:var(--color-text-disabled); margin-top:8px;">
                                            ※ 편차 = 중앙값 대비 로버스트 편차(1.4826×MAD/중앙값) — 대기·사람 개입 표본이 섞여도 동작 자체의 안정성만 측정합니다. 평균·σ·CV는 참고용.
                                        </div>
                                    </div>

                                    <!-- 우: 실행 시간 추이 차트 -->
                                    <div>
                                        <div class="d-flex" style="align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
                                            <span class="material-icons" style="font-size:18px; color:var(--color-primary);">show_chart</span>
                                            <span class="typo-subtitle2">실행 시간 추이</span>
                                            <span class="typo-caption" x-show="isChartLoading" style="color:var(--color-text-secondary);">로딩 중...</span>
                                            <div class="d-flex" style="align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap;">
                                                <div class="d-flex hm-period-btns" style="gap:4px;" title="표시할 실행 이력의 기간을 선택합니다.">
                                                    <button class="btn btn-sm" :class="historyPeriod === 'all' ? 'btn-primary' : 'btn-outlined color-default'" @click="setHistoryPeriod('all')">전체</button>
                                                    <button class="btn btn-sm" :class="historyPeriod === 'today' ? 'btn-primary' : 'btn-outlined color-default'" @click="setHistoryPeriod('today')">오늘</button>
                                                    <button class="btn btn-sm" :class="historyPeriod === '7d' ? 'btn-primary' : 'btn-outlined color-default'" @click="setHistoryPeriod('7d')">지난 7일</button>
                                                    <button class="btn btn-sm" :class="historyPeriod === '30d' ? 'btn-primary' : 'btn-outlined color-default'" @click="setHistoryPeriod('30d')">지난 30일</button>
                                                </div>
                                                <label class="switch" title="이동평균의 0.5배~2배 범위를 벗어나는 회차(위·아래 이상치)를 제외합니다.">
                                                    <input type="checkbox" x-model="excludeDeviation" @change="onExcludeDeviationChange()" /> 이상치 제외
                                                </label>
                                            </div>
                                        </div>

                                        <div x-show="callHistory.length > 0" class="hm-chart-box">
                                            <canvas id="callHistoryChart"></canvas>
                                        </div>
                                        <div x-show="callHistory.length === 0 && !isChartLoading" class="typo-body2 hm-chart-empty">
                                            <span class="material-icons" style="font-size:32px; display:block; margin-bottom:8px; opacity:0.5;">timeline</span>
                                            실행 이력이 없습니다.
                                        </div>
                                        <div class="typo-caption" style="color:var(--color-text-secondary); margin-top:6px;">
                                            녹색 밴드 = 중앙값 ± 2×로버스트σ (정상 동작 구간) · 빨간선 = 실행시간
                                        </div>
                                    </div>
                                </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </main>

    </div>

    <!-- Chart.js + 기존 차트 인터롭(camelCase 키 기대 → API 도 camelCase) -->
    <script src="/lib/chart.umd.min.js"></script>
    <script src="/lib/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="/js/call-history-chart.js"></script>

    <!-- Alpine 컴포넌트 정의 (Alpine 보다 먼저 평가되어 전역 함수 등록) -->
    <script>
        function heatmapApp() {
            return {
                allGroups: [],
                loading: true,
                error: null,
                // 설비(Flow) 필터 — 좌측 메뉴 '동작편차' 트리에서 /heatmap?flow=이름 으로 진입. '' = 전체.
                flowParam: '',
                viewMode: 'table', // 'matrix'(flow-call 블럭 매트릭스) | 'table'(정렬 표) — 한 번에 하나만, 기본=테이블
                sortField: 'cv',
                sortAsc: false,
                selectedCall: null,
                callHistory: [],
                excludeDeviation: true,
                historyPeriod: 'today',
                isChartLoading: false,
                dark: false,
                // 시간 단위 표시: false=초(기본) / true=ms. Flow 필터란의 "ms로 보기" 토글로 전환(localStorage 영속).
                showMs: false,
                excelExporting: false,   // Excel 내보내기 진행 상태(중복 클릭 방지)

                // 색상 등급 임계(CV=σ/평균). 설정 페이지(동작편차 설정)에서 사용자가 조정 → /api/heatmap/config 로 로드.
                // 기본 0.10/0.30(±10%/±30%). fetch 실패 시 이 기본값 유지.
                cautionCv: 0.10,
                dangerCv: 0.30,

                async init() {
                    this.dark = localStorage.getItem('dspilot-theme') === 'dark';
                    this.showMs = localStorage.getItem('dspilot-heatmap-ms') === '1';
                    // 설비 필터는 URL(?flow=)에서만 온다(좌측 메뉴 트리). 없으면 전체.
                    this.flowParam = new URLSearchParams(location.search).get('flow') || '';
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'dspilot-theme') this.dark = e.newValue === 'dark';
                    });
                    await this.loadData();
                },

                toggleTheme() {
                    this.dark = !this.dark;
                    localStorage.setItem('dspilot-theme', this.dark ? 'dark' : 'light');
                },

                // 시간 단위 표시 전환. x-text 바인딩이 showMs 를 읽으므로 값 변경만으로 표·매트릭스·상세가 자동 갱신됨.
                onUnitChange() {
                    localStorage.setItem('dspilot-heatmap-ms', this.showMs ? '1' : '0');
                },
                // 헤더 도움말 등 단위 라벨 표기용
                get unitName() { return this.showMs ? 'ms' : '초'; },

                async apiGet(url) {
                    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                },

                // 색상 등급 임계 로드 — loadData 보다 먼저 호출해 precompute(_tier/_dev)가 최신 임계를 쓰게 한다.
                async loadConfig() {
                    try {
                        const cfg = await this.apiGet('/api/heatmap/config');
                        if (cfg && typeof cfg.cautionPct === 'number') this.cautionCv = cfg.cautionPct / 100;
                        if (cfg && typeof cfg.dangerPct === 'number') this.dangerCv = cfg.dangerPct / 100;
                    } catch (e) { /* 실패 시 기본 임계(0.10/0.30) 유지 */ }
                },

                async loadData() {
                    this.loading = true; this.error = null;
                    try {
                        // 새로고침 때도 변경된 임계를 반영하도록 데이터보다 먼저 설정을 읽는다.
                        await this.loadConfig();
                        const groups = await this.apiGet('/api/heatmap/data') || [];
                        // 렌더 비용 선계산(1회): 행마다 blockTier / flowDangerCount 재계산 방지(O(n²) 렉 회피)
                        const tierRank = { danger: 3, caution: 2, steady: 1, normal: 0 };
                        for (const g of groups) {
                            const calls = g.calls || [];
                            for (const c of calls) {
                                c._devVal = c.robustCv != null ? c.robustCv : c.coefficientOfVariation;
                                c._dev = this.deviationPctFromCv(c._devVal);
                                c._tier = this.tierOf(c);
                            }
                            g._dangerCount = calls.reduce((n, c) => n + (c._tier === 'danger' ? 1 : 0), 0);
                            g._cautionCount = calls.reduce((n, c) => n + (c._tier === 'caution' ? 1 : 0), 0);
                            g._avgDev = calls.length ? calls.reduce((s, c) => s + (c._devVal || 0), 0) / calls.length : 0;
                            g._flowTier = calls.reduce((w, c) => tierRank[c._tier] > tierRank[w] ? c._tier : w, 'normal');
                            g._blockCalls = calls.slice().sort((a, b) => (b._devVal - a._devVal) || (a.callName || '').localeCompare(b.callName || ''));
                            g.isExpanded = true; // 테이블 보기 기본 펼침
                        }
                        // Flow 나열 순서: 상태가 나쁜 그룹이 위로 — 위험 Call 수 ▸ 주의 Call 수 ▸ 평균 편차 ▸ 이름
                        groups.sort((a, b) =>
                            (b._dangerCount - a._dangerCount)
                            || (b._cautionCount - a._cautionCount)
                            || ((b._avgDev || 0) - (a._avgDev || 0))
                            || (a.flowName || '').localeCompare(b.flowName || ''));
                        this.allGroups = groups;
                        // 새로고침으로 데이터가 교체됐는데 열린 모달의 Call 이 더 이상 없으면 모달 정리(좀비 모달 방지)
                        if (this.selectedCall &&
                            !this.allGroups.some(g => (g.calls || []).some(c => c.callId === this.selectedCall.callId))) {
                            await this.closeModal();
                        }
                    } catch (e) {
                        this.error = '데이터를 불러오지 못했습니다: ' + e.message;
                        this.allGroups = [];
                    } finally {
                        this.loading = false;
                    }
                },

                get filteredGroups() {
                    // 설비 필터(URL ?flow=)가 있으면 정확히 그 Flow 만, 없으면 전체.
                    if (!this.flowParam) return this.allGroups;
                    return this.allGroups.filter(g => (g.flowName || '') === this.flowParam);
                },

                // FormatMetricValueShort(AverageTime/StdDeviation). 기본 초 단위, "ms로 보기" 시 정수 ms.
                fmtShortAvg(v) {
                    if (this.showMs) return Math.round(v) + 'ms';
                    if (v < 60000) return (v / 1000).toFixed(v < 10000 ? 2 : 1) + '초';
                    if (v < 3600000) return Math.floor(v / 60000) + '분 ' + Math.floor((v % 60000) / 1000) + '초';
                    return Math.floor(v / 3600000) + '시간 ' + Math.floor((v % 3600000) / 60000) + '분';
                },

                // ── 4단계 진단 등급 — 색 = "평소(전체 이력) 대비 최근이 악화됐는가" ──
                // 편차의 절대 크기(공정 특성일 수 있음)와 이상 여부(조치 필요)를 분리:
                //   normal  = 최근 편차 < 주의임계 (지금 안정)
                //   steady  = 편차 ≥ 주의임계지만 평소 수준 (변동 공정 — 정보색, 경보 아님)
                //   caution = 평소 대비 1.3배 이상 악화
                //   danger  = 악화 + 최근 편차 ≥ 위험임계
                // robust 통계 미산출(서버 부팅 직후 등) Call 은 기존 CV 절대 임계로 폴백.
                tierOf(c) {
                    if (c.robustCv == null) return this.cvToTier(c.coefficientOfVariation);
                    const base = c.robustCv;
                    const recent = c.recentRobustCv != null ? c.recentRobustCv : base;
                    if (recent < this.cautionCv) return 'normal';
                    if (recent >= base * 1.3) return recent >= this.dangerCv ? 'danger' : 'caution';
                    return 'steady';
                },
                // (폴백 전용) CV 절대 임계 3단계 — robust 미산출 Call 에서만 사용.
                cvToTier(cv) {
                    if (cv < this.cautionCv) return 'normal';
                    if (cv < this.dangerCv) return 'caution';
                    return 'danger';
                },
                // 범례/KPI 텍스트용 임계(편차 %). tierOf/cvToTier 와 동일 소스.
                get cautionPct() { return Math.round(this.cautionCv * 100); },
                get dangerPct() { return Math.round(this.dangerCv * 100); },
                blockTier(call) { return call._tier != null ? call._tier : this.tierOf(call); },
                tierLabel(tier) {
                    return { normal: '안정', steady: '변동 공정', caution: '주의', danger: '위험' }[tier] || '안정';
                },
                tierStatusClass(tier) {
                    return { normal: 'ok', steady: 'info', caution: 'warn', danger: 'bad' }[tier] || 'info';
                },
                // 편차%(중앙값 대비 로버스트 — 폴백 시 평균 대비 CV) = CV × 100
                deviationPct(call) { return call._dev != null ? call._dev : this.deviationPctFromCv(call.robustCv != null ? call.robustCv : call.coefficientOfVariation); },
                // 편차 뱃지 텍스트 — 악화(주의/위험) tier 는 판정 근거인 "최근" 편차를 보여준다.
                // (평소 편차 10%인데 빨강이면 "왜?"가 되므로 — 색과 숫자의 논리를 일치)
                devBadgeText(call) {
                    const tier = this.blockTier(call);
                    if ((tier === 'caution' || tier === 'danger') && call.recentRobustCv != null)
                        return '최근 ±' + this.deviationPctFromCv(call.recentRobustCv) + '%';
                    return '±' + this.deviationPct(call) + '%';
                },
                deviationPctFromCv(cv) {
                    const v = Number(cv) * 100;
                    return v >= 100 ? Math.round(v) : v.toFixed(1);
                },
                // 대표 시간 = 중앙값(로버스트 미산출 시 평균 폴백)
                callMedianVal(c) { return c.medianGoingTime != null ? c.medianGoingTime : c.averageGoingTime; },
                // 정상범위 P10~P90 표기
                rangeText(c) {
                    if (c.p10GoingTime == null || c.p90GoingTime == null) return '—';
                    return this.fmtShortAvg(c.p10GoingTime) + ' ~ ' + this.fmtShortAvg(c.p90GoingTime);
                },
                delayTooltip(c) {
                    const thr = c.medianGoingTime != null ? Math.max(3 * c.medianGoingTime, 2000) : null;
                    return '지연 ' + (c.delayCount || 0) + '회 — 정상(중앙값)의 3배'
                        + (thr ? ' (>' + this.fmtShortAvg(thr) + ')' : '') + ' 초과 실행.\n대기·사람 개입으로 추정되는 표본으로, 편차 계산과 분리해 집계합니다.';
                },
                // 선형 보간 백분위수(sorted 오름차순 전제) — 상세 패널 robust 재계산용(서버 정의와 동일)
                pctl(sorted, p) {
                    if (!sorted.length) return 0;
                    const rank = (p / 100) * (sorted.length - 1);
                    const lo = Math.floor(rank), hi = Math.ceil(rank);
                    return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (rank - lo);
                },
                // 블럭 그리드용 정렬: 편차 큰 순 → 진단 카드가 위험부터 보이도록
                blockCalls(group) {
                    return group._blockCalls || group.calls.slice().sort((a, b) =>
                        ((b.robustCv != null ? b.robustCv : b.coefficientOfVariation) - (a.robustCv != null ? a.robustCv : a.coefficientOfVariation))
                        || (a.callName || '').localeCompare(b.callName || ''));
                },
                flowDangerCount(group) { return group._dangerCount != null ? group._dangerCount : group.calls.filter(c => this.blockTier(c) === 'danger').length; },
                // Flow 대표 tier = 소속 Call 중 가장 나쁜 등급(danger > caution > steady > normal) — 헤더 상태 칩용.
                flowTier(group) {
                    if (group._flowTier != null) return group._flowTier;
                    const rank = { danger: 3, caution: 2, steady: 1, normal: 0 };
                    return (group.calls || []).reduce((w, c) => rank[this.blockTier(c)] > rank[w] ? this.blockTier(c) : w, 'normal');
                },
                // 선택된 Call 이 이 그룹 소속인지 — 상세 패널을 "소속 그룹의 매트릭스/테이블 바로 아래"에 렌더하는 데 사용
                groupHasSelected(group) {
                    return this.selectedCall && (group.calls || []).some(c => c.callId === this.selectedCall.callId);
                },

                get totalCalls() { return this.filteredGroups.reduce((s, g) => s + g.callCount, 0); },
                get dangerCalls() { return this.filteredGroups.reduce((s, g) => s + this.flowDangerCount(g), 0); },
                get totalGoingCount() { return this.filteredGroups.flatMap(g => g.calls).reduce((s, c) => s + (c.goingCount || 0), 0); },

                sortedCalls(group) {
                    const calls = group.calls.slice();
                    const f = this.sortField, asc = this.sortAsc;
                    const cmp = (a, b) => (a || '').localeCompare(b || '');
                    if (f === 'callName') calls.sort((a, b) => asc ? cmp(a.callName, b.callName) : cmp(b.callName, a.callName));
                    else if (f === 'workName') calls.sort((a, b) => asc ? cmp(a.workName, b.workName) : cmp(b.workName, a.workName));
                    else {
                        const val = f === 'median' ? (c => this.callMedianVal(c))
                            : f === 'delay' ? (c => c.delayCount || 0)
                            : (c => c._devVal != null ? c._devVal : (c.robustCv != null ? c.robustCv : c.coefficientOfVariation)); // 'cv' = 편차
                        calls.sort((a, b) => asc ? val(a) - val(b) : val(b) - val(a));
                    }
                    return calls;
                },
                sortBy(field) {
                    if (this.sortField === field) this.sortAsc = !this.sortAsc;
                    else { this.sortField = field; this.sortAsc = (field === 'callName' || field === 'workName'); }
                },
                sortIcon(field) {
                    if (this.sortField !== field) return '';
                    const icon = this.sortAsc ? 'arrow_upward' : 'arrow_downward';
                    return `<span class="material-icons sort-icon">${icon}</span>`;
                },

                callTooltip(call) {
                    const tier = this.blockTier(call);
                    let s = `[${call.callName}]\nFlow: ${call.flowName}\nWork: ${call.workName || '—'}\n`;
                    if (call.robustCv != null) {
                        s += `대표 시간(중앙값): ${this.formatMs(call.medianGoingTime)}\n`
                            + `정상범위(P10~P90): ${this.rangeText(call)}\n`
                            + `편차(전체 이력): ±${this.deviationPct(call)}%\n`
                            + (call.recentRobustCv != null ? `편차(최근 ~200회): ±${this.deviationPctFromCv(call.recentRobustCv)}%\n` : '')
                            + `진단: ${this.tierLabel(tier)} — 색은 최근이 평소 대비 악화됐는지 기준\n`
                            + `지연(중앙값×3 초과): ${call.delayCount || 0}회\n`
                            + `평균 / σ (참고): ${this.formatMs(call.averageGoingTime)} / ${this.formatMs(call.stdDevGoingTime)}\n`;
                    } else {
                        s += `평균: ${this.formatMs(call.averageGoingTime)}\n표준편차(σ): ${this.formatMs(call.stdDevGoingTime)}\n`
                            + `편차(평균 대비): ±${this.deviationPct(call)}%  [${this.tierLabel(tier)}]\n`;
                    }
                    return s + `실행횟수(N): ${call.goingCount}회\n클릭 → 추이·상세 펼침`;
                },

                // ── 차트/통계 (이상치 제외 반영) ──
                get displayedHistory() {
                    if (!this.excludeDeviation || this.callHistory.length === 0) return this.callHistory;
                    const times = this.callHistory.map(r => r.goingTimeMs);
                    const n = times.length, half = Math.floor(5 / 2), result = [];
                    for (let i = 0; i < n; i++) {
                        const lo = Math.max(0, i - half), hi = Math.min(n - 1, i + half);
                        let sum = 0; for (let j = lo; j <= hi; j++) sum += times[j];
                        const ma = sum / (hi - lo + 1);
                        if (ma <= 0 || (times[i] >= ma * 0.5 && times[i] <= ma * 2.0)) result.push(this.callHistory[i]);
                    }
                    return result;
                },
                get chartAvg() { const d = this.displayedHistory; return d.length ? d.reduce((s, r) => s + r.goingTimeMs, 0) / d.length : 0; },
                get chartStdDev() { const d = this.displayedHistory; if (!d.length) return 0; const a = this.chartAvg; return Math.sqrt(d.reduce((s, r) => s + Math.pow(r.goingTimeMs - a, 2), 0) / d.length); },
                get chartCV() { return this.chartAvg > 0 ? this.chartStdDev / this.chartAvg : 0; },
                get chartCount() { return this.displayedHistory.length; },
                // 상세 패널 로버스트 요약 — 로드된 기간 이력(원본, 이상치 제외 미적용)에서 재계산해
                // 매트릭스와 같은 지표 정의(중앙값/MAD/P10~P90/지연)를 기간 스코프로 제공(검산 가능).
                // 이력이 아직 없으면 서버 전체기간 값으로 폴백, 그것도 없으면 null(— 표기).
                get detailStats() {
                    const h = this.callHistory;
                    if (h.length >= 5) {
                        const xs = h.map(r => r.goingTimeMs).slice().sort((a, b) => a - b);
                        const med = this.pctl(xs, 50), p10 = this.pctl(xs, 10), p90 = this.pctl(xs, 90);
                        const devs = xs.map(v => Math.abs(v - med)).sort((a, b) => a - b);
                        let sig = 1.4826 * this.pctl(devs, 50);
                        if (sig <= 0) sig = (this.pctl(xs, 75) - this.pctl(xs, 25)) / 1.349; // MAD=0 → IQR 폴백(서버와 동일)
                        const thr = Math.max(3 * med, 2000);
                        return { med, p10, p90, sig, rcv: med > 0 ? sig / med : 0, delay: xs.filter(v => v > thr).length, n: xs.length };
                    }
                    const c = this.selectedCall;
                    if (c && c.robustCv != null) {
                        return {
                            med: c.medianGoingTime, p10: c.p10GoingTime, p90: c.p90GoingTime,
                            sig: c.robustCv * (c.medianGoingTime || 0), rcv: c.robustCv,
                            delay: c.delayCount || 0, n: c.robustSampleCount || c.goingCount
                        };
                    }
                    return null;
                },
                // 최소/최대 실행시간 — 표시 이력(이상치 제외 반영) 기준. 이력 없으면 null('—' 표기).
                get displayedMin() { const d = this.displayedHistory; return d.length ? Math.min(...d.map(r => r.goingTimeMs)) : null; },
                get displayedMax() { const d = this.displayedHistory; return d.length ? Math.max(...d.map(r => r.goingTimeMs)) : null; },

                async selectCall(call) {
                    if (this.selectedCall && this.selectedCall.callId === call.callId) { await this.closeModal(); return; }
                    this.selectedCall = call;
                    this.callHistory = [];
                    // 공통 상세 패널이 뷰 하단에 있으므로 선택 시 부드럽게 스크롤(매트릭스/테이블 공통)
                    this.$nextTick(() => { const el = this.$refs.detail; if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
                    await this.loadHistory();
                },
                async loadHistory() {
                    if (!this.selectedCall) return;
                    this.isChartLoading = true;
                    try {
                        this.callHistory = await this.apiGet(`/api/heatmap/call-history?callId=${encodeURIComponent(this.selectedCall.callId)}&period=${this.historyPeriod}`);
                        await this.renderChart();
                    } catch (e) {
                        console.error('history load failed', e);
                        this.callHistory = [];
                    } finally {
                        this.isChartLoading = false;
                    }
                },
                async setHistoryPeriod(p) {
                    if (this.historyPeriod === p) return;
                    this.historyPeriod = p;
                    await (window.dspLoading ? window.dspLoading.wrap(() => this.loadHistory(), '기간 이력 불러오는 중…') : this.loadHistory());
                },
                async onExcludeDeviationChange() { await this.renderChart(); },
                async renderChart() {
                    const d = this.displayedHistory;
                    if (d.length === 0) { window.destroyCallHistoryChart(); return; }
                    const chartData = d.map(r => ({
                        executionNumber: r.executionNumber,
                        goingTimeMs: r.goingTimeMs,
                        timestamp: (r.timestamp || '').replace('T', ' ').slice(0, 19)
                    }));
                    // 밴드 = 중앙값 ± 2×로버스트σ — 평균±2σ는 대기 표본에 끌려가 밴드가 무의미하게 넓어짐.
                    const st = this.detailStats;
                    const avg = st ? st.med : (this.selectedCall?.averageGoingTime ?? 0);
                    const sd = st ? st.sig : (this.selectedCall?.stdDevGoingTime ?? 0);
                    // canvas 는 x-if(모달) + x-show(이력>0) 안에 있어 $nextTick 한 번으로 DOM 보장이 안 될 수 있으므로
                    // requestAnimationFrame 으로 최대 ~10프레임 폴링 후 렌더(Blazor 의 Task.Delay(50) 대체, 더 견고).
                    await this.$nextTick();
                    const draw = (attempt) => {
                        const cv = document.getElementById('callHistoryChart');
                        const box = cv && cv.parentElement;
                        // 캔버스 컨테이너가 실제 레이아웃 크기를 가질 때까지 대기.
                        // 0×0 상태(모달 mount/표시 직후)에서 Chart.js 를 만들면 캔버스가 0×0 으로 고정돼 빈 차트가 됨.
                        if (box && box.clientWidth > 0 && box.clientHeight > 0) {
                            window.renderCallHistoryChart('callHistoryChart', chartData, avg, sd);
                        } else if (attempt < 30) {
                            requestAnimationFrame(() => draw(attempt + 1));
                        }
                    };
                    draw(0);
                },
                // 인라인 상세 패널 닫기 (구 모달 closeModal 과 동작 동일 — loadData 의 좀비 정리 호출 호환 위해 둘 다 유지)
                async closeChart() {
                    this.selectedCall = null;
                    this.callHistory = [];
                    window.destroyCallHistoryChart();
                },
                async closeModal() { await this.closeChart(); },

                formatMs(ms) {
                    if (this.showMs) return (ms <= 0 ? 0 : Math.round(ms)) + 'ms';
                    if (ms <= 0) return '0초';
                    if (ms < 60000) return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + '초';
                    if (ms < 3600000) return Math.floor(ms / 60000) + '분 ' + Math.floor((ms % 60000) / 1000) + '초';
                    return Math.floor(ms / 3600000) + '시간 ' + Math.floor((ms % 3600000) / 60000) + '분 ' + Math.floor((ms % 60000) / 1000) + '초';
                },

                // 파일명 타임스탬프(yyyyMMdd_HHmmss) — Excel 파일명용.
                _stamp() {
                    const pad = (x) => String(x).padStart(2, '0');
                    const t = new Date();
                    return `${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}_${pad(t.getHours())}${pad(t.getMinutes())}${pad(t.getSeconds())}`;
                },
                _downloadBlob(name, blob) {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
                },

                // Excel = 동작편차 데이터 테이블. 서버(HeatmapExcelExporter)가 렌더 → 화면과 동일 컬럼 + tier 색상.
                async exportExcel() {
                    const groups = this.filteredGroups;
                    if (groups.length === 0 || this.excelExporting) return;
                    this.excelExporting = true; this.error = null;
                    try {
                        const rows = [];
                        for (const g of groups) for (const c of this.sortedCalls(g)) {
                            rows.push({
                                flowName: c.flowName, callName: c.callName, workName: c.workName || '',
                                averageMs: c.averageGoingTime, stdDevMs: c.stdDevGoingTime,
                                cv: c.coefficientOfVariation, goingCount: c.goingCount,
                                // 로버스트 표시값 + 화면 tier 그대로(WYSIWYG — 등급은 "평소 대비 악화" 판정이라 서버가 재산출 불가)
                                medianMs: c.medianGoingTime, p10Ms: c.p10GoingTime, p90Ms: c.p90GoingTime,
                                robustCv: c.robustCv, delayCount: c.delayCount || 0, tier: this.tierLabel(this.blockTier(c))
                            });
                        }
                        const model = { title: this.flowParam || '전체', cautionCv: this.cautionCv, dangerCv: this.dangerCv, rows };
                        const res = await fetch('/api/heatmap/export-excel', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(model)
                        });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        let fn = `Heatmap_${this.flowParam || '전체'}_${this._stamp()}.xlsx`;
                        const cd = res.headers.get('Content-Disposition');
                        if (cd) {
                            const star = cd.match(/filename\*=(?:UTF-8'')?([^;]+)/i);
                            const plain = cd.match(/filename="?([^";]+)"?/i);
                            if (star) { try { fn = decodeURIComponent(star[1].trim()); } catch (_) {} }
                            else if (plain) { fn = plain[1].trim(); }
                        }
                        this._downloadBlob(fn, await res.blob());
                    } catch (e) {
                        this.error = 'Excel 내보내기 실패: ' + e.message;
                    } finally { this.excelExporting = false; }
                }
            };
        }
    </script>

    <!-- Alpine 마지막 로드 (defer) -->
    <script src="/app/shell.js" defer></script>
    <script defer src="/lib/alpine.min.js"></script>
